type: Experiment
name: NCT06475235 — Pembrolizumab + Chemotherapy in Newly Diagnosed PCNSL
description: 'This research study is studying if the investigational drug, Pembrolizumab,
  in combination with chemotherapy helps primary central nervous system lymphoma with
  acceptable side effects. This research study involves a combination of the below
  drugs: * Pembrolizumab (a type of monoclonal antibody) * Methotrexate (a type of
  anti-metabolite) * Temozolomide (a type of alkylating agent) * Rituximab (a type
  of antibody) (NCT NCT06475235; status RECRUITING).'
