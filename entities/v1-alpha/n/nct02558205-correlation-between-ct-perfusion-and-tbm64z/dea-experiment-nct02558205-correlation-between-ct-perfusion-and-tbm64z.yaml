id: dea:experiment-nct02558205-correlation-between-ct-perfusion-and-tbm64z
type: Experiment
name: NCT02558205 — Correlation Between CT Perfusion and Post Y-90 TARE PET/CT Dosimetry
description: 'The purpose of this study is to see if it is possible to establish a
  relationship between the blood flow and blood volume of liver tumors from CT body
  perfusion and the radiation dose deposited in the tumors from the radioembolization
  treatment as measured by PET/CT. The study will do this by: 1. Measuring the blood
  flow and blood volume of tumors in the imaging data from a CT body perfusion 2.
  Measuring the radioactivity in the tumors after the radioembolization treatment
  using PET/CT and then calculating the dose deposited in the tumor 3. Using statistical
  analysis to assess the relationship between the dose and the perfusion parameters
  In addition, the research may help develop a method for calculating the dose of
  radioembolization to be delivered to a liver tumor(s) using blood volume and blood
  flow data obtained from the CT body perfusion scans. (NCT NCT02558205; status WITHDRAWN).'
