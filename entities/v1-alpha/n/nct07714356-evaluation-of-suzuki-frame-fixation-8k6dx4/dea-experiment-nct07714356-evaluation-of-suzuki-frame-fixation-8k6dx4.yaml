id: dea:experiment-nct07714356-evaluation-of-suzuki-frame-fixation-8k6dx4
type: Experiment
name: NCT07714356 — Evaluation of Suzuki Frame Fixation in Comminuted Fractures of
  the Proximal Interphalangeal Joint.
description: This prospective randomized controlled trial aims to evaluate the functional
  and radiological outcomes of using the Suzuki frame for treating comminuted intra-articular
  fractures of the proximal interphalangeal (PIP) joint. The study involves adult
  patients with PIP joint fractures who will be treated using dynamic joint distraction
  (ligamentotaxis) via the Suzuki frame. The primary goal is to assess whether this
  technique facilitates early active finger motion, reduces joint stiffness, and improves
  long-term functional recovery compared to other methods. (NCT NCT07714356; status
  NOT_YET_RECRUITING).
