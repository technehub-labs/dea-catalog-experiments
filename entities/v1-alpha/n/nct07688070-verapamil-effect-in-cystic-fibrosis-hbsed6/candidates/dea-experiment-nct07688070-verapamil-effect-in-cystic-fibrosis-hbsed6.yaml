id: dea:experiment-nct07688070-verapamil-effect-in-cystic-fibrosis-hbsed6
type: Experiment
name: NCT07688070 — Verapamil Effect in Cystic Fibrosis-related Dysglycemia
description: The investigators are conducting a pilot open-label pre/post interventional
  trial in adolescents and adults with cystic fibrosis (CF) and abnormal glucose tolerance
  or early CF-related diabetes mellitus (CFRD) to assess the safety and efficacy of
  verapamil on beta cell function and dysglycemia. (NCT NCT07688070; status NOT_YET_RECRUITING).
