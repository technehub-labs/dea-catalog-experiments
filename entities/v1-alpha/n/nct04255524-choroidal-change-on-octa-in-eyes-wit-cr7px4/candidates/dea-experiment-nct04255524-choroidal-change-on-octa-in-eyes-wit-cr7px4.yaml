id: dea:experiment-nct04255524-choroidal-change-on-octa-in-eyes-wit-cr7px4
type: Experiment
name: NCT04255524 — Choroidal Change on OCTA in Eyes With High Myopia
description: Myopia is a global healthy concern, especially the high myopia and pathological
  myopia among Asian populations. However, its mechanism still remains largely unclear.
  Recent findings suggested choroidal changes might be related to the development
  of myopia. This study is to useOCT angiography (OCT-A) to investigate parapapillary
  choroidal microvasculature change in myopic eyes, and try to find the cause-and-effect
  relationship between choroidal change and the development of myopia. (NCT NCT04255524;
  status NOT_YET_RECRUITING).
