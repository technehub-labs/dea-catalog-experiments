type: Experiment
name: NCT07828470 — A Study to Evaluate the Safety, Pharmacokinetics, and Pharmacodynamics
  of KL0011034 Injection Administered by Continuous Infusion in Healthy Adult Subjects
description: This study is a randomized, double-blind, propofol position-controlled
  trial, evaluating the safety, tolerability, and pharmacodynamic of continuous infusion
  of KL0011034 injection compared with propofol injectable emulsion for durations
  of 1 hour, 2 hours, and 3 hours, and evaluating the pharmacokinetic of the KL0011034
  injection. (NCT NCT07828470; status NOT_YET_RECRUITING).
