id: dea:experiment-nct02008370-exparel-in-minimally-invasive-cardia-ce5uv3
type: Experiment
name: NCT02008370 — Exparel in Minimally Invasive Cardiac Surgery
description: 'The investigators are presently using Exparel, a slow released local
  anesthestic, in patients undergoing minimally invasive cardiac surgery. The primary
  objective of this study is to assess the efficacy of EXPAREL when delivered into
  the thoracotomy and chest tube sites to provide prolonged postoperative analgesia
  in patients undergoing minimally invasive cardiac surgery. Efficacy will be assessed
  by: the effectiveness of analgesia as measured by the subject''s overall postoperative
  pain scores and postsurgical analgesic use. (NCT NCT02008370; status TERMINATED).'
