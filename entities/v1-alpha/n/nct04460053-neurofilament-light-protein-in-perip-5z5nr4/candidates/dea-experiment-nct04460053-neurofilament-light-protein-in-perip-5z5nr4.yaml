id: dea:experiment-nct04460053-neurofilament-light-protein-in-perip-5z5nr4
type: Experiment
name: NCT04460053 — Neurofilament Light Protein in Peripheral Blood Used as a Biomarker
  for Neurotoxicity After Isolated Limb Perfusion.
description: A prospective feasibility trial initially including 10 patients to investigate
  if Neurofilament light protein can be detected in peripheral blood in patients undergoing
  Isolated Limb Perfusion with chemotherapeutic agents. This biomarker could act as
  predictive biomarker for neurotoxicity after isolated limb perfusion. (NCT NCT04460053;
  status COMPLETED).
