id: dea:experiment-nct05442853-continuous-glucose-monitoring-for-hy-u9c3xh
type: Experiment
name: NCT05442853 — Continuous Glucose Monitoring for Hyperglycemia in Critically
  Ill Patients
description: The investigators intend to conduct a single-center, prospective, randomized
  comparative trial of patients admitted to the intensive care unit (ICU) who received
  continuous glucose monitoring (CGM) vs point of care (POC) glucose monitoring. The
  study will examine relevant outcomes for patients in the ICU with diabetes mellitus
  and/or hyperglycemia. The primary outcome of the study will be the proportion of
  time in target range (blood glucose 70-180 mg/dL). (NCT NCT05442853; status COMPLETED).
