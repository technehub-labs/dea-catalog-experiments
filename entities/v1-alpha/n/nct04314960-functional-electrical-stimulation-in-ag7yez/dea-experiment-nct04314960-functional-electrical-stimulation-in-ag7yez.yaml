id: dea:experiment-nct04314960-functional-electrical-stimulation-in-ag7yez
type: Experiment
name: NCT04314960 — Functional Electrical Stimulation in Chronic Ankle Instability
description: Individuals with chronic ankle instability (CAI) display neuromuscular
  deficits such as altered control of posture and gait when compared with healthy
  controls. These deficits may be attributed to muscle inhibition occurring after
  a surrounding joint structure has been damaged. Functional electrical stimulation
  (FES) is the application of high-intensity intermittent electrical stimuli to generate
  muscle contractions that may overcome inhibition, and which is coupled with a functional
  task such as gait. The current study aims to investigate the short and immediate
  effects of FES on gait parameters and postural control in subjects with CAI. Prior
  to intervention, treadmill gait will be evaluated using a motion analysis system,
  and postural control will be evaluated in a series of tests that measure balance,
  reaction time to ankle perturbation and stabilization ability after jump-landing.
  Then, a 20 minutes gait training with an FES device will be applied. Immediate effects
  of the training on gait parameters will be assessed. For medium-term effects evaluation,
  subjects will return for additional 7 training sessions (2 per week for 4 weeks),
  following by a complete measurements acquisition as prior to intervention. At six
  months follow-up, subjects will be contacted for collecting subjective outcomes.
  (NCT NCT04314960; status UNKNOWN).
