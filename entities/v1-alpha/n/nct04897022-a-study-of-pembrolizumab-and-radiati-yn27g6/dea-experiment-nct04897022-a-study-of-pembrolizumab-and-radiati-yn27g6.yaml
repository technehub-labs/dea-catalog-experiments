type: Experiment
name: NCT04897022 — A Study of Pembrolizumab and Radiation Therapy in People With
  Mesothelioma
description: The purpose of this study is to find out whether IMPRINT in combination
  with pembrolizumab is a safe treatment for people with malignant pleural mesothelioma
  (MPM).The highest dose of IMPRINT that causes few or mild side effects when given
  in combination with pembrolizumab will be found. Once the highest safe dose of IMPRINT
  is found, it will be tested in combination with pembrolizumab in future participants
  to see whether the combination may be an effective treatment for MPM. (NCT NCT04897022;
  status ACTIVE_NOT_RECRUITING).
