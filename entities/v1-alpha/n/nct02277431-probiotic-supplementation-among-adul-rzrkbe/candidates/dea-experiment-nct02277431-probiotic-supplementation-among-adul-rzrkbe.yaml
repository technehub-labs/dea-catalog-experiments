id: dea:experiment-nct02277431-probiotic-supplementation-among-adul-rzrkbe
type: Experiment
name: NCT02277431 — Probiotic Supplementation Among Adults With Recurrent Gastrointestinal
  Symptoms
description: Participants experiencing recurrent gastrointestinal symptoms in this
  double-blind, randomized, controlled trial will receive either a commercially-available
  probiotic dietary supplement or placebo. The investigators hypothesize that participants
  in the probiotic dietary supplement group will experience greater improvement in
  their gastrointestinal symptoms than participants in the placebo group. (NCT NCT02277431;
  status COMPLETED).
