id: dea:experiment-nct01950988-effectiveness-of-a-novel-concept-for-v863zk
type: Experiment
name: NCT01950988 — Effectiveness of a Novel Concept for a Manual Toothbrush Broscyl®
description: The aim is to determine the efficacy and the satisfaction/adaptability
  of the manual Broscyl® toothbrush as compared with a standard " soft " manual toothbrush
  ADA (American Dental Association) reference using the modified Stillman brushing
  technique, in children, adults and elderly persons, after 3 months of daily use.
  (NCT NCT01950988; status TERMINATED).
