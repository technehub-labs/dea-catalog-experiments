id: dea:experiment-nct02950194-mesh-augmentation-and-panniculectomy-74c822
type: Experiment
name: NCT02950194 — Mesh Augmentation and Panniculectomy for the Treatment of Post-partum
  Abdominal Wall Insufficiency
description: The aim of this study is to evaluate this multidisciplinary surgical
  approach of PPAWI (one-step procedure a panniculectomy by a plastic surgeon was
  performed together with a mesh augmentation of the abdominal wall by a general surgeon)
  at least 1 year post-operatively. Evaluation of the PPAWI approach by clinical examination
  with Quality of Life questionnaire and by ultrasound examination. (NCT NCT02950194;
  status UNKNOWN).
