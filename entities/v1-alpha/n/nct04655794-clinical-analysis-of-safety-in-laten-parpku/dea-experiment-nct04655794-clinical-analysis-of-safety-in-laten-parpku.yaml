id: dea:experiment-nct04655794-clinical-analysis-of-safety-in-laten-parpku
type: Experiment
name: NCT04655794 — Clinical Analysis of Safety in Latent Tuberculosis Infection Prophylaxis
  Treatment
description: The treatment of latent TB with 3HP is an important issue for the prevention
  of active TB. However, significant proportion of subjects receiving 3HP had adverse
  reaction. The main purpose of this observation study is to identify subjects who
  have higher risk to develop adverse reaction. Clinical characteristics and biomarker
  will be used to predict adverse reaction. (NCT NCT04655794; status UNKNOWN).
