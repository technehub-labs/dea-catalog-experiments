id: dea:experiment-nct02995174-will-perceptual-learning-via-video-g-knexkh
type: Experiment
name: NCT02995174 — Will Perceptual Learning Via Video Game Playing Improve Visual
  Acuity Stereopsis & Fixation Stability in Mild Amblyopes?
description: Contrast balanced dichoptic videogame training has been found to improve
  sensory functions in adults with amblyopia; best corrected distance visual acuity
  (BCVA) and stereopsis, but its effect on motor function, namely amblyopic eye fixation
  stability, is unknown. Furthermore, the effect of treatment in cases of mild amblyopia
  is not well understood. The aim of this study is to find out the difference on fixation
  stability, BCVA and stereopsis in mild amblyopes after 6 weeks' contrast balanced
  dichoptic video game training. (NCT NCT02995174; status COMPLETED).
