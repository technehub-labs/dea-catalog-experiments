type: Experiment
name: NCT02113774 — The Impact of Antimicrobial Treatment for Asymptomatic Bacteriuria
  in Renal Transplant Patients
description: The investigators hypothesize that antibiotic therapy for asymptomatic
  bacteriuria in renal transplant patients does not have impact on the development
  of symptomatic urinary tract infection (UTI) or progression of renal impairment
  in patients during the first year after transplantation. (NCT NCT02113774; status
  UNKNOWN).
