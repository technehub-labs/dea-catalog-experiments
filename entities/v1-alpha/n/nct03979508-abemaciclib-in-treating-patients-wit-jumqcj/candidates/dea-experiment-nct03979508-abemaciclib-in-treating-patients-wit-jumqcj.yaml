type: Experiment
name: NCT03979508 — Abemaciclib in Treating Patients With Surgically Resectable, Chemotherapy
  Resistant, Triple Negative Breast Cancer
description: This phase II trial studies how well abemaciclib works in treating patients
  with triple negative breast cancer that can be removed by surgery (resectable) and
  does not respond to treatment with chemotherapy alone, or in combination with pembrolizumab.
  Abemaciclib may stop the growth of cancer cells by blocking some of the enzymes
  needed for cell growth. (NCT NCT03979508; status TERMINATED).
