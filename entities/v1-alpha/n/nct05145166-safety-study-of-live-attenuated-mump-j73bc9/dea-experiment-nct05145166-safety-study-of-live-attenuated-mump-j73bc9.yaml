type: Experiment
name: NCT05145166 — Safety Study of Live Attenuated Mumps Vaccines in Junior High
  School Students Under 14 Years Old
description: This study of live attenuated mumps vaccines is an observational study
  in which active monitoring and passive monitoring were combined to conduct safety
  observation.The live attenuated mumps vaccines manufactured by Sinovac (Dalian)
  Vaccine Technology Co., Ltd.The purpose of this study is to evaluate the safety
  of live attenuated mumps vaccines after large-scale application and accumulate safety
  data for the application of live attenuated mumps vaccines,and provide scientific
  basis for the formulation of vaccine immunization prevention strategies. (NCT NCT05145166;
  status COMPLETED).
