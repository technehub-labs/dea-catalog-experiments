type: Experiment
name: NCT04106102 — Study of the Effectiveness of Transcranial Direct Current Stimulation
  on Obsessive Compulsive Disorder
description: The usual management of Obsessive Compulsive Disorders is based on cognitive-behavioural
  psychotherapy, as well as the use of serotonergic antidepressants. Nevertheless,
  a significant proportion of patients (40% to 60%) are non-responders to these conventional
  therapies, and remain severely handicapped. transcranial Direct current stimulation
  (tDCS) has already proven its effectiveness, in addition to drug approaches, in
  various clinical settings, such as depression or acoustic-verbal hallucinations.
  This technic appears to be an extremely interesting alternative This is a non-invasive
  neuromodulation technique (application of a low intensity direct current (1 to 2
  mA) between two electrodes positioned on the scalp) that allows the neural activity
  of different brain areas to be modulated simultaneously. It is a simple and inexpensive
  technique with excellent tolerance. (NCT NCT04106102; status ACTIVE_NOT_RECRUITING).
