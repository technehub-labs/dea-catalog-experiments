id: dea:experiment-nct03756597-pan-study-pan-cancer-early-detection-qa543j
type: Experiment
name: 'NCT03756597 — PAN-study: Pan-Cancer Early Detection Study (PAN)'
description: The PAN-cancer Early Detection study or PAN-study is a prospective cross-sectional
  observational case-control study evaluating whether Breath Biopsy can differentiate
  between patients with and without different cancer types by comparing breath biomarkers
  for a range of cancer types including patients with gastric, oesophageal, and liver
  cancer. The research may be extended to include also pancreatic, renal, prostate
  and bladder cancer patients, however in agreement between Cambridge University Hospital
  NHS Foundation Trust, University of Cambridge, CRUK and Owlstone Medical recruitment
  in these arms will not start until further notice. When recruitment is planned to
  start in these arms, Owlstone Medical will ensure to notify the REC. Subjects with
  a histologically confirmed cancer will be recruited from CUH by local research staff.
  Breath samples will be collected by means of the ReCIVA breath sampler which requires
  tidal breathing into a face mask for around 10 minutes. A cancer free control subject
  matched for age, sex and tumour specific risk factors will be recruited and sampled.
  (NCT NCT03756597; status COMPLETED).
