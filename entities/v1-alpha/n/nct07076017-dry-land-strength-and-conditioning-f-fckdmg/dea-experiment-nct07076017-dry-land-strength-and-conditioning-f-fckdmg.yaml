id: dea:experiment-nct07076017-dry-land-strength-and-conditioning-f-fckdmg
type: Experiment
name: NCT07076017 — Dry-land Strength and Conditioning for Competitive Youth Swimmers
description: 'Starts and turns play an important role in swimming performance, with
  starts accounting for around a quarter of the total time achieved in a 50m freestyle
  race and have been recommended as a high priority area for improvement by York City
  Baths Club (YCBC). The relationship between starts and turns and plyometric and
  general strength training is well documented. However, few studies have explored
  this relationship in competitive youth swimmers. This non-randomised controlled
  trial will evaluate the effects of a dry-land strength and conditioning programme,
  when added to usual swim training, on the physical fitness and start and turn performance
  of regional- and national-level age-group swimmers. The study intervention will
  involve two supervised gym sessions per week for 10 weeks. Study outcomes will be
  assessed before the intervention, at the midpoint and at 1 week and 3 weeks post-intervention.
  The following testing will occur: Pool-based testing (50m Freestyle; a Time to 7.5m
  test; Turn time); Gym-based testing (Counter-movement jump; Isometric Mid-Thigh
  Pull; Athletic Shoulder (ASH)) The dive and turn measures will be assessed via video
  recordings. (NCT NCT07076017; status ACTIVE_NOT_RECRUITING).'
