id: dea:experiment-nct01177969-cognitive-behavioral-therapy-cbt-for-4cseve
type: Experiment
name: 'NCT01177969 — Cognitive Behavioral Therapy (CBT) for Anxiety Disorders in Autism:
  Adapting Treatment for Adolescents'
description: Comorbid anxiety disorders affect as many as 80% of youth with autism
  spectrum disorders, causing substantial distress and impairment over and above the
  autism spectrum diagnosis alone. Cognitive behavioral therapy (CBT) is the gold
  standard treatment among typically developing youth with an anxiety disorder and
  when adapted, shows promise in children with ASD and comorbid anxiety. However,
  there is currently no psychotherapy protocol tailored to meet the unique needs of
  young adolescents with Autism spectrum disorders (ASD) and comorbid anxiety. Given
  this, the present study seeks to develop and test a new CBT therapy in adolescents
  with autism and comorbid anxiety. (NCT NCT01177969; status COMPLETED).
