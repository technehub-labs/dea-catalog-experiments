type: Experiment
name: NCT07411469 — Comparison Between Using Cardiometry and IVC Collapsibility
description: Sepsis is a life-threatening condition caused by a dysregulated host
  response to infection, leading to organ dysfunction. Septic shock, a severe form
  of sepsis, is characterized by persistent hypotension and cellular/metabolic abnormalities
  despite adequate fluid resuscitation. It is associated with high mortality rates
  globally, necessitating timely diagnosis and treatment. Fluid resuscitation and
  vasopressor use are cornerstones of management, but they must be tailored to the
  individual to prevent complications such as fluid overload. (NCT NCT07411469; status
  RECRUITING).
