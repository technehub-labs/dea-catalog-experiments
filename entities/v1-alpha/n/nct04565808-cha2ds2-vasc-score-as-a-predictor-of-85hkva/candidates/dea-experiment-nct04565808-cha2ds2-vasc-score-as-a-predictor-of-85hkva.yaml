id: dea:experiment-nct04565808-cha2ds2-vasc-score-as-a-predictor-of-85hkva
type: Experiment
name: NCT04565808 — CHA2DS2-VASc Score as a Predictor of Thrombus Burden and Clinical
  Outcomes in Patients Undergoing PPCI.
description: Aim of the work is to evaluate the use CHA2DS2-VASc score in predicting
  no-reflow phenomenon and its impact on short term primary percutaneous coronary
  intervention outcomes (in-hospital mortality) and long term (6 months) incidence
  of MACE ( major adverse cardiac event ) in patients with ST segment elevation Myocardial
  infarction who underwent primary primary percutaneous coronary intervention (NCT
  NCT04565808; status UNKNOWN).
