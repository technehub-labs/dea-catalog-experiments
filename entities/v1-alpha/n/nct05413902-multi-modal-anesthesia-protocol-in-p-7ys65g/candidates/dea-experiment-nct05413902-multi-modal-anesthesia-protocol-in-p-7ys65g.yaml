id: dea:experiment-nct05413902-multi-modal-anesthesia-protocol-in-p-7ys65g
type: Experiment
name: NCT05413902 — Multi-Modal Anesthesia Protocol in Pain Management of Patients
  Undergoing Posterior Lumbar Spinal Fusion Surgery
description: This study consisted of a randomized controlled trial designed to evaluate
  a Multimodal Analgesia (MMA) Protocol on patients undergoing Posterior Spinal Fusion.
  The purpose is to describe the narcotic requirements and usage during the perioperative
  period of posterior spinal fusion and instrumentation surgery with the implementation
  of multimodal anesthesia protocol. The study will consist of two parallel arms,
  with Group 1 receiving our MMA protocol and Group 2 receiving a traditional opioid-based
  regime. The primary outcome of this study will be the reported Visual Analog Scale
  (VAS) for pain at 12, 24, and 48 hours after surgery. We considered that our findings
  could contribute to the fight against the opioid crisis proving alternatives to
  opioids as feasible alternatives for pain management even in significant surgery,
  as is posterior spinal fusion with instrumentation. (NCT NCT05413902; status COMPLETED).
