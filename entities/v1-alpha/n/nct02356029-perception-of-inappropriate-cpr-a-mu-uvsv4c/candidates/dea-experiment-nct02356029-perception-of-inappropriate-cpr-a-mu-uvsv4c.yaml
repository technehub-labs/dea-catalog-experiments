id: dea:experiment-nct02356029-perception-of-inappropriate-cpr-a-mu-uvsv4c
type: Experiment
name: 'NCT02356029 — Perception of Inappropriate CPR: a Multicenter International
  Cross-sectional Survey'
description: The primary objective of this study is to determine how often cardiopulmonary
  resuscitation (CPR) is perceived as inappropriate by Healthcare Providers (HCPs)
  working in prehospital Ambulance Services and Emergency Departments. Perception
  of inappropriate CPR is defined as resuscitation efforts perceived by HCPs as disproportionate
  to the expected prognosis of the patient in terms of survival or quality of life.
  When a HCP perceives CPR as inappropriate, this may cause moral and emotional distress.
  This perception may be modulated by the personal background and professional role
  of the HCP, but also by his/her working conditions. Apart from the workload, the
  resulting distress can be influenced by the way non-technical skills are developed
  within the team and the ethical environment in which the HCP functions. Frequent
  exposure to similar patient care situations and/or a professional environment not
  acknowledging the distress may lead to deficient coping mechanisms and accumulation
  of moral distress. This may be associated with job leave, burnout and a decreased
  quality of patient care. Acute distress may also influence the quality of care provided
  to actual and future patients. Secondary objectives of the study are to evaluate
  whether perceived inappropriateness of CPR is not only associated with patient related
  factors but also with personal characteristics and work related factors. Potential
  consequences for HCP's like moral distress and intentional job leave will be assessed.
  (NCT NCT02356029; status COMPLETED).
