id: dea:experiment-nct03108560-sublobar-resection-versus-lobectomy-udhybk
type: Experiment
name: NCT03108560 — Sublobar Resection Versus Lobectomy for cT1N0M0 Non-small-cell
  Lung Cancer
description: The incidence rate of ground-glass opacity (GGO) has been increasing
  these years. A great number of retrospective studies suggested that sublobar resection
  was better for some GGO patients. However, no prospective clinical study supports
  the perspective. This study is prospective, multi-center, randomized-controlled.
  The aim of this study is to investigate whether sublobar resection is inferior to
  lobectomy for cT1N0M0 non-small-cell lung cancer or not. (NCT NCT03108560; status
  UNKNOWN).
