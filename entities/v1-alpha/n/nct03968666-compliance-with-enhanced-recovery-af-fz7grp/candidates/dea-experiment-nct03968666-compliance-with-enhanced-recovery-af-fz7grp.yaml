id: dea:experiment-nct03968666-compliance-with-enhanced-recovery-af-fz7grp
type: Experiment
name: NCT03968666 — Compliance With Enhanced Recovery After Surgery Protocol (ERAS)
  in Surgical Patients
description: The concept of "enhanced recovery" was introduced by European anesthesiologists
  and surgeons who challenged traditional clinical practices involved in peri-operative
  care in 1990s. The goal of enhanced recovery programs (ERP) is to maintain normal
  physiology thereby decreasing complications. It focuses on peri-operative optimization
  of patient care. It was originally created for open colorectal surgeries but now
  has shown benefit in various surgical specialities including thoracic surgery, vascular
  surgery, hepatobiliary as well as gynecological surgery. The successful implementation
  of structured ERAS program requires an ERAS protocol, audit system and a multidisciplinary
  team. The investigators will evaluate the effect of compliance with the protocol
  and outcomes such as length of stay, readmissions, morbidity and mortality. (NCT
  NCT03968666; status UNKNOWN).
