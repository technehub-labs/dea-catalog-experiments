id: dea:experiment-nct02268422-bioequivalence-and-adhesion-comparis-bz4raa
type: Experiment
name: NCT02268422 — Bioequivalence and Adhesion Comparison of Buprenorphine Patches
description: To compare a 2nd generation Buprenorphine Transdermal System (BTDS) patch
  with a marketed 1st generation BTDS patch to confirm that the two are bioequivalent
  (deliver the same amount of drug) and that they equally both stick to the skin over
  7 days of continuous wear. (NCT NCT02268422; status COMPLETED).
