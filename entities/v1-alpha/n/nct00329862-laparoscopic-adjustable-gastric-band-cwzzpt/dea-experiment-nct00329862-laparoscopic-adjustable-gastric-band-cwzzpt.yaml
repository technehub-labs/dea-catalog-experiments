id: dea:experiment-nct00329862-laparoscopic-adjustable-gastric-band-cwzzpt
type: Experiment
name: NCT00329862 — Laparoscopic Adjustable Gastric Banding With Truncal Vagotomy
description: Laparoscopic Adjustable Gastric Banding (LAGB) is a gold standard in
  the surgical treatment of morbid obesity. We hypothesize that the addition of truncal
  vagotomy (cutting of nerves to the stomach) will produce greater weight loss and
  better reduction of co-morbidities (diseases caused by or aggravated by morbid obesity)
  than LAGB alone. 25 patients will be enrolled and outcomes compared to LAGB historical
  controls over a post-operative period of 24 months. (NCT NCT00329862; status TERMINATED).
