id: dea:experiment-nct01964690-lactate-use-as-triage-tool-in-sepsis-mbg9ch
type: Experiment
name: 'NCT01964690 — Lactate Use as Triage Tool in Sepsis : Veinous, Capillary or
  Arterial?'
description: Severe sepsis and septic shocks are increasingly codified. A biomarker
  as Lactate is very interesting to detect those situations. Usually, lactate used
  is arterial but results are often too slow to obtain if we want to respect Surviving
  Sepsis Campaign guidelines. Some analyzers (EKF diagnostics Lactate Scout\*) can
  give results in 15 seconds. We hypothesized that capillary lactate, easy to sample,
  tested with this analyzer may detect earlier those infections states and we want
  to find the most accurate site to detect severe sepsis (capillary, venous or arterial
  sample). (NCT NCT01964690; status COMPLETED).
