id: dea:experiment-nct06774651-comparison-of-femto-ldv-z8-corneal-l-hmytjj
type: Experiment
name: NCT06774651 — Comparison of Femto LDV Z8 Corneal Lenticule Extraction for Advanced
  Refractive Correction (CLEAR) and Visumax Small Incision Lenticule Extraction (SMILE)
description: 'This observational study aims to compare two laser corrective procedures
  for treating myopia and myopic astigmatism: a novel refractive technique, the CLEAR
  procedure, and the established SMILE procedure. Participants will be randomized
  to undergo CLEAR in one eye and SMILE in the other. The investigators will evaluate
  and compare the two procedures based on the following aspects: refractive predictability
  (how accurate the vision correction is) by measuring the proportion of eyes close
  to the target prescription after surgery, clinical dry eye outcomes, changes in
  tear proteins, and corneal nerve changes at 1, 3, 6, and 12 months after both surgeries.
  Metabolomic features of the removed corneal tissue and how precisely the laser is
  centered during surgery will also be examined. Our hypothesis is that CLEAR provides
  equally good vision results as SMILE, and explore any extra benefits of CLEAR. (NCT
  NCT06774651; status RECRUITING).'
