id: dea:experiment-nct00048217-a-rollover-study-to-provide-chronic-pcndes
type: Experiment
name: NCT00048217 — A Rollover Study to Provide Chronic T-1249 to Patients Who Completed
  Study T1249-102
description: Patients who complete study T1249-102 (must be currently failing a T-20
  containing regimen to participate in this study) will receive T-1249 at a dose of
  200mg daily in combination with a background antiretroviral regimen for 96 weeks.
  Only patients that participated in study T1249-102 can participate in study T1249-105.
  (NCT NCT00048217; status UNKNOWN).
