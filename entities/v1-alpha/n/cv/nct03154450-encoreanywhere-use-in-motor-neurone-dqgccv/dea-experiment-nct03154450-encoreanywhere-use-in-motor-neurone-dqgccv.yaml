id: dea:experiment-nct03154450-encoreanywhere-use-in-motor-neurone-dqgccv
type: Experiment
name: NCT03154450 — EncoreAnywhere Use in Motor Neurone Disease
description: 'Motor neurone disease is a progressive incurable disease causing weakness
  and paralysis of muscles. Respiratory failure is the most common cause of death
  in motor neurone disease. Patients with respiratory failure use a machine that supports
  breathing using a mask and ventilator (non-invasive ventilation: NIV) and using
  it for more than five hours per night has been shown to prolong life and improve
  symptoms such as poor sleep and breathlessness. NIV is however, challenging to use
  and some patients are unable to adhere to the required regime meaning they fail
  to gain benefit. Timely support is important to help individuals overcome early
  hurdles and barriers to using becoming regular NIV users. The Philips EncoreAnywhere
  is a system that allows continuous monitoring of the use and effectiveness of ventilation
  and allows instant adjustment of ventilator settings. The aim of this project is
  to explore if "real time" feedback and support, as well as remote changes to NIV
  settings using the EncoreAnywhere system could increase the number of individuals
  successfully using NIV. This project also aims to explore the impact of using EncoreAnywhere
  on the process of initiation of NIV, on both patients and staff. Patients starting
  NIV at the Sheffield MND care centre will be provided with the standard ventilator
  plus a Philips modem for the first three months of use. In half the patients clinicians
  will be able to use the EncoreAnywhere system to review patients'' use of NIV, make
  adjustments and give feedback. In the other half, the data will be collected but
  not available to the clinical team. Clinical data will be collected as part of usual
  care: adherence, clinical encounters and resource use and patients will be asked
  to complete questionnaires at baseline, one month and three months. This will allow
  the care team to predict the potential impact on the service and on clinical care.
