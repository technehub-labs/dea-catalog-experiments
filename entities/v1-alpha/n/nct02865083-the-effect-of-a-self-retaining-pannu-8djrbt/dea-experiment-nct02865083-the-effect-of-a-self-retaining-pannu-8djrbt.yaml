id: dea:experiment-nct02865083-the-effect-of-a-self-retaining-pannu-8djrbt
type: Experiment
name: NCT02865083 — The Effect of a Self-Retaining Pannus Retractor in Obese Patients
  Undergoing Cesarean Section
description: The purpose of this study is to investigate the effects of the Traxi
  Pannus retractor in obese patients (BMI ≥30 kg/m2) who undergo Cesarean sections
  compared to routine pannus retraction techniques. Patients will be randomized to
  the use of the Traxi retractor during Cesarean section (treatment group) or the
  use of traditional pannus retraction techniques (control group). The primary outcome
  to be followed is surgical site disruption. The investigators will also assess the
  duration of surgery or length of time from skin incision to delivery of the infant,
  change in hemoglobin, estimated blood loss, postoperative length of stay, need for
  hospital readmission or emergency room visits, or other complication rates between
  the two groups. (NCT NCT02865083; status TERMINATED).
