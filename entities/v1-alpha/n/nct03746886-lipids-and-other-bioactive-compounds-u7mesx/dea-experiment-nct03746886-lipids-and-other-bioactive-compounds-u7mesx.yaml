type: Experiment
name: NCT03746886 — Lipids and Other Bioactive Compounds of Human Breast Milk
description: The biochemical differences in the composition of breast milk and formula
  have not been profoundly established in all compound groups. Increased understanding
  of breast milk composition, the normal variation of various bioactive compounds
  and their levels is required to be able to develop formulas better corresponding
  the breast milk, and ensure the optimal development of also the formula-fed babies.
  (NCT NCT03746886; status COMPLETED).
