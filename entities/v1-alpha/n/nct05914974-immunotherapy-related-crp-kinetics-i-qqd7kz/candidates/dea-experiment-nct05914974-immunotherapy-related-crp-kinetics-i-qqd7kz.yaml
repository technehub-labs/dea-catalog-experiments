type: Experiment
name: NCT05914974 — Immunotherapy-related CRP Kinetics in Metastatic Gynecological
  Malignancies
description: ICK-Gyn is a prospective, multicentric, non-interventional investigator-initiated
  trial (IIT) that aims to investigate the prognostic value of CRP kinetics in advanced
  or metastatic gynecological malignancies under immune checkpoint inhibitor (ICI)
  therapy on the objective response rate (ORR), progression-free survival (PFS) and
  overall survival (OS). (NCT NCT05914974; status RECRUITING).
