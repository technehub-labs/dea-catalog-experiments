type: Experiment
name: NCT04825054 — Cardiopulmonary Effect of Mechanical Ventilation in Children With
  Right Ventricular Hypertrophy
description: Neurally adjusted ventilatory assist (NAVA) is a new mode of mechanical
  ventilation that delivers ventilatory assist in proportion to neural effort. The
  investigators hope to compare the hemodynamic and pulmonary effect in children after
  surgical repair of congenital heart disease with right ventricular hypertrophic
  ventilated with Pressure control ventilation (PCV), Pressure support ventilation
  (PSV), and NAVA by a crossover study. (NCT NCT04825054; status UNKNOWN).
