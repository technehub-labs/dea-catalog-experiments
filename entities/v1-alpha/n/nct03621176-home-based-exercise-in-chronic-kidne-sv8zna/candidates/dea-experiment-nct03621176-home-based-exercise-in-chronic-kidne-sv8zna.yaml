id: dea:experiment-nct03621176-home-based-exercise-in-chronic-kidne-sv8zna
type: Experiment
name: NCT03621176 — Home-based Exercise in Chronic Kidney Disease
description: 'A home-based exercise program will be implemented in three different
  groups of participants: advanced chronic kidney disease, end-stage renal disease
  in substitutive treatment hemodialysis or peritoneal dialysis. Participants will
  be evaluated before the program, after 3 months and after 6 months from the starting
  of the program. During the first 3 months the researcher will phone them weekly
  to reinforce the exercise habit, and during the last three months, there will be
  no reinforcement. Assessment will include strength, functional capacity, health-related
  quality of life and depressive symptoms. (NCT NCT03621176; status COMPLETED).'
