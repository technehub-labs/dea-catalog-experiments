type: Experiment
name: NCT04199208 — Does Prehabilitation Improve Outcome in Coloncancer Surgery?
description: The study aims to find out if complications after surgery for large bowel
  (colon) cancer can be reduced or avoided in the most frail and elderly by letting
  them go through an exercise- and diet regime prior to the surgical procedure. (NCT
  NCT04199208; status NOT_YET_RECRUITING).
