id: dea:experiment-nct01258946-epicardial-adipose-tissue-thickness-sc6gfu
type: Experiment
name: NCT01258946 — Epicardial Adipose Tissue Thickness in Polycystic Ovary Syndrome
  (PCOS)
description: The aim of the present study was to search whether epicardial adipose
  tissue thickness, a predictor of increased cardiovascular risk, increases in PCOS
  patients or not and, if it does, to analyze the relationship of EATT with insulin
  resistance, adiponectin and biochemical and anthropometric parameters. (NCT NCT01258946;
  status COMPLETED).
