id: dea:experiment-nct07300696-functional-mri-for-monitoring-progre-mvj5eg
type: Experiment
name: NCT07300696 — Functional MRI for Monitoring Progression and Assessing Trends
  in ILD
description: 'The main objective of this study is to investigate the utility of functional
  MRI to differentiate, characterize, and monitor subgroups of ILD. This can be broken
  down into three specific objectives: Determine if ILD features observed on high-resolution
  computed tomography (HRCT), such as ground glass opacities (GGO), are functionally
  different. Analyse MRI metrics within each subgroup to determine whether these metrics
  distinguish different ILDs. Assess MRI metrics longitudinally to see if these parameters
  change with disease progression, stability, or reversibility. (NCT NCT07300696;
  status RECRUITING).'
