type: Experiment
name: NCT03329950 — A Study of CDX-1140 (CD40) as Monotherapy or in Combination in
  Patients With Advanced Malignancies
description: This is a study to determine the maximum tolerated dose (MTD) for CDX-1140
  (CD40 antibody), either alone or in combination with CDX-301 (FLT3L), pembrolizumab,
  or chemotherapy and to further evaluate its tolerability and efficacy in expansion
  cohorts once the MTD is determined. (NCT NCT03329950; status COMPLETED).
