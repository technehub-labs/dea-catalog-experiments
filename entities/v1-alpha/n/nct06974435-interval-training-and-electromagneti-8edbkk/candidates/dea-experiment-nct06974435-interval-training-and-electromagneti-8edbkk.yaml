id: dea:experiment-nct06974435-interval-training-and-electromagneti-8edbkk
type: Experiment
name: NCT06974435 — Interval Training and Electromagnetic Therapy on Cardiovascular
  Disease Risk in Diabetic Elderly
description: 'Aims: To evaluate the combined effect of moderate intensity interval
  training and low frequency pulsed electromagnetic field therapy on cardiovascular
  disease risk and lower extremity functioning in the elderly with type 2 diabetes
  mellitus. Methods: One hundred patients with type 2 diabetes mellitus were randomly
  allocated into four groups: group A (received moderate intensity interval training+low
  frequency pulsed electromagnetic field therapy; n=25), group-B (received low frequency
  pulsed electromagnetic field therapy only; n=25), group C (received moderate intensity
  interval training only; n=25), and (control group; no intervention; n=25). Treatment
  programs for groups A, B, and C were in the form of twice-weekly sessions for 8
  weeks. Variables were evaluated at the beginning and the end of the study. The cardiovascular
  disease risk (evaluated using the Atherosclerotic Cardiovascular Disease risk estimator
  plus tool, Framingham Cardiovascular Disease risk estimation tool, and the mean
  arterial pressure methods). Lower extremity functioning was evaluated using the
  Short Physical Performance Battery. Within and between-subjects statistical comparisons
  were performed to test the hypothesis (to test whether the combined application
  of moderate intensity interval training+low frequency pulsed electromagnetic field
  therapy is effective in improving the cardiovascular disease risk and lower limbs
  functional status in ethe lderly with type 2 diabetes mellitus), A P-value of \<0.05
  was considered significant. (NCT NCT06974435; status COMPLETED).'
