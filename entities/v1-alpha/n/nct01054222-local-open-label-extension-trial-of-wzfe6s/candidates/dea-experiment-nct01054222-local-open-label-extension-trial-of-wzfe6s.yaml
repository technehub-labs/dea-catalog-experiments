id: dea:experiment-nct01054222-local-open-label-extension-trial-of-wzfe6s
type: Experiment
name: NCT01054222 — Local, Open-Label, Extension Trial Of The Efficacy And Safety
  Of Fesoterodine In Elderly Patients With Overactive Bladder
description: This is an open-label extension study intended for subjects who have
  previously completed study A0221045 (fesoterodine in elderly OAB patients) and who
  have been recommended by the investigator as being suitable for the extended use
  of Fesoterodine. Data from this study will extend the evaluation of efficacy, tolerability
  and safety of Fesoterodine in older subjects from Portugal. (NCT NCT01054222; status
  COMPLETED).
