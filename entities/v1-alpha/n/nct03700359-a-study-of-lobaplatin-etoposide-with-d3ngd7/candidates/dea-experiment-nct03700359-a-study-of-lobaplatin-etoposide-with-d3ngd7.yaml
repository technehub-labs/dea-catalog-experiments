id: dea:experiment-nct03700359-a-study-of-lobaplatin-etoposide-with-d3ngd7
type: Experiment
name: NCT03700359 — A Study of Lobaplatin/Etoposide With or Without Anlotinib Maintenance
  Therapy in Patients With ES-SCLC
description: This is a prospective, randomized, open-label and active controlled phase
  II study. It plans to enroll 60 subjects with extensive stage small cell lung cancer
  (ES-SCLC). All subjects will be assigned randomly to the experimental arm or control
  arm. The primary endpoints would be overall survival and progression-free survival.
  (NCT NCT03700359; status UNKNOWN).
