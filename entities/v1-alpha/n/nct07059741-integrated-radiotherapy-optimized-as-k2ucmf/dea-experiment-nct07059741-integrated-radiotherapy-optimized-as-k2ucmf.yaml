id: dea:experiment-nct07059741-integrated-radiotherapy-optimized-as-k2ucmf
type: Experiment
name: NCT07059741 — Integrated Radiotherapy-optimized ASCT Sequential CAR-T Therapy
  for Patients With Relapsed and Refractory B-NHL
description: This study aims to investigate a novel therapeutic strategy of integrated
  radiotherapy before autologous stem cell transplantation (ASCT) sequential chimeric
  antigen receptor T-cell(CAR-T) therapy for patients with relapsed/refractory(R/R)
  aggressive B-cell non-Hodgkin lymphoma (B-NHL). By evaluating the efficacy and safety
  of this multimodal approach, we seek to provide a theoretical foundation and clinical
  data to optimize outcomes for relapsed/refractory aggressive B-NHL patients. (NCT
  NCT07059741; status RECRUITING).
