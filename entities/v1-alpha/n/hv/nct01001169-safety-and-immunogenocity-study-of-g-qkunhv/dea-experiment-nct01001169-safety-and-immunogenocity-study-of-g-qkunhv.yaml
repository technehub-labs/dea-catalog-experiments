id: dea:experiment-nct01001169-safety-and-immunogenocity-study-of-g-qkunhv
type: Experiment
name: NCT01001169 — Safety and Immunogenocity Study of GSK Biologicals' Pandemic Influenza
  (H1N1) Candidate Vaccine in Japanese Children
description: The objective of this study is to evaluate the immunogenicity and safety
  of GSK Biologicals' investigational influenza vaccine GSK2340274A following one
  dose and following a second dose, using the same dosage as has been used in the
  H5N1 development program in Japanese children aged 10-17 years and an alternative
  dose in children aged 6 months to 9 years. (NCT NCT01001169; status COMPLETED).
