id: dea:experiment-nct03690531-efficacy-of-mindfulness-as-an-interv-gejy5r
type: Experiment
name: NCT03690531 — Efficacy of Mindfulness as an Intervention in the Pediatric Emergency
  Department
description: Non-pharmacological interventions including distraction techniques (ie.,
  games, ipads, bubbles, stickers) are standard of care in reducing situation anxiety
  for children in the pediatric emergency department. The goal of the study is to
  evaluate the efficacy of a mindfulness based virtual reality (mbVR) tool (Take-Pause)
  for pediatric patients age \> 12 years. The study team will be providing children
  with a virtual reality experience upon arrival to the emergency department and measuring
  the effectiveness of the intervention versus standard of care (Ipads, games). Subjective
  measurements will include questionnaires and objective measurements will include
  vital signs. (NCT NCT03690531; status COMPLETED).
