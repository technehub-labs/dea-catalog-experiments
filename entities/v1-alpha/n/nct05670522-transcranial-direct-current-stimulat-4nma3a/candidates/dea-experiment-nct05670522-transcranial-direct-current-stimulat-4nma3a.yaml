type: Experiment
name: NCT05670522 — Transcranial Direct Current Stimulation Versus Virtual Reality
  on Gait in Children With Spastic Diplegia
description: Spastic diplegia is the most frequent type of cerebral palsy (CP), and
  impaired gait is a common sequela of this condition. The investigators compared
  the effects of two novel research interventions transcranial direct current stimulation
  (tDCS) and virtual reality (VR) on gait impairments in children with spastic diplegia.
  Currently, both tDCS and VR require further investigation to determine their clinical
  effectiveness for children with CP. Thus, the aim of this study was to compare the
  effects of tDCS and VR training on spatiotemporal and kinetic gait parameters in
  children with spastic diplegia, as a supplemental intervention to traditional physical
  therapy. (NCT NCT05670522; status COMPLETED).
