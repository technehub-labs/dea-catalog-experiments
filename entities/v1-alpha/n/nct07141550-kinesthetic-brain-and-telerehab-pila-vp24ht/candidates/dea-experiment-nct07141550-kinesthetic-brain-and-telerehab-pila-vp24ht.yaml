id: dea:experiment-nct07141550-kinesthetic-brain-and-telerehab-pila-vp24ht
type: Experiment
name: NCT07141550 — Kinesthetic Brain and Telerehab Pilates for Cognitive and Functional
  Outcomes in Women With Fibromyalgia
description: Fibromyalgia is a chronic pain syndrome often accompanied by fatigue,
  psychological problems, and cognitive dysfunction, leading to reduced quality of
  life. Telerehabilitation-based Pilates has been shown to improve symptoms and function
  in fibromyalgia, while kinesthetic brain exercises may enhance cognitive performance
  through neuroplasticity. This study aims to evaluate the effects of adding kinesthetic
  brain exercises to telerehabilitation-based Pilates on cognitive functions, symptom
  management, functional performance, and quality of life in women with fibromyalgia.
  (NCT NCT07141550; status NOT_YET_RECRUITING).
