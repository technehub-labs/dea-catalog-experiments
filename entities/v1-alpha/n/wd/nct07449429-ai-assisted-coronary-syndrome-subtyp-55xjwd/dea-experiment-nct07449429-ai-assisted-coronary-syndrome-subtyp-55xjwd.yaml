id: dea:experiment-nct07449429-ai-assisted-coronary-syndrome-subtyp-55xjwd
type: Experiment
name: 'NCT07449429 — AI-Assisted Coronary Syndrome Subtyping From Admission History
  of Present Illness: A Clinician Reader Study'
description: This study will evaluate whether an OCR-LLM-based clinical decision support
  framework improves clinicians' accuracy in classifying coronary syndrome subtypes
  from admission history of present illness. Participating clinicians will classify
  a set of cases first without AI assistance and then with assistance from the OCR-LLM
  framework. The primary outcome is the change in classification accuracy between
  unaided and AI-assisted assessments. (NCT NCT07449429; status COMPLETED).
