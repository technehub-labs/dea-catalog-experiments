id: dea:experiment-nct04910360-embolism-in-covid-19-positive-patien-u2uwjh
type: Experiment
name: NCT04910360 — Embolism in COVID-19 Positive Patients
description: Covid-19 outbreak has caused death of millions of people because of not
  only the severe acute respiratory syndrome coronavirus 2 (SARS-CoV-2) infection
  itself but also infection dependent complications. Abnormalities in thrombotic events
  leads to some of these complications which eventually result in emboli. The endothelial
  damage caused by the virus interacting with ACE2 on the host cells leads to the
  activation of coagulation cascade. Accumulation of byproducts of the cascade might
  have some roles in embolism inducing risk of organ damage, other life-threatening
  problems, and even death. To enlighten the factors triggering embolism, the investigators
  have focused on genetic changes such as polymorphisms and mutations in certain genes
  in DNA samples coming from intensive care unit (ICU) patients. (NCT NCT04910360;
  status UNKNOWN).
