id: dea:experiment-nct00054002-surgery-and-photodynamic-therapy-in-p984cu
type: Experiment
name: NCT00054002 — Surgery and Photodynamic Therapy in Treating Patients With Malignant
  Mesothelioma
description: 'RATIONALE: Photodynamic therapy uses light and drugs that make cancer
  cells more sensitive to light to kill cancer cells. Combining photodynamic therapy
  with surgery may be an effective treatment for malignant mesothelioma. PURPOSE:
  Phase II trial to study the effectiveness of combining photodynamic therapy with
  surgery in treating patients who have malignant mesothelioma. (NCT NCT00054002;
  status COMPLETED).'
