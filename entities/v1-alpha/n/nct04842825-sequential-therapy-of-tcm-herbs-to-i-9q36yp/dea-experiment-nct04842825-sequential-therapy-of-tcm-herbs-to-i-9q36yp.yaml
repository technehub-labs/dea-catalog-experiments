id: dea:experiment-nct04842825-sequential-therapy-of-tcm-herbs-to-i-9q36yp
type: Experiment
name: NCT04842825 — Sequential Therapy of TCM Herbs to Improve the Success Rate of
  IVF-ET in Diminished Ovarian Reserve Patients
description: In the early stage, our team found that traditional Chinese medicine
  (TCM) intervention aimed at Nourishing kidney and regulating blood circulation in
  vitro fertilization and embryo transfer(IVF-ET) can improve the clinical pregnancy
  rate. In order to further study the role of TCM in improving the pregnancy outcome
  of IVF-ET in infertility due to decreased ovarian reserve (DOR). A randomized controlled
  clinical trial was used in this study. 200 infertile patients with DOR were randomly
  divided into two groups. The control group was treated with conventional modern
  medicine, and the treatment group was treated with traditional Chinese herbs on
  the basis of conventional modern medicine. The intervention started from the 5th
  day of the first menstrual cycles after enrollment and lasted for three months before
  IVF-ET. After the transplantation, the TCM treatment continues for 14 days. The
  number of oocytes, antral follicles, anti-Mullerian hormone(AMH), serum follicle-stimulating
  hormone(FSH), and clinical pregnancy rate will be observed to evaluate the effect
  of traditional Chinese medicine on the improvement of ovarian function, pregnancy
  outcome, and fertility of DOR patients. (NCT NCT04842825; status UNKNOWN).
