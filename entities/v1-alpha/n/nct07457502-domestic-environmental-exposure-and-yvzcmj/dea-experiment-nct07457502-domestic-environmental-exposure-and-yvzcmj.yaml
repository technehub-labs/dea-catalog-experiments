id: dea:experiment-nct07457502-domestic-environmental-exposure-and-yvzcmj
type: Experiment
name: 'NCT07457502 — Domestic Environmental Exposure and Progression of ILD: An Exploratory
  Case-Control Study'
description: 'The project titled "Domestic Environmental Exposure and Progression
  of Progressive or Stable Fibrosing Interstitial Lung Diseases: An Exploratory Case-Control
  Study" is a Category 3 study involving 60 patients with progressive or stable fibrosing
  interstitial lung diseases (ILDs). These patients are matched based on the same
  ILD subtype and their use or non-use of antifibrotic medication. The study aims
  to thoroughly describe the domestic environment of these patients and investigate
  the associations between the progression of pulmonary fibrosis and: i) The presence
  of pollutants and risk factors in the home, including concentrations of nitrogen
  dioxide, volatile organic compounds, aldehydes, fine particles, mold, dust mite
  allergens, building defects, and lifestyle habits that increase pollutant exposure.
  ii) The ambient air quality at the patients'' addresses. Occupational exposures
  will also be considered in the analysis. This project is designed to enhance our
  understanding of how an unfavorable domestic environment impacts the progression
  of pulmonary fibrosis and to evaluate the effects of the CMEI (Comprehensive Environmental
  and Indoor Audit) on patients'' ability to manage identified risk factors within
  their homes, their respiratory health, and their medical diagnosis. The CMEI audit
  is a preventive measure that could serve as a significant intervention to alter
  patient behavior, reduce exposure, and improve health outcomes. This project is
  sponsored by the Environmental Health Laboratories Department, in collaboration
  with Unit 1018 of the Research Center in Epidemiology and Population Health (CESP),
  and two investigative centers: Tenon Hospital and Paris Saint-Joseph Hospital. (NCT
  NCT07457502; status RECRUITING).'
