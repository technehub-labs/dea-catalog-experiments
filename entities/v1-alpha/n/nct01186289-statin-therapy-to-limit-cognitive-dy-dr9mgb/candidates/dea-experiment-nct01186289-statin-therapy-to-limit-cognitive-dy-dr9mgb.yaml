id: dea:experiment-nct01186289-statin-therapy-to-limit-cognitive-dy-dr9mgb
type: Experiment
name: NCT01186289 — Statin Therapy To Limit Cognitive Dysfunction After Cardiac Surgery
description: The primary aim of our prospective, randomized, double-blind interventional
  clinical trial is to determine the effectiveness of high dose atorvastatin therapy
  to reduce post operative cognitive dysfunction (POCD) in patients undergoing cardiac
  valve surgery. We hypothesize that therapy with high dose atorvastatin will significantly
  reduce the incidence and/or severity of POCD. (NCT NCT01186289; status WITHDRAWN).
