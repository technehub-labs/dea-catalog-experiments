id: dea:experiment-nct07903246-a-prospective-study-of-anxiety-depre-jcb4w9
type: Experiment
name: NCT07903246 — A Prospective Study of Anxiety, Depression, and Bipolar Disorder
  in People
description: This study aims to understand how anxiety disorders, depressive disorders,
  and bipolar disorder change over time and to identify patterns that may help with
  earlier recognition, diagnosis, and prediction of future symptoms. The study will
  enroll approximately 2,690 participants aged 12 to 55 years across multiple hospitals
  in China. Participants will include people with anxiety disorders, depressive disorders,
  or bipolar disorder, as well as healthy volunteers for comparison. Participants
  will be followed for 3 years after enrollment, with assessments at baseline and
  at 1, 6, 12, 18, 24, 30, and 36 months. Study assessments will collect information
  about symptoms, treatment, daily functioning, and quality of life. Other study data
  will include biological samples, brain imaging, recordings of brain electrical activity,
  and measurements from wearable devices and tasks involving speech, facial expressions,
  and eye movements. Researchers will examine how these measurements relate to symptoms
  and changes in health over time. They will also develop and evaluate artificial
  intelligence models intended to help identify these disorders and predict treatment
  outcomes, relapse, and suicide or self-harm risk. This is an observational study.
  The researchers will not assign treatments or change participants' treatment as
  part of the study. Treatments received during routine clinical care will be recorded.
  (NCT NCT07903246; status RECRUITING).
