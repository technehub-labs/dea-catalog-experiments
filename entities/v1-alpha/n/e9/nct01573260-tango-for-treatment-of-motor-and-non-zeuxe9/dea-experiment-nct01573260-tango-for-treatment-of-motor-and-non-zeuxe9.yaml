id: dea:experiment-nct01573260-tango-for-treatment-of-motor-and-non-zeuxe9
type: Experiment
name: NCT01573260 — Tango for Treatment of Motor and Non-motor Manifestations in Parkinson's
  Disease.
description: Parkinson's disease involves many motor difficulties as well as non-motor
  ones. Recent research has strongly suggested that exercise is very important for
  Parkinson's disease. We are interested especially in dance as a form of exercise,
  because it combines physical movements with balance tasks, social engagement, and
  mental stimulation. Therefore, we think dance classes may be a very beneficial exercise
  for Parkinson's disease; the purpose of this study is to see if Argentinean Tango
  classes might improve motor and non-motor manifestations of Parkinson's disease.
  (NCT NCT01573260; status COMPLETED).
