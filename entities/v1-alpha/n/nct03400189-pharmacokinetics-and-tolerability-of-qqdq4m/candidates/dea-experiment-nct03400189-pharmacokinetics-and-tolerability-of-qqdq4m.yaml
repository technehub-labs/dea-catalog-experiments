id: dea:experiment-nct03400189-pharmacokinetics-and-tolerability-of-qqdq4m
type: Experiment
name: NCT03400189 — Pharmacokinetics and Tolerability of Sulthiame
description: This preliminary pilot exploration aims at specifying the pharmacokinetic
  parameters of sulthiame, formulated as an immediate release tablet, thus helping
  to design proper clinical trials for the future assessment of new paediatric formulations
  currently under development. The clinical tolerability to single doses of sulthiame
  will also be closely monitored to orient future trials. (NCT NCT03400189; status
  COMPLETED).
