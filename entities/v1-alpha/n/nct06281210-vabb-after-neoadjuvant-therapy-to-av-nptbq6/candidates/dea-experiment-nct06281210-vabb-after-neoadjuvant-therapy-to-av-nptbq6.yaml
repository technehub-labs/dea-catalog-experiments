id: dea:experiment-nct06281210-vabb-after-neoadjuvant-therapy-to-av-nptbq6
type: Experiment
name: NCT06281210 — Vabb After Neoadjuvant Therapy to Avoid Surgery-pCR to Avoid Breast
  Surgery
description: This single arm study aims to evaluate the efficacy and safety of a non-surgical
  approach, consisting of radiotherapy (RT) alone, for patients who have achieved
  a complete pathological response (pCR) following neoadjuvant chemotherapy (NACT).
  The study design involves the histological confirmation of pCR using vacuum-assisted
  biopsy (VABB) or vacuum-assisted excision (VAE) guided by ultrasound. The primary
  objective is to demonstrate that the non-surgical, RT-only treatment and follow-up
  approach is not inferior to the traditional surgical approach in patients with pCR
  after NACT. (NCT NCT06281210; status RECRUITING).
