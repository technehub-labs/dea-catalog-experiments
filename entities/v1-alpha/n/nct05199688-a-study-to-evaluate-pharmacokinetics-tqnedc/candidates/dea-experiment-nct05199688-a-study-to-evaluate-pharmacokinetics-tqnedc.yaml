id: dea:experiment-nct05199688-a-study-to-evaluate-pharmacokinetics-tqnedc
type: Experiment
name: NCT05199688 — A Study to Evaluate Pharmacokinetics, Efficacy, Safety, Tolerability,
  and Pharmacodynamics of Satralizumab in Pediatric Patients With Aquaporin-4 Antibody
  Positive Neuromyelitis Optica S
description: This study will primarily evaluate the pharmacokinetics of satralizumab
  in pediatric patients aged 2-11 years with anti-aquaporin-4 (AQP4) antibody seropositive
  neuromyelitis optica spectrum disorder (NMOSD). Efficacy, safety, tolerability,
  and pharmacodynamics will be evaluated in a descriptive manner, given the small
  number of patients who will be enrolled in this study. (NCT NCT05199688; status
  RECRUITING).
