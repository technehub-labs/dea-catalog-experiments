type: Experiment
name: 'NCT02613273 — CHAMP: A Randomized Controlled Trial of High-intensity Aerobic
  and Resistance Exercise for Metastatic Prostate Cancer'
description: This Phase II, open-label, three-arm randomized controlled trial (RCT)
  will investigate the effects of 12 weeks of aerobic exercise vs. 12 weeks of resistance
  exercise vs. usual care in men with metastatic castration resistant prostate cancer
  to determine the safety, feasibility, and tolerance of exercise; quality of life
  indicators, and a prognostic score. (NCT NCT02613273; status COMPLETED).
