name: NCT05414266 — Study Evaluating Efficacy of Topical Squaric Acid Dibutyl Ester
  in Children and Adolescents With Alopecia Areata
description: The purpose of this study is to evaluate the efficacy and tolerability
  of squaric acid dibutylester (SADBE) in children and adolescents with alopecia areata
