type: Experiment
name: NCT07193160 — Sacituzumab Tirumotecan in Combination With Furmonertinib as Second-line
  Treatment for EGFR-mutant Advanced or Metastatic NSCLC After Failure of First-line
  Third-generation EGFR-TKI Ther
description: This study is a multicenter, single-arm, phase II clincial trial. The
  main objective of the study is to evaluate the efficacy and safety of the combination
  of Sacituzumab Tirumotecan (sac-TMT) and Furmonertinib in the treatment of EGFR-mutant
  advanced or metastatic NSCLC after failure of first-line Third-generation EGFR-TKI
  therapy. (NCT NCT07193160; status NOT_YET_RECRUITING).
