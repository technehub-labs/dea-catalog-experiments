name: NCT04298346 — Neurological Fate, Prematurity and Genetic Susceptibility Factors
description: This study could help identify aggravating or protective genetic polymorphisms
  associated with cerebral palsy. Populations of premature babies at different risk
  of cerebral palsy could thus be individualized with an impact on their monitoring
  and on the pathophysiological understanding of the processes leading to neurological
  lesions. (NCT NCT04298346; status COMPLETED).
