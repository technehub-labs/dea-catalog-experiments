id: dea:experiment-nct04605380-learning-management-of-open-fracture-ft4tce
type: Experiment
name: NCT04605380 — Learning Management of Open Fractures on Virtual Patient
description: '* A novel virtual world programme with over 240 multiple choice questions
  was developed to assess the competencies in managing an open fracture of the lower
  limb according to the British Orthopaedic Association Standards for Trauma (BOAST)
  and Advanced Trauma Life support (ATLS) guidelines. * A longitudinal, observational,
  multi-centre prospective cohort study was conducted at Imperial College London.
  * Primary objective consisted of objective scores calculated in real-time from the
  240 multiple choice questions between Novices, Intermediates and Experts. * Participants
  who had either completed ATLS training, or had familiarised themselves with BOAST
  guidelines were also identified and correlated with objective scores. (NCT NCT04605380;
  status SUSPENDED).'
