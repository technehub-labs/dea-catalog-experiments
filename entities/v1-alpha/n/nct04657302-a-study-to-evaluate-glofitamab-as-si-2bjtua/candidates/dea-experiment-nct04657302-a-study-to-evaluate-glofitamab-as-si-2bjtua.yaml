id: dea:experiment-nct04657302-a-study-to-evaluate-glofitamab-as-si-2bjtua
type: Experiment
name: NCT04657302 — A Study to Evaluate Glofitamab as Single Agent Administered After
  Pretreatment With Obinutuzumab in Chinese Patients With Relapsed/Refractory Diffuse
  Large B-Cell Lymphoma
description: This study will evaluate the pharmacokinetics, safety, tolerability,
  and efficacy of glofitamab as a single agent following a fixed single dose of obinutuzumab
  in Chinese patients with relapsed or refractory (R/R) diffuse large B-cell lymphoma
  (DLBCL) who have failed two or more lines of systemic therapy. (NCT NCT04657302;
  status COMPLETED).
