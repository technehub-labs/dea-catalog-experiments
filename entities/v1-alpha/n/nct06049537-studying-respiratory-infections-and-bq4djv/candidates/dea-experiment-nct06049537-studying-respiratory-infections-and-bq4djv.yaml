type: Experiment
name: NCT06049537 — Studying Respiratory Infections and Colonisation in Children Using
  Daily Minimally-invasive Nasal Sampling
description: 'Rationale: Respiratory tract infections (RTI) are a major cause of morbidity
  in young children in high- income countries and the major cause of mortality in
  developing countries. Causative bacteria and viruses are regular residents of the
  nasopharynx of asymptomatic individuals (colonization) and live there together with
  other presumed harmless commensals, without causing disease. These non-pathological
  infections/colonization episodes are important for transmission, intermediate step
  to disease and boost immune responses. The investigators recently validated the
  use of minimally-invasive nasal sampling methods that can be done at home for the
  study of host and microbial parameters in adults and children. In this study the
  investigators will focus on the daily microbial and immunological composition of
  the nasopharynx during health in relation to symptoms. Primary objective: Associate
  acquisition of pneumococcal colonisation with levels of pre-existing polysaccharide
  specific memory B cells. Secondary objectives include: Validate the use of synthetic
  absorptive matrices (SAM) for detection of respiratory pathogens versus nasopharyngeal
  swabs (NPS) and saliva; Assess dynamics of URT infection/colonisation and examine
  its relationship with symptoms, host responses and microbiota; Measure transmission
  between children and parents and immune responses in parents. Study design: Prospective
  community-based cohort study.total of 45 children, aged 1-5 years old attending
  daycare or (pre-)school, will be included, including a pilot of 10 children to assess
  tolerability. If there are insufficient pneumococcal acquisitions in the study to
  assess the primary outcome, additional children can be recruited in groups of 3
  or 4 children (up to 10). For a subset of participating children, both parents will
  be asked to self-collect daily saliva during the study. Primary study parameters:
  Frequency of systemic polysaccharide specific B cells in children that become colonised
  during the'
