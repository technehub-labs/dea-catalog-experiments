id: dea:experiment-nct06074003-does-biological-sex-influence-insuli-n4uwzd
type: Experiment
name: NCT06074003 — Does Biological Sex Influence Insulin Sensitivity and Muscle Metabolism
  Following High-intensity Interval Exercise?
description: High-intensity interval exercise (HIIE) is a type of exercise that involves
  alternating periods of intense exercise with periods of rest. HIIE has been shown
  to improve many aspects of cardiovascular and metabolic health in a time-efficient
  manner (e.g., only 20 minutes per exercise session). An important health benefit
  of exercise is improved blood sugar control, which can help reduce the risk of metabolic
  diseases like type 2 diabetes. A single session of HIIE has been shown to improve
  blood sugar in males, but it is unknown if females achieve the same health benefit.
  It is also not fully understood how exercise improves blood sugar in males and females.
  Therefore, the purpose of this project is 1) to determine if a single session of
  HIIE improves blood sugar control in males and females, and 2) to evaluate if changes
  in skeletal muscle can explain the beneficial effects of HIIE on blood sugar. (NCT
  NCT06074003; status COMPLETED).
