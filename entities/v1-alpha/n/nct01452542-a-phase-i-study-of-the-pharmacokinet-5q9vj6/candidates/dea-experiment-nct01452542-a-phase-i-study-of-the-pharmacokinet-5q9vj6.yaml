id: dea:experiment-nct01452542-a-phase-i-study-of-the-pharmacokinet-5q9vj6
type: Experiment
name: NCT01452542 — A Phase I Study of the Pharmacokinetic Variability and Relative
  Bioavailability of the Phase 3 and Common Blend Formulations of Eliglustat in Healthy
  Adult Subjects
description: The primary objective of this pilot study is to determine the within-subject
  pharmacokinetic (PK) variability and relative bioavailability of single oral 150-mg
  doses of eliglustat administered as the Phase 3 formulation (3x50-mg capsules) and
  the common blend proposed commercial formulation (1x150-mg capsule) in healthy adult
  subjects, which will be used to plan and support the design of a subsequent bioequivalence
  study. (NCT NCT01452542; status COMPLETED).
