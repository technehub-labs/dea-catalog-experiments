id: dea:experiment-nct06960902-study-of-the-determinants-of-coronar-g8ae9x
type: Experiment
name: NCT06960902 — Study of the Determinants of Coronary Atherosclerosis in Familial
  Hypercholesterolemia (ATHERO-FH Study)
description: 'The goal of this study (interventional clinical research not involving
  a health product) is to assess the prevalence of subclinical coronary atherosclerosis
  diagnosed by coronary CT angiography in heart failure patients in primary prevention,
  across different levels of cardiovascular risk defined by coronary artery calcium
  (CAC) score percentiles (based on data from the MESA study): low risk (≤25th percentile
  for age, sex, and ethnicity), intermediate risk (25th \< CAC ≤ 75th percentile),
  and high risk (\>75th percentile). The Patients will attend an on-site visit at
  inclusion (and must undergo a coronary CT angiography within 6 months following
  this visit), will be contacted by phone at 1 year and 2 years, and will return for
  an on-site visit at 30 months. (NCT NCT06960902; status RECRUITING).'
