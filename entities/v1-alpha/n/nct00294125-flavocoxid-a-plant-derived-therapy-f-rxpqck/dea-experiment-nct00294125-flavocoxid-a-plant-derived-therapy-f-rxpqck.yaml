id: dea:experiment-nct00294125-flavocoxid-a-plant-derived-therapy-f-rxpqck
type: Experiment
name: NCT00294125 — Flavocoxid, A Plant-Derived Therapy, for the Treatment of Knee
  Osteoarthritis
description: 'Nonsteroidal anti-inflammatory drugs (NSAIDs) are commonly prescribed
  to treat arthritis. The purpose of this study is to test the effectiveness of flavocoxid,
  a plant-derived compound, for the treatment of knee osteoarthritis (OA) in adults.
  Study hypotheses: 1) Flavocoxid has an acceptable safety and tolerability profile
  as determined by the Generally Regarded as Safe (GRAS) profile in patients with
  OA compared to identical placebo. 2) Flavocoxid will be more effective as a therapy
  for OA compared to identical placebo. (NCT NCT00294125; status COMPLETED).'
