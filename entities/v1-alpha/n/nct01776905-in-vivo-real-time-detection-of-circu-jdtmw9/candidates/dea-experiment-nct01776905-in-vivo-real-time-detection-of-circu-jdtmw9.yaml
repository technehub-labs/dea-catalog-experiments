id: dea:experiment-nct01776905-in-vivo-real-time-detection-of-circu-jdtmw9
type: Experiment
name: NCT01776905 — In Vivo Real-time Detection of Circulating Melanoma Cells
description: The objective of this clinical trial is to determine whether a Photoacoustic
  flow cytometry (PAFC)-based prototype device can detect circulating tumor cells
  (CTCs) in the blood of melanoma patients in vivo, in real time, and do so at detection
  limits at least one order of magnitude below the detection limits of currently existing
  ex vivo methods. (NCT NCT01776905; status RECRUITING).
