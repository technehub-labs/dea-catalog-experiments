id: dea:experiment-nct03830242-diagnostic-significance-of-fdg-pet-c-p2dptm
type: Experiment
name: NCT03830242 — Diagnostic Significance of FDG PET/CT Dynamic Imaging in Detecting
  Metastatic Lymph Nodes With Papillary Thyroid Cancer.
description: The aim of this study is to make up for the gap by performing a dynamic
  scan of \<Sup\>18\<Sup\>F-FDG PET/CT on newly diagnosed patients with papillary
  thyroid carcinoma. Pathological and genomic studies are performed. The differences
  between metastatic central lymph nodes images and tissues are compared at the same
  time. \<Sup\>18\<Sup\>F-FDG PET/CT dynamic imaging is explored in metastatic central
  lymph nodes with papillary thyroid cancer for the diagnostic value. (NCT NCT03830242;
  status UNKNOWN).
