id: dea:experiment-nct01425242-study-on-anti-inflammatory-effect-of-4p8abw
type: Experiment
name: NCT01425242 — Study on Anti-inflammatory Effect of Anti-hypertensive Treatment
  in Patients With Small AAA's and Mild Hypertension
description: Inflammation of the blood vessel plays an important role in the development
  and growth of a dilated abdominal aorta. An elevated blood pressure leads to an
  increase in inflammation, therefore blood pressure lowering is an important part
  of the treatment of patients with a dilated abdominal aorta who also have an elevated
  blood pressure. In the investigators study the investigators compare the anti-inflammatory
  effects of 2 different blood pressure lowering strategies. The investigators hypothesize
  that both strategies will decrease inflammation, however the investigators believe
  the total decrease of inflammation depends on the type of blood pressure lowering
  medication used. (NCT NCT01425242; status TERMINATED).
