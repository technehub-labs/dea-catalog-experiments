type: Experiment
name: NCT04303676 — Facilitating Alcohol Screening and Treatment (FAST)
description: Alcohol use is the third leading cause of death in the United States.
  Primary care practices need to implement new research findings that help identify
  and treat alcohol use disorder. This project will compare two methods of supporting
  small and medium size primary care practices in Colorado and surrounding states
  to improve their alcohol screening and treatment. (NCT NCT04303676; status COMPLETED).
