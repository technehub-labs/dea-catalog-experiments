name: NCT03325010 — Safety, Tolerability, and Efficacy of NBI-98854 for the Treatment
  of Pediatric Subjects With Tourette Syndrome
description: This is a Phase 2b, randomized, double-blind, placebo-controlled, dose-optimization
  study to evaluate the efficacy, safety, and tolerability of NBI-98854 titrated to
  the subject's optimal dose administered once daily (qd) for a total of 12 weeks
  of treatment in pediatric subjects with TS. (NCT NCT03325010; status COMPLETED).
