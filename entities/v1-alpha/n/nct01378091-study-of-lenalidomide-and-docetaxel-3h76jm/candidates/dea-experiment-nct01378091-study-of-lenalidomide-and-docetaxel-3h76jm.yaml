description: 'Primary objectives: To determine the maximum tolerated doses (MTDs)
  of daily lenalidomide and docetaxel given every three weeks and prednisone, as combination
  therapy to subjects with androgen independent prostate cancer To evaluate the safety
  profile of the combination of daily lenalidomide and every three week docetaxel
  and prednisone when given to subjects with androgen independent prostate cancer
  Secondary objective: To explore the anti-tumor activity of the combination of daily
  lenalidomide and every 3 week docetaxel and prednisone when given to subjects with
  androgen independent prostate cancer. (NCT NCT01378091; status COMPLETED).'
