id: dea:experiment-nct03735069-vital-pulp-therapy-in-carious-teeth-9gtgga
type: Experiment
name: NCT03735069 — Vital Pulp Therapy in Carious Teeth With Hypomineralization
description: Vital pulp therapy (VPT) is a general term for multiple procedures (indirect
  pulp cap, direct pulp cap and pulpotomy) all directed toward preserving pulp vitality
  and enable complete root development in immature teeth. The aim of this study is
  to evaluate the clinical, radiographic and histologic (if any teeth later are doomed
  for extraction for orthodontic or other reasons) success rate of VPT on treating
  cariously exposed permanent teeth with developmental defects of enamel. This will
  be a a prospective case series study including children between 6-16 years old having
  tooth with enamel hypomineralization defect with deep caries, restorable teeth ,
  and no signs of infection. The teeth will be followed up both clinically and radiographically
  for 1 year after treatment. It is expected that the teeth will maintain vitality
  with resolution of symptoms (if present) and completion of root development in immature
  teeth after vital pulp therapy. (NCT NCT03735069; status COMPLETED).
