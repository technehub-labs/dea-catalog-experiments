type: Experiment
name: NCT03572062 — A Study to Evaluate the Safety and Immunogenicity of an Adjuvanted
  RSV Vaccine in Healthy Older Adults
description: The study will evaluate the safety, tolerability, and immunogenicity
  of up to 7 different RSV vaccine candidates, some with adjuvant, when administered
  concomitantly with seasonal inactivated influenza vaccine (SIIV) and may evaluate
  a second dose of RSV vaccine administered12 months after the initial dose. In addition
  the study will evaluate a 2-dose regimen administered 2 months apart to 62 subjects.
  (NCT NCT03572062; status TERMINATED).
