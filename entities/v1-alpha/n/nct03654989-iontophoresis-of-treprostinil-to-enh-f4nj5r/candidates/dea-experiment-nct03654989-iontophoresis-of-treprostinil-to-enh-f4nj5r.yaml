id: dea:experiment-nct03654989-iontophoresis-of-treprostinil-to-enh-f4nj5r
type: Experiment
name: NCT03654989 — Iontophoresis of Treprostinil to Enhance Wound Healing in Diabetic
  Foot Skin Ulcers
description: Assess the effect of iontophoresis of treprostinil on wound closure over
  12 weeks, in patients with DFU. In the present study the investigators aim at establishing
  the proof-of-concept of iontophoresis of treprostinil as a potential treatment of
  diabetic foot ulcers in humans. The main hypothesis is that in patients with DFUs,
  the pharmacodynamic effect of a PGI2 analogue potentiates the effect of low-intensity
  current on microvascular function, tissue oxygenation and healing. (NCT NCT03654989;
  status TERMINATED).
