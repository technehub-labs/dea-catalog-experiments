type: Experiment
name: NCT06742996 — A Study to Investigate the Efficacy and Safety of Sonrotoclax
  Plus Zanubrutinib Compared With Placebo Plus Zanubrutinib in Adults With Relapsed/Refractory
  Mantle Cell Lymphoma (CELESTIAL
description: The goal of this study is to compare how well sonrotoclax plus zanubrutinib
  works versus zanubrutinib plus placebo in treating adults with relapsed/refractory
  (R/R) mantle cell lymphoma (MCL). This study will also look at the safety of sonrotoclax
  plus zanubrutinib versus zanubrutinib plus placebo. (NCT NCT06742996; status RECRUITING).
