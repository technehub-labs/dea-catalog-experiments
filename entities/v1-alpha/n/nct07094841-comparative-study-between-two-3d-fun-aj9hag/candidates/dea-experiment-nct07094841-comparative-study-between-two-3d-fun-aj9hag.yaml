name: NCT07094841 — Comparative Study Between Two 3D Functional Appliances Herbst
  and Mandibular Anterior Repositioning Appliance (MARA) on Posterior Airway Space
  And TMJ in Growing Class II Malocclusion Pa
description: 'The aim of this study is to evaluate effect of three dimensional printed
  appliances Herbst appliance and Mandibular Anterior Repositioning Appliance (MARA)
  on Posterior Airway Space (PAS) and Temporomandibular Joint (TMJ) in growing patients
  with Class II malocclusion. Primary outcome: Effect of three dimensional printed
  appliances Herbst appliance and Mandibular Anterior Repositioning Appliance (MARA)
  on Class II malocclusion in growing patients. Secondary outcome: To evaluate effects
  of two different three dimensional printed functional appliances on Posterior Airway
  Space (PAS) and Temporomandibular Joint (TMJ). (NCT NCT07094841; status NOT_YET_RECRUITING).'
