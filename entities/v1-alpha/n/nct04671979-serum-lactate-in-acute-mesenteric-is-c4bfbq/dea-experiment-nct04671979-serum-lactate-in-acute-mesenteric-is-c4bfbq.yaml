id: dea:experiment-nct04671979-serum-lactate-in-acute-mesenteric-is-c4bfbq
type: Experiment
name: NCT04671979 — Serum Lactate in Acute Mesenteric Ischemia
description: 'Background: Acute mesenteric ischemia is a vascular emergency with high
  mortality because of ambiguous symptomatology and a lack of early diagnostic markers.
  Lactate dehydrogenase has been described as a mortality biomarker and bowel necrosis
  length too. Nevertheless, the association between them has been mildly studied.
  Our objective was to evaluate the association between serum lactate admission levels,
  bowel necrosis extension, and mortality. Additionally, we performed a mortality
  characterization. Materials and Methods: A retrospective cross-sectional study was
  designed. We reviewed patients'' clinical records with acute mesenteric ischemia
  that attended a hospital between 2012 and 2018. We compared serum lactate admission
  levels with bowel necrosis length and mortality. A receiver operating characteristic
  curve was performed on the last association. As post hoc analysis, a classification
  and regression tree on mortality was fitted. (NCT NCT04671979; status COMPLETED).'
