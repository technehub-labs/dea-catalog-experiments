type: Experiment
name: NCT06642025 — EX02 CAR-T Cells for Relapsed and Refractory Acute Myeloid Leukemia
description: 'This is a early Phase 1 open-label, single-arm clinical study of EX02
  CAR-T therapy for relapsed and refractory acute myeloid leukemia. Each participant
  will undergo leukapheresis after enrolment, receive treatment of the conditioning
  chemotherapy of cyclophosphamide and fludarabine, and an an intravenous infusion
  of CAR-T cells. Each participant will proceed through the following study procedures:
  * Screening * Enrollment/Leukapheresis * Conditioning chemotherapy * CAR T treatment
  * Post-treatment assessment * Long-term follow-up (NCT NCT06642025; status RECRUITING).'
