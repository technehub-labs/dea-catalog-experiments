id: dea:experiment-nct04488068-transpelvic-magnetic-stimulation-to-czvvut
type: Experiment
name: NCT04488068 — Transpelvic Magnetic Stimulation to Improve Urogenital Function
description: 'After recruitment, 20 male patients will be assigned 1:1 to either age-matched
  control (G1: sham) or age-matched intervention (G2: pelvic magnetic stimulation;
  TPMS) groups using computer-generated process, and baseline parameters will be established.
  All patients will be instructed by the investigators to perform standard of care
  pelvic floor exercise for the duration of the study. In addition, G2 patients will
  receive TPMS, while G1 patients will undergo sham treatment. (NCT NCT04488068; status
  COMPLETED).'
