id: dea:experiment-nct02057510-observational-study-of-dental-outcom-mxj4vm
type: Experiment
name: NCT02057510 — Observational Study of Dental Outcomes in Head and Neck Cancer
  Patients
description: The purpose of this study is to measure the two-year rate of tooth loss
  in patients who have received external beam radiation therapy with curative intent
  for head and neck cancer. The study will also evaluate the sequelae of radiation
  therapy and oral complications that may occur as a result to receiving radiation
  therapy. (NCT NCT02057510; status COMPLETED).
