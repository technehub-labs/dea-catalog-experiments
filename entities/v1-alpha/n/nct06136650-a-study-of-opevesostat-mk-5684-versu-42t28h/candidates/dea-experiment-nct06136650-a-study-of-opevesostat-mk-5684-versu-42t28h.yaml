id: dea:experiment-nct06136650-a-study-of-opevesostat-mk-5684-versu-42t28h
type: Experiment
name: NCT06136650 — A Study of Opevesostat (MK-5684) Versus Alternative Next-generation
  Hormonal Agent (NHA) in Metastatic Castration-resistant Prostate Cancer (mCRPC)
  Post One NHA (MK-5684-004)
description: The purpose of this study is to assess the efficacy and safety of opevesostat
  plus daily corticosteroids compared to alternative abiraterone acetate or enzalutamide
  in participants with Metastatic Castration-resistant Prostate Cancer (mCRPC) previously
  treated with one next-generation hormonal agent (NHA). The primary study hypothesis
  is that opevesostat is superior to alternative abiraterone acetate or enzalutamide
  with respect to overall survival (OS), in androgen receptor ligand binding domain
  (AR LBD) mutation positive and negative participants. (NCT NCT06136650; status RECRUITING).
