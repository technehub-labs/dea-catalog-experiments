id: dea:experiment-nct05498662-an-observational-study-of-the-t3-pro-jk2h2y
type: Experiment
name: NCT05498662 — An Observational Study of the T3 Pro Dental Implant System
description: A prospective, observational, multicenter study where 60 patients needing
  implants in the maxilla or mandible will be enrolled. The patients will be restored
  with a final prosthesis no later than 4 months following implant placement surgery.
  The patients will come back for follow-up evaluations yearly for 2 years. (NCT NCT05498662;
  status ACTIVE_NOT_RECRUITING).
