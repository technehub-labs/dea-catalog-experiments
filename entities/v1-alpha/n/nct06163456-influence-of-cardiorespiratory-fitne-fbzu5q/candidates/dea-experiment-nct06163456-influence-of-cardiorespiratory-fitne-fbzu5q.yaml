id: dea:experiment-nct06163456-influence-of-cardiorespiratory-fitne-fbzu5q
type: Experiment
name: NCT06163456 — Influence of Cardiorespiratory Fitness and Body Composition on
  Resting and Post-exercise Indices of Vascular Health in Young Adults
description: This research is being done to determine whether acute exercise causes
  differences in numbers of novel blood factors associated with vascular health in
  college-aged adults across different physical activity habits. As only \~50% of
  cardiovascular (CV) events can be explained by traditional CV risk factors such
  as high blood pressure and high cholesterol, it is anticipated that this research
  will provide a more comprehensive look into novel risk factors that may better explain
  CV risk and that may be modifiable through regular physical activity. (NCT NCT06163456;
  status COMPLETED).
