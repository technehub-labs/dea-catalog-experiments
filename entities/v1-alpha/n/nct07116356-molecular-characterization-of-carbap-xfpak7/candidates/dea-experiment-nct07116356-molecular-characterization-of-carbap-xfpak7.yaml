name: NCT07116356 — Molecular Characterization of Carbapenemase-Producing Enterobacterales
description: Bacterial infections with carbapenem resistant pathogens are one of the
  major threats in immunocompromised patients, especially among cancer patients .Furthermore,
  Gram negative pathogens are becoming increasingly prevalent and have become an ongoing
  global health concern .Emergence of Gram-negative pathogens, especially Enterobacterales
  that avert many of the human defense mechanisms are alarmingly increasing and most
  of these pathogens are resistant to many of the in-use antibiotics including carbapenems
  . (NCT NCT07116356; status NOT_YET_RECRUITING).
