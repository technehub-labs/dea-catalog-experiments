id: dea:experiment-nct05534113-envafolimab-immunotherapy-after-ctdn-q9arun
type: Experiment
name: NCT05534113 — Envafolimab Immunotherapy After ctDNA EGFR Clearance by Treatment
  With Almonertinib in EGFR-Mutant, PD-LI Positive NSCLC
description: This is a prospective, single-arm, open-label, interventional clinical
  study, aimed at exploring the efficacy and safety of sequential Envafolimab immunotherapy
  after patients with ctDNA EGFR mutation clearance and achieved stable radiographically
  deep esponse after first line treatment with Almonertinib in EGFR-Mutant, PD-LI
  positive non-small-cell lung cancer. (NCT NCT05534113; status UNKNOWN).
