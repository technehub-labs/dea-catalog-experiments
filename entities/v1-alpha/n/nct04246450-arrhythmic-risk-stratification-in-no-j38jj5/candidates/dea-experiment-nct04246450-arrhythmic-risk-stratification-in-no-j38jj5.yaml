id: dea:experiment-nct04246450-arrhythmic-risk-stratification-in-no-j38jj5
type: Experiment
name: NCT04246450 — Arrhythmic Risk Stratification in Nonischemic Dilated Cardiomyopathy
description: Nonischemic dilated cardiomyopathy is a heterogeneous disease often associated
  with increased rates of sudden cardiac death. Although many algorithms have been
  proposed, risk stratification remains suboptimal, and implantable cardioverter-defibrillators
  are currently recommended only in patients with poor left ventricular function.
  However, most cases of sudden cardiac death occur at earlier stages, in patients
  with relatively preserved left ventricular function and exercise capacity, for which
  device-therapy is currently not indicated. Several noninvasive risk factors have
  been associated with increased arrhythmic risk, including clinical history (syncope),
  imaging (fibrosis on cardiac magnetic resonance imaging and left ventricular dimensions
  in echocardiography) and electrocardiographic parameters (ventricular arrhythmic
  burden, late potentials, heart rate variability and repolarization abnormalities).
  The investigators hypothesized that the encouraging findings of studies assessing
  more sophisticated stratification-algorithms in patients with ischemic heart disease
  could be extrapolated in patients with nonischemic dilated cardiomyopathy. Thus,
  combining noninvasive risk factors with programmed ventricular stimulation may risk-stratify
  such patients more accurately. In this regard, the prospective observational multicenter
  ReCONSIDER study aims to integrate several approaches to arrhythmic risk stratification
  in nonischemic dilated cardiomyopathy in a tiered, multifactorial, approach, in
  which noninvasive risk factors are combined with electrophysiologic studies. This
  approach may pave the way for a more comprehensive risk stratification algorithm
  in patients with nonischemic dilated cardiomyopathy, leading to more rational device-therapy,
  and, ultimately to lower mortality. (NCT NCT04246450; status UNKNOWN).
