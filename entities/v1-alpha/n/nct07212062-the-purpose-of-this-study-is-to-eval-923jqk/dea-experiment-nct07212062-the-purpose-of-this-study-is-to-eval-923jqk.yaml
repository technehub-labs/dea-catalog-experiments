description: The goal of the trial is to see if the Safety and Tolerability of X/T+X/T-EC
  combined with currently treated Lecanemab participants with Alzheimer's Disease
  compared with placebo. This is a 32 week study (4 weeks of screening,24 weeks of
  treatment and 4 weeks of safety follow up) (NCT NCT07212062; status NOT_YET_RECRUITING).
