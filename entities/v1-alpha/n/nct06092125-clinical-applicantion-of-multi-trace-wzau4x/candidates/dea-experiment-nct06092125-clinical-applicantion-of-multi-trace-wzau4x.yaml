id: dea:experiment-nct06092125-clinical-applicantion-of-multi-trace-wzau4x
type: Experiment
name: NCT06092125 — Clinical Applicantion of Multi-Tracer PET/MR Imaging in Neurological
  Disorders/Disease
description: 'The goal of this clinical trial is to learn about the application of
  domestic PET/MR in major brain diseases. The main questions it aims to answer are:
  * Overcome the bottleneck of early accurate diagnosis and treatment in major brain
  diseases clinical practice. * Promote the clinical application of domestic PET/MR,
  enhance international competitiveness. Participants will have a PET/MR scan of the
  brain. (NCT NCT06092125; status RECRUITING).'
