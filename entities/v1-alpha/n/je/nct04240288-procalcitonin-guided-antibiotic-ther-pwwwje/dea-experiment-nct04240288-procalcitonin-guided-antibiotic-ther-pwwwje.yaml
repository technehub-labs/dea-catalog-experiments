type: Experiment
name: NCT04240288 — Procalcitonin Guided Antibiotic Therapy
description: The overuse of antibiotics is an enormous problem facing the healthcare
  system both in the United States and across the world. The investigators plan to
  test the hypothesis that using procalcitonin levels (blood test) to guide the length
  of antibiotic therapy in patients with complicated intra-abdominal infections leads
  to shorter antibiotic treatment courses. (NCT NCT04240288; status WITHDRAWN).
