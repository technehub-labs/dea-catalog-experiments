type: Experiment
name: NCT06796127 — A Multicenter Study of Artificial Intelligence Model for Fetal
  Congenital Heart Disease
description: This study addresses congenital heart disease in fetuses, a specific
  birth defect, by collaborating with multicenter medical institutions across China.
  It prospectively collects echocardiographic screening, diagnostic images, and structured
  parameter data from both normal and abnormal fetuses. Cases are followed up, and
  artificial intelligence (AI) models are developed to extract fetal heart echocardiographic
  image features and analyze the data. This process allows for the analysis of the
  AI models' accuracy, sensitivity, and specificity, and verifies the application
  value of AI models in fetal heart echocardiographic screening and diagnosis. (NCT
  NCT06796127; status NOT_YET_RECRUITING).
