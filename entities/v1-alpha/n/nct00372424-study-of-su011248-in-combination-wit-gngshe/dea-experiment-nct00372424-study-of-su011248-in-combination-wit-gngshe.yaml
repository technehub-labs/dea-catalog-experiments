type: Experiment
name: NCT00372424 — Study Of SU011248 In Combination With Docetaxel And Trastuzumab
  In Patients With Advanced Breast Cancer HER-2 Positive
description: This is an exploratory trial evaluating the tolerability and preliminary
  anti-tumor activity of SU011248 combined with docetaxel and trastuzumab in patients
  with locally recurrent or metastatic breast cancer over-expressing Her-2, who have
  not received chemotherapy treatment in the advanced disease setting. (NCT NCT00372424;
  status COMPLETED).
