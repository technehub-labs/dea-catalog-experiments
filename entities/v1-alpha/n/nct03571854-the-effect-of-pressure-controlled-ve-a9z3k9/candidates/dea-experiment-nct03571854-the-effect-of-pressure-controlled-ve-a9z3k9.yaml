type: Experiment
name: NCT03571854 — The Effect of Pressure-controlled Ventilation-volume Guaranteed
  Mode
description: The anesthetized patient is turned to the prone position during lumbar
  spine surgery. The dynamic compliance of lung usually decreases and peak airway
  pressure increases during the surgery. A new ventilation mode, pressure-controlled
  ventilation with volume guaranteed mode (PCV-VG) has been recently introduced. The
  ventilator compares the tidal volume of the previous breath and automatically regulates
  the pressure up or down to achieve the set tidal volume. This prospective, randomized
  study is designed to compare the effect of PCV-VG and volume-controlled ventilation
  (VCV) on peak airway pressure, lung compliance and hemodynamic variables. (NCT NCT03571854;
  status UNKNOWN).
