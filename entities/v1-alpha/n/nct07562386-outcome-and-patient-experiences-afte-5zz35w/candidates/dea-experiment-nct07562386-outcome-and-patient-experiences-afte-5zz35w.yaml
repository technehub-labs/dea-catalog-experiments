id: dea:experiment-nct07562386-outcome-and-patient-experiences-afte-5zz35w
type: Experiment
name: NCT07562386 — Outcome and Patient Experiences After Transurethral Resection
  and Bipolar Enucleation of the Prostate - a Multi-center, Randomized Controlled
  Trial.
description: In this randomized controlled trial, we will evaluate if bipolar enucleation
  of the prostate (BEEP) is associated with better urinary voiding outcome than transurethral
  resection (TURP) in men with enlarged prostate referred to surgery. In addition
  we will investigate the association between symptom relief and the amount of removed
  tissue and if patients experience differ between the two methods. Finally, we will
  assess cost-effectiveness of BEEP compared to TURP. The main outcome for comparison
  of the two surgical methods is International Prostate Symptom Score (IPSS) assessed
  at 12-month follow-up. The primary outcome to assess patient experience is measured
  with the questionnaire Nordic Patients Experience Questionnaire (NORPEQ). Cost-effectiveness
  will be measured with incremental cost-effectiveness ratio (ICER). (NCT NCT07562386;
  status RECRUITING).
