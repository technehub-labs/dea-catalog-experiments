id: dea:experiment-nct06535620-comparison-of-the-effect-of-red-wine-5cav5w
type: Experiment
name: NCT06535620 — Comparison of the Effect of Red Wine With Alcohol on Flow-mediated
  Dilation Versus Red Wine Without Alcohol
description: 'Introduction: Cardiovascular diseases (CVDs) are the leading cause of
  global mortality, despite being preventable. Moderate wine consumption has been
  associated with one of the preventative approaches due to its benefits on cardiovascular
  health, including endothelial protection and antioxidant effects, attributed to
  its chemical composition, such as flavonoids. Objective: To assess endothelial function
  through flow-mediated dilation after the consumption of red wine compared to non-alcoholic
  wine. Methodology: A parallel, randomized, placebo-controlled clinical trial with
  a blinded evaluator will be conducted with 20 healthy participants, evaluated at
  two distinct time points. Participants will be selected to receive either red wine
  or non-alcoholic wine and will be crossed over after 7 days to receive the opposite
  beverage from the initial one. The primary outcome will be the change in flow-mediated
  dilation of the brachial artery pre- and post-intervention in both groups. The secondary
  outcomes will include the flow-mediated dilation values, brachial artery diameter
  after the intervention, and measurements of systolic blood pressure (SBP) and diastolic
  blood pressure (DBP). (NCT NCT06535620; status UNKNOWN).'
