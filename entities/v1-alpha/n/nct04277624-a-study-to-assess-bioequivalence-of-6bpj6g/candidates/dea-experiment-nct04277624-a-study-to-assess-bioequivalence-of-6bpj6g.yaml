id: dea:experiment-nct04277624-a-study-to-assess-bioequivalence-of-6bpj6g
type: Experiment
name: NCT04277624 — A Study to Assess Bioequivalence of Fezolinetant Formulations
  in Healthy Female Participants
description: The purpose of this study is to assess the bioequivalence of a single
  dose of fezolinetant test formulation compared to a single dose of fezolinetant
  reference formulation under fasting conditions. This study will also evaluate the
  safety and tolerability of a single dose of fezolinetant test formulation and a
  single dose of fezolinetant reference formulation. (NCT NCT04277624; status COMPLETED).
