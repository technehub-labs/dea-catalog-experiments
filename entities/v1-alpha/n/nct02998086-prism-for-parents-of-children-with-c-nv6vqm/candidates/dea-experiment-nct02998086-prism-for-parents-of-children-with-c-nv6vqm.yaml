id: dea:experiment-nct02998086-prism-for-parents-of-children-with-c-nv6vqm
type: Experiment
name: NCT02998086 — PRISM for Parents of Children With Cancer Promoting Resilience
  in Stress Management (PRISM) Intervention for Parents of Children With Cancer
description: Parenting a child with cancer is highly stressful. The investigators
  have designed a promising parent-centered intervention to bolster parent resilience
  and reduce stress and distress. This study will test 2 formats of the intervention
  (individual or group-based) and compare them to usual care. (NCT NCT02998086; status
  COMPLETED).
