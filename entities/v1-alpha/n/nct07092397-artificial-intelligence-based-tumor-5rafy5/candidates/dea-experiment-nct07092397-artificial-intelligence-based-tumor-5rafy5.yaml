id: dea:experiment-nct07092397-artificial-intelligence-based-tumor-5rafy5
type: Experiment
name: NCT07092397 — Artificial Intelligence-based Tumor Microenvironment Analysis
  for Prognosis Prediction in Gallbladder Cancer
description: This retrospective study aims to investigate the prognostic significance
  of artificial intelligence (AI)-powered analysis of tumor-infiltrating lymphocytes
  (TILs) and the tumor microenvironment (TME) in patients with resected gallbladder
  cancer. Using hematoxylin and eosin (H\&E)-stained slides, the study quantifies
  spatial TME features, including TIL density, tertiary lymphoid structures, and fibroblast
  density, to identify potential TME-related risk factors associated with survival.
  (NCT NCT07092397; status COMPLETED).
