id: dea:experiment-nct06471231-renal-outcomes-in-the-early-use-of-v-p5c5tt
type: Experiment
name: NCT06471231 — Renal Outcomes in the Early Use of Vasopressin in the Treatment
  of Septic Shock
description: The aim of the present study is to verify whether the earlier association
  of vasopressin and norepinephrine, in patients in septic shock, determines variations
  in terms of use of renal function replacement techniques in the first 7 days of
  hospitalization in Intensive Care, compared to patients in whom vasopressin is added
  only when norepinephrine reaches a higher dose. (NCT NCT06471231; status UNKNOWN).
