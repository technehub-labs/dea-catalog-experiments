id: dea:experiment-nct01554397-study-with-intensity-modulated-radia-s7dyuf
type: Experiment
name: NCT01554397 — Study With Intensity Modulated Radiation Therapy With Cisplatin
  to Treat Stage I-IVA Cervical Cancer
description: The purpose of this study is to find out whether patients with cervical
  cancer treated with PET-guided Bone Marrow Sparing IMRT have less side effects with
  equal cancer control compared to standard radiation techniques (IMRT). The hypothesis
  is that PET-guided Bone Marrow Sparing IMRT will reduce acute hematologic and gastrointestinal
  toxicity and increase chemotherapy tolerance for cervical cancer patients treated
  with concurrent cisplatin. (NCT NCT01554397; status COMPLETED).
