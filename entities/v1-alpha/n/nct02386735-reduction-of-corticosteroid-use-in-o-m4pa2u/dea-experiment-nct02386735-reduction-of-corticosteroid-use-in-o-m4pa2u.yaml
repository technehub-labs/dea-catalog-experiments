id: dea:experiment-nct02386735-reduction-of-corticosteroid-use-in-o-m4pa2u
type: Experiment
name: NCT02386735 — Reduction of Corticosteroid Use in Outpatient Treatment of Exacerbated
  COPD
description: Background Chronic obstructive pulmonary disease (COPD) is a major public
  health issue with no curative treatment. In Switzerland estimated 5-7% of the total
  population are suffering from this chronic disease. According to current guidelines
  corticosteroids are part of treatment of acute exacerbations in COPD patients. Several
  studies suggest that corticosteroids accelerate the recovery of forced expiratory
  volume in 1 second (FEV1), decrease duration of hospitalization, reduce treatment
  failure rate and improve clinical outcome. The additional therapeutic benefit on
  FEV1-recovery tough seems only to last for three to five days. The investigators
  recently published a hospital-based study showing that in patients presenting to
  emergency departments with acute exacerbation of COPD, a short five day treatment
  with systemic steroids was not inferior to a conventional 14 day treatment with
  regard to re-exacerbation. Cumulative corticosteroid dose could be reduced in this
  trial. To the investigators knowledge no data is available about the minimal necessary
  corticosteroid dose in an outpatient treatment setting so far. Aim The primary aim
  of this study is to investigate in an outpatient setting, whether a three day treatment
  with orally administered systemic corticosteroids is non-inferior to a five day
  treatment in acute exacerbation of COPD and if total glucocorticoid exposure can
  be reduced by shorter therapy. Hypothesis The investigators postulate, that in an
  outpatient setting, where generally less severe exacerbations are being treated,
  a three day treatment duration of systemic corticosteroids should be non-inferior
  to a five day treatment duration with regard to treatment benefits but decrease
  cumulative corticosteroid exposure. Design and Setting This study is going to be
  performed as a prospective, randomized, double-blind, placebo-controlled, non-inferiority
  trial in an outpatient setting. Randomization will be performed as block randomization
  with a 1:1 alloca
