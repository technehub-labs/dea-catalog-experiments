id: dea:experiment-nct02421796-malnutrition-in-non-celiac-wheat-sen-xqu38p
type: Experiment
name: NCT02421796 — Malnutrition In Non-Celiac Wheat Sensitivity Patients
description: Non-celiac gluten sensitivity (NCGS) or 'wheat sensitivity' (NCWS) is
  included in the spectrum of gluten-related disorders. No data are available on the
  prevalence of low bone mass density (BMD) in NCWS. Our study aims to evaluate the
  prevalence of malnutrition in NCWS patients and search for correlations with other
  clinical characteristics. This prospective observation study will include 90 NCWS
  patients with irritable bowel syndrome (IBS)-like symptoms, 90 IBS and 90 celiac
  controls. Patients will be recruited at the Internal Medicine and at the Gastroenterology
  Units of the University of Palermo. Elimination diet and double-blind placebo controlled
  (DBPC) wheat challenge proved the NCWS diagnosis. All subjects underwent nutritional
  parameters measurement, duodenal histology, Human Leucocyte Antigen (HLA) DQ typing
  and body mass index (BMI) evaluation. (NCT NCT02421796; status COMPLETED).
