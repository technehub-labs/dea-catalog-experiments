id: dea:experiment-nct03559894-severe-and-transient-hypoxemia-durin-jqxcz8
type: Experiment
name: 'NCT03559894 — Severe and Transient Hypoxemia During Selective Intra-arterial
  Chemotherapy for Retinoblastoma in Children: Evaluation of the Right-sided Heart
  Function.'
description: Children having selective ophthalmic artery chemotherapy for retinoblastoma
  under general anaesthesia may experience troubles during the procedure. The troubles
  are transient, may be severe and include hypoxemia, hypotension and bradycardia.
  All children having such trouble always fully recovered without any sequelae or
  prolonged length of stay. The investigators suspect that these phenomenons are caused
  by transient pulmonary hypertension.The objective is to see whether transient pulmonary
  hypertension and right-sided heart failure is present during theses phenomenon by
  trans-thoracic echocardiography. (NCT NCT03559894; status UNKNOWN).
