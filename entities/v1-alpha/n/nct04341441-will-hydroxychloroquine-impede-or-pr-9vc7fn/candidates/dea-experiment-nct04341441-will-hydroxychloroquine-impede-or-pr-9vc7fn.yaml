id: dea:experiment-nct04341441-will-hydroxychloroquine-impede-or-pr-9vc7fn
type: Experiment
name: NCT04341441 — Will Hydroxychloroquine Impede or Prevent COVID-19
description: This is a prospective, multi-site study designed to evaluate whether
  the use of hydroxychloroquine in healthcare workers (HCW), Nursing Home Workers
  (NHW), first responders (FR), and Detroit Department of Transportation bus drivers
  (DDOT) in SE, Michigan, can prevent the acquisition, symptoms and clinical COVID-19
  infection The primary objective of this study is to determine whether the use of
  daily or weekly oral hydroxychloroquine (HCQ) therapy will prevent SARS-CoV-2 infection
  and COVID-19 viremia and clinical COVID-19 infection healthcare workers (HCW) and
  first responders (FR) (EMS, Fire, Police, bus drivers) in Southeast Michigan. Preventing
  COVID-19 transmission to HCW, FR, and Detroit Department of Transportation (DDOT)
  bus drivers is a critical step in preserving the health care and first responder
  force, the prevention of COVID-19 transmission in health care facilities, with the
  potential to preserve thousands of lives in addition to sustaining health care systems
  and civil services both nationally and globally. If efficacious, further studies
  on the use of hydroxychloroquine to prevent COVID-19 in the general population could
  be undertaken, with a potential impact on hundreds of thousands of lives. (NCT NCT04341441;
  status TERMINATED).
