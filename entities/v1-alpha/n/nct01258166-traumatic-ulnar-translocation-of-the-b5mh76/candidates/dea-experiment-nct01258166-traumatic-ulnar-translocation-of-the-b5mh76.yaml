id: dea:experiment-nct01258166-traumatic-ulnar-translocation-of-the-b5mh76
type: Experiment
name: NCT01258166 — Traumatic Ulnar Translocation of the Carpus
description: Ulnar translocation of the carpus is a form of wrist instability where
  the small bones of the wrist shift out of position. It is well recognized in patients
  with rheumatoid arthritis, but can also occur after a traumatic event, such as a
  violent football tackle or a fall from a height. The treatment options vary considerably,
  and there is no consensus of how to best address this injury pattern. Because traumatic
  ulnar translocation is relatively rare, the diagnosis may be missed or delayed,
  causing problems for the patient such as persistent pain and loss of function. The
  investigators present 11 cases of this injury, discuss how to recognize it, and
  report our results after different treatment methods. (NCT NCT01258166; status COMPLETED).
