id: dea:experiment-nct06586437-neuromodulation-of-the-cortex-and-sp-ufxuec
type: Experiment
name: NCT06586437 — Neuromodulation of the Cortex and Spinal Cord
description: 'Specific Aim 1: To further quantify the difference in the sensorimotor
  cortical activity, spinal cord activity, and corticospinal coherence of persons
  with CP. Overall hypotheses: The sensorimotor cortical activity, spinal cord activity,
  and corticospinal coherence will be uncharacteristic in persons with CP when compared
  with neurotypical controls. Furthermore, the extent of the alterations in the sensorimotor
  cortical activity, spinal cord activity, and corticospinal coherence will be tightly
  linked with the clinical presentations of persons with CP. Specific Aim 2: To investigate
  the effect of transcutaneous current stimulation applied over the cortex and/or
  spinal cord on the sensorimotor cortical activity, spinal cord dynamics, and corticospinal
  coherence. Overall hypotheses: Compared with the sham controls, those receiving
  the transcutaneous current stimulation will demonstrate alterations in the strength
  of the sensorimotor cortical activity, spinal cord activity, and corticospinal coherence.
  Moreover, the extent of the alterations in the sensorimotor cortical activity, spinal
  cord activity, and corticospinal coherence will be tightly linked with the clinical
  presentations of persons with CP. (NCT NCT06586437; status ACTIVE_NOT_RECRUITING).'
