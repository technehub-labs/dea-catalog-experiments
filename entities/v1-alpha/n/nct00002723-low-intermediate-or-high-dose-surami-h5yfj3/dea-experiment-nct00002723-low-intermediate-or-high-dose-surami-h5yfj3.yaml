type: Experiment
name: NCT00002723 — Low, Intermediate, or High Dose Suramin in Treating Patients With
  Hormone-Refractory Prostate Cancer
description: Randomized phase III trial to compare the effectiveness of low, intermediate,
  and high dose suramin in treating men with stage IV prostate cancer that is refractory
  to hormone therapy. Drugs used in chemotherapy use different ways to stop tumor
  cells from dividing so they stop growing or die. It is not yet known which regimen
  of suramin is more effective for prostate cancer. (NCT NCT00002723; status COMPLETED).
