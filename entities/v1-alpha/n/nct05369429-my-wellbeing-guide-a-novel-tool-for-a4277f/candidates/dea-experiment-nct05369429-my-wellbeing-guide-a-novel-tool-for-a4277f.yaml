id: dea:experiment-nct05369429-my-wellbeing-guide-a-novel-tool-for-a4277f
type: Experiment
name: 'NCT05369429 — My Wellbeing Guide: A Novel Tool for Managing Stress and Improving
  Quality of Life'
description: 'The purpose of this study is to examine the implementation and effectiveness
  of the psychosocial eHealth intervention, My Wellbeing Guide, on the proposed primary
  outcome, depressive symptoms, in patients diagnosed with cancer who receive care
  at Northwestern Medicine and the University of Miami Health System. Eligible patients
  will be directly contacted by the study team for recruitment. The intervention includes
  cognitive behavioral therapy management strategies for health-related stress in
  the form of animated videos, interactive activities, and written content. The intervention
  will be delivered via an online application over an 7-week period. Intervention
  participants will also complete four assessments: baseline (at the beginning of
  the research study), post-intervention (7 weeks after baseline), a 6-month follow-up,
  and a 12-month follow up. Participants are randomized into either an intervention
  application (described above) or a control application (which will provide links
  to helpful resources for patients with cancer, such as the contact information for
  cancer support services at Northwestern University and the University of Miami,
  and the link to the National Cancer Institute website, and the American Cancer Society
  website.) Control participants will also complete four assessments: baseline (at
  the beginning of the research study), post-intervention (7 weeks after baseline),
  a 6-month follow-up, and a 12-month follow up. (NCT NCT05369429; status RECRUITING).'
