id: dea:experiment-nct05881356-discovering-factors-in-the-clinical-ndtqqv
type: Experiment
name: NCT05881356 — Discovering Factors in the Clinical Study Journey of Patients
  With OCD
description: This research aims to collect comprehensive data on the clinical trial
  experience of OCD patients. Its goal is to identify the factors that limit patients'
  ability to join or complete a trial successfully. Clinical trial participation often
  favors specific demographic groups, and limited research exists on the impact of
  trial attributes on participation. Therefore, this study aims to analyze data from
  various demographic groups and identify any recurring trends that could provide
  valuable insights for future OCD patients. (NCT NCT05881356; status UNKNOWN).
