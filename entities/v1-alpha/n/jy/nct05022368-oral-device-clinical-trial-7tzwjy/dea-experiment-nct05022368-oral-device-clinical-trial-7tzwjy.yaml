id: dea:experiment-nct05022368-oral-device-clinical-trial-7tzwjy
type: Experiment
name: NCT05022368 — Oral Device Clinical Trial
description: The investigators are studying the use of a new medical device developed
  at Nationwide Children's. This technology has been licensed and produced by Zotarix
  LLC, a medical device company. It is designed to aid in retraction and provide protection
  of the lips during surgery. The investigators are not recording any of your identifiable
  personal health information except for the surgery date. This device, called the
  LabraGuard is a sterile, soft medical grade silicone, and no alternative device
  with these exact protective properties exists, and the investigators are trying
  to learn more about how it performs in different age children. (NCT NCT05022368;
  status UNKNOWN).
