type: Experiment
name: NCT01086605 — Pixantrone Dimaleate in Treating Patients With HER2-Negative Metastatic
  Breast Cancer
description: 'RATIONALE: Drugs used in chemotherapy, such as pixantrone dimaleate,
  work in different ways to stop the growth of tumor cells, either by killing the
  cells or by stopping them from dividing. Giving pixantrone dimaleate in different
  ways may kill more tumor cells. PURPOSE: This randomized phase II trial is studying
  how well pixantrone dimaleate works in treating patients with HER2-negative metastatic
  breast cancer. (NCT NCT01086605; status COMPLETED).'
