type: Experiment
name: NCT07568405 — The Effect of Remifentanil on the Objectively Measured Pressure
  Pain Threshold
description: It is a clinical study investigating the relationship between objectively
  measured pain threshold and the need for escalating doses of remifentanyl opioids.
  This study is expected to include approximately 40 participants. The aim of the
  study is to objectively measure the analgesic effect of an increasing dose of opioids
  just before anesthesia. (NCT NCT07568405; status ENROLLING_BY_INVITATION).
