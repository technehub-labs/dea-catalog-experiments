id: dea:experiment-nct01397253-virtual-continuity-and-its-impact-on-9qw6ad
type: Experiment
name: NCT01397253 — Virtual Continuity and Its Impact on Complex Hospitalized Patients'
  Care
description: Communication between physicians caring for a patient in the hospital
  and that patient's primary care provider is less than optimal, and can lead to diminished
  health care quality and safety. This project will lead to better communication between
  physicians and could decrease medication errors that tend to occur as the patient
  goes from hospital to home. (NCT NCT01397253; status COMPLETED).
