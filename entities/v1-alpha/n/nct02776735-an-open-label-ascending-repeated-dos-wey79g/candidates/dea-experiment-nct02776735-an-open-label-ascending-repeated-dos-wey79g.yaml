name: NCT02776735 — An Open-label, Ascending, Repeated Dose-finding Study of Sarilumab
  in Children and Adolescents With Polyarticular-course Juvenile Idiopathic Arthritis
  (pcJIA)
description: 'Primary Objective: To describe the pharmacokinetic (PK) profile of sarilumab
  in participants aged 2-17 years with Polyarticular-course Juvenile Idiopathic Arthritis
  (pcJIA) in order to identify the dose and regimen for adequate treatment of this
  population Secondary Objective: To describe the pharmacodynamic (PD) profile, the
  efficacy and the long-term safety of sarilumab in participants with pcJIA. (NCT
  NCT02776735; status COMPLETED).'
