id: dea:experiment-nct04788459-safety-and-immunogenicity-of-covid-e-vehbx2
type: Experiment
name: NCT04788459 — Safety and Immunogenicity of COVID-eVax, a Candidate Plasmid DNA
  Vaccine for COVID-19, in Healthy Adult Volunteers
description: This is a multicentre, open-label Phase 1/2 study, with a first-in-human
  (FIH) dose escalation part (Phase 1 study) followed by an open-label single arm
  (or two-arms, randomized) dose expansion part (Phase 2 study). The vaccine will
  be administered by intramuscular (IM) injection followed by electroporation (EP)
  applied to the injection site. The study is aimed at assessing the safety and immunogenicity
  of COVID-eVax, a DNA plasmid-based vaccine whose target antigen is a portion of
  the S protein of SARS-CoV-2 virus (the Receptor Binding Domain located in the CTD1
  of the S1 region of the S protein). In animal models COVID-eVax was safe and induced
  high immunological humoral and cellular response. (NCT NCT04788459; status TERMINATED).
