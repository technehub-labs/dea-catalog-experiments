id: dea:experiment-nct01296061-kidney-transplant-failure-hr3e2r
type: Experiment
name: NCT01296061 — Kidney Transplant Failure
description: 'Primary Hypotheses: 1. Among patients who retain the failed kidney transplant,
  those who continue immunosuppressant medication will have more deaths than patients
  who discontinue these drugs 2. Among patients who retain the failed kidney transplant,
  those who continue immunosuppressant medication will have more hospitalizations
  for sepsis than patients who discontinue these drugs 3. Among patients who retain
  the failed kidney transplant, those who continue immunosuppressant medication will
  have fewer rejection events than patients who discontinue these drugs Secondary
  Hypotheses: 1. Patients who undergo elective nephrectomy (to remove the failed kidney
  transplant) will have fewer deaths than those who retain the failed kidney transplant
  2. Patients who undergo elective nephrectomy (to remove the failed kidney transplant)
  will have fewer hospitalizations for sepsis than those who retain the failed kidney
  transplant 3. Among patients who retain the failed kidney transplant, those who
  continue immunosuppressant medication will have lower levels of allosensitization
  (anti-HLA antibodies) than those who discontinue these drugs 4. Patients who undergo
  elective nephrectomy will have higher levels of allosensitization (anti-HLA antibodies)
  than patients who retain the failed kidney transplant (NCT NCT01296061; status TERMINATED).'
