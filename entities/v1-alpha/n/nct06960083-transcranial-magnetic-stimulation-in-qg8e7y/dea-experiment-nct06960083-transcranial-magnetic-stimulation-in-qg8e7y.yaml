id: dea:experiment-nct06960083-transcranial-magnetic-stimulation-in-qg8e7y
type: Experiment
name: NCT06960083 — Transcranial Magnetic Stimulation in Misophonia
description: 'The purpose of the project is to assess the efficacy of parietal transcranial
  magnetic stimulation in misophonia. N=60 participants will undergo two transcranial
  magnetic stimulation sessions: one inhibitory and another excitatory. During both
  sessions, the parietal region will be stimulated. Participants will perform computerized
  tasks immediately before and after the stimulation, while EEG, heart rate, and skin
  temperature will be recorded. These recordings will be used to assess if TMS can
  be used to improve tolerance to misophonia triggers. (NCT NCT06960083; status RECRUITING).'
