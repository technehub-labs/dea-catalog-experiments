id: dea:experiment-nct01542086-comparison-of-the-cost-effectiveness-p2399v
type: Experiment
name: NCT01542086 — Comparison of the Cost-Effectiveness of Coronary CT Angiography
  Versus Myocardial SPECT in Patients With Intermediate Risk of Coronary Heart Disease
description: The investigators aim to compare the cost-effectiveness of CCTA and myocardial
  SPECT in patients with intermediate pre-test probability of CHD. To this end, patients
  with intermediate pre-test probability of CHD will be randomized 1:1 to either CCTA
  and myocardial SPECT. The patients will be analyzed for cost and also, for outcome.
  (NCT NCT01542086; status UNKNOWN).
