id: dea:experiment-nct05152537-flor3-gene-polymorphism-in-predictin-gfhbjk
type: Experiment
name: NCT05152537 — FLOR3 Gene Polymorphism in Predicting Outcomes of Tyrosine Kinase
  Inhibitor（TKI）Stopping in Chronic Myeloid Leukemia
description: For patients with chronic myeloid leukemia in chronic phase (CML-CP)
  who have achieved a stable deep molecular response (DMR) using BCR-ABL1 tyrosine
  kinase inhibitors (TKIs), treatment-free remission (TFR) following TKI cessation
  is an emerging goal. However, about half of the patients relapsed after TKI discontinuation.
  There is no definite examinations to predict the outcome of TKI discontinuation.
  Investigators aim to study the relationship between FLOR3 SNP rs139130389 and the
  outcome of TKI discontinuation. (NCT NCT05152537; status UNKNOWN).
