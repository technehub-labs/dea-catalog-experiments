id: dea:experiment-nct03408418-l-prf-in-alveolar-ridge-preservation-sqmbk5
type: Experiment
name: NCT03408418 — L-PRF in Alveolar Ridge Preservation
description: 'The effect of leucocyte- and platelet-rich fibrin (L-PRF) for enhancing
  the healing after dental extractions is still a matter of debate. The available
  literature suggests that L-PRF performs positive effect to improve alveolar preservation
  resulting in less bone resorption on extraction sockets. L-PRF is a second generation
  of platelet concentrate produced without biochemical blood manipulation. L-PRF is
  composed by three key parameters: first, the presence of platelets; second, the
  presence of leucocytes; third, the density and complex organization of the fibrin
  matrix architecture produced by a natural polymerization process. The theory is
  that this key parameters acts to produce a faster bone healing. (NCT NCT03408418;
  status COMPLETED).'
