id: dea:experiment-nct02112929-regional-lung-imaging-using-hyperpol-sruueh
type: Experiment
name: NCT02112929 — Regional Lung Imaging Using Hyperpolarized Xenon Gas
description: The investigators aim to use hyperpolarized xenon gas magnetic resonance
  imaging (MRI) and computed tomography to develop a new technique capable of objectively
  and quantitatively describing regional and structural lung abnormality. Since this
  is a relatively novel technique, the investigators first need to acquire imaging
  and clinical data from a group of participants with normal lungs. The investigators
  hope to generate an "atlas" of normality, which will form the foundation of future
  studies to compare with patients suffering from chronic respiratory disease. The
  investigators also aim to validate the new technique in terms of intra-subject reproducibility.
  (NCT NCT02112929; status COMPLETED).
