type: Experiment
name: NCT07579325 — Lipid Screening Study
description: The purpose of this pilot study is to estimate the prevalence of elevated
  Lipoprotein (a) in an adult primary care population and to describe the distribution
  of atherogenic lipid markers within this cohort. This pilot study will provide preliminary
  data to inform future cardiovascular risk assessment initiatives in primary care.
  (NCT NCT07579325; status COMPLETED).
