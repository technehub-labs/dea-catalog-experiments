type: Experiment
name: NCT05773118 — A Unified Index to Predict the Success Probability of Myopia Control
description: Orthokeratology lenses (OK-lens) and multifocal contact lenses (MFCL)
  are optical devices designed to slow down the progression of myopia. Both treatments
  a long-term commitment from doctors and patients. This study aims to develop a unified
  index to predict the success probability of myopia control at the early stage of
  treatment. (NCT NCT05773118; status WITHDRAWN).
