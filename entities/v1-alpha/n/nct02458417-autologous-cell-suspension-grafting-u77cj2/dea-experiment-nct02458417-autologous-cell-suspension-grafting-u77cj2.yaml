id: dea:experiment-nct02458417-autologous-cell-suspension-grafting-u77cj2
type: Experiment
name: NCT02458417 — Autologous Cell Suspension Grafting Using ReCell in Vitiligo and
  Piebaldism Patients
description: The purpose of this study is to assess the efficacy and safety of ReCell
  grafting after CO2 laser abrasion with superficial full surface ablation, fractional
  laser treatment and conventional (deep) full surface CO2 laser ablation, to assess
  the practical aspects and the patient reported outcome and to assess the cellular
  composition of the graft. (NCT NCT02458417; status COMPLETED).
