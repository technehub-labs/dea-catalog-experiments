id: dea:experiment-nct07572266-adjuvant-nitrate-to-boost-exercise-i-53utru
type: Experiment
name: NCT07572266 — Adjuvant Nitrate to Boost Exercise-induced Health Benefits in
  Older Adults
description: Aging-related functional declines are thought to be caused by hallmark
  biological processes that ultimately manifest in physical, mental, and metabolic
  impairments to compromise intrinsic capacity and healthspan. Exercise is the only
  multipotent treatment with promise to mitigate many of the aging hallmarks, but
  there is substantial variability in individual exercise responsiveness. Thus, the
  investigators approach to boosting exercise responsiveness in aging is to combine
  an exercise training prescription containing both endurance and resistance training
  (in alignment with DHHS guidelines) with a nitrate-enriched dietary supplement to
  augment the cellular, tissue, and systemic adaptations that induce myriad health
  benefits of exercise in older adults. (NCT NCT07572266; status NOT_YET_RECRUITING).
