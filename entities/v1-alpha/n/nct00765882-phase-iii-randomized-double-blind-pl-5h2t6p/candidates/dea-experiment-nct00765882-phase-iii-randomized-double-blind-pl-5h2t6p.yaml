type: Experiment
name: NCT00765882 — Phase III, Randomized, Double-Blind, Placebo-Controlled, Trial
  of Linaclotide Administered to Patients With Chronic Constipation
description: The objective of this trial is to determine the efficacy and safety of
  linaclotide administered to patients with chronic constipation (CC). The primary
  efficacy parameter is the percentage of patients in each treatment group that meet
  the protocol definition for Complete Spontaneous Bowel Movement (CSBM) Overall Responder
  (NCT NCT00765882; status COMPLETED).
