id: dea:experiment-nct03360045-comparing-effectiveness-of-merocel-a-6sxuyn
type: Experiment
name: NCT03360045 — Comparing Effectiveness of Merocel and Packing With Tranexamic
  Acid in the Management of Anterior Epistaxis
description: Aim of this study is evaluate whether superior nasal compression with
  tranexamic acid to simple nasal compression and Merocel packing. In this study,
  patients who presented with non-traumatic anterior epistaxis to emergency departments
  will be included in this study. Three different therapy option are created; first,
  nasal compression with tranexamic acid, second, simple nasal compression without
  any drugs. And third, packing with Merocel. (NCT NCT03360045; status COMPLETED).
