id: dea:experiment-nct00007761-does-bipolar-disease-program-bdp-int-nug55u
type: Experiment
name: NCT00007761 — Does Bipolar Disease Program (BDP) Intervention Improve Long Term
  Manic and Depressive Symptoms.
description: Based on highly promising preliminary data, it is proposed to conduct
  a multi-site randomized controlled trial of a high-intensity ambulatory treatment
  program for bipolar disorder against standard office-based, physician-centered care.
  The major characteristics of this program are that it emphasizes (1) aggressive
  guideline-driven pharmacotherapy, (2) continuity of care with identified primary
  mental health nurse clinicians supported by psychiatrist back-up, and (3) patient
  education to improve treatment alliance and illness management skills. (NCT NCT00007761;
  status COMPLETED).
