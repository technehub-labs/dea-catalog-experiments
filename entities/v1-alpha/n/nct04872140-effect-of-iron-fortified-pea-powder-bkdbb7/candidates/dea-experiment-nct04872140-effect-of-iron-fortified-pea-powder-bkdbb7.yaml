id: dea:experiment-nct04872140-effect-of-iron-fortified-pea-powder-bkdbb7
type: Experiment
name: NCT04872140 — Effect of Iron-fortified Pea Powder on Exercise Performance
description: Female endurance athletes are susceptible to iron deficiency and this
  can impact their exercise performance. This study assesses the impact of an pea
  protein supplement with high iron bio-availability on iron status and exercise performance.
  (NCT NCT04872140; status COMPLETED).
