id: dea:experiment-nct03437668-adjunctive-withania-somnifera-ashwag-cc933y
type: Experiment
name: NCT03437668 — Adjunctive Withania Somnifera (Ashwagandha) for Persistent Symptoms
  in People With Schizophrenia
description: To determine whether a standardized extract of Withania somnifera will
  reduce psychopathology scores (PANSS total score) in persons with schizophrenia.
  A secondary aim is to determine whether WSE reduces measures of positive and negative
  symptoms (PANSS subscales) and stress scores on the Perceived Stress Scale (PSS).
  (NCT NCT03437668; status TERMINATED).
