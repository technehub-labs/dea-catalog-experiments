id: dea:experiment-nct02999997-evaluation-of-ronnie-gardiner-method-phyxbe
type: Experiment
name: NCT02999997 — Evaluation of Ronnie Gardiner Method in Individuals With Parkinson's
  Disease
description: 'Parkinson''s disease (PD) is typically associated with cognitive and
  movement related functional disabilities. One commonly described cognitive complaint
  is the ability to do several things simultaneously, defined as dual or multiple
  tasking. The Ronnie Gardiner Method (RGM) is a rhythm and music based rehabilitation
  intervention that includes components that will train this ability specifically
  in addition to postural control, motor learning, movement ability and general cognitive
  function. The aim with the present randomized controlled single-blinded trial is
  to evaluate the RGM with main focus on dual-task performance, compared to a control
  group, in individuals with PD. The control group will continue with everyday activities,
  including ordinary exercise activities, with no additional activity. Both groups
  will be evaluated pre-, post-, and after 3 months post intervention. Following outcome
  measures will be analyzed: 1. dual task performance (motor-motor, and motor-cognitive)
  2. level of physical activity, motor function and balance 3. cognitive function
  including memory and spatial function 4. health-related quality of life, fear of
  falling, and freezing of gait 5. qualitative interviews from focus group discussions
  (NCT NCT02999997; status COMPLETED).'
