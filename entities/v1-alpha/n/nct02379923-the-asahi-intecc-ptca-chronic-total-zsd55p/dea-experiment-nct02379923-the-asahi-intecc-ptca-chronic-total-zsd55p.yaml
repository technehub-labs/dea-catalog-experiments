id: dea:experiment-nct02379923-the-asahi-intecc-ptca-chronic-total-zsd55p
type: Experiment
name: NCT02379923 — The Asahi Intecc PTCA Chronic Total Occlusion Study
description: The primary objective of this trial is to evaluate confirmation of placement
  of any guidewire beyond the chronic total occlusion (CTO) in the true vessel lumen
  in patients in which at least one Asahi series of guidewires and/or Corsair microcatheter
  were used. Procedure success will be defined as angiographic visualization of any
  guidewire in a position either distal or proximal to the occlusion depending on
  the route of access and the absence of in-hospital major adverse cardiac events
  (MACE). (NCT NCT02379923; status COMPLETED).
