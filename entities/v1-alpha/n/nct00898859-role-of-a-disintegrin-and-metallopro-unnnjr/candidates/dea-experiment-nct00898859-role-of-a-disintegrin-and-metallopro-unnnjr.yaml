id: dea:experiment-nct00898859-role-of-a-disintegrin-and-metallopro-unnnjr
type: Experiment
name: NCT00898859 — Role of A Disintegrin and Metalloproteinase (ADAM) in Epithelial
  Dysfunction
description: Despite emerging implications for ADAMs (and matrix metalloproteinases
  (MMPs)) in disease progression, the mechanisms that lead to activation of specific
  ADAMs (and MMPs) and their actions in chronic obstructive pulmonary disease (COPD)
  are still incompletely understood. In the current study, the researchers aim to
  investigate the effects of cigarette smoke on cellular parameters that are relevant
  for development of COPD and the involvement of ADAM activity in these effects. By
  studying the effects of ADAM inhibition, the researchers aim to provide novel insights
  in the role of ADAMs in the development of COPD, which may offer new therapeutic
  targets for the treatment of COPD. (NCT NCT00898859; status COMPLETED).
