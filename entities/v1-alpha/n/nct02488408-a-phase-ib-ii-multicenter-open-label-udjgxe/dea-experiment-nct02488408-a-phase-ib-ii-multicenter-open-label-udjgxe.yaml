id: dea:experiment-nct02488408-a-phase-ib-ii-multicenter-open-label-udjgxe
type: Experiment
name: NCT02488408 — A Phase Ib/II Multicenter Open-label Study of Bemcentinib (BGB324)
  in Patients With AML or MDS
description: A Phase Ib/II multicentre open label study of bemcentinib (BGB324) as
  a single agent in participants with Acute Myeloid Leukemia (AML) or Myelodysplastic
  syndrome (MDS) or in a combination with cytarabine or decitabine in AML participants.
  Bemcentinib is a potent selective small molecule inhibitor of AXL a surface membrane
  protein kinase receptor which is overexpressed in up to half of AML cases. (NCT
  NCT02488408; status COMPLETED).
