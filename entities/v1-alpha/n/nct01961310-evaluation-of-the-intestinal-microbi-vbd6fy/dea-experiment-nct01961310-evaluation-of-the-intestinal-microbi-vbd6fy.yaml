type: Experiment
name: NCT01961310 — Evaluation of the Intestinal Microbiota and Bacterial Translocation
  in Patients With Rheumatoid Arthritis
description: The main objective of this study is to compare the intestinal microbiota
  in newly diagnosed rheumatoid arthritis (RA) with that from individuals without
  RA. The first analysis will compare the proportion of filamentous bacteria in the
  intestinal microbiota between the two groups. (NCT NCT01961310; status COMPLETED).
