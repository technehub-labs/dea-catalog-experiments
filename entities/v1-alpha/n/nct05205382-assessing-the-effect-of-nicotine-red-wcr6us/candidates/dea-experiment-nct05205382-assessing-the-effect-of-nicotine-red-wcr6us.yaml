id: dea:experiment-nct05205382-assessing-the-effect-of-nicotine-red-wcr6us
type: Experiment
name: NCT05205382 — Assessing the Effect of Nicotine Reduction on ENDS User's Addiction
  and Exposures
description: The rapid increase of electronic nicotine delivery systems (ENDS) use
  by young people in the US and their potential to harm health, cause addiction, and
  serve as a risk for cigarette smoking or dual-use is alarming. The epidemic of ENDS
  use among young people in the US has been associated with the rise in popularity
  of ENDS products that are very efficient in delivering high doses of nicotine to
  users. Therefore, the investigators propose to study the effects of nicotine reduction
  (NR) on young ENDS users as a potential regulatory strategy to reduce the addictiveness
  and use of ENDS. The proposed studies are directly responsive to research priories
  identified by the FDA and specified in this RFA under Addiction; studying the "Impact
  of changes in tobacco product characteristics (e.g. nicotine formulation) on dependence".
  This project aims to provide an overview of this project's rationale significance
  divided into 1) scientific rationale and regulatory implications; 2) the need to
  respond to the rising trend of ENDS use among young people in the US; 3) the importance
  of reducing the addictiveness of ENDS; 4) the strength of our clinical and analytical
  lab approach for regulatory purposes; and 5) the strengths and weaknesses in the
  rigor of prior research about NR for ENDS. (NCT NCT05205382; status COMPLETED).
