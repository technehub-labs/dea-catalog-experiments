type: Experiment
name: NCT05957094 — Human Cerebral Blood Flow and Serotonin
description: Breathing, blood pressure, and blood flow into the brain are controlled
  - in part - by small areas in the brainstem; the central chemoreceptors. The mechanisms
  involved in the transmission of signals through the brainstem and also in controlling
  brain blood flow past the brainstem both use a molecule called serotonin. Citalopram
  is a "selective serotonin reuptake inhibitor" (or SSRI) which means it allows serotonin
  to be released in the brain but stops it from being reabsorbed. SSRIs are often
  used as antidepressants. This study aims to investigate the influence of an SSRI
  on the control of brain blood flow. (NCT NCT05957094; status UNKNOWN).
