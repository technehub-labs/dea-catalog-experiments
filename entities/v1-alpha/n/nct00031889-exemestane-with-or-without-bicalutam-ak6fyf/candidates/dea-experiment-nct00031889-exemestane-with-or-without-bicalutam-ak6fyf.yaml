id: dea:experiment-nct00031889-exemestane-with-or-without-bicalutam-ak6fyf
type: Experiment
name: NCT00031889 — Exemestane With or Without Bicalutamide in Treating Patients With
  Stage IV Prostate Cancer
description: 'RATIONALE: Androgens can stimulate the growth of prostate cancer cells.
  Hormone therapy using exemestane plus bicalutamide may fight prostate cancer by
  reducing the production of androgens. It is not yet known if exemestane is more
  effective with or without bicalutamide in treating prostate cancer. PURPOSE: Randomized
  phase II trial to study the effectiveness of exemestane with or without bicalutamide
  in treating patients who have stage IV prostate cancer that has been previously
  treated with hormone therapy or surgery. (NCT NCT00031889; status COMPLETED).'
