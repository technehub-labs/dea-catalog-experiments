id: dea:experiment-nct01154218-bioequivalence-and-food-effect-study-dnpn7d
type: Experiment
name: NCT01154218 — Bioequivalence And Food Effect Study Comparing The Commercial
  Formulation Of Crizotinib To Its Clinical Study Formulations And Commercial Formulation
  With Or Without Food In Healthy Volu
description: The purpose of this study is to demonstrate bioequivalence of the Commercial
  Image Capsule (CIC) relative to the Immediate Release Tablet (IRT) of crizotinib,
  bioequivalence of CIC relative to Powder in Capsule (PIC) of crizotinib, and lack
  of an effect of high fat meal on the pharmacokinetics (PK) of crizotinib when administered
  as CIC Formulation in healthy volunteers. (NCT NCT01154218; status COMPLETED).
