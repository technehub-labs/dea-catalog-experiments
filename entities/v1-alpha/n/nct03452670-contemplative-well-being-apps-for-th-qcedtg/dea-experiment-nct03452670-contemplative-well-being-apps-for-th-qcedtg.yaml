id: dea:experiment-nct03452670-contemplative-well-being-apps-for-th-qcedtg
type: Experiment
name: NCT03452670 — Contemplative Well-being Apps for the Workplace
description: The study will examine the use and impact of a meditation app delivered
  to adult workforce populations facing extreme time demands. Enrollees will be randomized
  to either app or a wait-list group, and will be assessed in terms of job and daily
  functioning, well-being, and biomarkers of immune function and stress physiology,
  and neural structure and function prior to randomization and again at multiple time
  points after participants commence app engagement. In order to assess efficacy,
  we will examine the longitudinal changes in all measures in both the mindfulness
  group, compared to wait-list control group. (NCT NCT03452670; status COMPLETED).
