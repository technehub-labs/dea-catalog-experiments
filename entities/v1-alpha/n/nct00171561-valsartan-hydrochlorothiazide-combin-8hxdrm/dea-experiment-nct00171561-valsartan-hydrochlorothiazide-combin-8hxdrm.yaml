id: dea:experiment-nct00171561-valsartan-hydrochlorothiazide-combin-8hxdrm
type: Experiment
name: NCT00171561 — Valsartan/Hydrochlorothiazide Combination vs Amlodipine in Patients
  With Hypertension, Diabetes, and Albuminuria.
description: The purpose of this study is assess if treatment with valsartan and a
  diuretic, hydrochlorothiazide, has beneficial effects in people with high blood
  pressure, diabetes, and albuminuria (protein in the urine) compared with amlodipine.
  In particular, the study will assess whether the treatment will decrease the stiffness
  of the blood vessels. (NCT NCT00171561; status COMPLETED).
