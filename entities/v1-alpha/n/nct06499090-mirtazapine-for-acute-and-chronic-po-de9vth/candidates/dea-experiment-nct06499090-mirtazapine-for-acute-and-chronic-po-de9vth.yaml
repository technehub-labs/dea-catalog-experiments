type: Experiment
name: NCT06499090 — Mirtazapine for Acute and Chronic Post Mastectomy Pain
description: Our aim in this study will be to investigate the effect of mirtazapine
  on acute post-mastectomy pain manifested by total morphine consumption in first
  24 hours and VAS score at rest and movement (primary outcomes). chronic neuropathic
  pain using LANSS Pain Scale (Leeds Assessment of Neuropathic Signs and Symptoms)
  and to evaluate the quality of recovery using the quality of recovery-40scoring
  system(QoR-40) (secondary outcomes) following modified radical mastectomy for breast
  cancer. (NCT NCT06499090; status COMPLETED).
