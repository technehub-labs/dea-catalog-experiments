name: NCT05082961 — Circulating Immunes Cells, Cytokines and Brain Radiotherapy
description: Patients with malignant tumours of the cephalic pole have a poor prognosis,
  despite a wide range of treatments. prognosis despite a large therapeutic arsenal.
  Among this arsenal, radiotherapy (RT) is one of the standard treatments for these
  tumours. However, this treatment can cause damage to the surrounding healthy tissue,
  has limited efficacy in hypoxic However, this treatment can cause damage to the
  surrounding healthy tissue, has limited efficacy in hypoxic tissue and can promote
  pro-tumour inflammation. In these circumstances, hadrontherapy, which uses charged
  heavy particles, such as protons or carbon ions, is the preferred treatment. protons
  or carbon ions, seems more appropriate for the treatment of these tumours. However,
  although inflammation plays a major role in tumour development and tumour development
  and therapeutic response, few studies have evaluated the immune response response
  after proton therapy (PT) and carbon therapy (CT). The objective of this project
  is to study the effect of hadrontherapy on resident/circulating inflammation after
  brain irradiation. brain irradiation. In a first step, the impact of different PT
  and CT TEL on macrophages (M\&#1060;), the most abundant immune cells in malignant
  solid tumours, will be evaluated in vitro. malignant solid tumours, will be evaluated
  in vitro. In a second step, the evolution of circulating leukocytes after brain
  irradiation with X-rays or protons will be studied in vivo in rodents and patients.
  rodent and patient. In this project, we propose to study for the first time the
  inflammatory response after hadrontherapy in the context of a cephalic tumour. cephalic
  tumour. These results will allow a better understanding of the biological response
  response following PT and CT with the aim of optimising RT and potentially and potentially
  translate these data to the clinic. (NCT NCT05082961; status RECRUITING).
