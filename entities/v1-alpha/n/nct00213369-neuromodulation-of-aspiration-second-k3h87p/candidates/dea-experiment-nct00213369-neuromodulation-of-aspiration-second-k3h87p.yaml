id: dea:experiment-nct00213369-neuromodulation-of-aspiration-second-k3h87p
type: Experiment
name: NCT00213369 — Neuromodulation of Aspiration Secondary to Stroke
description: Aspiration could induce major respiratory affection. They are often present
  after stroke. The aim of this study is to facilitate swallowing recuperation in
  stroke patients using peripheral laryngeal stimulation and to understand its mechanisms
  using motor evoked potential and cortical evoked potential. (NCT NCT00213369; status
  COMPLETED).
