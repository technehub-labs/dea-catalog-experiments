id: dea:experiment-nct05644366-postural-control-instability-in-chil-y45kme
type: Experiment
name: NCT05644366 — Postural Control Instability in Children With Mild Autism
description: 'Objective: Individuals diagnosed with Autism Spectrum Disorder (ASD)
  exhibit some type of motor control impairment, for instance, motor apraxia and history
  of gross motor delay that could lead to increased risk of fall. This pilot research
  was designed to assess and characterize static postural stability and create a starting
  point to better understand and describe postural control in children with mild autism.
  Method: We measured static postural control with center of pressure (COP) displacement
  in 10 children with mild autism during eight sensory conditions that challenge and
  cancel the visual, proprioceptive and vestibular systems. (NCT NCT05644366; status
  COMPLETED).'
