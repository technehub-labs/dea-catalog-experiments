id: dea:experiment-nct01039727-prerecorded-autosuggestion-in-long-s-3satxa
type: Experiment
name: NCT01039727 — Prerecorded Autosuggestion in Long-standing Pain Intervention
description: The first objective of this thesis is to investigate the hypothesis that
  prerecorded autosuggestion (PA) can be a theoretically valuable (efficacy) and practical
  (efficiency) tool in the care of many patients with chronic pain. With a prevalence
  in chronic pain conditions of +/- 20% of adults, chronic pain is a huge problem
  for individuals as well as for society, absorbing an enormous amount of resources.
  Even with all available treatments, many people still suffer from chronic pain,
  in particular when this pain has a psychosomatic ('functional') origin. In the PALPI
  study (Prerecorded Autosuggestion in Long-standing Pain Intervention), accompanying
  this thesis, efforts are made to mainly involve chronic pain of clearly psychosomatic
  origin. (NCT NCT01039727; status UNKNOWN).
