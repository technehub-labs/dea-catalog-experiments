id: dea:experiment-nct01343069-safety-improvement-and-checklist-app-abw3n3
type: Experiment
name: NCT01343069 — Safety Improvement and Checklist Application
description: The study investigates the impact of the introduction of a surgical checklist
  on the incidence of complications and mortality within 30 days after surgery in
  patients scheduled for elective non-cardiac surgery. Patients scheduled for elective
  surgical procedures lasting longer than 20 minutes at are eligible. Surgery is performed
  in a single tertiary care center. Study design is an open trial before and after
  intervention (implementation of the checklist "safe surgery saves lifes"). (NCT
  NCT01343069; status WITHDRAWN).
