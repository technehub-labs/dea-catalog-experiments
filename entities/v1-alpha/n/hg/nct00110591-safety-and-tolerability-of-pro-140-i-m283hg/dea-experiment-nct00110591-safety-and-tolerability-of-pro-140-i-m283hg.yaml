description: 'The purpose of the study is to determine the safety and tolerability
  of PRO 140, an investigational anti-HIV drug, administered via intravenous infusion.
  Study hypothesis: Single intravenous doses of PRO 140 can be safely administered
  to humans and will result in measurable concentrations of the product in serum.
  (NCT NCT00110591; status COMPLETED).'
