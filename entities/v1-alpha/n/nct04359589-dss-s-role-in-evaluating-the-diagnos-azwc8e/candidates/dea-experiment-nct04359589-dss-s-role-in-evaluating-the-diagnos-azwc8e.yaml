name: NCT04359589 — DSS's Role in Evaluating the Diagnosis and Treatment System of
  Ischemic Cardiovascular and Cerebrovascular Diseases
description: 'Background: Acute ischemic cardiovascular and cerebrovascular diseases
  are a kind of diseases with high incidence, rapid progression, poor prognosis and
  high mortality and disability rate of the circulatory system, mainly including acute
  myocardial infarction, acute ischemic stroke and acute limb ischemia, which place
  a heavy burden on individuals, families and society due to their severe prognosis
  and high medical costs. At present, the diagnosis and treatment of ischemic cardiovascular
  and cerebrovascular diseases mainly focus on single organ diagnosis and treatment
  of target organs, lacking of indicators to comprehensively evaluate the body''s
  pathophysiology. As ischemic disease of the circulatory system, ischemic cardiovascular
  and cerebrovascular diseases have common pathophysiological basis such as ischemia,
  hypoxia and inflammation. These common pathophysiological basis suggests that different
  acute ischemic cardiovascular and cerebrovascular diseases can be monitored and
  evaluated from an integrated perspective, it suggests the possibility of comprehensive
  diagnosis, evaluation and treatment guidance. At present, the "circulatory integration"
  therapy represented by the combined treatment of heart and brain has achieved certain
  results, but there is no corresponding evaluation system to provide accurate guidance.
  Therefore, with the concept of "circulation integration", it is an urgent problem
  to find the common indicators of the circulation system and construct the hierarchical
  diagnosis and subsequent evaluation system of acute cardiovascular and cerebrovascular
  integration. The development of efficient and comprehensive stratified diagnosis
  and prognosis evaluation system is of great significance in clinical, market and
  social aspects. At the early stage of the efforts our team, it was found that Dan
  Shen Su-(±)-3, 4-dihydroxyphenylacetic acid (DSS) could be detected in the plasma
  and urine of patients with acute myocardial infarction and ischemic stroke t'
