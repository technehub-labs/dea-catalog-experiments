id: dea:experiment-nct04007653-long-term-outcome-after-edoxaban-ver-vp3n2t
type: Experiment
name: NCT04007653 — Long-term Outcome After Edoxaban Versus Vitamin K Antagonists
  for Acute VTE
description: The HOKUSAI post VTE study contains of two different research questions;
  one on the long term outcomes of deep vein thrombosis and one on the long term effects
  of pulmonary embolism, post thrombotic syndrome (PTS) and chronic thromboembolic
  pulmonary hypertension (CTEPH) respectively. Our aim of the study is to compare
  the long term outcomes along with the quality of life assessment of VTE in a group
  treated with heparin+VKA versus a group treated with heparin+edoxaban in the acute
  setting. (NCT NCT04007653; status UNKNOWN).
