id: dea:experiment-nct01970631-the-study-of-physical-activity-rewar-28xbym
type: Experiment
name: NCT01970631 — The Study of Physical Activity Rewards After Knee Surgery
description: The objectives of this research are to conduct a proof of concept randomized
  controlled trial with 200 patients undergoing primary total knee replacement (TKR)
  at Brigham and Women's Hospital (BWH). The trial will compare levels of physical
  activity in subjects in the behavioral and economic interventions versus "Usual
  Care" post TKR. (NCT NCT01970631; status COMPLETED).
