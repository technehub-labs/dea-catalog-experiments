id: dea:experiment-nct07023523-self-regulation-of-real-time-fmri-br-v4uncq
type: Experiment
name: NCT07023523 — Self-regulation of Real-time fMRI Brain Activity in Chronic Pain
description: This study aims to explore the usefulness of self-regulation of brain
  activity in patients with fibromyalgia. Patients will use real-time functional magnetic
  resonance imaging (fMRI) neurofeedback to observe and regulate their own brain activity
  while applying mental strategies to reduce fibromyalgia pain. The study consists
  of 2 magnetic resonance imaging (MRI) visits that involve brain neuroimaging for
  fMRI neurofeedback tasks, as well as 8 weekly intervention sessions with a pain
  psychologist. Patients will be randomized to either Cognitive Behavioral Therapy
  (CBT) or Fibromyalgia Education groups. (NCT NCT07023523; status RECRUITING).
