id: dea:experiment-nct02206425-ixazomib-as-a-replacement-for-carfil-jr7c2z
type: Experiment
name: NCT02206425 — Ixazomib as a Replacement for Carfilzomib and Bortezomib for Multiple
  Myeloma Patients
description: The goal of this clinical research study is to evaluate the safety and
  effectiveness (good and bad effects) of ixazomib given as part of a combination
  therapy to treat subjects with relapsed (subjects whose disease came back) or refractory
  (subjects whose disease did not respond to past treatment) multiple myeloma. More
  specifically, the study is focused on subjects who were previously treated with
  bortezomib (Velcade®) or carfilzomib (Kyprolis®) and showed worsening of their myeloma
  while receiving either one of these drugs in combination therapy. This study is
  a Phase I/II. Ixazomib is an investigational drug, which means that ixazomib is
  currently being tested and is not yet approved by the United States Food and Drug
  Administration (FDA) for subjects with relapsed or refractory multiple myeloma.
  Ixazomib is a new study drug that belongs to the same class as bortezomib and carfilzomib;
  however, unlike bortezomib and carfilzomib, ixazomib is taken by mouth. Current
  studies investigating ixazomib are demonstrating that it is as safe as bortezomib
  and effective for the treatment of multiple myeloma both on its own and in combination
  with other multiple myeloma medications, such as lenalidomide and dexamethasone,
  or prednisone and melphalan. (NCT NCT02206425; status COMPLETED).
