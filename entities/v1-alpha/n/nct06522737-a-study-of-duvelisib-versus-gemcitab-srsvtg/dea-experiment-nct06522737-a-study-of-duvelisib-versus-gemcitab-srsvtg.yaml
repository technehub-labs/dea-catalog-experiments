id: dea:experiment-nct06522737-a-study-of-duvelisib-versus-gemcitab-srsvtg
type: Experiment
name: NCT06522737 — A Study of Duvelisib Versus Gemcitabine or Bendamustine in Participants
  With Relapsed/Refractory Nodal T Cell Lymphoma With T Follicular Helper (TFH) Phenotype
description: The study will evaluate the progression-free survival benefit of duvelisib
  monotherapy as compared to investigator's choice of gemcitabine or bendamustine
  in participants with relapsed/refractory nodal T cell lymphoma with TFH phenotype.
  (NCT NCT06522737; status RECRUITING).
