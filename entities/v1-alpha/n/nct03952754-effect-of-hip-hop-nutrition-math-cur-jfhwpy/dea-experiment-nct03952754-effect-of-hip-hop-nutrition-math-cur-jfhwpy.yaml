id: dea:experiment-nct03952754-effect-of-hip-hop-nutrition-math-cur-jfhwpy
type: Experiment
name: NCT03952754 — Effect of Hip Hop Nutrition-Math Curriculum
description: 'This study is testing the efficacy of the integrative approach to: 1.
  teach 5th grade children menu board calorie literacy as measured by our novel recently
  validated menu board calorie literacy (MBCL) instrument; 2. provide strategies designed
  to improve food purchasing behaviors; and 3. facilitate the transmission of core
  lesson messages from children to parents via a procedure that we have termed "Child
  Mediated Health Communication (CMHC)". (NCT NCT03952754; status SUSPENDED).'
