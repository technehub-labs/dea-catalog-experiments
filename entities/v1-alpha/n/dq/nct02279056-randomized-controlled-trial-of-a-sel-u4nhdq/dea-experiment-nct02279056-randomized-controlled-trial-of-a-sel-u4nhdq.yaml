id: dea:experiment-nct02279056-randomized-controlled-trial-of-a-sel-u4nhdq
type: Experiment
name: NCT02279056 — Randomized Controlled Trial of a Self-help Book for Insomnia in
  Patients With Co-morbid OSA and Insomnia
description: Obstructive sleep apnea (OSA) is a common sleep disorder treated with
  continuous positive airway pressure (CPAP). Some OSA patients also suffer from co-morbid
  insomnia. CPAP treatment may be complicated in patients with co-morbid insomnia.
  This project evaluates the effects of a self-help book for insomnia in patients
  being treated with CPAP for OSA. (NCT NCT02279056; status COMPLETED).
