id: dea:experiment-nct05882162-conventional-coronectomy-vs-coronect-hz4z6p
type: Experiment
name: NCT05882162 — Conventional Coronectomy vs Coronectomy in Combination Vital Pulp
  Treatment Using Calcium Silicate
description: The aim of this study was to compare the conventional coronectomy and
  the combined coronectomy technique with vital pulp treatment. The primary outcome
  of the study was to evaluate the success rates of two treatment techniques based
  on clinical and radiologic observations regarding inferior alveolar nerve injury,
  root exposure and formation of periapical lesion. The secondary outcome was to evaluate
  the change in periodontal condition of the second molar adjacent to the operation
  area, dentin bridge formation and root migration. Between March 2018 and February
  2022 eligible patients attended University Hospital for the removal of lower third
  molar with risk of inferior alveolar nerve (IAN) damage invited to the study. 60
  teeth meeting the inclusion criteria in 52 participants were randomized to Test
  (with BiodentineTM, n=30) and Control (without BiodentineTM, n=30) groups. Neurological
  injury and post-operative pain were clinically evaluated at 12th months and 1st
  week, respectively. Root migration, dentin bridge formation and periapical lesion
  development were evaluated using Cone Beam Computed Tomography (CBCT) at 12th month.
  The change in the periodontal status of second molar was evaluated by measurement
  of pocket depth at 1st, 3rd and 12th months and the distance between base of the
  bone defect and the marginal crest and cemento-enamel junction and at 6th and 12th
  months month. (NCT NCT05882162; status COMPLETED).
