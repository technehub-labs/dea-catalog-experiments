id: dea:experiment-nct07877259-collection-and-distribution-of-blood-9fgrn5
type: Experiment
name: NCT07877259 — Collection and Distribution of Blood Components From Healthy Donors
  for In Vitro Research Use
description: 'Background: Many different research projects need a steady supply of
  human blood. Blood donated by screened, healthy people may be used to test new drugs,
  for example, or to learn how blood cells work. Scientists from the National Institutes
  of Health and the Food and Drug Administration want to collect blood from donors
  for use in laboratory studies. Objective: To collect blood and blood parts from
  healthy donors for research. Eligibility: Healthy people aged 18 years and older
  who weigh more than 110 pounds. They must meet the requirements to donate blood
  for research. Participants will be screened. A nurse will check their general health.
  The veins in both arms will be checked to make sure they are good for donation.
  Participants may donate whole blood as often as they wish, but no more than 2 cups
  will be taken over an 8-week period. At each visit, they will fill out a questionnaire
  about their health, and a small sample of blood will be tested to make sure it is
  safe to donate. Participants may also opt to donate only white blood cells. They
  will undergo leukapheresis: Blood will be taken from the body through a needle inserted
  into a vein. The blood will pass through a machine that separates out the white
  blood cells. The remaining blood will be returned to the body through a different
  needle. Those who donate white blood cells called granulocytes may need to take
  2 drugs, including a steroid, the day before. Participants who repeat this donation
  will need an eye exam. Participants may remain in the study for 20 years. (NCT NCT07877259;
  status NOT_YET_RECRUITING).'
