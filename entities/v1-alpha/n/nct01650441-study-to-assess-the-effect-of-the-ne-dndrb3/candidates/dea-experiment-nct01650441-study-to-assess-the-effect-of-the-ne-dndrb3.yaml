id: dea:experiment-nct01650441-study-to-assess-the-effect-of-the-ne-dndrb3
type: Experiment
name: NCT01650441 — Study to Assess the Effect of the NEXThaler® Device (DPI - Dry
  Powder Inhaler) on the Central and Peripheral Airway Dimensions in Asthmatic Patients
description: The objective of this study is to evaluate the effect of the combination
  of formoterol and beclometasone dipropionate in a dry powder inhaler (NEXThaler®)
  on central and peripheral airway dimensions in asthmatic patients. Therefore Computational
  Fluid Dynamics (CFD) will be used. Further more, the effect of this combination
  therapy on lung function (spirometry, resistance and diffusion), the Asthma Control
  Test (ACT™) and the Asthma Control Questionnaire (ACQ) will be assessed and the
  safety will be evaluated. (NCT NCT01650441; status COMPLETED).
