id: dea:experiment-nct04759261-smad4-methylation-and-expression-lev-mm9jcg
type: Experiment
name: NCT04759261 — SMAD4 Methylation and Expression Levels in Non-melanocytic Skin
  Cancers; SMAD4 Protein Positivity
description: Non-melanocytic skin cancers are the most common type of cancer worldwide.
  In the development of this cancer type, environmental factors such as UV and smoking
  are emphasized. Epigenetics are genetic conditions that develop due to environmental
  factors and can be inherited. Epigenetic modifications such as DNA methylation play
  an integral role in carcinogenesis, cancer progression and metastasis. The TGF-/
  SMAD4 pathway plays a tumor suppressive role in cancer pathogenesis. Epigenetic
  changes in this pathway also lead to a decrease in expression level, leading to
  different types of cancer. However, there is no study showing the epigenetic relationship
  between non-melanocytic skin cancer and SMAD4 methylation. In this study we planned,
  it was aimed to show the change in SMAD4 methylation and SMAD4 RNA expression level
  in cancerous tissue. In addition, it is planned to measure the SMAD4 protein positivity
  rate in non-melanocytic cancers as an immunohistochemical marker. In this context,
  60 patients who applied to Trakya University Dermatology and Venereal Diseases Outpatient
  Clinic and diagnosed with non-melanocytic skin cancer clinically and dermoscopically
  will be included in the study. Tissue materials obtained from both cancerous and
  intact skin of the patients will be examined in Trakya University Medical Biophysics
  and Medicine Pathology laboratories through various steps. Our project is the first
  study to be conducted on this subject in terms of handling all non-melanocytic skin
  cancers, using human tissue and having a large sample. In addition, with the data
  to be obtained; We think that better clarification of the role of SMAD4 in non-melanocytic
  cancers and the use of SMAD4 as both a prognostic factor and an immunohistochemical
  marker in future studies will prevent this study. Again, we anticipate that different
  treatment modalities will be developed and different functional studies can be designed
  through this pathway. (NCT NCT04759261; status UNKNOWN).
