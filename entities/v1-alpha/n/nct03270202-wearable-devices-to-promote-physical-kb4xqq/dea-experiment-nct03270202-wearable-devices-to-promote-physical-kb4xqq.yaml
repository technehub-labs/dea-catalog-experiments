type: Experiment
name: NCT03270202 — Wearable Devices to Promote Physical Activity
description: This study evaluates the effect of a new wearable device, that measures
  physical activity level based on heart rates, on relevant health outcomes including
  cardiorespiratory fitness. Half of participants will be instructed in using the
  Mio Slice wristband, while the other half will be requested to follow today's recommendations
  for physical activity. (NCT NCT03270202; status TERMINATED).
