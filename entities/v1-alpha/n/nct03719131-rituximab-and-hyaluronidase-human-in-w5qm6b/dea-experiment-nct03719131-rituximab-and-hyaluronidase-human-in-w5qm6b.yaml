id: dea:experiment-nct03719131-rituximab-and-hyaluronidase-human-in-w5qm6b
type: Experiment
name: NCT03719131 — Rituximab and Hyaluronidase Human in Patients With Advanced Melanoma
  Undergoing Nivolumab and Ipilimumab Therapy
description: This phase II trial studies whether rituximab and hyaluronidase human
  (Rituxan Hycela) can prevent immune related adverse events in participants with
  stage III-IV melanoma that cannot be removed by surgery who are undergoing nivolumab
  and ipilimumab therapy. (NCT NCT03719131; status COMPLETED).
