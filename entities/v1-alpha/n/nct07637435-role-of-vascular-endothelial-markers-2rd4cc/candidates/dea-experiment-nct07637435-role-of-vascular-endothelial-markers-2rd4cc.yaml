id: dea:experiment-nct07637435-role-of-vascular-endothelial-markers-2rd4cc
type: Experiment
name: NCT07637435 — Role of Vascular Endothelial Markers in Predicting Renal Prognosis
  and Mortality in Patients Undergoing HD-AKI
description: 'The aim of this study was to evaluate the role of Activin A, Nostrin,
  and Angiopoetin-2 levels in predicting the prognosis of renal function and in-hospital
  and 6-month mortality in patients undergoing emergency hemodialysis treatment for
  acute kidney injury. The main questions it aims to answer are: Acute renal injury
  is a clinical entity with very important consequences. Mortality and morbidity are
  high in patients requiring hemodialysis. This study aims to evaluate the predictive
  effects of certain biomarkers on outcomes such as short- and long-term monitoring
  of renal function, weaning or continuation of hemodialysis, in-hospital and 6-month
  mortality in these patients. In patients with an indication for emergency hemodialysis,
  the following levels will be measured before hemodialysis: * Serum Activin A, *
  Serum Nostrin, * Serum Angiopoetin-2 (NCT NCT07637435; status COMPLETED).'
