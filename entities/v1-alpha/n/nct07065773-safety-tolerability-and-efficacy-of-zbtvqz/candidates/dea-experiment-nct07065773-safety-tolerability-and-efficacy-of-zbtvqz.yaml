id: dea:experiment-nct07065773-safety-tolerability-and-efficacy-of-zbtvqz
type: Experiment
name: NCT07065773 — Safety, Tolerability and Efficacy of Trichostatin A in Patients
  With Mild to Severe Onychomycosis
description: This is a multicenter, open label study designed to evaluate the safety,
  tolerability, and efficacy of topically administered VTR-297 solution. The efficacy
  objectives of the study will be assessed using fungal culture testing, Neutral Red
  Staining (NRS) microscopy examination, and KOH microscopy examination after 4 weeks
  of treatment with VTR-297. (NCT NCT07065773; status ACTIVE_NOT_RECRUITING).
