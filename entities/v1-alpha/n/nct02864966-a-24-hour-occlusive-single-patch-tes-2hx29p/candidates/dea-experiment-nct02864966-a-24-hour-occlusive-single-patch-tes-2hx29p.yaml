id: dea:experiment-nct02864966-a-24-hour-occlusive-single-patch-tes-2hx29p
type: Experiment
name: NCT02864966 — A 24 Hour Occlusive Single Patch Test to Assess Acute Tolerance
  of Pre Lubricated Condom on a Panel of Healthy Adult Subjects
description: This is a 24 hour patch test to determine the acute tolerance of 3 variants
  of condom on a panel of healthy adult subjects. The patches will be affixed to the
  back and remain under occlusion for 24 hours. They will then be assessed at 30 minutes
  and 24 hours post patch removal. (NCT NCT02864966; status COMPLETED).
