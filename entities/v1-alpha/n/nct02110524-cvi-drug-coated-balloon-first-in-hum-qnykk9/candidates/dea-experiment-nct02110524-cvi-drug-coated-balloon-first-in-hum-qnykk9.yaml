id: dea:experiment-nct02110524-cvi-drug-coated-balloon-first-in-hum-qnykk9
type: Experiment
name: NCT02110524 — CVI Drug Coated Balloon First In Human Trial
description: The purpose of this study is to assess safety and the inhibition of restenosis
  of the CVI Paclitaxel-coated PTA Balloon Catheter in the treatment of de-novo occluded/stenotic
  or reoccluded/restenotic superficial femoral (SFA) or popliteal arteries. The primary
  endpoint for this analysis is late lumen loss at six (6) months. (NCT NCT02110524;
  status COMPLETED).
