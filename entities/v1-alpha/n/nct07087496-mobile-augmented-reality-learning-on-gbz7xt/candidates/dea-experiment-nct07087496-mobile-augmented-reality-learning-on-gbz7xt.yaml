id: dea:experiment-nct07087496-mobile-augmented-reality-learning-on-gbz7xt
type: Experiment
name: NCT07087496 — Mobile Augmented Reality Learning On Insulin Administration Knowledge
  And Skills Of Patients
description: 'The goal of this study to determine the effectiveness of insulin administration
  with augmented reality on increasing the knowledge and skills of patients newly
  diagnosed with type 2 diabetes on insulin administrations, determining patients''
  satisfaction with education and comparing the following two strategies: education
  with the Mobile Augmented Reality and education with the brochure. * Is Mobile augmented
  reality application effective on the knowledge scores and insulin application skills
  of patients with type 2 diabetes on insulin applications? * Does training with a
  mobile augmented reality application affect patients'' satisfaction with patient
  education? * Other patients with type 2 diabetes were given insulin administration
  training with a brochure prepared by the researcher. All patients who participated
  in the study were evaluated for insulin administration knowledge and skills after
  the training. (NCT NCT07087496; status COMPLETED).'
