type: Experiment
name: NCT03298841 — Clinical Comparison of Length of Cataract Procedures With Zeiss
  Lumera Versus Older Zeiss Microscope
description: Study design will be a mix of retrospective (older Zeiss microscope previously
  in use at our surgery center) and prospective data collection with the Lumera and
  Callisto software. The Lumera and Callisto software system will be used for all
  cataract surgeries including toric analyses and lens placement. (NCT NCT03298841;
  status COMPLETED).
