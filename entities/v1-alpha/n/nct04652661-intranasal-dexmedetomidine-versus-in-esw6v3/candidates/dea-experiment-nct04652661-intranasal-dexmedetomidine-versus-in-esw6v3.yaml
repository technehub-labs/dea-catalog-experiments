id: dea:experiment-nct04652661-intranasal-dexmedetomidine-versus-in-esw6v3
type: Experiment
name: NCT04652661 — Intranasal Dexmedetomidine Versus Intranasal Midazolam for MRI
  In Pediatrics
description: An increasing number of studies have reported the use of dexmedetomidine
  in clinical practice. However, few studies have reported on the intranasal use of
  dexmedetomidine in radiological procedures The aim of this work is to compare the
  efficacy and safety of intranasal dexmedetomidine and intranasal midazolam in pediatrics
  undergoing MRI. (NCT NCT04652661; status COMPLETED).
