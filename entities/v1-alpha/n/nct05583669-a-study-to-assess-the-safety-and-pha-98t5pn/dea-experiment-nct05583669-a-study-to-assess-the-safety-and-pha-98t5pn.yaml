name: NCT05583669 — A Study to Assess the Safety and Pharmacokinetics of Multiple
  Ascending Subcutaneous Doses of DS-2325a in Healthy Subjects
description: Netherton syndrome (NS) is a rare autosomal recessive disease and no
  systemic treatment or standard of care currently exists for patients with NS. DS-2325a,
  a specific and potent inhibitor of kallikrein 5, is expected to treat NS by replacing
  a defective gene. (NCT NCT05583669; status COMPLETED).
