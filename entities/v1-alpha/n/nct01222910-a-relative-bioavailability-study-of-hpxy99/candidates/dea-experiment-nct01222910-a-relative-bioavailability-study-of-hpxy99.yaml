id: dea:experiment-nct01222910-a-relative-bioavailability-study-of-hpxy99
type: Experiment
name: NCT01222910 — A Relative Bioavailability Study of Valacyclovir Hydrochloride
  Tablets 1gm Under Fasting Condition
description: The study was conducted as an open-label, balanced, randomized, two-treatment,
  two-period, two-sequence, single-dose, crossover, bioequivalence study comparing
  valacyclovir hydrochloride tablets 1 gram manufactured by OHM Laboratories Inc.
  NJ 08901 with VALTREX® caplets 1 gram manufactured by GlaxoSmithKline, Research
  Triangle Park, NC 27709 in healthy, adult, male, human subjects under fasting condition.
  (NCT NCT01222910; status COMPLETED).
