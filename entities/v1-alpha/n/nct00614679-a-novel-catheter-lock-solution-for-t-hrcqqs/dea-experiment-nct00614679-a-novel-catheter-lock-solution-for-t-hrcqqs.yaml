id: dea:experiment-nct00614679-a-novel-catheter-lock-solution-for-t-hrcqqs
type: Experiment
name: NCT00614679 — A Novel Catheter Lock Solution for Treatment of Tunneled Hemodialysis
  Catheter-Associated Bacteremia
description: The primary objective is to investigate the ability of systemic intravenous
  antibiotic plus antibiotic/anti-biofilm (i.e. N-acetylcysteine) lock catheter technique
  in eradicating uncomplicated catheter associated bacteremia and salvaging the infected
  vascular catheter. Secondary objectives include duration to clearance of bacteremia,
  future recurrence of bacteremia, need for catheter removal and death. (NCT NCT00614679;
  status COMPLETED).
