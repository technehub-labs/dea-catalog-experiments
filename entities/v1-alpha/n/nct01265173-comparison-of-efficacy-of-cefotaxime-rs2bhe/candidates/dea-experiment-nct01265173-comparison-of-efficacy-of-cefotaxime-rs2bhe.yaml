id: dea:experiment-nct01265173-comparison-of-efficacy-of-cefotaxime-rs2bhe
type: Experiment
name: NCT01265173 — Comparison of Efficacy of Cefotaxime, Ceftriaxone, and Ciprofloxacin
  for the Treatment of SBP in Patients With LC
description: Spontaneous bacterial peritonitis (SBP) is one of the most serious complications
  of liver cirrhosis. Mainstay of treatment for SBP is use of proper antibiotics.
  Although, several antibiotics including cefotaxime, ceftriaxone, or ciprofloxacin
  are being used, it is unclear which drug is most effective. Our aim of study is
  to compare the efficacy of the three current antibiotics for the treatment of SBP
  in patients with liver cirrhosis. The primary hypothesis is that the efficacy of
  all the antibiotics will not significantly different. This is non-inferiority trial.
  (NCT NCT01265173; status COMPLETED).
