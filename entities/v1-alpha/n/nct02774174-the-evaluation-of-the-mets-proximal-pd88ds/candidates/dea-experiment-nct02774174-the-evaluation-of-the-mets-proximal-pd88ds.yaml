id: dea:experiment-nct02774174-the-evaluation-of-the-mets-proximal-pd88ds
type: Experiment
name: NCT02774174 — The Evaluation of the METS™ Proximal Humeral System
description: This study is a single centre, non-randomised, post market clinical follow
  up examining retrospective patient data from a series of surgical cases; which involved
  the endoprosthetic replacement of the proximal humerus using the Stanmore Implant
  Worldwide METS (Modular Endoprosthetic Tumour System) Proximal Humeral system. The
  objective of this study is to evaluate the retrospective patient data where patients
  have been followed up for at least 12 months post operation; to demonstrate the
  safety of the METS Proximal Humeral replacement system. (NCT NCT02774174; status
  COMPLETED).
