id: dea:experiment-nct00207324-the-use-of-silver-leaf-dressing-in-t-r6t77f
type: Experiment
name: NCT00207324 — The Use of Silver Leaf Dressing in the Prevention of Radiotherapy
  Induced Skin Reactions
description: The hypothesis is that silver leaf nylon dressing reduces the percentage
  of patients developing brisk erythema and moist desquamation while undergoing whole
  breast radiotherapy. The secondary hypothesis is that silver leaf nylon dressing
  reduces breast-related symptoms of pain, itching and burning sensation in patients
  receiving whole breast radiotherapy. (NCT NCT00207324; status COMPLETED).
