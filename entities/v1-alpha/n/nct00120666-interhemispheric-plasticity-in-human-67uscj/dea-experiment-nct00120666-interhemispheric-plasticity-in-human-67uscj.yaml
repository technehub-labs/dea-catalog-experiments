id: dea:experiment-nct00120666-interhemispheric-plasticity-in-human-67uscj
type: Experiment
name: NCT00120666 — Interhemispheric Plasticity in Humans
description: This study will determine how the brain controls movements by sending
  messages to the spinal cord and muscles. Researchers want to know if strengthening
  a hand muscle will increase the strength of the same muscle in the other hand, and
  if these changes happen in the brain or spine, or both. Plasticity in this study
  refers to the capacity for continuous changes of the neural pathways in the brain
  and nervous system. Researchers have seen cases in which using a muscle extensively
  (force production) in one muscle group has increased the strength of the same muscle
  group on the opposite side of the body (force transfer). This situation happens
  without the unused muscle becoming larger-suggesting that the practice causes changes
  in some parts of the brain or spine. It is vital for scientists to know how this
  effect works, so that they can create new rehabilitation methods for people who
  cannot move or who have difficulty moving one side of their body. Patients ages
  18 to 60 who are in good health and who do not have a history of major conditions
  affecting the bones, joints or nervous system may be eligible for this study. Patients
  will undergo a medical examination. There will be 1 or 2 testing sessions, 20 training
  sessions, and 1 or 2 final testing sessions, with patients being asked to come to
  the laboratory for as few as 4 times (about 10 hours total) or for up to 25 visits
  (about 20 hours total). The investigator will indicate which of six different groups
  that a patient is selected for. During testing sessions, the strength of the pointer
  and little fingers in each hand will be determined through the use of very brief
  electrical pulses. There also will be transcranial magnetic stimulation (TMS) and
  1 Hz TMS. The researchers will place one or two wire coils on the patient's scalp
