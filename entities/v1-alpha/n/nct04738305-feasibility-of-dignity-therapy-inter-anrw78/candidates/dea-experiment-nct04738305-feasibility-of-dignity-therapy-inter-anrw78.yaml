id: dea:experiment-nct04738305-feasibility-of-dignity-therapy-inter-anrw78
type: Experiment
name: NCT04738305 — Feasibility of Dignity Therapy Intervention on Cancer Patients
  in Charge to an Hospital Palliative Care Unit.
description: Aim of the study was to asses feasibility and acceptability of a nurse
  delivered Dignity Therapy (DT) intervention on advanced cancer patients referring
  to an Hospital palliative care unit. To achieve this aim a mixed-method approach
  using before and after evaluation and semi-structured interviews has been used.
  (NCT NCT04738305; status COMPLETED).
