id: dea:experiment-nct00876408-review-of-molecular-profiling-real-t-xzw45d
type: Experiment
name: NCT00876408 — Review of Molecular Profiling-Real Time Polymerase Chain Reaction
  (Rt-Pcr) in Unknown Primary Cancer
description: This will be a retrospective review of 30 patients with unknown primary
  cancer who have had commercially available RT-PCR assays performed on biopsied tumors,
  in order to determine if the assay results are consistent with clinical features
  and useful for planning initial therapy or changing therapy. (NCT NCT00876408; status
  COMPLETED).
