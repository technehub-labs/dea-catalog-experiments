id: dea:experiment-nct03553862-collaborative-care-model-on-type-2-d-y2dhzy
type: Experiment
name: NCT03553862 — Collaborative Care Model on Type 2 Diabetic Patients
description: The purpose of this study is to determine the effectiveness of the collaborative
  care model in Singapore in which clinical pharmacists, nurses and dietitians are
  active participants who collaborate with physicians in caring for patients with
  Type 2 diabetes mellitus (DM).Since DM is a cardiovascular risk equivalent, co-morbidities
  such as hypertension (HTN) and dyslipidaemia (DLP) will also be evaluated to assess
  the holistic care provided for the investigator's patients afflicted with these
  top chronic diseases in Singapore. (NCT NCT03553862; status COMPLETED).
