type: Experiment
name: NCT04669340 — E-learning in Patient Education to Patients With Rheumatoid Arthritis
description: Rheumatoid arthritis (RA) is a chronic inflammatory disease that primarily
  causes pain, swelling and stiffness in the joints. The disease may reduce normal
  functioning and thereby quality of life. Patient education (PE), with the aim of
  supporting patients to self-manage their disease is an important part of the treatment
  and care to patients with RA. PE supports people in living with RA by offering knowledge
  of the disease, symptoms and treatment as well as guidance in coping with the disease
  in everyday life. In recent years, the number of people with RA has risen and in
  general people lives longer. This places new demands on the healthcare system for
  alternatives to conventional care, e.g. through web technology and remote care.
  Often PE is provided through face-to-face interactions with health professionals
  at the hospital and thus far, only a small number of studies have been conducted
  within the area of web-based PE targeting people with RA. A few studies within RA
  and other chronic diseases shows that online tools and online educational programs
  may enhance patient's knowledge of the disease and treatment and improve self-management
  and quality of life. Internet and technology is a great part of everyday life, however,
  variation is seen in computer skills and likewise in health literacy skills. Even
  so, PE based on web technology may have several advantages, e.g. the accessibility
  and the possibility to seek for information as needed and repeatedly in familiar
  surroundings and possibly with relatives. Moreover, the integration of words and
  images can promote deeper understanding and learning since both auditory and visual
  channels are used. Possible disadvantages may be related to the absence of face-to-face
  contact with healthcare professionals. Given the need for alternative solutions
  to the conventional face-to-face contact, the investigators have developed an e-learning
  program targeting newly diagnosed patients with RA. The purpose of the program is
