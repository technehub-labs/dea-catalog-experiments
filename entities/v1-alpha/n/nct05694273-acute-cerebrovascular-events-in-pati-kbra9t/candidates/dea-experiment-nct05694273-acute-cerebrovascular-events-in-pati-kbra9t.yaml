id: dea:experiment-nct05694273-acute-cerebrovascular-events-in-pati-kbra9t
type: Experiment
name: NCT05694273 — Acute Cerebrovascular Events in Patients Undergoing Catheter Ablation
description: This study aims to evaluate the incidence, clinical characteristics,
  and short-term prognosis of acute cerebrovascular events occurring in-hospital in
  patients with arrhythmias following catheter ablation. The goal is to provide evidence
  supporting the improvement of patient quality of life and reduction of in-hospital
  acute cerebrovascular complications in patients with post-ablation arrhythmias.
  This will also contribute to the evidence-based clinical management of such patients.
  (NCT NCT05694273; status NOT_YET_RECRUITING).
