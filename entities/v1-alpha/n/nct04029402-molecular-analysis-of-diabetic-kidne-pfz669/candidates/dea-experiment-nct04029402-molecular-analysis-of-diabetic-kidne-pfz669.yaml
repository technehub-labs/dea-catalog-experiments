id: dea:experiment-nct04029402-molecular-analysis-of-diabetic-kidne-pfz669
type: Experiment
name: NCT04029402 — Molecular Analysis of Diabetic Kidney Disease Biopsies
description: Despite decades of research, the pathogenesis of human diabetic kidney
  disease remains largely unclear. Our goal is to use archived human kidney biopsy
  tissue from patients with and with diabetic nephropathy to identify new molecules
  that drive and/or protect against disease progression. We will use RNA sequencing
  to identify transcriptomic changes that associate with histologic and functional
  outcomes. (NCT NCT04029402; status UNKNOWN).
