id: dea:experiment-nct00196937-human-papilloma-virus-hpv-vaccine-im-7fzg4n
type: Experiment
name: NCT00196937 — Human Papilloma Virus (HPV) Vaccine Immunogenicity and Safety
  Trial in Young and Adult Women With GSK Biologicals' HPV-16/18
description: Infection with human papillomavirus (HPV) has been clearly established
  as the central cause of cervical cancer. Indeed, certain oncogenic types of HPV
  can infect the cervix (part of the uterus or womb). This infection may go away by
  itself, but if it does not go away (this is called persistent infection), it can
  lead in women over a long period of time to cancer of the cervix. This study will
  evaluate the immunogenicity and safety of GSK Biologicals HPV-16/18 vaccine over
  12 months, in women up to 55 years of age at study start. Approximately 660 study
  subjects will receive the HPV vaccine administered intramuscularly according to
  a 0-1-6 month schedule. The study will be extended to assess long-term safety and
  immunogenicity of the HPV-16/18 vaccine. (NCT NCT00196937; status COMPLETED).
