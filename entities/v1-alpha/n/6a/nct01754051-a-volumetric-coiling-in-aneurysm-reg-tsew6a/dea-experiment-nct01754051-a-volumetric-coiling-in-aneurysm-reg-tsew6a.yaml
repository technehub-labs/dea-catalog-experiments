type: Experiment
name: NCT01754051 — A Volumetric Coiling in Aneurysm Registry of the Penumbra Coil
  400TM System
description: This study is a prospective, multi-center registry of patients with intracranial
  aneurysms who are treated by the PC 400 System. Data for each patient are collected
  up to 12 ± 3 months post-procedure for the study. (NCT NCT01754051; status COMPLETED).
