id: dea:experiment-nct05474469-diaphragmatic-breathing-with-and-wit-2vyn4k
type: Experiment
name: NCT05474469 — Diaphragmatic Breathing With and Without Abdominal Muscles Strength
  Training Program
description: The postpartum period is excessively weak and have hypotonic abdominal
  muscles, making the ligaments and connective tissue softer and more elastic. The
  importance of exercise in the postpartum period is very important in this regard.
  This study will be a Randomized control trial used to compare the effects of diaphragmatic
  breathing with and without abdominal muscles strength training program on pelvic
  floor strength and endurance and quality of life in postnatal women. Subjects meeting
  the inclusion and exclusion criteria will be divided into two groups using lottery
  method. Assessment will be done using PERFECT scheme questionnaire and SF- 36 quality
  of life questionnaire. Subjects in one group will receive diaphragmatic breathing
  exercises along with pelvic muscle strength training and subjects in other group
  will receive only diaphragmatic breathing exercises. Each subject will receive 12
  treatment sessions for 4 weeks. Results will be analyzed for any change by using
  SPSS25. (NCT NCT05474469; status COMPLETED).
