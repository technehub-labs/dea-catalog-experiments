id: dea:experiment-nct07572942-laser-based-map-tests-in-motoric-cog-pasg35
type: Experiment
name: NCT07572942 — Laser-Based Map Tests in Motoric Cognitive Risk Syndrome
description: This study aims to evaluate the validity and reliability of neuroscience-based
  visual laser feedback map tests in individuals with Motoric Cognitive Risk Syndrome
  (MCRS). The developed assessment protocol integrates visuospatial processing, reaction
  time, and upper extremity motor control within a single task. Construct validity
  will be examined through correlations with reaction time and proprioception measurements,
  and test-retest reliability will be assessed to determine measurement consistency.
  (NCT NCT07572942; status RECRUITING).
