type: Experiment
name: NCT04049305 — Robotic Versus Conventional or Endoscopic Nipple Sparing Mastectomy
  for Breast Cancer
description: This study will retrospectively collect and evaluate the surgical outcomes
  of robotic nipple sparing mastectomy (R-NSM) compared with endoscopic assisted NSM
  (E-NSM) or conventional NSM (C-NSM) in the management of breast cancer. Multi-centers
  pooled data analysis would be performed for comparisons of R-NSM compared with C-NSM
  or E-NSM. (NCT NCT04049305; status UNKNOWN).
