id: dea:experiment-nct07685990-trauma-therapy-for-weight-based-bull-kgq9a6
type: Experiment
name: NCT07685990 — Trauma Therapy for Weight-Based Bullying in Children
description: 'The goal of this feasibility study is to learn whether a trauma therapy
  intervention for children and adolescents who have experienced weight-based bullying
  can be successfully delivered within a pediatric weight management program. The
  intervention is informed by Trauma-Focused Cognitive Behavioral Therapy (TF-CBT)
  principles and is designed to address trauma-related distress, body image concerns,
  emotional difficulties, and eating-related challenges associated with weight-based
  bullying. The main questions this study aims to answer are: * Can this trauma therapy
  intervention be feasibly implemented within the HEAL Program at Children''s Hospital,
  London Health Sciences Centre? * Is the intervention acceptable and helpful for
  participating children, adolescents, and caregivers? * Are exploratory changes observed
  in trauma symptoms, emotional well-being, self-esteem, eating-related concerns,
  and weight-related distress following participation in the intervention? Participants
  will: * Participate in approximately 12 weekly virtual therapy sessions, with flexibility
  for additional sessions if clinically needed * Complete questionnaires before and
  after treatment related to emotional well-being, trauma symptoms, eating-related
  concerns, and body image * Participate in selected caregiver-supported sessions
  during treatment * Optionally complete a brief feedback interview about their experience
  in the program after treatment is completed The study will also examine recruitment,
  attendance, treatment completion, and participant satisfaction to help determine
  whether this intervention can be implemented in routine clinical care settings.
  (NCT NCT07685990; status NOT_YET_RECRUITING).'
