id: dea:experiment-nct04119713-autoimmunity-after-checkpoint-blocka-kuu6pb
type: Experiment
name: NCT04119713 — Autoimmunity After Checkpoint Blockade
description: The purpose of this study is to better understand how the treatment of
  cancer with immune checkpoint inhibitors (ICI) leads to the development of autoimmunity.
  Specifically, we wish to understand the genetics and immune system features that
  cause a subset of cancer patients treated with checkpoint inhibitor therapy to develop
  an immune-related adverse event (irAE). (NCT NCT04119713; status RECRUITING).
