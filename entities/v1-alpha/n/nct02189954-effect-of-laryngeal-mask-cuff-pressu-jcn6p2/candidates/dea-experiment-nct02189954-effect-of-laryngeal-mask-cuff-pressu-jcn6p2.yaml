id: dea:experiment-nct02189954-effect-of-laryngeal-mask-cuff-pressu-jcn6p2
type: Experiment
name: NCT02189954 — Effect of Laryngeal Mask Cuff Pressure in Geriatric Patients
description: Laryngeal Mask is widely used for air-way management during anaesthesia.
  Pharyngolaryngeal morbidity linked to laryngeal mask use is related to correct choice
  of mask size, placement technique, placement of the laryngeal mask in the correct
  position on the larynx, cuff volume and cuff pressure. It has been stated that keeping
  laryngeal mask cuff pressure below 45 mmHg (60 centimeter of water(cmH2O) ) can
  prevent pharyngolaryngeal morbidity related to laryngeal mask (throat pain, dysphonia,
  dysphagia) and shown that using a manometer after Laryngeal Mask Unique placement
  to limit pressure within the cuff can reduce this morbidity by nearly 70%. Studies
  commenting on pharyngolaryngeal morbidity generally do not choose a certain age
  group and cover stages including very young and middle-aged groups. In the literature
  only one similar study on the geriatric age group was found. The aim of this study
  is to compare the postoperative pharyngolaryngeal morbidity in a group with cuff
  pressure held to 44 mmHg (60 cmH2O with a manometer and a group with Laryngeal Mask
  cuff inflated without reference to pressure in the geriatric age group with indications
  for Laryngeal Mask Unique placement. (NCT NCT02189954; status COMPLETED).
