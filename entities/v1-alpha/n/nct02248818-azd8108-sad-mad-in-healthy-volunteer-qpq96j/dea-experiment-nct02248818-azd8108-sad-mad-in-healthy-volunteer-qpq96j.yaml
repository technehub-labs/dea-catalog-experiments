type: Experiment
name: NCT02248818 — AZD8108 SAD/MAD in Healthy Volunteers
description: This is a randomized, double-blind, placebo-controlled study of single
  and multiple ascending dosage levels of AZD8108 in healthy volunteers. The study
  includes an up to 28-day screening period, an in-house period during which AZD8108
  or placebo will be administered orally as a solution, and a 4- to 10-day follow-up
  period after discharge. (NCT NCT02248818; status COMPLETED).
