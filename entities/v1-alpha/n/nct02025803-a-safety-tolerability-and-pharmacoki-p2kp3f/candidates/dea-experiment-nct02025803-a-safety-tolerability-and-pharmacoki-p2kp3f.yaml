name: NCT02025803 — A Safety, Tolerability and Pharmacokinetic Study of TAS-114 in
  Combination With Capecitabine in Patients With Advanced Solid Tumors
description: The purpose of this exploratory study is to investigate the safety and
  determine the maximum tolerated dose (MTD) of TAS-114 in combination with capecitabine
  in patients with advanced solid tumors for which the patients have no available
  therapy likely to convey clinical benefit. (NCT NCT02025803; status COMPLETED).
