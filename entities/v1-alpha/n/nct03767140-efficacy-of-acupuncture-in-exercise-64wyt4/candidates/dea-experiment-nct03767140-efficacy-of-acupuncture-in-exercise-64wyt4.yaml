id: dea:experiment-nct03767140-efficacy-of-acupuncture-in-exercise-64wyt4
type: Experiment
name: NCT03767140 — Efficacy of Acupuncture in Exercise Tolerance in Patients With
  COPD
description: Chronic Obstructive Pulmonary Disease (COPD) is nowadays the 4th cause
  of death in the world and it´s expected to become the 3rd cause of death in 2020
  and the majority cause of morbidity. Besides that, in Portugal COPD patients become
  more dependents each day. Acupuncture as a reflex therapy it´s carried out through
  a Traditional Chinese Medicine (TCM) diagnose that will allowed to identify the
  acupoints. The investigators are interested in to assess acupuncture efficacy on
  physical exercise tolerance in COPD patients.An experimental, controlled, randomized,
  double blind study was done. Patients were recruited according TCM diagnose to optimize
  potential therapeutic effects. (NCT NCT03767140; status COMPLETED).
