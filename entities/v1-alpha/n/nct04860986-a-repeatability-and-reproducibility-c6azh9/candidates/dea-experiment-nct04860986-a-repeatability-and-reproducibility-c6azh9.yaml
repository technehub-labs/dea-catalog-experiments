id: dea:experiment-nct04860986-a-repeatability-and-reproducibility-c6azh9
type: Experiment
name: NCT04860986 — A Repeatability and Reproducibility Study of the EarliPoint™ Device
description: The study is a prospective randomized repeatability and reproducibility
  (R\&R) study of the EarliPoint DeviceTM in pediatric subjects 16-30 months of age.
  The study will enroll subjects who are both clinically-positive and clinically-negative
  for ASD. The study will be conducted at a single center in the US. The Study consists
  of a screening period in order to review the subject's medical history to determine
  subject eligibility, followed by a device administration period during which subjects
  will undergo testing with the EarliPoint Devices and Expert Clinician Diagnosis
  (ECD) procedures to determine if they are clinically-positive or clinically-negative
  for ASD. (NCT NCT04860986; status COMPLETED).
