id: dea:experiment-nct07072156-the-effect-of-stress-ball-use-on-str-2fj96g
type: Experiment
name: NCT07072156 — The Effect of Stress Ball Use on Stress, Anxiety, and Vital Signs
  in Patients Undergoing Chemotherapy for Breast Cancer
description: AIM This study aims to investigate the effects of stress ball use on
  stress, anxiety, and vital signs in patients receiving chemotherapy for breast cancer.
  METHOD This study will be conducted with 50 breast cancer patients receiving chemotherapy
  at the Outpatient Chemotherapy Unit of Rize Training and Research Hospital, using
  a randomized controlled experimental design. Simple randomization will be used for
  group assignment. Data will be collected using a Breast Cancer Patient Information
  Form, Distress Thermometer, and State Anxiety Inventory. It is planned that data
  will be collected both before and after the chemotherapy session. ORIGINALITY /
  SCIENTIFIC CONTRIBUTION To date, no study has been found in the literature evaluating
  the effects of stress balls on stress, anxiety, and vital signs in breast cancer
  patients undergoing chemotherapy. Therefore, this project is considered original
  and is expected to contribute to both national and international scientific literature.
  If successful, the project will provide evidence for a new non-pharmacological intervention
  that is easy to use during chemotherapy sessions and can help improve patients'
  stress, anxiety, and vital signs. Patients may experience more comfort and better
  treatment compliance during chemotherapy. EXPECTED OUTCOMES It is expected that
  the use of a stress ball will have a positive effect on reducing stress and anxiety
  levels and improving vital signs in breast cancer patients receiving chemotherapy.
  (NCT NCT07072156; status NOT_YET_RECRUITING).
