type: Experiment
name: NCT07439289 — Turtle-Assisted Animal Interaction on Dental Anxiety and Physiological
  Parameters in Children
description: This study aims to measure the effect of a structured AAT session with
  a turtle present on dental anxiety and behavioral compliance in children during
  routine procedures that do not require local anesthesia in a pediatric dental clinic.
  (NCT NCT07439289; status RECRUITING).
