type: Experiment
name: NCT02552342 — Corticosteroid Therapy for Severe Community-Acquired Pneumonia
description: The purpose of the present study is to assess the efficacy of methylprednisolone
  as an adjuvant therapy in patients with severe community-acquired pneumonia (CAP)
  (PSI 4-5). The hypothesis of the study is that methylprednisolone can decrease the
  mortality of severe CAP without any significant side effects,with reduction of the
  time to clinical stability and failure rate of treatment. (NCT NCT02552342; status
  UNKNOWN).
