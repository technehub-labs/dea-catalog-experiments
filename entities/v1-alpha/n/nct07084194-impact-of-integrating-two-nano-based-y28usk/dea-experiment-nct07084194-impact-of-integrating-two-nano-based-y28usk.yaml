type: Experiment
name: NCT07084194 — Impact of Integrating Two Nano Based Irrigants With Two Activation
  Techniques in Treatment of Teeth With Acute Pulpitis on Postoperative Pain and Flare
  up Incidence
description: This study aimed to evaluate and compare impact of integrating passive
  ultrasonic activation and laser activation with nano-chitosan and aloe vera in terms
  of postoperative pain and flare-up incidence in a randomized clinical trial. (NCT
