id: dea:experiment-nct07380035-coercion-in-same-day-research-consen-v2hvua
type: Experiment
name: NCT07380035 — Coercion in Same-Day Research Consent
description: As a result of their unique practice patterns, many specialist physicians
  typically only meet patients on the date of an intervention such as surgery. However,
  some of the world's most prestigious academic centers do not allow research participants
  to be recruited on the same day as surgery. This is because of concerns, shared
  by researchers and research ethics boards, that patients may be too anxious or rushed
  to provide informed, voluntary consent immediately before an operation. This is
  not supported by evidence, and leads to potential inequities by restricting patients'
  opportunities to contribute to and benefit from research. The investigators undertook
  a randomized controlled trial incorporating deception to study the voluntariness
  of research consent provided by patients invited to enroll in a fabricated anesthesia
  research study at Women's College Hospital in Toronto, Ontario, Canada. Patients
  undergoing day surgery were randomized to receive research recruitment opportunities
  either days before surgery in the pre-operative assessment clinic, or on the surgical
  date. Post-operatively, patient's perceptions of undue influence or coercion in
  the consent process were examined with questionnaires and compared between these
  groups. This trial will help to design future perioperative studies, and will answer
  the important question of whether truly voluntary and informed same-day consent
  can be provided for participation in perioperative research. (NCT NCT07380035; status
  COMPLETED).
