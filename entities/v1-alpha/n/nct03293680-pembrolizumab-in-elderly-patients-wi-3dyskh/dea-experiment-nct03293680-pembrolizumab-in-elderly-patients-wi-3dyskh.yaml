id: dea:experiment-nct03293680-pembrolizumab-in-elderly-patients-wi-3dyskh
type: Experiment
name: NCT03293680 — Pembrolizumab in Elderly Patients With Advanced Lung Cancer
description: This is a multi-center phase II trial of intravenous (IV) Pembrolizumab
  MK-3475 in subjects older than 70 years with advanced Non-small cell Lung Cancer
  (NSCLC) expressing Programmed death-ligand 1 (PD-L1). 82 patients will be enrolled
  in this trial to examine the efficacy, the impact on geriatric assessments, the
  quality of life and the self-reported outcomes. (NCT NCT03293680; status COMPLETED).
