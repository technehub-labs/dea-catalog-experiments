id: dea:experiment-nct07712783-lateral-ql-block-vs-intrathecal-morp-47a7c3
type: Experiment
name: NCT07712783 — Lateral QL Block vs Intrathecal Morphine for Cesarean Section
description: Effective postoperative analgesia after cesarean delivery is essential
  for maternal recovery, early mobilization, breastfeeding, and maternal-infant bonding.
  Although intrathecal morphine (ITM) is considered the gold standard for post-cesarean
  analgesia, its use is associated with opioid-related adverse effects. Ultrasound-guided
  lateral quadratus lumborum block (QLB-I) has emerged as a promising alternative.
  This randomized, double-blind, non-inferiority trial aims to compare the postoperative
  analgesic efficacy of lateral QLB-I with ITM. Secondary outcomes include postoperative
  opioid consumption, pain scores, opioid-related adverse effects, quality of recovery
  (ObsQoR-11T), and maternal satisfaction. (NCT NCT07712783; status RECRUITING).
