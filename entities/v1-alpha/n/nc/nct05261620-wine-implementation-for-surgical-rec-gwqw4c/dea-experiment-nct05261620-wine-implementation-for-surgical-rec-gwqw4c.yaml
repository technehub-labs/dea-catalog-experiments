id: dea:experiment-nct05261620-wine-implementation-for-surgical-rec-gwqw4c
type: Experiment
name: NCT05261620 — Wine Implementation for Surgical Recovery Enhancement
description: This is a monocenter, prospective randomized clinical trial. The study
  aims to investigate whether moderate consumption of red wine (1 unit at lunch and
  1 unit at dinner) for 30 days after surgery could improve the quality of life (QoL)
  and health perception status of the patient, without increasing the morbidity and
  the toxicity related to the surgery. (NCT NCT05261620; status COMPLETED).
