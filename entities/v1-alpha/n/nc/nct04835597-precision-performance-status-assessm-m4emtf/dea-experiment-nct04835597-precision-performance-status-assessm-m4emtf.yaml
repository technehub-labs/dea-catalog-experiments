id: dea:experiment-nct04835597-precision-performance-status-assessm-m4emtf
type: Experiment
name: NCT04835597 — Precision Performance Status Assessment in Breast Cancer Patients
  Receiving Neoadjuvant Chemotherapy
description: This study assesses the performance status in stage I-III triple negative
  breast cancer patients who are receiving neoadjuvant chemotherapy. Information collected
  in this study may help doctors learn if movement and fitness trackers can be used
  to predict side effects in cancer patients receiving chemotherapy. (NCT NCT04835597;
  status TERMINATED).
