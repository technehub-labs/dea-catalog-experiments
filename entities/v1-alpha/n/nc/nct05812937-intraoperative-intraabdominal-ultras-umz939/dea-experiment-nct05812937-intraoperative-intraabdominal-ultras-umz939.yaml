id: dea:experiment-nct05812937-intraoperative-intraabdominal-ultras-umz939
type: Experiment
name: NCT05812937 — Intraoperative Intraabdominal Ultrasound for Endometriosis
description: The diagnosis of bowel endometriosis lesions is in most cases a combination
  of anamnesis, clinical exam, transvaginal ultrasound (and/or MRI and/or endorectal
  sonography) and laparoscopy. Both the transvaginal ultrasound as well as the MRI
  have showed a great accuracy with very good sensititivity and specificity regarding
  the imaging diagnosis of bowel endometriosis. The conventional laparoscopy contributes
  to the diagnosis of bowel endometriosis by visualizing the nodules and palpating
  the deep endometriosis nodule using the instruments, therefor offering the surgeon
  a haptic feedback by grasping, pushing and rolling the bowel wall and the nodules.
  Horace Roman and Dan Martin showed that 25% of patients undergoing a conventional
  laparoscopic segmental bowel resection with a minilaparotomy hat palpable non-visualized
  endometriosis nodules. These nodules could be directly palpated with the hands because
  the bowel was exteriorized through the minilaparotomy. The direct palpation of the
  bowel offers of course a superior haptic feedback compared to the haptic feedback
  offered by the laparoscopic palpation using the instruments. However this was a
  direct palpation of only the oral part of the bowel. The aboral part of the bowel
  caudal to the staple line could not be evaluated by direct palpation. New surgical
  techniques for the segmental bowel resection with transvaginal/transanal NOSE(natural
  orifice specimen extraction) have been described in the last years. The novel techniques
  avoid the minilaparotomy and assure a 100% minimal invasive approach offering better
  esthetic outcomes. However in such cases a direct palpation of the bowel wall using
  the hands in order to identify non- visualizable nodules is not possible as the
  bowel remains the whole time of the procedure inside of the abdomen. On the other
  side the robotic-assisted laparoscopy doesn't offer the surgeon a haptic feedback
  at all. In these cases the surgeon has to rely on the visual aspects of the lesions
