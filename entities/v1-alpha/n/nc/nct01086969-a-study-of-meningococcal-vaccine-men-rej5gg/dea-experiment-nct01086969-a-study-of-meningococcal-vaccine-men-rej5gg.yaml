type: Experiment
name: NCT01086969 — A Study of Meningococcal Vaccine, Menactra® in Healthy Subjects
  in India
description: 'The purpose of this study is to assess the safety and immunogenicity
  of a single dose of Menactra® vaccine to support registration. Primary Objectives:
  * To describe the antibody titers measured by serum bactericidal activity using
  baby rabbit complement (SBA-BR) before and after Menactra® vaccination. * To describe
  the safety profile of participants after one dose of Menactra®. (NCT NCT01086969;
  status COMPLETED).'
