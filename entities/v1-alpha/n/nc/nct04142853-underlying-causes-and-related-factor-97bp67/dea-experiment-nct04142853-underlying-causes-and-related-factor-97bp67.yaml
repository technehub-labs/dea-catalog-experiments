id: dea:experiment-nct04142853-underlying-causes-and-related-factor-97bp67
type: Experiment
name: NCT04142853 — Underlying Causes and Related Factors, and Rehabilitation Approaches
description: This study will be a cross-sectional observational study, followed by
  a pilot intervention. The aim of the study is to examine the underlying causes of
  walking-related performance fatigability, together with other related and influencing
  factors, to make up a clinical profile of patients with MS showing walking-related
  performance fatigability. In the second part of the study a pilot intervention will
  be executed to see if the investigators can improve the clinical status of the MS
  patients with walking-related performance fatigability. (NCT NCT04142853; status
  COMPLETED).
