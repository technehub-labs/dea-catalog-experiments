type: Experiment
name: NCT07903337 — A Phase 1, Open-Label, Two-Stage, Food Effect Study to Assess
  the Safety, Tolerability, and Pharmacokinetics of EI-1071 Under Fasted or Fed Conditions
  in Healthy Volunteers
description: This is a phase 1, open-label, two-stage, sequential food effect study
  to evaluate the safety, tolerability, and PK of EI-1071 under fasted or fed conditions
  in HVs. Approximately 25 evaluable participants will be enrolled in this study,
  including 11 participants in Stage 1 and 14 participants in Stage 2. Stage 2 study
  may be conducted based on the results of Stage 1 study. (NCT NCT07903337; status
  NOT_YET_RECRUITING).
