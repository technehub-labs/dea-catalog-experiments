id: dea:experiment-nct01047631-role-of-exercise-in-diastolic-heart-xxtesc
type: Experiment
name: NCT01047631 — Role of Exercise in Diastolic Heart Failure
description: Diastolic heart failure is now being recognized as a key form of heart
  failure in older people. The focus of this research is to study ways to improve
  and maintain physical activity and functioning. This knowledge may improve the health
  and well-being in people with diastolic heart failure. (NCT NCT01047631; status
  COMPLETED).
