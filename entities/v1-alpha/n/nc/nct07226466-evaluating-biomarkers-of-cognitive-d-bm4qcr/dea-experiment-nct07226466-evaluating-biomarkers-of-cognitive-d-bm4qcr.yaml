id: dea:experiment-nct07226466-evaluating-biomarkers-of-cognitive-d-bm4qcr
type: Experiment
name: NCT07226466 — Evaluating Biomarkers of Cognitive Dysfunction in Patients With
  Cancer
description: This study investigates the effects of brain radiotherapy on cognitive
  function by evaluating plasma biomarkers and apolipoprotein E (APOE) genotype in
  patients with primary or metastatic brain tumors. Standard brain radiotherapy is
  known to impact cognitive outcomes, yet the underlying biological mechanisms remain
  unclear. (NCT NCT07226466; status NOT_YET_RECRUITING).
