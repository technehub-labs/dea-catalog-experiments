id: dea:experiment-nct04012723-clinical-trial-of-a-new-device-for-r-5h4k3r
type: Experiment
name: NCT04012723 — Clinical Trial of a New Device for Real-Time Muscle Pressure Measurements
  in Patients at Risk for Acute Compartment Syndrome
description: Compartment syndrome remains a very serious complication of lower extremity
  trauma and/or procedural cases that involved lower or upper extremity surgery. This
  condition results in muscle death, chronic pain, infection, and possible amputation.
  Early diagnosis is essential to institute interventions to avoid complications.
  Unfortunately, the subjective pain of the patient remains the mainstay for diagnosis.
  A method or device is needed that would improve the investigator's ability to diagnose
  this potentially devastating condition. The purpose of this trial is to evaluate
  the safety and functionality of MY01, an investigational device that allows continuous
  monitoring of intracompartmental muscle pressure in patients at risk for developing
  acute compartment syndrome. This is a single centre, non-randomized, non-controlled,
  unblinded, prospective trial of the MY01 device. A cohort of 25 participants will
  be prospectively enrolled to document the performance of the device. (NCT NCT04012723;
  status COMPLETED).
