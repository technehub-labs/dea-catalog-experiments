id: dea:experiment-nct00505427-alpha-lipoic-acid-and-polycystic-ova-nf8ct2
type: Experiment
name: NCT00505427 — Alpha Lipoic Acid and Polycystic Ovary Syndrome
description: 'The study will recruit 40 subjects with Polycystic Ovary Syndrome (PCOS)
  as defined by the NIH criteria. The subjects will be pre-screened for insulin sensitivity
  using fasting insulin and glucose levels and oral glucose tolerance test. The 20
  most insulin resistant subjects will undergo measurements of in vivo insulin action
  by hyperinsulinemic, euglycemic clamp. Body composition will be measured by dual-energy
  X-ray absorptiometry (DEXA). Plasma lipids and markers of oxidative stress will
  be measured. They will then receive open label controlled release alpha lipoic acid
  (CRLA) at 800 mg twice daily for 16 weeks. After treatment hyperinsulinemic euglycemic
  clamps, DEXA, plasma lipids and markers of oxidative stress will be repeated. Hypotheses:
  LA will improve insulin sensitivity in PCOS subjects; LA will reduce oxidative stress,
  testosterone levels and improve cardiovascular risk factors. (NCT NCT00505427; status
  COMPLETED).'
