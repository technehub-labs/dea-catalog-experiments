id: dea:experiment-nct05917340-intensified-short-course-regimen-for-b5xdpr
type: Experiment
name: NCT05917340 — Intensified Short Course Regimen for TBM in Adults
description: Tuberculous meningitis (TBM) is the most lethal form of extra pulmonary
  tuberculosis. This devastating disease kills almost a third of its sufferers and
  disables a significant proportion of the survivors. TBM poses one of the most difficult
  diagnostic and therapeutic challenges in modern clinical practice. High-quality
  robust clinical trials have made a considerable contribution to the treatment of
  pulmonary tuberculosis in the last four decades. However, evidence from such clinical
  trials is lacking in TBM and the treatment remains uncertain. There is a significant
  variation in the choice, dose and duration of drugs between countries, institutions
  and clinicians. Investigators propose a multi-centric open-label clinical trial
  to assess the efficacy of short-course anti-TB drugs with high dose rifampicin,
  and moxifloxacin along with conventional anti-TB drugs and adjuvant therapy with
  aspirin and corticosteroids. Controls will receive standard treatment as per national
  guidelines for TBM. The investigators also aim to assess the safety and tolerability
  of high-dose Rifampicin and Moxifloxacin and the Pharmacodynamics and Pharmacokinetics
  parameters of ATT (Rifampicin, INH, Moxifloxacin and Pyrazinamide) in CSF between
  the two groups (NCT NCT05917340; status NOT_YET_RECRUITING).
