type: Experiment
name: NCT06677073 — Effects of FATmax Exercise and HIIT on Fat Loss in Overweight
  Young Women
description: 'This study investigated the effects of two exercise modalities: high-intensity
  interval training (HIIT) and maximal fat oxidation (FATmax) exercise on fat loss
  in overweight young women. Participants were randomly assigned to either the HIIT
  or FATmax group, underwent an 8-week supervised exercise intervention. (NCT NCT06677073;
  status COMPLETED).'
