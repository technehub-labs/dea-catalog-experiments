id: dea:experiment-nct04294862-tissue-distribution-pharmacokinetics-w6waed
type: Experiment
name: NCT04294862 — Tissue Distribution, Pharmacokinetics, Safety, and Tolerability
  After a Single Dose of TNP-2092 in Participants Undergoing Primary Total Hip or
  Knee Arthroplasty
description: This study will investigate TNP-2092 distribution into joint tissues
  in participants undergoing a total hip arthroplasty (THA) or a total knee arthroplasty
  (TKA). Tissue distribution is the primary objective, and plasma pharmacokinetics
  (PK), safety, and tolerability are secondary objectives. (NCT NCT04294862; status
  COMPLETED).
