name: NCT02366156 — A 12 Week, 3-Period Study to Evaluate the Effects of a Dietary
  Supplement on Lipid Metabolism
description: This study will evaluate the effects of encapsulated botanical extracts,
  previously shown to inhibit the enzyme diacylglycerol-acyltransferase-1 (DGAT-1)
  in vitro, on fasting and postprandial lipid metabolism during an oral fat tolerance
  test (OFTT) in apparently healthy, overweight and obese adult men and women. (NCT
  NCT02366156; status COMPLETED).
