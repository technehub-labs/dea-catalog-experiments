id: dea:experiment-nct01863108-safety-study-of-a-dendritic-cell-bas-f8cxkr
type: Experiment
name: NCT01863108 — Safety Study of a Dendritic Cell-based Cancer Vaccine in Melanoma
description: The primary objective of this study is to evaluate the safety and tolerability
  of multiple sub-cutaneous injections of GeniusVac-Mel4, a dendritic cell-based cancer
  vaccine, in patients with melanoma. The secondary objectives are to determine immune
  response and clinical efficacy of such injections in patients with melanoma. (NCT
  NCT01863108; status COMPLETED).
