id: dea:experiment-nct06345235-new-biomarkers-and-plasma-prothrombo-ncjxyc
type: Experiment
name: NCT06345235 — New Biomarkers and Plasma Prothrombotic Potential in Cardiac Transthyretin
  Amyloidosis
description: 'The development of cardiac amyloidosis is caused by the deposition of
  misfolded, insoluble proteins in the extracellular matrix of tissues. An important
  element of the clinical picture of the disease is the increased risk of thromboembolic
  complications, independent of the occurrence of atrial fibrillation, and the presence
  of intracardiac thrombi. The pathomechanism may be related to an increase in filling
  pressure or amyloid infiltration leading to myocardial damage and endothelial dysfunction,
  which may activate the prothrombotic inflammatory cascade, resulting in increased
  thrombogenic potential. Currently, there is limited published data on the potential
  role of new heart failure biomarkers in the assessment of ATTR cardiomyopathy, particularly
  in the assessment of asymptomatic carriers of pathogenic TTR variants. Moreover,
  there are few literature reports on the direct assessment of the coagulation system
  in this group of patients, and the pathomechanism of the increased thromboembolic
  risk is unexplored. Purpose of the study: To assess the diagnostic value of biomarkers
  related to heart failure (growth differentiation factor-15 (GDF15), soluble suppression
  of tumorigenicity-2 (ST2), galectin-3), amyloidosis ( TTR, tissue inhibitor of metalloproteinase-1
  (TIMP-1), matrix metalloproteinase-9 (MMP-9, matrix metalloproteinase-9), neurofilament
  light chain (NfL)) and the generation potential thrombin as a marker of the prothrombotic
  state in the course of ATTR. Methods: This prospective, single-center study will
  include consecutive patients diagnosed with ATTR cardiomyopathy (GROUP 1, n=30),
  asymptomatic carriers of pathogenic TTR variants (GROUP 2, n=30), and a matched
  control group of healthy volunteers (GROUP 3 , n=20). Material for research was
  collected and secured from all study participants. After giving informed consent,
  all patients will be tested using the ELISA method from peripheral blood (enzyme-linked
  immunosorbent assay) GDF15, ST2, TTR, TIMP-1, MMP'
