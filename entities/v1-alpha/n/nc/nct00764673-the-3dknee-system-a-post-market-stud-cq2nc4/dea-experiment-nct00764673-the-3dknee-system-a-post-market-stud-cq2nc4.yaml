type: Experiment
name: 'NCT00764673 — The 3DKnee™ System: A Post-Market Study'
description: The purpose of this study is to evaluate the survivorship and efficacy
  of the Encore 3DKnee™ system in a group of patients who will receive the 3DKnee™
  as a primary (first) orthopedic implant in the knee. Each knee will be designated
  as a separate subject and followed for a period of 2 years. (NCT NCT00764673; status
  COMPLETED).
