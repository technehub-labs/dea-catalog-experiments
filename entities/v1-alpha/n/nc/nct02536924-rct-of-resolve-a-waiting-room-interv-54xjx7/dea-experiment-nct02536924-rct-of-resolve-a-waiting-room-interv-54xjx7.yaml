id: dea:experiment-nct02536924-rct-of-resolve-a-waiting-room-interv-54xjx7
type: Experiment
name: 'NCT02536924 — RCT of RESOLVE: A Waiting Room Intervention for Crisis Clients'
description: Crisis Teams are now a well established part of the mental health system.
  These teams are effective in providing crisis management, treatment, referral, and
  educational services. We are testing a waiting room intervention for the patients
  attending a Crisis Team. As far as we are aware, no trial of a waiting room intervention
  has been reported in a psychiatric setting. This is a preliminary study using a
  Randomized Control Trial (RCT) Design. Patients (N =40) will be randomly allocated
  to either the treatment or the control group, and will be selected from the local
  Crisis Team. The treatment group will receive a waiting room intervention called,
  RESOLVE (Relaxation, SOLving problem and cognitiVe Errors), that is a short film,
  Plus Treatment As Usual (TAU), and the control group will receive only TAU. Patients
  in both groups will be assessed before and after the intervention, using the HADS
  (Hospital Anxiety And Depression Scale), CORE (Clinical Outcome in Routine Evaluation),
  (to measure psychopathology) and WHODAS (World Health Organization Disability Assessment
  Schedule) (for functioning). We hypothesize that the treatment group will demonstrate
  significant improvement in mental health and functioning, compared to the control
  group. Analyses will be conducted using SPSS v22, and will consist of a t-test or
  Chi Square test to measure the baseline differences, and a linear regression to
  compare the differences between the two groups at the end of the intervention. Results
  will be published in international journals and will be presented in local and international
  conferences. (NCT NCT02536924; status UNKNOWN).
