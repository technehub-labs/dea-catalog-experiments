id: dea:experiment-nct03293108-comparing-efficacy-and-safety-of-ary-27fxyb
type: Experiment
name: NCT03293108 — Comparing Efficacy and Safety of AryoGen Pharmed Biosimilar Denosumab
  60 mg (Arylia) Versus Prolia® in Improvement of Bone Mineral Densitometry (BMD)
  Among Osteoporotic Postmenopausal Wo
description: 'The purpose of this study is to compare the efficacy and safety of Denosumab
  60 mg produced by AryoGen Pharmed and Amgen Denosumab 60 mg among osteoporotic postmenopausal
  women. Postmenopausal women diagnosed with osteoporosis according to their Bone
  mineral density result (BMD), aged between 45 to 75 are included in this trial.
  This is a Phase III, randomized, two armed, double-blind, parallel, active-controlled,non-inferiority
  clinical trial. The eligible patients are randomized in a 1:1 ratio to receive Arylia
  or Prolia® subcutaneous injections, at the beginning of the trial and every 6 months
  at month 6 and 12, in an 18-month study period. Along with, all women will receive
  daily supplements containing at least 1000 mg of elemental calcium (divided into
  two doses) and at least 400 IU vitamin D daily during 18 months of the study. The
  primary objective of this study is to assess non-inferiority of test- Denosumab
  60 mg (Arylia) to the reference Denosumab 60 mg (Prolia®) in terms of efficacy among
  osteoporotic postmenopausal women. The secondary objectives of this study are: To
  further compare efficacy of test- Denosumab 60 mg to reference Denosumab 60 mg;
  To assess the safety of test- Denosumab 60 mg compared to reference Denosumab 60
  mg. (NCT NCT03293108; status UNKNOWN).'
