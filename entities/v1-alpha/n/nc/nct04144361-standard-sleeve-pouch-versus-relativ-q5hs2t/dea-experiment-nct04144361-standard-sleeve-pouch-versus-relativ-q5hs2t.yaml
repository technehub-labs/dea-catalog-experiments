name: NCT04144361 — Standard Sleeve Pouch Versus Relatively Wide Pouch With Plication
description: 'three hundred morbidly obese patients candidate for sleeve gastrectomy
  will divided into equal two groups, group A : will operated by standard sleeve gastrectomy
  on bougie 36 without plication of stable line and group B: will operated by sleeve
  gastrectomy on bougie 42 with plication of stable line. the aim is to test the effect
  of pilcation on the incidence of leaks and bleeding (NCT NCT04144361; status COMPLETED).'
