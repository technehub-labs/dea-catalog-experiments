type: Experiment
name: NCT01585922 — Noninvasive Positive Pressure Ventilation in Moderate Acute Respiratory
  Distress Syndrome
description: In order to identify the effect of noninvasive positive pressure ventilation
  (NPPV) on decreasing inflammatory response, improving the pathophysiological manifestation
  and reducing the morbidity and mortality in the moderate acute respiratory distress
  syndrome (ARDS) patients, the investigators conduct this clinical trial comparing
  NPPV with invasive mechanical ventilation in more than twenty ICUs in China. (NCT
  NCT01585922; status COMPLETED).
