type: Experiment
name: NCT03763890 — Post- End- Expiratory Pressure Affect the Alveolar Heterogeneity
  in Moderate and Sever ARDS Patients
description: This study try to use EIT ( Electronic impedance tomography ) to evaluate
  the alveolar heterogeneity and use trans-pulmonary pressure and stain to evaluate
  the lung injury . The study use these methods to figure out how PEEP impact the
  alveolar heterogeneity and VILI. (NCT NCT03763890; status UNKNOWN).
