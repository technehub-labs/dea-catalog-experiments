type: Experiment
name: NCT05201924 — Bedtime Routines and Children's Health
description: In Taiwan, the prevalence of sleep problems, myopia, and dental caries
  in school-age children is high. Little is known regarding the implementation of
  oral and vision health outcomes around bedtime. A bedtime routine intervention was
  conducted to improve children's oral, vision and sleep health. (NCT NCT05201924;
  status COMPLETED).
