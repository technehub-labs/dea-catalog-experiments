id: dea:experiment-nct06964646-assess-efficacy-safety-and-tolerabil-yeuc72
type: Experiment
name: NCT06964646 — Assess Efficacy, Safety, and Tolerability of 8 Weeks of Vaginal
  Hyaluronic (V-HYAL) Gel in Peri- and Post-Menopausal Female
description: 'The goal of this clinical trial is to assess the efficacy of repeat
  doses of V-HYAL Gel on vaginal dryness in Peri- and Post-Menopausal Female. The
  main questions it aims to answer : * To evaluate the effect of V-HYAL Gel on subjects''
  quality life. * To evaluate the effect of V-HYAL Gel on the vaginal lactobacillus
  flora, vaginal thrush, bacterial vaginosis and trichomonas vaginalis * To evaluate
  the safety and tolerability of repeat doses of V-HYAL Gel. Researchers will compare
  V-Hyal treated arm to see for its efficacy and safety. Participants will have screening
  visit for the evaluation of subject''s eligibility and three study days, Day 0 (Baseline),
  Week 4 (Telephone contact), and Week 8 (End of study visit). Primary criterion:
  Visual Analogic Scale (VAS) of vaginal dryness Secondary criterion: Vaginal microbiota
  and immunology HRQoL(SF 8), DIVA, FSFI questionnaires Patient Global Impression
  of Improvement Vaginal PH VHI scale. (NCT NCT06964646; status COMPLETED).'
