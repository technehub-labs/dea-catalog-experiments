name: NCT03984305 — Utilization of Target Ranges to Treat Parkinson's Disease With
  the PKG
description: The main objective of this study is to evaluate whether people whose
  PD symptoms are uncontrolled who are managed with the aid of objective measurement
  and use of target ranges have improved PD symptoms and outcomes as compared to individuals
  treated using only standard of care (medical history, neurological examination).
  (NCT NCT03984305; status TERMINATED).
