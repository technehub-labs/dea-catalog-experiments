id: dea:experiment-nct05227573-pao2-and-lung-function-after-orthope-hk785g
type: Experiment
name: NCT05227573 — PaO2 and Lung Function After Orthopedic Surgery
description: 'Hypoxia and reduced oxygen partial pressure is commonly occurring after
  abdominal surgery. This study aims to investigate whether similar changes also occur
  after orthopedic surgery in the form of upper limb surgery. Inclusion: 60 patients
  undergoing orthopedic surgery in the form o knee-, hip-, shoulder- or elbow surgery.
  Exclusion: Dementia or cognitive impairment that makes it impossible to participate
  in studies. Arterial blood gas and lung function are undertaken before surgery,
  the day after surgery and at follow-up. (NCT NCT05227573; status UNKNOWN).'
