id: dea:experiment-nct05061823-bintrafusp-alfa-program-rollover-stu-4qr5xx
type: Experiment
name: NCT05061823 — Bintrafusp Alfa Program Rollover Study
description: 'This study is designed to provide continuous access to treatment with
  bintrafusp alfa for eligible participants from ongoing bintrafusp alfa parent studies
  (NCT02517398, NCT02699515, NCT04246489, NCT03840915, NCT03631706, NCT04551950, NCT03833661
  and NCT04066491) and to collect long-term safety and efficacy data. Study Duration:
  All participants in this rollover study will be treated with bintrafusp alfa until
  meeting defined criteria in the protocol for discontinuation, until study intervention
  is commercially accessible and provisioned via marketed product, or until end of
  study. The study also includes a 5 years survival follow-up after last dose of the
  study treatment. Treatment Duration: Treatment under the rollover protocol according
  to the interval and dosing schedule in the parent protocol until discontinuation.
  (NCT NCT05061823; status COMPLETED).'
