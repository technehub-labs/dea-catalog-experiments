name: NCT06875596 — The Effectiveness of an Exercise Program on Scapulohumeral Rhythm,
  Range of Motion, and Stability in Young Female Handball Players
description: This record describes a planned randomized parallel-group trial of a
  modified Watson-based shoulder exercise program in female handball players. An internal
  pilot phase was conducted first to evaluate feasibility and obtain preliminary estimates
  to inform the definitive trial. (NCT NCT06875596; status ACTIVE_NOT_RECRUITING).
