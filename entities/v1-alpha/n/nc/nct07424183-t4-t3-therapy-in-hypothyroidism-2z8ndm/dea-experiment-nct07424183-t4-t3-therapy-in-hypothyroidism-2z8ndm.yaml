id: dea:experiment-nct07424183-t4-t3-therapy-in-hypothyroidism-2z8ndm
type: Experiment
name: NCT07424183 — T4/T3 Therapy in Hypothyroidism
description: This study will test whether 6 months of combination therapy with levothyroxine
  (LT4) plus liothyronine (LT3) is superior to LT4 plus placebo in participants with
  hypothyroidism who have residual symptoms of hypothyroidism with TSH levels within
  the reference range. (NCT NCT07424183; status NOT_YET_RECRUITING).
