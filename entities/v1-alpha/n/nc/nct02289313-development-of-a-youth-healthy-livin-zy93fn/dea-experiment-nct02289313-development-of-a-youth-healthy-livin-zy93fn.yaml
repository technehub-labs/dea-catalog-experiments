id: dea:experiment-nct02289313-development-of-a-youth-healthy-livin-zy93fn
type: Experiment
name: NCT02289313 — Development of a Youth Healthy Living Program With Underserved
  Adolescents at Rochester Alternative Learning Center
description: 'Approximately one third of the children and adolescents in the United
  States are either overweight or obese. Childhood obesity disproportionately affects
  specific racial and ethnic groups and households with low socioeconomic status and
  low parental education. The Alternative Learning Center (ALC) within Rochester School
  District 535 provides viable educational options for students who are experiencing
  difficulty in regular educational systems. A greater proportion of students at ALC
  are minorities, qualify for free and reduced lunch and receive special education
  services. These children are likely to have unique barriers to physical activity
  and healthy eating. Specific Aims: Aim 1: Examine the association between BMI and
  ethnic/ socioeconomic variables and behaviors related to physical activity and eating
  in ALC students. Aim 2: Develop an age and culturally appropriate on-site program
  that promotes healthy lifestyle. (NCT NCT02289313; status COMPLETED).'
