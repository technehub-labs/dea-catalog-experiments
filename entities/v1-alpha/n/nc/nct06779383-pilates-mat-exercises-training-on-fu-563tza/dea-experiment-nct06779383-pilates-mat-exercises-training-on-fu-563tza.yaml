id: dea:experiment-nct06779383-pilates-mat-exercises-training-on-fu-563tza
type: Experiment
name: NCT06779383 — Pilates Mat Exercises Training on Functional Performance in Middle
  Age Obese Women
description: '• Aim of the study: This study will aim to investigate the effects of
  a 12-week Pilates-mat exercise program on the functional performance in middle age
  obese women. Materials and Methods: sixty obese women patients (ages 45-55 years
  old) with a body mass index (BMI) 30 -34.9 kg/m2.Women will be randomly assigned
  into experimental group(Pilates) or control group, (3 times/week, 60 min/session)
  their age from 45 to 55 yrs. The Pilates exercises were performed on mats. The functional
  performance on one-leg stance (OLS), five-times-sit-to-stand (STS) and 6-min walk
  (6 MW) tests was evaluated before and after the 12-week Pilates training or control
  follow-up period. (NCT NCT06779383; status NOT_YET_RECRUITING).'
