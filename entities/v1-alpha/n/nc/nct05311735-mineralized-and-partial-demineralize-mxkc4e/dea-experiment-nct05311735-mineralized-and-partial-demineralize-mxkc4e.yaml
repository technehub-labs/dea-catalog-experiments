id: dea:experiment-nct05311735-mineralized-and-partial-demineralize-mxkc4e
type: Experiment
name: NCT05311735 — Mineralized and Partial Demineralized Dentin Graft Compared to
  FDBA
description: The bone grafting materials currently used in dentistry are autografts,
  allografts, xenografts, and alloplastic grafts. Among these different types of bone
  graft materials, autografts are considered to have the most predictable results
  due to its properties of osteogenesis, osteoinduction and osteoconduction. However,
  bone autografts are rarely used due to the high morbidity associated with harvesting
  the bone graft from the patient with a second surgical site. Because of the increased
  risk to the patient with autogenous bone grafts, the current standard of care is
  an allograft, which is a bone graft harvested from cadaver sources such as Freeze-Dried
  Bone Allograft (FDBA). While allografts can only possess the qualities of osteoinduction
  and osteoconduction, they also have dramatically less morbidity due to the lack
  of a second surgical site. Studies have shown that autogenous dentin grafts promote
  all three ideal mechanisms for bone regeneration. There are two methods to generate
  autogenous dentin grafts. One is to collect the extracted tooth and to send it to
  a tooth bank for the preparation process. The second is to process the extracted
  tooth in a clinical setting chairside, for a graft. A dentin graft can undergo different
  treatments such as demineralization, mineralization, and partial-demineralization.
  Although the autogenous dentin graft has shown positive results for bone regeneration,
  the comparison between partial-demineralized, mineralized autogenous dentin grafts,
  and freeze-dried bone grafts in the clinical setting for immediate grafting has
  not been studied in humans. Thus, there is a need to study the benefits of autogenous
  dentin partial-demineralized and mineralized grafts versus freeze-dried bone allografts
  regarding clinical, radiographically (bone volume and density), and efficacy results.
  This research addresses these areas of need. (NCT NCT05311735; status COMPLETED).
