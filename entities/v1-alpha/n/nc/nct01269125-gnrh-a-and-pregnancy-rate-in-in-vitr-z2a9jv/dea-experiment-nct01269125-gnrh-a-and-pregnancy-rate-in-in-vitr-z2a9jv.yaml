id: dea:experiment-nct01269125-gnrh-a-and-pregnancy-rate-in-in-vitr-z2a9jv
type: Experiment
name: NCT01269125 — GnRH-a and Pregnancy Rate in In Vitro Fertilization (IVF) Cycles.
description: The investigators attempted to establish a rationale for the Gonadotropin
  Releasing Hormone-agonist (GnRH-a) administration, post-laparoscopically, in women
  with mild endometriosis (until stage II, according to AFS) who underwent IVF-ET
  procedure. Since GnRH-a reduces cytokine's concentration in serum (Iwabe et al.,
  1998; Iwabe et al., 2003) and peritoneal fluid of women with endometriosis (Taketani
  et al., 1992) the investigators hypothesized that GnRH-a can reduces also cytokine's
  concentration in the follicular fluid and this action may improve the oocyte quality
  and the fertility of these women. (NCT NCT01269125; status COMPLETED).
