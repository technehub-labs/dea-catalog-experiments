id: dea:experiment-nct01552824-fetal-cystoscopy-versus-vesico-amnio-x97f43
type: Experiment
name: NCT01552824 — Fetal Cystoscopy Versus Vesico-amniotic Shunting in Severe Lower
  Urinary Tract Obstructions
description: 'There are two options of fetal treatment in cases of severe lower urinary
  tract obstructions: the vesico-amniotic shunting and fetal cystoscopy. There is
  no study confirming the effectiveness of these treatment, specially comparing both
  techniques. The present study aims to investigate the effectiveness of these treatments.
  (NCT NCT01552824; status UNKNOWN).'
