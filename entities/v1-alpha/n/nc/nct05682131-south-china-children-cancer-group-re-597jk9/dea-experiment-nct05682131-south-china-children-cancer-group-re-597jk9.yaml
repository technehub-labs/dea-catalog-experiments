id: dea:experiment-nct05682131-south-china-children-cancer-group-re-597jk9
type: Experiment
name: NCT05682131 — South China Children Cancer Group - Relapsed-Acute Lymphoblastic
  Leukemia 2022 Protocol
description: In recent years, the prognosis of pediatric relapsed ALL patients has
  improved, but the 5-year OS of patients with first recurrence is still less than
  50%. A number of in vitro studies have shown that arsenic trioxide (ATO) can selectively
  inhibit the growth and induce apoptosis in a variety of leukemia cell lines, suggesting
  that ATO as a synergist combined with other common chemotherapy drugs may provide
  a new target for the treatment of relapsed ALL. Realgar Indigo naturalis formula
  is a compound traditional Chinese medicine preparation developed in China. The main
  component of realgar is arsenic tetrasulfide (As4S4), which can produce similar
  pharmacological effects to ATO. Based on the R3 protocol, this study plans to perform
  a double-blind randomized controlled trial, and to randomly combine compound Huangdai
  tablets with compound Huangdai tablets in the treatment of intermediate and high
  risk ALL children, in order to improve the MRD negative rate after induction therapy
  in this group of children, which may provide a new method for the clinical treatment
  of relapsed ALL. (NCT NCT05682131; status RECRUITING).
