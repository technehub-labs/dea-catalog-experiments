id: dea:experiment-nct04488510-pathogens-involved-in-secondary-infe-2nq5y9
type: Experiment
name: 'NCT04488510 — Pathogens Involved in Secondary Infections During Severe Forms
  of Covid-19 Pneumonia:'
description: A Respiratory infection with the SARS-CoV2 virus is associated with a
  major risk of viral pneumonia that can lead to respiratory distress requiring resuscitation.
  In the most severe forms, it may require mechanical ventilation or even lead to
  an acute respiratory distress syndrome with a particularly poor prognosis. The SARS-CoV2
  is a single-stranded RNA virus of positive polarity and belongs to the beta genus
  of Coronaviruses. SARS-CoV2 is responsible for the third epidemic in less than twenty
  years secondary to a Coronavirus (SARS-CoV then MERS-CoV) and if the mortality associated
  with it is lower than that of previous strains, notably MERS-CoV, its spread is
  considerably big. As a result, the number of patients developing respiratory distress
  requiring invasive mechanical ventilation is high, with prolonged ventilation duration
  in these situations (NCT NCT04488510; status UNKNOWN).
