description: The BARITONE study's overall aim is to understand how our eating habits
  affect our long-term health. By identifying biological traces in blood, urine and
  other samples - so-called biomarkers - the investigators want to be able to see
  what people actually eat, such as protein from different food sources as well as
  fruit, berries and vegetables. These biomarkers could in the future improve the
  possibilities to find out how dietary habits affect the risk of disease. The investigators
  are targeting healthy people who are interested in participating in research on
  biomarkers of dietary intake. The research is divided into a cross-sectional study,
  where the investigators collect data on the participant's usual dietary intake,
  health and biological samples at the screening visit, and an cross over intervention
  study that involves eating three different diets (meat, fish, vegetarian) for a
  total of 3 weeks with one week wash-out in between. (NCT NCT07128940; status COMPLETED).
