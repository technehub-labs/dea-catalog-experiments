id: dea:experiment-nct01535274-ventilation-strategies-anesthetic-te-4umu2q
type: Experiment
name: NCT01535274 — Ventilation Strategies, Anesthetic Techniques and Cerebral Oxygenation
  in the Beach Chair Position
description: The seated or "beach chair" position during surgery and general anesthesia
  decreases brain oxygen levels and can result in stroke. As such, poor neurological
  outcome following beach chair positioning is a growing concern. In the proposed
  study the investigators test the hypothesis that changes in ventilation strategy
  and anesthetic technique can affect cerebral oxygenation in anesthetized patients
  in the beach chair position. (NCT NCT01535274; status COMPLETED).
