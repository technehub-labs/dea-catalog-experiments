id: dea:experiment-nct06316505-oral-photographs-of-patients-on-oral-d369e2
type: Experiment
name: NCT06316505 — Oral Photographs of Patients on Oral Hygiene Motivation
description: Based on these considerations, this randomized controlled trial aimed
  to determine the effectiveness of a personalized visual oral health education program
  in addition to conventional education on oral hygiene by comparing changes in clinical
  periodontal parameters. Participants will get conventional oral hygiene education
  (COHE) with/without visual motivation using self oral photographs of patients. Researchers
  will compare Intervention group and control groups on oral hygiene by comparing
  changes in clinical periodontal parameters. (NCT NCT06316505; status COMPLETED).
