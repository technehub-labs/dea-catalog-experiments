id: dea:experiment-nct06717061-composed-abdominal-wall-analysis-col-x29457
type: Experiment
name: NCT06717061 — Composed Abdominal Wall Analysis. Collecting Tissue and Blood
  From Patients Undergoing Elective Laparosopic Cholecystectomy. Objective to Describe
  the Normal Abdominal Wall
description: People who will be eligible to be asked about participation in the research
  project are individuals who seek planned care for surgery on their gallbladder due
  to gallstone disease. The group of patients is chosen as they can represent a normal
  material that enables comparison with hernia-specific disease in the abdominal wall.
  Basic data such as height, weight, sex, age, medication and ASA class will be collected
  in the form of a study form and stored in a database in a pseudonymised form. During
  the sampling of biological material, the test subjects will be under general anesthesia,
  which is why the sampling will not mean increased pain or discomfort other than
  what is standard after a gallbladder operation with the minimally invasive technique.
  No additional wound area will be added to the test subjects as the sample pieces
  are taken from the area at the umbilicus where one operates by default. The sampling
  is not planned to be repeated, but is performed at the time when the patients perform
  their cholecystectomy. During the sampling, centimeter-sized pieces of skin, fatty
  tissue, connective tissue and muscle are taken. Furthermore, serum and plasma will
  be collected. Two tubes of blood samples (10 ml total) are taken, centrifuged and
  pipetted before being frozen for later analysis. Pieces of tissue are placed in
  formalin before transport to the laboratory. The study form regarding the patient\&#39;s
  basic state of health will be filled in by the operator on the day of surgery and
  will be stored pseudonymized when the research subject is assigned a study number.
  Patients who are troubled by gallstone disease and are referred for minimally invasive
  surgery of the gallbladder at the surgical center Västerbotten in Skellefteå will
  receive oral and written information and will be asked to participate in the study.
  Approximately 200 cholecystectomies are performed annually at Skellefteå hospital.
