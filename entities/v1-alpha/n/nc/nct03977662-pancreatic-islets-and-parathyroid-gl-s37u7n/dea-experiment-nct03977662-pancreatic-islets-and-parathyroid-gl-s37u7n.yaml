id: dea:experiment-nct03977662-pancreatic-islets-and-parathyroid-gl-s37u7n
type: Experiment
name: NCT03977662 — Pancreatic Islets and Parathyroid Gland Co-transplantation for
  Treatment of Type 1 Diabetes
description: The primary objective is to test the hypothesis that co-transplantation
  of allogeneic PTG with adult pancreatic islets (derived from same deceased donor)
  in the IM site in people with Type 1 diabetes with functioning kidney and/or liver
  transplants is safe, allows islet engraftment, and leads to insulin independence.
  (NCT NCT03977662; status COMPLETED).
