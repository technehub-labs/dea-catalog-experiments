id: dea:experiment-nct03213522-comparison-of-craniosacral-therapy-v-ese95e
type: Experiment
name: NCT03213522 — Comparison of Craniosacral Therapy vs Pelvic Floor Physical Therapy
description: The purpose of this study is to determine the efficacy of CST for the
  treatment of LUTS in patients with MS and evaluate the acute effects compared to
  PFPT. A. Objectives To examine the effect of CST as compared to PFPT on QOL, SEMG
  resting biofeedback readings, and PVR ultrasonography measures in patients with
  MS and LUTS. B. Hypotheses / Research Question(s) It is hypothesized that patients
  who receive CST will demonstrate improved QOL, bladder control and ability to empty
  bladder as compared to those who receive PFPT. (NCT NCT03213522; status UNKNOWN).
