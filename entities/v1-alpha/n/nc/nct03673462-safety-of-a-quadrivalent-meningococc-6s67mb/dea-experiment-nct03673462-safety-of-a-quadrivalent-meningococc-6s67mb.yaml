  Concomitantly With Routine Pediatric Vaccines in Healthy Infants and Toddlers
description: The primary objective of this study was to describe the safety profile
  of Meningococcal Polysaccharide (Serogroups A, C, Y, and W) Tetanus Toxoid (MenACYW)
  Conjugate Vaccine and Meningococcal (Groups A, C, Y and W 135) Oligosaccharide Diphtheria
  CRM197 (MENVEO®) Conjugate Vaccine when administered concomitantly with routine
  pediatric vaccines in healthy infants and toddlers. (NCT NCT03673462; status COMPLETED).
