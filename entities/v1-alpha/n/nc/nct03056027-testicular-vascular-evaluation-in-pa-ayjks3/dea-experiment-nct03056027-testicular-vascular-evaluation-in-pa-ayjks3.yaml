id: dea:experiment-nct03056027-testicular-vascular-evaluation-in-pa-ayjks3
type: Experiment
name: NCT03056027 — Testicular Vascular Evaluation in Patients Undergoing Inguinal
  Hernia Repair
description: Patients scheduled to undergo laparoscopic preperitoneal or open inguinal
  hernia repair will be evaluated by means of scrotal/testicular ecocolordoppler ultrasound
  investigation before and after surgery in order to rule out the potential impact
  of the surgical procedure on testicular arterial and venous blood flow (NCT NCT03056027;
  status UNKNOWN).
