type: Experiment
name: NCT04672954 — A Study in Healthy Men to Test How Different Doses of BI 474121
  Are Taken up and How They Influence the Amount of a Molecular Messenger (cGMP) in
  the Spinal Fluid
description: 'The main objectives of this trial are: * To evaluate the effect of BI
  474121 on cyclic guanosine monophosphate (cGMP) levels in cerebrospinal fluid (CSF)
  * To assess the exposure of BI 474121 in CSF relative to plasma * To determine the
  exposure effect relationship in CSF with different oral doses of BI 474121 (NCT
  NCT04672954; status COMPLETED).'
