id: dea:experiment-nct05787860-ruxolitinib-in-seborrheic-dermatitis-pkree5
type: Experiment
name: NCT05787860 — Ruxolitinib in Seborrheic Dermatitis
description: This study is an open-label prospective interventional trial that will
  assess the efficacy of ruxolitinib in the treatment of seborrheic dermatitis. It
  will also attempt to characterize the molecular immune profiles of patients with
  SD at week 0 and week 4, with comparison to baseline profiles in healthy control
  subjects. (NCT NCT05787860; status COMPLETED).
