type: Experiment
name: NCT04219761 — National Tunisian Registry of Percutaneous Coronary Intervention
description: The National Tunisian Registry of Percutaneous Coronary Intervention
  is an observational, prospective and multicenter study aiming to assess coronary
  intervention strategies in tunisian departments of cardiology. Cardiologists from
  both sectors (public and private) are participating in the study, with 37 investigational
  centers. Data will be captured electronically by DACIMA Clinical Suite, according
  to FDA 21 CFR part 11 (Food and Drug Administration 21 Code of Federal Regulations
  part 11), HIPAA (Health Insurance Portability and Accountability Act) \& ICH (International
  Conference on Harmonisation) requirements. (NCT NCT04219761; status COMPLETED).
