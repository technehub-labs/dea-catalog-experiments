id: dea:experiment-nct07754773-motus-nova-foot-device-for-patients-ee7f3d
type: Experiment
name: NCT07754773 — Motus Nova Foot Device for Patients With Hemiplegia
description: Individuals with hemiplegia commonly demonstrate gait deviations such
  as difficulties with heel strike at initial contact, foot drop in swing, asymmetrical
  limb loading, muscle activation, and balance impairments. This study evaluates whether
  a therapeutic device (Motus Nova Foot; FDA approved) used in the home setting can
  increase heel strike, decrease limp, improve foot clearance in swing phase, improve
  quality of active muscle contraction of the affected limb, and improve balance.
  The Motus Nova Foot moves the ankle/foot and uses guided computer/video activities
  to encourage active participation while automatically recording device use and duration.
  (NCT NCT07754773; status NOT_YET_RECRUITING).
