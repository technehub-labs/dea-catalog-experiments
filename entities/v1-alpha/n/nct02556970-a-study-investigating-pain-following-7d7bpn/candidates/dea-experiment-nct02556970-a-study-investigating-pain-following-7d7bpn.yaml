id: dea:experiment-nct02556970-a-study-investigating-pain-following-7d7bpn
type: Experiment
name: NCT02556970 — A Study Investigating Pain Following Single-port or Multi-port
  Video Assisted Thoracoscopic Surgery
description: This study seeks to establish if thoracoscopic surgery performed through
  a single port or incision reduces early post-operative pain compared with conventional
  multiple port thoracoscopic surgery. This initial pilot study is designed to establish
  whether a trial of the two techniques is acceptable to patients, clinically feasible
  and can be delivered in a reasonable timescale. (NCT NCT02556970; status WITHDRAWN).
