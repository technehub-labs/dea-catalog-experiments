type: Experiment
name: NCT04315805 — Integrative Yoga Therapy for Patients With Chronic Pain and Psychological
  Distress
description: This study will be a randomized wait list controlled trial studying the
  efficacy of an Integrative Yoga Therapy for patients with chronic pain and psychological
  distress. Individualised yoga program will consist of a 8-week guided self-help
  program. This study will primarily investigate whether an individually tailored
  yoga can be beneficial for patients suffering from chronic pain reducing pain, anxiety
  depression, while improving overall quality of life. (NCT NCT04315805; status UNKNOWN).
