id: dea:experiment-nct02179073-health-related-quality-of-life-of-pa-pxpw5c
type: Experiment
name: NCT02179073 — Health-related Quality of Life of Patients With Neurogenic Bladder
description: Bladder management has a major impact on the quality of life in patients
  with neurogenic bladder dysfunction. This a prospective investigation of the effects
  of the method for bladder evacuation on the health-related quality of life in patients
  with neurogenic bladder dysfunction. The changes in health-related quality of life
  over time (longitudinal investigation) and the differences between the different
  methods for bladder evacuation will be investigated. Patients will be given a standardized
  and validated questionnaire annually for 10 years. (NCT NCT02179073; status COMPLETED).
