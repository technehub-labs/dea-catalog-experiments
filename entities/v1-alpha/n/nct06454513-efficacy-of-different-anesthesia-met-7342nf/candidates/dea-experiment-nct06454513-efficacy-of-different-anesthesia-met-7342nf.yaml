id: dea:experiment-nct06454513-efficacy-of-different-anesthesia-met-7342nf
type: Experiment
name: NCT06454513 — Efficacy of Different Anesthesia Methods in Transbronchial Biopsy
description: This study investigates the efficacy of different anesthesia methods
  (general anesthesia with laryngeal mask airway and local nebulized anesthesia) for
  transbronchial biopsy using an electronic bronchoscope. The study retrospectively
  analyzed cases of transbronchial biopsy performed at the Respiratory Endoscopy Center
  of Sichuan Provincial People's Hospital from June 5, 2020, to June 5, 2024. Data
  collected included age, gender, primary diagnosis, anesthesia method, biopsy method,
  operation time (excluding general anesthesia and laryngeal mask airway placement
  time), lesion location and size, pathological results, and follow-up status. (NCT
  NCT06454513; status COMPLETED).
