type: Experiment
name: NCT03600922 — Clinical Study of Patellar Resurfacing and Non-resurfacing in
  Total Knee Arthroplasty
description: The literature regarding resurfacing of the patella in total knee arthroplasty
  has conflicting conclusions. This study assesses medium-term clinical results of
  total knee arthroplasties performed with and without the patellar resurfacing in
  patients undergoing single-staged bilateral total knee arthroplasty in a randomized
  controlled, clinical study at a minimum of 5 years follow-up. (NCT NCT03600922;
  status COMPLETED).
