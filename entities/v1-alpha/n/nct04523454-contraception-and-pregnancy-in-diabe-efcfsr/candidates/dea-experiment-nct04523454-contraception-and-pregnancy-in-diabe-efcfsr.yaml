id: dea:experiment-nct04523454-contraception-and-pregnancy-in-diabe-efcfsr
type: Experiment
name: NCT04523454 — Contraception and Pregnancy in Diabetes Mellitus
description: This study seeks to expand upon and update this body of work. It will
  explore the knowledge and understanding women with diabetes have around pregnancy
  and conception, as well as establish how well prepared these women are for a pregnancy.
  Using this data, we will develop better services to inform women with diabetes about
  the contraception and pregnancy, as well inform the development of pre-conception
  counselling services for women with diabetes. If successful, we would anticipate
  seeing an improvement in performance in future National Diabetes in Pregnancy audits.
  (NCT NCT04523454; status COMPLETED).
