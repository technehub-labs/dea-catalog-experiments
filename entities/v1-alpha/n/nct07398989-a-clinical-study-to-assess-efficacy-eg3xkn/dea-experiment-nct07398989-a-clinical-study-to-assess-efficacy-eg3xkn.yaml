type: Experiment
name: NCT07398989 — A Clinical Study to Assess Efficacy and Tolerability of a Topical
  Skincare Product on Adults With Mature, Crepey Skin
description: Subjects having mild-to-moderate crepiness, photodamage, and loss of
  firmness will apply a topical skincare regimen to the knees, thighs, hands, and
  all over the body. Evaluations of the regimen's efficacy will be conducted at 4
  weeks, 8 weeks, and 12 weeks post-baseline. (NCT NCT07398989; status COMPLETED).
