type: Experiment
name: NCT03428373 — Rivaroxaban or Aspirin As Thromboprophylaxis in Multiple Myeloma
description: The intended study is designed as a a phase IV pragmatic multicenter
  randomized controlled clinical trial, comparing the impact of two different therapies
  including ASA vs. Rivaroxaban in newly diagnosed or relapsed and refractory multiple
  myeloma patients treated with Lenalidomide Dexamethasone (Len-Dex) combination therapy.
  The pilot feasibility study was conducted in preparation for this randomized controlled
  trial designed to assess the effect of an intervention. (NCT NCT03428373; status
  UNKNOWN).
