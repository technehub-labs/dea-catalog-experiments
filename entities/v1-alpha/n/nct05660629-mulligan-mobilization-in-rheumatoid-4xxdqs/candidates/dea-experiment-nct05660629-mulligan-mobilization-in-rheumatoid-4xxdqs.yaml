type: Experiment
name: NCT05660629 — Mulligan Mobilization in Rheumatoid Hand
description: 'The goal of this randomized-controlled study is to learn about the effectiveness
  of the Mulligan mobilization in rheumatoid hands. The main question it aims to answer
  are: -Does mulligan mobilization reduce effusion in wrist joints with rheumatoid
  arthritis? Participants will take Mulligan mobilization application and active ROM
  exercises for their hands. Researcher will compare treatments group ith sham mobilization.
  (NCT NCT05660629; status COMPLETED).'
