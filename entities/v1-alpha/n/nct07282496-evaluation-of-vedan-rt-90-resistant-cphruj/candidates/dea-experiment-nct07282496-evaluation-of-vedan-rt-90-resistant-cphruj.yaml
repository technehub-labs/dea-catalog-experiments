type: Experiment
name: NCT07282496 — Evaluation of VEDAN RT-90 Resistant Cassava Starch for Glycemic
  Control and Prebiotic Fiber Development in a Human Trial
description: This study aims to investigate the effects of RT-90 resistant cassava
  starch on glycemic control using a human dietary trial and to evaluate its potential
  as a prebiotic fiber supplement. This study will assess the efficacy of RT-90 resistant
  cassava starch in improving glycemic control, body composition, and gut microbiome
  in healthy individuals. (NCT NCT07282496; status NOT_YET_RECRUITING).
