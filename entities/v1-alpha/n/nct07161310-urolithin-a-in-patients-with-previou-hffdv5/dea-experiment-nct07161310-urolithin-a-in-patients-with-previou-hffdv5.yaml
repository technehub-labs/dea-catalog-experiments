id: dea:experiment-nct07161310-urolithin-a-in-patients-with-previou-hffdv5
type: Experiment
name: NCT07161310 — Urolithin A in Patients With Previously Untreated Solid Tumors
  Receiving Immune Checkpoint Inhibitors
description: The aim of this clinical study is to learn more about the effects of
  urolithin A (MitoPure®) on the immune system of cancer patients receiving immune
  checkpoint inhibitor-based therapies. Any effects will be compared with patients
  who take a placebo instead of urolithin A (MitoPure®). (NCT NCT07161310; status
  RECRUITING).
