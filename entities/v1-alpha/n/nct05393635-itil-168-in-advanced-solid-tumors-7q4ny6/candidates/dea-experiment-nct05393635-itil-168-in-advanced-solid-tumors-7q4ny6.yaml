type: Experiment
name: NCT05393635 — ITIL-168 in Advanced Solid Tumors
description: DELTA-2 is a phase 1 clinical trial to evaluate the safety, feasibility,
  and preliminary efficacy of ITIL-168 with pembrolizumab in participants with advanced
  cancer whose disease has progressed after standard therapy. ITIL-168 is a cell therapy
  derived from a patient's own tumor-infiltrating immune cells (lymphocytes; TILs).
  (NCT NCT05393635; status WITHDRAWN).
