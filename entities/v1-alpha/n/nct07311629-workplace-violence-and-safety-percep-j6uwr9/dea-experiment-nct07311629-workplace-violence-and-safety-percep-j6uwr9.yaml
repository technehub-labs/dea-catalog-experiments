id: dea:experiment-nct07311629-workplace-violence-and-safety-percep-j6uwr9
type: Experiment
name: NCT07311629 — Workplace Violence and Safety Perception Among ENT Physicians
  in Turkey
description: This multicenter, cross-sectional survey study aims to evaluate the perceived
  level of safety and security against workplace violence among otolaryngology-head
  and neck surgery (ENT-HNS) physicians in Turkey. The study investigates the association
  between exposure to workplace violence and perceived safety, as well as the adequacy
  of institutional support mechanisms. Data will be collected through an anonymous
  online questionnaire distributed nationwide. The findings are expected to contribute
  to awareness and the development of preventive strategies and institutional safety
  policies for healthcare professionals. (NCT NCT07311629; status NOT_YET_RECRUITING).
