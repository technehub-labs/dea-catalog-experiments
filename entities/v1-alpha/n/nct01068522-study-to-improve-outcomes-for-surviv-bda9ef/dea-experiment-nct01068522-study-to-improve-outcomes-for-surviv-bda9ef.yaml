type: Experiment
name: NCT01068522 — Study to Improve Outcomes for Survivors of Traumatic Brain Injury
  in Latin America
description: People who survive severe traumatic brain injury (TBI) live with profound
  cognitive impairments that alter their developmental course and define their future
  possibilities. Worldwide, TBI is the leading cause of death and disability among
  children and adolescents (Murgio, 2000). In the United States, the annual incidence
  of TBI is six times greater than that of multiple sclerosis, HIV/AIDS, spinal cord
  injury, and breast cancer combined \[Centers for Disease Control, American Cancer
  Society, National Multiple Sclerosis Society\]. The burden of TBI may be even greater
  in developing countries, due to civil unrest and war, and to the absence of mandated
  prevention such as seat belt laws. The long-term objective of the investigators'
  research group is to improve outcomes for survivors of TBI in Latin America. To
  that end, the investigators have created a structure for professionals and institutions
  involved in the treatment of TBI to generate research; to facilitate education,
  standardization, certification, the dissemination of information and resources;
  and to foster the development of evidence-based guidelines. The structure is the
  Latin American Brain Injury Consortium (LABIC). (NCT NCT01068522; status UNKNOWN).
