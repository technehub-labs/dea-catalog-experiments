name: NCT00301522 — Randomized Trial Evaluating Slow-Release Formulation TAXUS Paclitaxel-Eluting
  Coronary Stents to Treat De Novo Coronary Lesions
description: The primary objective of this study is to further evaluate the safety
  and effectiveness of the TAXUS Express2 Paclitaxel-Eluting Coronary Stent System
  in long lesion lengths, small and large vessel diameters and with multiple overlapping
  stents in the treatment of de novo coronary artery lesions (NCT NCT00301522; status
  COMPLETED).
