id: dea:experiment-nct07288060-the-effect-of-mulligan-and-gmi-on-di-hedy3w
type: Experiment
name: NCT07288060 — The Effect of Mulligan and GMI on Distal Radius Proprioception
description: 'Distal radius fractures are common in the elderly population and clinical
  findings after treatment include limitation of joint motion, pain, and muscle weakness.
  Physical therapy modalities include exercises, physical agents, and manual therapy
  techniques. The Mulligan Concept-specific mobilization with movement (MWM) technique
  improves joint movement by reducing pain and is effective in musculoskeletal disorders.
  Graded motor imagery activates the motor system, increases neuroplasticity, and
  promotes functional recovery. It has been observed that proprioception is impaired
  after distal radius fracture, affecting muscle tone and postural reflexes. Our study
  will examine proprioception measurements with an electrogonometer (K Force Sens)
  and universal goniometer and the effectiveness of MWM and progressive motor imagery
  treatments. The study is designed as a one-blind randomized study and a total of
  33 patients between the ages of 25-65 who were treated with volar plate screws after
  distal radius fracture will be included. Patients will be randomized as 11 people
  and one group will be treated with Mulligan Mobilisation in addition to conventional
  physiotherapy and the other group will be treated with Graded motor imagery techniques
  in addition to conventional physiotherapy. The control group will receive only conventional
  physiotherapy. Clinical Follow-up Form, Proprioception, Kinesiophobia, Hand Grip
  strength, Muscle strength, Pain, and functional evaluations will be performed 2
  times in total, just before the patient starts physical therapy after surgery and
  at the end of the 6-week treatment. A goniometer and electrogoniometer will be used
  to measure proprioception. Visual Analogue Scale (VAS) and algometer will be used
  to determine the pain assessment. Jamar''s hand grip strength meter and Digital
  Handheld Dynamometer will be used for muscle strength assessment. Tampa Kinesiophobia
  Scale will be used to measure the level of kinesiophobia. Patient Rated Wrist/Hand '
