id: dea:experiment-nct04801394-retrospective-analysis-on-large-inci-j58j45
type: Experiment
name: NCT04801394 — Retrospective Analysis on Large Incisional Hernia in High Risk
  Patients
description: Large incisional hernia (LIH) is a challenging condition where the abdominal
  wall is hopelessly compromised. Nowadays the best treatment option in this particularly
  frail subset of patients is a major issue. The Auhtors proposed the clinical experience
  with an innovative approach with the composite Free Lateral Polypropylene prosthesis
  (FLaPp®) mesh fashioned as "neoperitoneum" analyzing its feasibility and short/medium
  term results. (NCT NCT04801394; status COMPLETED).
