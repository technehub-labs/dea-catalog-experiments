id: dea:experiment-nct05405959-kinesio-tape-application-with-edf-te-47kwbx
type: Experiment
name: NCT05405959 — Kinesio Tape Application With EDF Technique on Active Trigger
  Points of Upper Trapezius Muscle
description: In this double-blinded, prospective randomized sham controlled multi
  centered study, the aim was to investigate the efficacy of EDF technique on pain
  intensity, number of active TrPs, cervical ROM and disability levels in patients
  with MPS on upper trapezius (UT) muscle.180 patients were randomly allocated to
  kinesio taping (KT) group or sham group. Applications were done two times 1 week
  apart. VAS-pain scores, disability scores , cervical ROM angles and number of trigger
  points were evaluated as outcome parameters. Vas-pain scores and number of trigger
  points were assessed at baseline, after 1 week and after 2 weeks (at the end of
  the study). Cervical ROM angles and disability (measured by Neck Pain Disability
  Scale) were assessed at baseline and at the end of the study. Both groups received
  home exercise program. As a result application of KT with EDF technique to the UT
  muscle provided a significant improvement in pain level, disability, number of active
  TrPs and cervical ROM angles and found superior to sham application. (NCT NCT05405959;
  status COMPLETED).
