id: dea:experiment-nct05916586-effect-of-short-term-prednisone-ther-3utzae
type: Experiment
name: NCT05916586 — Effect of Short-term Prednisone Therapy on C-reactive Protein
  in Patients With Acute Heart Failure
description: This is a multicenter, parallel-group, randomized, open-label, controlled
  trial. Patients with a diagnosis of acute heart failure (AHF) in the emergency department
  (ED) or after emergency presentation to hospital will be screened and informed of
  the study. After signed consent, patients will be randomized into the control group
  (usual AHF treatment) or intervention group (usual AHF treatment + prednisone).
  Prednisone will be given for 7 days. Patients will be assessed at days 2, 4 or at
  discharge if earlier, and at day 7 at hospital visit. If the patient has been discharged
  before day 7, a follow-up visit will be scheduled at day 7 for endpoints assessment
  followed by a scheduled hospital visit at day 31 and a telephone follow-up at day
  91. Study drug will be dispensed for the patient to take home until day 7. (NCT
  NCT05916586; status COMPLETED).
