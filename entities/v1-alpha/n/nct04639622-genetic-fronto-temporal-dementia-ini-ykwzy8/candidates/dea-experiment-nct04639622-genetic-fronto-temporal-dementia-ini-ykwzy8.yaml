id: dea:experiment-nct04639622-genetic-fronto-temporal-dementia-ini-ykwzy8
type: Experiment
name: NCT04639622 — GENetic Fronto Temporal Dementia Initiative in Lille
description: GENFI Lille is a French cohort that belongs to the international initiative
  GENFI2, a five year longitudinal biomarker cohort study of genetic FTD and its associated
  disorders (including MND/ALS) investigating members of families with a known mutation
  in GRN or MAPT or an expansion in C9orf72 (including those affected with the disorder
  as well as at-risk members of families). (NCT NCT04639622; status RECRUITING).
