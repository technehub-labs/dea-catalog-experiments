id: dea:experiment-nct04013308-iontophoresis-with-potassium-iodide-hc9psq
type: Experiment
name: NCT04013308 — Iontophoresis With Potassium Iodide and Thyroid Function
description: 'The aim of the study: To assess the influence of iontophoresis treatment
  with 2% potassium iodide on the level of thyroid hormones (TSH, FT3, FT4) The study
  group: conducting 10 iontophoresis treatments with Potassium iodide; The control
  group: conducting 10 placebo treatments with iontophoresis with destilled water;
  Intervention: 10 iontophoresis treatments with 2% potassium iodide in healthy individuals.
  Test the level of thyroid hormones before and after the 10 iontophoresis treatments;
  The study allows to assess the influence of iodine on the function of thuroid gland.
  (NCT NCT04013308; status COMPLETED).'
