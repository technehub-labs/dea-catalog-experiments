id: dea:experiment-nct04551976-habits-of-gamers-study-mdgx6m
type: Experiment
name: NCT04551976 — Habits of Gamers Study
description: 'Rationale: Mindfulness is a popular therapeutic strategy that has a
  growing body of evidence suggesting it can improve a wide range of physical and
  psychological symptoms. Yet, confusion exists as to why mindfulness is effective
  as well as the most effective ways in which to teach and practice mindfulness. The
  present study will test a mindfulness training protocol to better understand the
  most effective ways to teach and practice mindfulness. Intervention: A group of
  video game players, or "gamers", will be instructed on how to play a video game
  of their choice in a more mindful way and compare this to an activity of daily functioning
  (i.e., folding laundry). Outcomes from self-report measures taken both before and
  after study activities will be tested against a control group of gamers who will
  perform the same study activities without the mindfulness induction. Objective or
  Purpose: The purpose of the present study is to test the effects of a brief, standardized
  mindfulness prompt in order to better understand effective ways to train mindfulness
  concepts. The mindfulness prompt will be applied to an intrinsically motivated activity
  (i.e., video game play for experienced gamers) and an activity of daily functioning
  (i.e., laundry folding) in order to evaluate the different effects of mindfulness
  practice when implemented with a popular leisure activity versus a less engaging
  activity of daily living. Study Population: This study will include adult "gamers"
  ages 18-65. A gamer is someone who engages in some form of digital video game play
  for a minimal average of three hours per week. A pre-screening measuring will rule
  out any participants who do not play video games with enough frequency to be considered
  a gamer. Study sessions will take place remotely overseen via a Zoom-based video
  call with study personnel. Another exclusion criteria will be an inability to speak
  with study personnel via Zoom or do not have a private area to perform the study
  activities. Study '
