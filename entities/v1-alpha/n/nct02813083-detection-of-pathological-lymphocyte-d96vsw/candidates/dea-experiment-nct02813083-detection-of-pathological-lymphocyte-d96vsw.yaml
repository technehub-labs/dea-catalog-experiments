name: NCT02813083 — Detection of Pathological Lymphocytes in Patients With Autoimmune
  Disease
description: This study will help the investigators design a method to detect the
  disease-causing immune cells in patients with rheumatoid arthritis (RA). Such methods
  are not currently available, but if successful, would help scientists to better
  understand the causes of RA. (NCT NCT02813083; status COMPLETED).
