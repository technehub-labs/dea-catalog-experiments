id: dea:experiment-nct07280962-packing-versus-no-packing-in-periana-by6yeu
type: Experiment
name: NCT07280962 — Packing Versus no Packing in Perianal Abscess
description: Perianal abscess is a common surgical emergency that causes significant
  pain and discomfort. The standard treatment involves incision and drainage (I\&D)
  of the abscess cavity, traditionally followed by packing to prevent re-accumulation
  of pus and to promote healing. However, packing is often painful, requires frequent
  dressing changes, and increases patient discomfort as well as healthcare costs.
  Recent studies suggest that leaving the cavity unpacked may result in similar healing
  outcomes while reducing postoperative pain and shortening the length of hospital
  stay. This randomized controlled trial aims to compare the outcomes of packing versus
  no packing of the perianal abscess cavity following I\&D. The study will evaluate
  postoperative pain using the Visual Analogue Scale at 6, 12, and 24 hours, duration
  of hospital stay, and the recurrence rate within one month. The findings of this
  research are expected to guide evidence-based clinical practice by improving patient
  comfort, reducing hospital burden, and optimizing postoperative care protocols.
  (NCT NCT07280962; status COMPLETED).
