id: dea:experiment-nct02770586-comparison-of-positron-emission-mamm-2tje4u
type: Experiment
name: NCT02770586 — Comparison of Positron Emission Mammography and Contrast-enhanced
  Breast MRI
description: The hypothesis of this study is that positron emission mammography will
  provide comparable sensitivity to contrast-enhanced breast MRI in women with a high
  suspicion of breast cancer. The aim of this study is to determine the sensitivity
  of Positron Emission Mammography (PEM) relative to that of Contrast-enhanced breast
  MRI (CE-MRI) in women with a high suspicion of breast cancer (NCT NCT02770586; status
  COMPLETED).
