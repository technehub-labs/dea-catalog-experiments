id: dea:experiment-nct06547762-hybrid-approach-to-pediatric-rehabil-c4g672
type: Experiment
name: NCT06547762 — Hybrid Approach to Pediatric Rehabilitation
description: 'Children and youth recovering from acquired injuries typically receive
  therapy via in-patient or outpatient rehabilitation (OPR). Families from peripheral
  areas often face significant time and financial burdens to access treatment. Over
  the past decade, evidence supporting the effectiveness of remote (online) rehabilitation
  has increased. Objectives: 1. Identify facilitators and barriers to hybrid service
  adoption. 2. Develop a hybrid telerehabilitation program for youth that is at least
  equivalent (non-inferior) to conventional, in-person therapy. 3. Compare hybrid
  rehabilitation to in-person rehabilitation at two centers in Israel in terms of:
  Adherence to therapy, Therapeutic alliance, Perceived quality of care (families
  and therapists), Functional effectiveness (measured by pre-post change in the Pediatric
  Evaluation of Disability Inventory, PEDI), Cost-effectiveness (including training
  requirements, physical space requirements, and costs); 4. Provide best practice
  recommendations for hybrid rehabilitation in children. Research Methods: Focus Groups:
  Experts will develop a two-month hybrid program for approximately 200 children in
  OPR, commencing one month after in-person rehabilitation. Evaluation Metrics: Therapy
  adherence, therapeutic alliance, and perceived quality of care will be assessed
  monthly and compared to in-person treatment. Insights will inform best practice
  guidelines for hybrid telerehabilitation. Data Collection: Thematic Analysis: Analyzing
  focus group information. Comparative Metrics: Comparing measures of adherence, therapeutic
  alliance, and perceived quality of care between hybrid and in-person programs. Difference-in-Difference
  Approach: Assessing functional differences between in-person and remote therapy.
  Cost Analysis: Estimating direct and indirect costs per child for in-person versus
  remote rehabilitation. (NCT NCT06547762; status UNKNOWN).'
