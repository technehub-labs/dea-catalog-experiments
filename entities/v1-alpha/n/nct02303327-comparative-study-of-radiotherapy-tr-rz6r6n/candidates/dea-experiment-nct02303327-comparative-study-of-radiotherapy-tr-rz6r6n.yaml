id: dea:experiment-nct02303327-comparative-study-of-radiotherapy-tr-rz6r6n
type: Experiment
name: NCT02303327 — Comparative Study of Radiotherapy Treatments to Treat High Risk
  Prostate Cancer Patients
description: In North America, the number of new cases of prostate cancer increases
  every year. Many efforts have been made to develop more efficient and safer curative
  treatments for high risk prostate cancer patients. This phase III clinical trial
  is designed to compare the safety of a standard pelvic external beam radiation therapy
  (EBRT) combined with a high dose rate brachytherapy (HDRB) boost (direct insertion
  of radiation source over a period of minutes via flexible needles temporarily inserted
  in the prostate) to a shorter course of hypofractionated dose escalation radiotherapy
  (larger radiation dose per daily treatment) in patients with high risk prostate
  cancer. The investigators plan to recruit 296 patients across Quebec who will be
  randomized in either treatment plan. (NCT NCT02303327; status ACTIVE_NOT_RECRUITING).
