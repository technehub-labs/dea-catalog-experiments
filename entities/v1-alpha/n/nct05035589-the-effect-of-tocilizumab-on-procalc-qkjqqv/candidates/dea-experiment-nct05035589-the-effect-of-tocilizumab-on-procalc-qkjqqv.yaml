type: Experiment
name: NCT05035589 — The Effect of Tocilizumab on Procalcitonin and Other Biochemical
  and Clinical Markers in the Setting of COVID-19 Pneumonia
description: This study aims to establish whether tocilizumab has any significant
  effect on procalcitonin levels on patients diagnosed with COVID-19 pneumonia requiring
  intensive care admission. The effects on other biochemical and clinical markers
  are also considered. (NCT NCT05035589; status COMPLETED).
