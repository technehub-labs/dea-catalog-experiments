id: dea:experiment-nct02793986-dexmedetomidine-vs-propofol-sedation-xttj8x
type: Experiment
name: NCT02793986 — Dexmedetomidine vs Propofol Sedation Reduces Postoperative Delirium
  in Patients Receiving Hip Arthroplasty.
description: With blocks of lumbar and lumbar plexus, we can reduce the intravenous
  anesthetics usage. To offer an satisfied surgery process for patients, a proper
  sedation is necessary. So in this study, we want to investigate the influence of
  two different sedative drugs on outcomes of patients received hip replacement surgery
  . (NCT NCT02793986; status COMPLETED).
