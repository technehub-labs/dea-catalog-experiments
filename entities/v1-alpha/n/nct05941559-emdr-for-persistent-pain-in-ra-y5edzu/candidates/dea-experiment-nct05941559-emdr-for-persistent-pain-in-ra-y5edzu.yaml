id: dea:experiment-nct05941559-emdr-for-persistent-pain-in-ra-y5edzu
type: Experiment
name: NCT05941559 — EMDR for Persistent Pain in RA
description: 'Rationale: Around 20% of rheumatoid arthritis (RA) patients have persistent
  pain, despite having well-controlled disease activity. There is a significant overlap
  in underlying mechanisms between post-traumatic stress disorder (PTSD) and persistent
  pain. Eye Movement Desensitization and Reprocessing (EMDR) is a proven effective
  treatment for PTSD and evidence is growing that it may also be effective for persistent
  pain. Objective: To assess the feasibility and estimate the effectiveness of EMDR
  in RA patients with persistent pain despite inflammation being under control. Study
  design: A multiple-baseline single-case experimental design (SCED) across three
  time series. Participants will be randomized to one of the three time series. Within
  the time series the start of the intervention is randomly determined. Four participants
  will be assigned to the shortest, three to the medium and three to the longest baseline
  length. The SCED study consists of a baseline phase (A1), intervention phase (B),
  post-treatment phase (A2), follow-up phase 1 (A3), and follow-up phase 2 (A4). Study
  population: Subjects are RA patients \> 18 years with low disease activity (DAS28\<3.2)
  at \>2 measurements over the previous 12 months and concurrent elevated pain scores
  (NRS-pain\>6). Intervention (if applicable): EMDR therapy consists of an intake
  and eight sessions of 90 minutes in total, performed according to the EMDR standard
  protocol, conducted by four psychologists, all are level-II trained, under the supervision
  of an EMDR Europe consultant. EMDR focuses on processing traumatic memories, pain-related
  memories, and current physical pain. Main study parameters/endpoints: Primary endpoint
  for effectiveness is the pre-treatment phase A1 to post-treatment phase A2 difference
  in NRS pain intensity. Feasibility is examined by monitoring recruitment, dropout
  rates, and treatment satisfaction. Nature and extent of the burden and risks associated
  with participation, benefit and group relatedness'
