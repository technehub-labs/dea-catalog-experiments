type: Experiment
name: NCT03750786 — A Study to Compare the Efficacy of Arfolitixorin Versus Leucovorin
  in Combination With 5 Fluorouracil, Oxaliplatin, and Bevacizumab in Patients With
  Advanced Colorectal Cancer
description: This is a multicenter, randomized, parallel-group, Phase III study in
  at least 440 patients with advanced colorectal cancer to compare the efficacy of
  treatment with arfolitixorin versus Leucovorin in combination with 5-fluorouracil,
  oxaliplatin, and bevacizumab according to modified FOLFOX-6 until PD according to
  RECIST 1.1 criteria. (NCT NCT03750786; status COMPLETED).
