id: dea:experiment-nct03784482-multiple-drug-hypersensitivity-syndr-a657sz
type: Experiment
name: NCT03784482 — Multiple Drug Hypersensitivity Syndrome
description: 'Background: Multiple drug hypersensitivity syndrome (MDH) is defined
  as confirmed drug hypersensitivity reactions (DHRs) to at least 2 chemically and
  pharmacologically unrelated drugs. Reports of MDH are scarce and poorly specified
  and studies which diagnose MDH on the basis of positive allergy tests are lacking.
  Objective: To evaluate retrospectively the frequency and characteristics of MDH
  patients in a large database. Methods: All the patients who consulted and were tested
  in our Allergy Unit between September 1996 and February 2018, with confirmed MDH
  will be included. Clinical history and allergy work-up results will be extracted
  from our Drug Allergy and Hypersensitivity Database (DAHD). The frequency of MDH
  will be calculated, MDH patients will be described, the most frequent associations
  of DHRs will be identified and analysed. (NCT NCT03784482; status COMPLETED).'
