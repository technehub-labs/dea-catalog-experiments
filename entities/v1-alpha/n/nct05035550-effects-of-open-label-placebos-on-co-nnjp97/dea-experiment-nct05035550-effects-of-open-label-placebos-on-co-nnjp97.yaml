id: dea:experiment-nct05035550-effects-of-open-label-placebos-on-co-nnjp97
type: Experiment
name: NCT05035550 — Effects of Open-label Placebos on COVID-related Psychological
  Health
description: This project aimed to test the efficacy of a telehealth-administered
  placebo without deception intervention on stress, anxiety, and depression related
  to the COVID-19 pandemic. Participants were randomized into two groups (open-label
  placebo vs. no-treatment control). All participants received information on the
  impact of COVID-19 on psychological health. Participants in the open-label placebo
  group were instructed to watch an informational video on the beneficial effects
  of placebos without deception, remotely interact with an experimenter, and take
  open-label placebo pills twice a day for two weeks. Participants in the no-treatment
  control group did not receive any intervention. Instead, participants met with an
  experimenter and reported on their psychological and physical health. The investigators
  predicted that the placebo without deception group would exhibit substantially reduced
  stress, depression, and anxiety compared to a no-treatment control group. (NCT NCT05035550;
  status COMPLETED).
