type: Experiment
name: NCT03718169 — Smartphone Application-based Smoking Cessation Programme Among
  Female Smokers
description: This project aims to develop a smartphone application to deliver a gender-specific
  programme for female smokers in Hong Kong. Through the smartphone application, we
  expect that our gender-specific smoking cessation programme can reach more female
  smokers in Hong Kong. The objectives is to promote smoking cessation among female
  smokers in Hong Kong. (NCT NCT03718169; status COMPLETED).
