id: dea:experiment-nct00011024-prospective-studies-of-the-use-of-se-kdnxwj
type: Experiment
name: NCT00011024 — Prospective Studies of the Use of Self Hypnosis, Acupuncture and
  Osteopathic Manipulation on Muscle Tension in Children With Spastic Cerebral Palsy
description: We propose to identify patients and families for inclusion in pilot studies
  of the three modalities. Patients and their families will be asked to participate
  in these studies. Our research group has done some preliminary work with the modality
  of hypnotherapy, but has no experience to date with the other two modalities. The
  idea to try relaxation techniques was generated by the observation that there is
  great variation in the degree to spasticity at different times in the same patient
  with CP. When queried, mothers responded that they were able to get their child
  to relax and decrease the tension in their muscles by stroking, talking softly,
  and/or by playing certain types of music. The availability of hypnosis and training
  in self-hypnosis was presented to several families of our patients. Their understanding
  and acceptance of this alternate therapy was gratifying. The results of this therapy
  have been promising and have encouraged us to proceed with this modality and to
  consider making other nonconventional modalities available to our patients. We hypothesize
  that at least one of the two modalities will be accepted readily by patients with
  CP and their families, and with their acceptance compliance with the method chosen
  will be at levels of 80 percent or more. (NCT NCT00011024; status COMPLETED).
