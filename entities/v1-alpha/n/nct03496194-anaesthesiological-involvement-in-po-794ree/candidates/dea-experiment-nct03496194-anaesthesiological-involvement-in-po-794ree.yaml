id: dea:experiment-nct03496194-anaesthesiological-involvement-in-po-794ree
type: Experiment
name: NCT03496194 — Anaesthesiological Involvement in Postoperative Pain Treatment
description: This study aims to investigate the current organization and management
  of postoperative pain in Denmark, especially for invasive pain treatment modalities
  (epidural infusions, PCA and regional blocks), in a national survey covering the
  activities in Danish Hospitals. This study is an electronic questionnaire survey,
  that aim to describe and map the foundation for future developments within, and
  improvement of, postoperative pain management. (NCT NCT03496194; status COMPLETED).
