id: dea:experiment-nct03966469-what-is-the-impact-of-the-presence-o-c767u8
type: Experiment
name: NCT03966469 — What is the Impact of the Presence of a Support Person on Informed
  Consent
description: In practice, the Investigators recommend that patients bring a family
  member or close friend to their pre-operative appointment to help with patient anxiety,
  comprehension, and informed decision-making. However, there is limited literature
  to support this recommendation. The investigators are exploring if having a support
  person present during this consent process impacts anxiety, satisfaction, knowledge,
  and preparedness for surgery. (NCT NCT03966469; status COMPLETED).
