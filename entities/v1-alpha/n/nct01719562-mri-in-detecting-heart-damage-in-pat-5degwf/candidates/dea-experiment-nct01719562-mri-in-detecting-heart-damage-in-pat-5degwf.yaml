id: dea:experiment-nct01719562-mri-in-detecting-heart-damage-in-pat-5degwf
type: Experiment
name: NCT01719562 — MRI in Detecting Heart Damage in Patients With Cancer Receiving
  Chemotherapy With Exercise Capacity Addendum
description: 'This trial studies how well magnetic resonance imaging (MRI) works in
  detecting heart damage in patients with cancer receiving chemotherapy. Diagnostic
  procedures, such as MRI, may help doctors predict whether patients will have heart
  damage caused by chemotherapy in patients with cancer receiving chemotherapy. Exercise
  Capacity Addendum Brief Summary: This study is designed to demonstrate feasibility
  of performing the physical activity intervention and the primary outcome measures
  before, during and six months after initiating Anth-bC for treatment of non- or
  Hodgkin lymphoma. This study will test the potential for a novel (lifestyle) intervention
  designed to improve exercise capacity, health-related quality of life and cardiac
  and cognitive dysfunction. This data will inform the development of the R33 phase
  of the clinical trial to determine if the physical activity intervention can reduce
  exercise intolerance in this high-risk population. In addition, cardiac MRI data
  from individuals within this pilot will be compared to cardiac MRI data from individuals
  in the parent study that did not undergo either of the two interventional arms of
  this study. (NCT NCT01719562; status COMPLETED).'
