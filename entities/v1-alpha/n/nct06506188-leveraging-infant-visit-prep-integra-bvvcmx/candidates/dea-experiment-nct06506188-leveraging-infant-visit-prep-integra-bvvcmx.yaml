type: Experiment
name: NCT06506188 — Leveraging Infant Visit PrEP INtegration & tasK Shifting to Improve
  Post-partum HIV Prevention in Malawi
description: 'The goal of the Leveraging Infant Visit PrEP INtegration \& tasK Shifting
  to Improve Postpartum HIV Prevention in Malawi (LINK) study is to evaluate both
  the effectiveness of a postpartum prevention package ("LINK model") among post-partum
  women and its implementation into existing clinical care models in Lilongwe, Malawi.
  The main question the study seeks to answer is: Do women at clinics implementing
  the LINK model have improved Pre-exposure Prophylaxis (PrEP) persistence compared
  to women at clinics receiving the standard of care? Researchers will compare the
  LINK model to standard of care by randomizing twelve sites to either the LINK model
  or the standard of care. Then researchers will review existing medical record and
  health surveillance data, and qualitative and quantitative data collected from intervention
  and control sites. (NCT NCT06506188; status RECRUITING).'
