id: dea:experiment-nct00248820-contrast-enhanced-ultrasound-ability-5wgsyw
type: Experiment
name: NCT00248820 — Contrast-Enhanced Ultrasound Ability in the Characterization of
  Ovarian Masses
description: This study intends to assess the ability of contrast-enhanced ultrasound
  in the detection of benign and malignant ovarian masses compared to unenhanced ultrasound.
  By using an intravascular contrast agent, this noninvasive and feasible imaging
  technique will allow the investigators to define specific microcirculation patterns
  in 100 women with ovarian lesions. The intravascular contrast agent properties will
  be compared between benign and malignant adnexal masses. The final purpose of this
  ultrasonography is to allow the early detection of tumors and to improve the characterization
  between benign and malignant lesions. (NCT NCT00248820; status UNKNOWN).
