id: dea:experiment-nct05903989-real-world-treatment-patterns-and-pa-dtgymx
type: Experiment
name: NCT05903989 — Real-World Treatment Patterns and Patient Reported Outcome in
  COPD (REMIND)
description: This retrospective observational study aims to report distribution of
  the proportion of symptomatic Chronic obstructive pulmonary disease (COPD) patients
  classified by the COPD Assessment Test (CAT) managed with single or dual inhaler
  treatment using the data at cohort entry in the COPD cohort study, and treatment
  change and longitudinal CAT score by each inhaler treatment will also be evaluated
  using the data during the follow-up period. (NCT NCT05903989; status COMPLETED).
