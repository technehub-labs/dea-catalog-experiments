id: dea:experiment-nct06893510-virtual-reality-based-and-face-to-fa-p9bad5
type: Experiment
name: NCT06893510 — Virtual Reality-Based and Face-to-Face Relaxation Programs in
  Pregnant Women With Preeclampsia
description: Preeclampsia, affecting 2-8% of pregnancies globally, is a leading hypertensive
  disorder in pregnancy. It is clinically characterized by elevated blood pressure
  (≥140/90 mmHg) after the 20th gestational week, often accompanied by proteinuria
  and systemic complications such as thrombocytopenia, liver dysfunction, and cerebral
  symptoms. This condition poses significant risks for both maternal and fetal health,
  increasing the likelihood of organ damage, preterm birth, and long-term cardiovascular
  and neurodevelopmental complications. Non-pharmacological interventions, including
  relaxation techniques, have been explored for symptom management. Progressive muscle
  relaxation (PMR) has shown efficacy in reducing stress, anxiety, and blood pressure.
  Recently, virtual reality (VR)-based relaxation techniques have gained attention
  for enhancing stress relief and improving health outcomes. This study aims to compare
  the effects of VR-based PMR with in-person PMR on maternal and fetal outcomes in
  preeclamptic pregnancies. (NCT NCT06893510; status RECRUITING).
