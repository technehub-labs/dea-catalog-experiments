type: Experiment
name: NCT01606631 — Role of Beta-blockers in the Prevention on the Arisen of a Severe
  Sepsis (TESS)
description: The severe sepsis (SS) and toxic shock (TS) are both frequent and severe
  complications of infectious diseases. They are one of the top ten causes of death
  in industrialized countries. But an eventual protective role of beta-blockers (anti-hypertensive
  drug) in their occurrence on a community infection has never been studied. The objective
  of this study is to evaluate this role. (NCT NCT01606631; status COMPLETED).
