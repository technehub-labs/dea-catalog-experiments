id: dea:experiment-nct02627118-potential-effect-of-dialyzer-leachin-d3nztw
type: Experiment
name: NCT02627118 — Potential Effect of Dialyzer Leaching of BPA From the Fresenius
  Optiflux 160NR Compared to the Nipro ELISIO-15H
description: The aim of the study is to identify hepatic enzyme and estrogen-dependent
  biochemical changes that occur when dialysis patients are treated with dialyzers
  known to leach BPA (Bisphenol-A) into the blood, such as the commercially available
  Fresenius F160NR, as compared with the same chemical evaluations in patients being
  treated with the non BPA containing Nipro Elisio-15H dialyzer. Evaluations of patient's
  chemistries will be obtained prior to and after 2 months of standard dialysis treatments
  with each dialyzer. (NCT NCT02627118; status COMPLETED).
