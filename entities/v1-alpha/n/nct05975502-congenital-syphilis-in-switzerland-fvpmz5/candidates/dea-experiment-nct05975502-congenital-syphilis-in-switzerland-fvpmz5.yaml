id: dea:experiment-nct05975502-congenital-syphilis-in-switzerland-fvpmz5
type: Experiment
name: NCT05975502 — Congenital Syphilis in Switzerland
description: A retrospective national epidemiological Swiss study was conducted to
  establish a real prevalence and description of congenital syphilis, and to better
  classify the reported congenital syphilis. Maternal risk factors to contract syphilis
  (i.e. socio-demographic, cultural and clinical factors) were also evaluated, in
  order to focus on prevention of these targeted population. Follow up of the children
  born from mother with syphilis during pregnancy, until age 6, was recorded to evaluate
  the risk of congenital syphilis following treatment of maternal syphilis. (NCT NCT05975502;
  status COMPLETED).
