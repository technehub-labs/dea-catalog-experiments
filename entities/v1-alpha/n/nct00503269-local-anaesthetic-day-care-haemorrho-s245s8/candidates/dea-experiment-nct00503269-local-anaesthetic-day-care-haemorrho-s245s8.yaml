id: dea:experiment-nct00503269-local-anaesthetic-day-care-haemorrho-s245s8
type: Experiment
name: NCT00503269 — Local Anaesthetic Day-care Haemorrhoidectomy Challenges Traditional
  Concepts - a Randomised Controlled Trial
description: 'Background: Local anaesthetic day-care open haemorrhoidectomy (LH) is
  feasible, cheap and may be the cost-effective surgical approach to third degree
  haemorrhoids. This prospective randomised controlled trial compares patient''s evaluation
  of LH with general anaesthetic day-care Park''s modified Milligan-Morgan haemorrhoidectomy
  (GH). Methods: 41 patients with third degree haemorrhoids were randomised to LH
  (19 cases) and GH (22 cases). Demographics were comparable. Independent assessment
  (by a research nurse) and clinical evaluation ran parallel for 6 months. Outcome
  measures were average and expected pain scores for 10 days; satisfaction scores
  at 10 days, 6 weeks and 6 months. Secondary outcomes were journey time and cost
  in day surgery. (NCT NCT00503269; status COMPLETED).'
