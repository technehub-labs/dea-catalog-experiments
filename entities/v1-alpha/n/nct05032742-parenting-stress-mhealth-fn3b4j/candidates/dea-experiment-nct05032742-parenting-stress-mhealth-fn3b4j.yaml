type: Experiment
name: NCT05032742 — Parenting Stress mHealth
description: Parenting stress is a well-documented barrier to youth engagement in
  community-based substance use treatment. The current project aims to develop and
  evaluate a mobile health parenting stress intervention for caregivers of justice-involved
  youth, a population with high rates of substance use and low rates of treatment
  engagement. (NCT NCT05032742; status COMPLETED).
