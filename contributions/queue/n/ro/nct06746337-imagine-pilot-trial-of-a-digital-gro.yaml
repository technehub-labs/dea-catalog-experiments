name: 'NCT06746337 — IMAGINE: Pilot Trial of a Digital Group Intervention to Prevent
  Perinatal Depression'
description: 'The goal of this clinical trial is to evaluate if a digital group intervention
  (named IMAGINE) can prevent depression in perinatal populations. The main questions
  it aims to answer are: Does IMAGINE engage cognitive behavioral therapy targets?
  Does IMAGINE lead to lower depression scores? Is IMAGINE acceptable, appropriate,
  usable and feasible? Participants will be randomized to either participate in an
  IMAGINE group for 12 weeks or receive standard of care. Participants will respond
  to questionnaires at enrollment and study visits at 12 and 24 weeks after enrollment.
  (NCT NCT06746337; status ACTIVE_NOT_RECRUITING).'
