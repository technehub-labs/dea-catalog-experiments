name: NCT06442137 — A Clinical Trial of Chazhu Xiaozhi Decoction Against Non-alcoholic
  Fatty Liver Disease
description: 'The goal of this clinical trial is to learn if drug Chazhu Xiaozhi decoction
  works to treat non-alcoholic fatty liver disease in adults. It will also learn about
  the safety of drug Chazhu Xiaozhi decoction. The main questions it aims to answer
  are: Does drug Chazhu Xiaozhi decoction improve the degree of hepatic steatosis
  in patients with non-alcoholic fatty liver disease? What medical problems do participants
  have when taking drug Chazhu Xiaozhi decoction? Researchers will compare drug Chazhu
  Xiaozhi decoction to a placebo (a look-alike substance that contains no drug) to
  see if drug Chazhu Xiaozhi decoction works to treat non-alcoholic fatty liver disease.
  Participants will: Take drug Chazhu Xiaozhi decoction or a placebo every day for
  eight weeks Keep a record of their symptoms and the degree of hepatic steatosis
  before and after the treatment (NCT NCT06442137; status COMPLETED).'
