name: NCT05111925 — Pre- and Post-neuromusculoskeletal Injury Risk Evaluation for
  Return-to-Duty Enhancement
description: The purpose of this study is to develop comprehensive and efficient pre-
  and post- musculoskeletal injury (MSKI) risk assessments for Service members, incorporating
  both objective and subjective measures. This is a multi-site observational study
  to identify the pre- and post-MSKI physical and psychosocial factors contributing
  to MSKI risks and undesired patient outcomes following MSKI. The study hypothesis
  is that a set of field-expedient clinical assessments can identify Service member
  specific MSKI risk factors and post-MSKI deficits that contribute to undesired patient
  outcomes and provide data to guide patient-specific risk mitigation and rehabilitation
  programs. (NCT NCT05111925; status RECRUITING).
