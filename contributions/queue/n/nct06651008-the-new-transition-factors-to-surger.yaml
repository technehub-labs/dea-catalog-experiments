name: NCT06651008 — The New Transition Factors to Surgery of Duodenal Perforation
description: 'In this study,investigators sought to identify new transition factors in the initial evaluation
  of cases requiring conversion to surgery for duodenal ulcer perforation. This was a retrospective study
  performed at investigators'' hospital between January 2012 and July 2023 with upper gastrointestinal
  perforation. 27 patients, who underwent conservative management for the duodenal ulcer perforation,
  were extracted. Investigators researched the transition rate to surgery and the following factors: 1.
  Patient background, 2. Time from onset to hospital visit, 3. Vital signs and inflammatory findings on
  arrival, 4. CT findings of duodenal ulcer perforation and degree / shape of liver coverage for the perforation,
  and the extent of ascites. (NCT NCT06651008; status COMPLETED).'
