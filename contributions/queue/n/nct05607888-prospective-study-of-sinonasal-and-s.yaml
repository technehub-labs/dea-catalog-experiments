name: NCT05607888 — Prospective Study of Sinonasal and Skull-base Tumours Management
description: 'This observational prospective clinical study aims to describe the epidemiology, management
  and outcome of patients with sinonasal and skull-base pathology (tumours and diseases with malignant
  clinical characteristics) in a tertiary otorhinolaryngology referral centre. The main questions it aims
  to answer are: * what is the caseload of patients with the included pathology in our centre * what are
  the results of management of these cases * what are the epidemiological characteristics of included
  patients * what is the quality of life of included patients. (NCT NCT05607888; status RECRUITING).'
