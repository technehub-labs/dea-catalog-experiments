description: The purpose of this two-centre pilot research study is to establish the feasibility of conducting
  a full trial that seeks to determine if a cardiac anesthesia policy that uses alternatives to benzodiazepine
  medications is better at preventing delirium after cardiac surgery when compared with a cardiac anesthesia
  policy that uses benzodiazepine medications. (NCT NCT03053869; status COMPLETED).
