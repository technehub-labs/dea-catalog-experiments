name: NCT04486469 — Efficacy of Physiotherapy Techniques on Irritable Bowel Syndrome (IBS). Pilot Study.
description: Introduction and State of Question Irritable Bowel Syndrome can be classified as a functional
  digestive disorder characterized by abdominal pain, bloating, and changes in the frequency and consistency
  of bowel movements. Recent studies endorse the use of physical therapies for its symptomatic treatment.
  With the present study investigators wanted to verify the effectiveness of physiotherapy techniques
  in order to alleviate or eliminate the symptoms of Irritable Bowel Syndrome. Material and Methods Investigators
  have carried out an uncontrolled pilot clinical trial in a sample of 24 patients diagnosed with Irritable
  Bowel Syndrome in two hospitals in the Region of Murcia. Among the measurement tools used, we highlight
  the use of the IBS-Severity Scale, IBS-QoL, STAI and spirometry tests. (NCT NCT04486469; status COMPLETED).
