name: NCT05462405 — Evaluation of Sympathetic Activity Effects by the BackBeat Medical Cardiac Neuromodulation
  Therapy (CNT).
description: Measurement and recording of Muscle Sympathetic Neural Activity (MSNA) using microneurography,
  will be applied to subjects who have been already implanted with a Moderato IPG delivering the BackBeat
  CNT and/or pacing signals. Several tests will be performed by experienced professionals to ensure the
  acquired sympathetic nerve signals arise from the targeted nerve source. The Moderato Programmer will
  be then used to program different sets of CNT for several minutes with a several minutes interval between
  delivery periods. This delivery pattern is used will allow to acquire sympathetic nerve signals with
  and without CNT. Subject blood pressure, respiration and ECG data will be collected and recorded, both
  for safety and for evaluation of CNT dependent secondary indicators of sympathetic activity. (NCT NCT05462405;
  status ACTIVE_NOT_RECRUITING).
