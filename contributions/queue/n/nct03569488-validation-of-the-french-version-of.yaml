name: NCT03569488 — Validation of the French Version of the Low Anterior Resection Syndrome (LARS) Among
  Rectal Cancer Patients
description: 'Oncological rectal cancer outcomes have improved considerably because of optimal surgery
  by total mesorectal excision in conjunction with multidisciplinary team management by selective multimodal
  therapy (ie, neo-adjuvant chemo-radiotherapy). The 5-year survival has increased to more than 50% and
  local recurrence has been reduced to less than 10%. These advancements have resulted in more patient
  receiving sphincter-preserving surgery (SPS). With an increasing number of rectal cancer survivors,
  the investigators observe a rising attention to the disordered bowel function after SPS, called "low
  anterior resection syndrome" (LARS). LARS appear immediately after surgery, becoming most pronounced
  during the first few months, and improved thereafter, reaching a steady state after around two years.
  However, up to 60% of patients with SPS suffer from LARS which impaired their quality of life (QoL).
  The prevalence and severity of LARS is difficult to assess due to heterogeneity of the assessment tools.
  A group of Danish authors have recently developed and validated a five-item instruments for evaluation
  of LARS (LARS score). It represents to date the best questionnaire to capture anorectal postoperative
  function and consists of five items: incontinence for flatus, incontinence for liquid stool, frequency
  of bowel movements, clustering of stools, and urgency. It allows a categorization of patients into 3
  groups: no LARS (0-20 points), minor LARS (21-29 points), and major LARS (30-42 points). Developed in
  Danish, it is now internationally validated with translations in Chinese, English, German, Spanish and
  Swedish. To our knowledge, French version of the LARS score is not yet available. The aim of our study
  will be to adapt the LARS scale questionnaire to the French language (LARS-F), and assess its psychometric
  properties. Inclusion criteria will be patients 18 years old or above who were operated for rectal cancer
