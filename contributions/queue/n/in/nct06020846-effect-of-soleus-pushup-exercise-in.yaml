name: NCT06020846 — Effect of Soleus Pushup Exercise in Type 2 Diabetes Patients
description: The aim of this research is to compare the immediate effects of one hour
  Soleus Pushup Exercise and treadmill walk in Type 2 Diabetic population on blood
  glucose level. Randomized controlled trials done at Railway General Hospital and
  diabetic centers of Rawalpindi and Islamabad.. The sample size was 66. The subjects
  were divided in two groups, 33 subjects in Soleus Pushup Exercise group and 33 subjects
  in treadmill walk group. Study duration was of 6 months. Sampling technique applied
  was non probability convenience sampling technique. Only 40-60 years diabetic people
  with clinically diagnosed type 2 Diabetes for upto 10 years were included. Tools
  used in the study are Glucometer (NCT NCT06020846; status COMPLETED).
