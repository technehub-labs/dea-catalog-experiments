name: NCT05411497 — Genetically Engineered Cells (MUC1-Activated T-Cells) for the Treatment of MUC1 Positive
  Recurrent or Refractory Multiple Myeloma
description: This phase I trial tests the safety, side effects and best dose of MUC1-activated T cells
  in treating patients with multiple myeloma that has come back (relapsed) or does not respond to treatment
  (refractory) and is positive for expression of the MUC1 protein. T-cells are infection fighting blood
  cells that can kill cancer cells. MUC1-activated T-cells are made from the body's own T cells. The manufactured
  T-cells are made to target the MUC1 genetic marker and may help the body's immune system identify and
  kill cancer cells. (NCT NCT05411497; status ACTIVE_NOT_RECRUITING).
