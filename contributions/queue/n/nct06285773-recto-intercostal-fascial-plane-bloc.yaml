name: NCT06285773 — Recto-intercostal Fascial Plane Block and Pecto-intercostal Fascial Plane Block for
  Cardiac Surgery
description: In cardiac surgeries performed with median sternotomy, mediastinal and thoracic tube placement
  sites are outside the area of effect of parasternal blocks, and sometimes the sternotomy incision extends
  below the T6 dermatome. Recto intercostal fascial plane block (RIFPB) has been defined as a complementary
  block for analgesia of this region. This study aims to evaluate the effectiveness of the combination
  of ultrasound-guided recto-intercostal fascial plane block and pectointercostal fascial block for postoperative
  analgesia management after open heart surgery (coronary artery bypass) with median sternotomy. (NCT
  NCT06285773; status COMPLETED).
