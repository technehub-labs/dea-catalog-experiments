name: NCT04457973 — Home-based Transcranial Direct Current Stimulation for Pain Management in Persons
  With Alzheimer's Disease and Related Dementias
description: The purpose of this project is to evaluate the preliminary effects of home-based M1-SO applied
  tDCS (that is, tDCS with the anode over the primary motor cortex and the cathode over the contralateral
  supraorbital area) on clinical pain in persons with early-stage Alzheimer's disease and Related Dementias
  (ADRD), to evaluate the preliminary effects of home-based M1-SO applied tDCS on pain-related cortical
  response in persons with early-stage ADRD, and to evaluate the feasibility and acceptability of home-based
  M1-SO applied tDCS for pain management in persons with early-stage AD. (NCT NCT04457973; status COMPLETED).
