name: NCT04893005 — Knowledge Level of Pelvic Floor in Different Age Groups
description: Having knowledge and awareness about pelvic floor muscles and pelvic floor dysfunctions makes
  it easier for individuals to understand their own body and the treatment provided to them by healthcare
  professionals (Fante, 2019). In the literature, there are studies investigating the knowledge and awareness
  levels of different participant groups about pelvic floor and pelvic floor dysfunctions (Parden, 2016;
  Hill, 2017; Falvey, 2020). It has been shown that most women lack knowledge of pelvic floor muscle dysfunction,
  do not understand treatment options for the pelvic floor, and are unable to identify risk factors (Fante,
  2019). A Pelvic Floor Health Knowledge Quiz was created by Al-Deges in order to evaluate the level of
  knowledge about pelvic floor and pelvic floor dysfunction in women and men in our country (Al-Deges,
  2019). In line with this information, the aim of our study is to determine the level of knowledge about
  pelvic floor and pelvic floor dysfunctions in women and men of different age groups. The target audience
  of our research is male and female individuals over the age of 18, and our research will be conducted
  online. As a result of the information we obtained from our research, the level of knowledge of individuals
  living in our country about pelvic floor and pelvic floor dysfunctions will be determined and the literature
  will be contributed. In addition, by determining the missing information of the society about the pelvic
  floor, contribution will be made to the development of appropriate intervention methods in order to
  eliminate the deficiencies in this area and to increase the level of awareness. (NCT NCT04893005; status
  COMPLETED).
