name: NCT06213389 — Comparison of EzVision® Videolaryngoscope and Gum Elastic Bougie-Assisted Machintosh
  Laryngoscopy
description: The aim of this study is to compare the EzVision® videoryngoscope with conventional laryngoscopy
  using a Macintosh blade in patients with suspected difficult intubation. This study primarily aims to
  test the hypothesis that laryngoscopy image is better with EzVision® videoryngoscopy compared to direct
  laryngoscopy. The secondary hypothesis is also to test the view that, compared to direct laryngoscopy,
  EzVision® videolingoscopy will improve intubation success, reduce intubation attempts, shorten intubation
  time, facilitate intubation, and cause less additional complications such as bleeding or sore throat.
  (NCT NCT06213389; status COMPLETED).
