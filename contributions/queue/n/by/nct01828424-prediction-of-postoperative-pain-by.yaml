name: NCT01828424 — Prediction of Postoperative Pain by Measuring Nociception at the
  End of Surgery
description: There is a large variability of postoperative pain intensity and of the
  drug doses necessary to alleviate this pain. The investigators hypothesis is that
  a measurement of nociception at the end of surgery, using either the RIII reflex
  threshold, measures of heart rate variability or the pupil dilatation reflex measured
  by pupillometry, in relation to the doses of opioids used intraoperatively will
  yield a prediction of postoperative pain. (NCT NCT01828424; status COMPLETED).
