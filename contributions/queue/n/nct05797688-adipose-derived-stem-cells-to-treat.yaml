name: NCT05797688 — Adipose-derived Stem Cells to Treat Chronic Wounds.
description: The goal of this study is to determine whether autologous, adipose-derived
  regenerative cells improve the healing of chronic wounds. Ten patients will undergo
  fat harvest and peri-wound injection of the isolated cells in addition to the standard
  of care for the treatment of their chronic wound. Wound healing will be followed
  over 24 weeks. (NCT NCT05797688; status WITHDRAWN).
