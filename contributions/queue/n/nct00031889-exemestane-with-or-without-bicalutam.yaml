description: 'RATIONALE: Androgens can stimulate the growth of prostate cancer cells. Hormone therapy
  using exemestane plus bicalutamide may fight prostate cancer by reducing the production of androgens.
  It is not yet known if exemestane is more effective with or without bicalutamide in treating prostate
  cancer. PURPOSE: Randomized phase II trial to study the effectiveness of exemestane with or without
  bicalutamide in treating patients who have stage IV prostate cancer that has been previously treated
  with hormone therapy or surgery. (NCT NCT00031889; status COMPLETED).'
