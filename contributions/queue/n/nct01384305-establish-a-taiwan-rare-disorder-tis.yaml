name: NCT01384305 — Establish a "Taiwan Rare Disorder Tissue Bank", to Collect and Repost Biological Samples
  and Disease Information From Patients With Rare Disorders
description: Even though rare disorders usually have limited case numbers, they have induced huge impacts
  on patients and their families, and has heavily burdened on our society and healthcare system as well.
  Therefore, it is essential to detect the occurrence of disorders and thus take appropriate measures
  as early as possible. The preventive goal is based on comprehensive understanding on rare disorders,
  available diagnostic and therapeutic approaches. However, studies related to rare disorders are often
  impeded by limited sample sizes and infrequent exchange of research materials among institutes. After
  referring to foreign experiences, the investigators have noticed that a non-profit tissue bank which
  can reposit biological samples and thus provide researchers access to samples, may be a solution. Through
  sharing this public asset, the investigators believe not only quantity and quality of rare disorder
  studies will be improved, the collaboration between various research institutes can also be strengthened
  afterwards. Most important of all, those achievements can ultimately benefit patients, families and
  the whole society. (NCT NCT01384305; status UNKNOWN).
