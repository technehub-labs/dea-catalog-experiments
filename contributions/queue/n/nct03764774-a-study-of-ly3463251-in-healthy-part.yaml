name: NCT03764774 — A Study of LY3463251 in Healthy Participants
description: The purpose of this study is to evaluate the safety and tolerability
  (side effects) of single (Part A) and multiple (Part B) doses of the study drug
  when it is administered subcutaneously (under the skin) into the abdomen. This is
  a two-part study. Participants will enroll in only one part. For each participant,
  Part A will last about 10 weeks and Part B will last about 23 weeks, including screening.
  (NCT NCT03764774; status TERMINATED).
