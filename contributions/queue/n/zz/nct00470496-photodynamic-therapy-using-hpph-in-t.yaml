name: NCT00470496 — Photodynamic Therapy Using HPPH in Treating Patients Undergoing
  Surgery for Primary or Recurrent Head and Neck Cancer
description: This phase I trial studies the side effects and best dose of photodynamic
  therapy using HPPH in treating patients who are undergoing surgery for primary or
  recurrent head and neck cancer. Photodynamic therapy (PDT) uses a drug, such as
  HPPH, that becomes active when it is exposed to a certain kind of light. When the
  drug is active, tumor cells are killed. Giving photodynamic therapy after surgery
  may kill any tumor cells that remain after surgery. (NCT NCT00470496; status COMPLETED).
