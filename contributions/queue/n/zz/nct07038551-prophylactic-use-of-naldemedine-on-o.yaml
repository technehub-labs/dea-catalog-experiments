name: 'NCT07038551 — Prophylactic Use of Naldemedine on Opioid-induced Nausea and
  Vomiting in Patients With Cancer: POSEIDON Study'
description: Opioid analgesics can cause side effects such as constipation, nausea,
  and vomiting by acting on opioid receptors widely distributed in the peripheral
  nervous system. This can sometimes make it difficult to achieve and maintain pain
  relief and continue pain treatment. Among these side effects, nausea and vomiting
  are specifically referred to as opioid-induced nausea and vomiting (OINV). OINV
  is known to occur during the initial administration or dose escalation of opioid
  analgesics, and it not only decreases the quality of life for patients but also
  reduces adherence to opioid analgesics, which can have a negative impact on pain
  management. Therefore, appropriate management is crucial. While the administration
  of conventional antiemetic drugs is recommended for the treatment of OINV, there
  is a lack of high-quality studies evaluating their effectiveness, and studies comparing
  treatment effects with a placebo have not been reported. The objective is to verify
  the effectiveness of naldemedine in preventing OINV in patients starting opioid
  analgesics for cancer (NCT NCT07038551; status COMPLETED).
