name: 'NCT07632950 — Frequency-Dependent Effects of Mobilization-Based Exercise on Dynamic Postural Control
  in Orchestra Musicians: An Exploratory Randomized Controlled Trial'
description: Orchestra musicians are exposed to prolonged asymmetric postures and repetitive upper-quarter
  loading that may affect postural control. This exploratory randomized controlled trial examined whether
  a four-week mobilization-based exercise program, delivered once or twice weekly, was associated with
  changes in static sensory-dependent balance and dynamic voluntary weight-shifting control. (NCT NCT07632950;
  status COMPLETED).
