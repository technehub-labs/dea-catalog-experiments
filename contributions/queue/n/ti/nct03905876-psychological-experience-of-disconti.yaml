name: NCT03905876 — Psychological Experience of Discontinuation an Early Phase Treatment
  by Patients
description: While there is currently some study on the motivations and experiences
  of patients integrating early phase clinical trials, to our knowledge, no study
  has explored the future of patients coming out of these trials. It is therefore
  urgent to better understand the feelings and experiences of patients who discontinue
  their treatment in a clinical trial of early phase (EP) to provide them with tailored
  and personalized support. In addition, the end of treatment may have a different
  impact on the person depending on whether the treatment was discontinued due to
  the protocol (the patient received the full treatment as planned) or to an early
  withdrawal (intolerable toxicities or progression of the disease). (NCT NCT03905876;
  status COMPLETED).
