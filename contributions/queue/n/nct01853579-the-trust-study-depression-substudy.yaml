name: NCT01853579 — The TRUST Study - Depression Substudy
description: Mild thyroid failure is a common condition among older adults and has been associated with
  numerous adverse effects on health, such as cardiovascular disease, cognition disturbances and muscular
  problems. Mild thyroid failure has also been associated with an increased risk of developing depression.
  To date, only few studies have investigated the effect of thyroid hormone replacement on depression
  in patients with mild thyroid failure. This study therefore aims to assess whether thyroid hormone replacement
  in older adults with mild thyroid failure is associated with a decrease in the presence of depressive
  symptoms. This study forms a substudy of a large international study on thyroid hormone replacement
  in older adults with mild thyroid failure (the TRUST study). (NCT NCT01853579; status COMPLETED).
