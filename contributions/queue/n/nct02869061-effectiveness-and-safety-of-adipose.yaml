name: NCT02869061 — Effectiveness and Safety of Adipose-derived Regenerative Cells for Reduction of Risk
  of Bladder Neck Contracture
description: Autologous adipose-derived regenerative cells (ADRC) will be extracted from lipoaspirate
  by enzymatic digestion from a portion of the fat harvested from the patient's front abdominal wall.
  Transurethral bladder neck resection followed by the injection of ADRCs suspension will be performed.
  This is a single arm study with no control. All patients receive cell therapy. (NCT NCT02869061; status
  UNKNOWN).
