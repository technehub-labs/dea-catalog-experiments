name: NCT06436469 — MBSR Programs to Reduce Compassion Fatigue in Nurses
description: 'The goal of this observational study is to evaluate the effectiveness
  of a mindfulness-based stress reduction (MBSR) program in reducing compassion fatigue
  among nurses. The main question it aims to answer is: Does participation in an MBSR
  program decrease levels of compassion fatigue among nurses? The primary hypothesis
  is that nurses who participate in the MBSR program will experience a significant
  reduction in compassion fatigue after implementing the interventions. Participants
  will include psychiatric nurse practitioners working in high-stress environments.
  Participants will: Attend a series of MBSR sessions over a specified period. Engage
  in mindfulness practices such as body scans, and deep breathing. Complete self-report
  measures to assess levels of compassion fatigue before and after the intervention.
  (NCT NCT06436469; status COMPLETED).'
