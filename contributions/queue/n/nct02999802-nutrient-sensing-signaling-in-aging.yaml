name: NCT02999802 — Nutrient Sensing & Signaling in Aging Muscle
description: This research seeks to better understand how cellular and molecular bases
  of changes associated with aging contribute to decreased function and increased
  incidence of disease. Specific mechanism in muscle responsible for anabolic resistance
  - a key component of sarcopenia and frailty - will be identified. The proposed research
  is relevant to public health because the discovery of new targets for interventions
  and novel therapeutics to improve muscle strength and function, prevent falls, and
  reduce physical dependency will improve the healthspan and quality of life in older
  adults by improving their physical function and ability to remain independent and
  healthy for a longer period of time. (NCT NCT02999802; status COMPLETED).
