name: NCT00023920 — Bevacizumab, Idarubicin, and Cytarabine in Treating Patients With
  Blast Phase Chronic Myelogenous Leukemia
description: This phase II trial is to see if combining bevacizumab with idarubicin
  and cytarabine works better in treating patients who have blast phase chronic myelogenous
  leukemia. Monoclonal antibodies, such as bevacizumab, can block cancer growth in
  different ways. Some block the ability of cancer cells to grow and spread. Others
  find cancer cells and help kill them or deliver cancer-killing substances to them.
  Drugs used in chemotherapy, such as idarubicin and cytarabine, work in different
  ways to stop cancer cells from dividing so they stop growing or die. Combining monoclonal
  antibody therapy with chemotherapy may be an effective treatment for blast phase
  chronic myelogenous leukemia (NCT NCT00023920; status TERMINATED).
