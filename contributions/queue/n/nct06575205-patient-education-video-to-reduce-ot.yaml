name: NCT06575205 — Patient Education Video to Reduce OTC NSAIDs
description: The goal of this study is to assess the efficacy of a brief 3 to 5-minute educational video
  on influencing intent to change behavior regarding potentially harmful over-the-counter (OTC) NSAID
  use in adults with chronic kidney disease (CKD), heart failure (HF), and/or hypertension (HTN). Informed
  by the COM-B model of behavior change, the video reviews identifying OTC NSAIDs, potential risks of
  NSAIDs, and general alternatives to potentially harmful NSAIDs. Participants with CKD, HF, and/or HTN
  identified as regular OTC NSAID users will be randomized to the VIDEO or CONTROL group. They will complete
  surveys immediately and 4 weeks after viewing the VIDEO or CONTROL to assess actual NSAIDs use, intent
  to change behavior related to NSAIDs use, capability/opportunity/motivation to change behavior, pain,
  and barriers to decreasing OTC NSAIDs. Findings will inform future population health initiatives to
  reduce potentially harmful OTC NSAIDs use. (NCT NCT06575205; status UNKNOWN).
