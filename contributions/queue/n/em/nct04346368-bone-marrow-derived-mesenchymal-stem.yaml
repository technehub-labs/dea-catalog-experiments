name: NCT04346368 — Bone Marrow-Derived Mesenchymal Stem Cell Treatment for Severe
  Patients With Coronavirus Disease 2019 (COVID-19)
description: Coronavirus Disease 2019 (COVID-19) is spreading worldwide and has become
  a public health emergency of major international concern. Currently, no specific
  drugs or vaccines are available. For severe cases, it was found that aberrant pathogenic
  T cells and inflammatory monocytes are rapidly activated and then producing a large
  number of cytokines and inducing an inflammatory storm.Mesenchymal stem cells (MSCs)
  have been shown to possess a comprehensive powerful immunomodulatory function. This
  study aims to investigate the safety and efficacy of intravenous infusion of mesenchymal
  stem cells in severe patients with COVID-19. (NCT NCT04346368; status UNKNOWN).
