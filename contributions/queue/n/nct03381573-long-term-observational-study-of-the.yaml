name: NCT03381573 — Long-term Observational Study of the Safety of Roflumilast
description: This is a retrospective cohort study comparing COPD patients aged 40 years and older with
  new exposure to roflumilast with up to 5 unexposed (ie, not roflumilast-exposed) COPD controls matched
  by propensity score (PS), age, sex, and year of cohort entry. The study is using electronic healthcare
  databases in the US (Military Health System database), Germany (GER) (German Pharmacoepidemiological
  Research Database), and Sweden (SWE) (national databases including healthcare, death, and demographics
  data). The main objective of this study is to evaluate the long-term safety of roflumilast in the treatment
  of COPD with main focus on the primary outcome of all-cause mortality and evaluation of potential safety
  issues identified during the clinical trials of roflumilast. Crude mortality and incidence rates will
  be compared between roflumilast exposed and unexposed COPD patients and adjusted hazard ratios (HRs)
  of the primary and secondary outcomes will be calculated. (NCT NCT03381573; status COMPLETED).
