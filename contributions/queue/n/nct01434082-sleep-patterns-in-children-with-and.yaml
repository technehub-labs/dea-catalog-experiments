name: NCT01434082 — Sleep Patterns in Children With and Without Juvenile Idiopathic
  Arthritis
description: The investigators are doing this study to look at sleep problems, daytime
  sleepiness, and thinking and behavior patterns in children with arthritis and in
  children without arthritis. Arthritis is a problem with joints. Some children have
  arthritis and some children do not have arthritis. Sleep disordered breathing is
  a sleeping problem in which some children snore and have pauses in their breathing
  during sleep. It is associated with not enough or fragmented sleep, poor school
  performance, problems paying attention, and behavior problems. The investigators
  do not know how many children with arthritis have sleep problems, and how it is
  linked to daytime sleepiness and children's learning, and behavior patterns compared
  to children without arthritis. The investigators need to study both children with
  arthritis and children without arthritis to learn more about these connections and
  to understand if they are the same or different in children with arthritis and in
  children without arthritis. (NCT NCT01434082; status UNKNOWN).
