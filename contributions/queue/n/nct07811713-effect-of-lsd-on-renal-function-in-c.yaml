name: NCT07811713 — Effect of LSD on Renal Function in Cirrhotic Patients With Portal Hypertension
description: Patients with liver cirrhosis and portal hypertension often have impaired kidney function
  due to reduced blood flow to the kidneys and fluid buildup in the abdomen (ascites). Laparoscopy splenectomy
  and azygoportal disconnection (LSD) is a minimally invasive surgery commonly used to treat bleeding
  from swollen veins in these patients, but its impact on kidney function recovery remains unclear. This
  study will review medical records of patients with liver cirrhosis and portal hypertension who underwent
  LSD at our hospital. We will measure kidney function using estimated glomerular filtration rate (eGFR)
  before surgery and at 3, 6, 9, and 12 months after surgery to evaluate changes over time. We will also
  examine whether factors such as fluid buildup in the abdomen (ascites) before surgery are associated
  with kidney function changes after LSD. The goal is to better understand how LSD affects kidney function
  in these patients and to identify factors that may predict kidney function recovery, which could help
  improve care for cirrhotic patients undergoing this surgery. (NCT NCT07811713; status COMPLETED).
