name: NCT03371888 — The Platelet-Rich Plasma in the Therapy of Temporomandibular Disorders
description: 'The Platelet-Rich Plasma intramuscular injections into the masseter
  and temporalis muscle were performed to reduce painful temporomandibular disorder
  symptoms,such as myalgia, myofascial pain and myofascial pain with referrals. Patients(n=120)
  were randomly divided into two groups: experimental(n=60) and control group(n=60).
  In controls injections with 0,9% NaCl were performed. Pain intensity was measured
  with NPRS (numeriic pain rating scale, 0= no pain, 11= the worst pain that one can
  imagine) before(0 day), during(10 day) and after(20 day) the therapy with PRP injections.
  (NCT NCT03371888; status COMPLETED).'
