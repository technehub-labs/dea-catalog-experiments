name: NCT04739670 — Evaluating the Efficacy and Safety of Bevacizumab, Carboplatin,
  Gemcitabine and Atezolizumab in Breast Cancer
description: The study hypothesise that the combination of carboplatin, gemcitabine,
  bevacizumab and atezolizumab may be synergistic and improve outcomes for patients
  with early relapsed TNBC by overcoming mechanisms of immune resistance and thus
  potentiating greater and more durable responses to immune checkpoint inhibitor therapy.
  Early relapsing TNBC represents a high priority, unmet need whereby effective therapeutic
  strategies are urgently needed. (NCT NCT04739670; status UNKNOWN).
