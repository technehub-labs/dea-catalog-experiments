name: NCT05741879 — Gamified Family-based Health Exercise Intervention to Improve Adherence to 24-h Movement
  Behaviors Recommendations in Children.
description: Physical inactivity is the fourth most important risk factor for mortality worldwide and
  it contributes to weight gain and obesity. On the contrary, it is established that regular physical
  activity is a prevention and managerial factor of these non-communicable diseases. Therefore, the goal
  of this study is to design and evaluate the effectiveness of a 12-week physical exercise and lifestyle
  improvement training program carried out in a family environment, through a web platform, and with "online"
  supervision. This platform will improve the physical conditioning and adherence to PE in a "family environment",
  and to promote good development of the child through physical activities and exercises that can be done
  as a family at home and/or outside. (NCT NCT05741879; status COMPLETED).
