name: NCT06897150 — Carotegrast Methyl in Ulcerative Colitis
description: Carotegrast methyl, an oral α4-integrin inhibitor, was recently approved in Japan for the
  treatment of active ulcerative colitis (UC). However, real-world data regarding its efficacy and safety
  remain scarce. This study aimed to assess the clinical effectiveness and safety profile of carotegrast
  methyl in patients with active UC. (NCT NCT06897150; status COMPLETED).
