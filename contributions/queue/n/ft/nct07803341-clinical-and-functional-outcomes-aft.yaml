name: NCT07803341 — Clinical and Functional Outcomes After Subtalar Arthroereisis
  in Pediatric Flexible Flatfoot
description: Flexible flatfoot is common in children and adolescents. In some patients,
  the condition remains painful or limits activity despite non-surgical treatment.
  Subtalar arthroereisis is a minimally invasive operation in which an implant is
  placed in the sinus tarsi to limit excessive foot pronation while preserving joint
  movement. This observational study follows children and adolescents who receive
  subtalar arthroereisis as part of their planned clinical care. Clinical status,
  standing foot radiographs, plantar-pressure distribution, and walking characteristics
  are assessed before surgery and six months after surgery. The study aims primarily
  to describe changes in dynamic plantar loading and walking parameters. Changes in
  clinical scores and radiographic alignment are assessed as secondary outcomes. No
  treatment is assigned for research purposes, and all surgical and postoperative
  decisions are made according to routine clinical indications. (NCT NCT07803341;
  status ACTIVE_NOT_RECRUITING).
