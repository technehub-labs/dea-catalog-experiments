name: NCT06648720 — Efficacy and Safety of Shortening Dual Antiplatelet Therapy Duration with IVUS Guidance
  in PCI Patients
description: This study is designed to assess the efficacy and safety of de-escalating dual antiplatelet
  therapy (DAPT) at 1 month compared to the standard 12 months of therapy in patients undergoing percutaneous
  coronary intervention (PCI) guided by intravascular ultrasound (IVUS). The main outcomes measured will
  include major adverse cardiovascular and cerebrovascular events (NACCE), bleeding events, and target
  vessel failure (TVF). The goal is to evaluate whether a shorter duration of DAPT is non-inferior to
  the standard 12-month regimen in preventing ischemic events while reducing the incidence of bleeding.
  (NCT NCT06648720; status NOT_YET_RECRUITING).
