  diagnosed or relapsed and refractory multiple myeloma patients treated with Lenalidomide Dexamethasone
  (Len-Dex) combination therapy. The pilot feasibility study was conducted in preparation for this randomized
  controlled trial designed to assess the effect of an intervention. (NCT NCT03428373; status UNKNOWN).
