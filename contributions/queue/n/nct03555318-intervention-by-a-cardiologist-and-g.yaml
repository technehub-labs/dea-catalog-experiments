name: NCT03555318 — Intervention by a Cardiologist and Geriatrician in Elderly Patients
  After Admission Due to Heart Failure.
description: Randomized clinical trial in which patients with a recent admission for
  heart failure in the cardiology department of the Hospital de Mar will be randomized
  to usual follow-up (cardiologist of the Heart Failure Unit) or follow-up by cardiologist
  and intervention by the geriatrician. This visit will be done at the same time.
  The main gial of this study is to evaluate whether the combined intervention of
  a cardiologist and a geriatrician reduces hospital all-cause rehospitalizations
  at 1 year. (NCT NCT03555318; status COMPLETED).
