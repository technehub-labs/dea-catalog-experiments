name: NCT00190190 — Internal Limiting Membrane Peeling for Large Macular Holes
description: 'Rational of the study: for macular holes larger than 400 µm the rate of failure is of more
  than 20%. It is for these eyes that it is necessary to show the benefit of internal limiting membrane
  (ILM) peeling in term of vision and success rate. In order to test the benefit of this gesture, it is
  necessary to make a randomized study. Primary objective: To show that the percentage of success (anatomical
  closing, confirmed by OCT) at third postoperative month is higher in the ILM peeling group. Design of
  the study: Randomized multicentric study, in parallel groups, with individual benefit for the patient.
  Tested Hypothesis: The success rate of the surgery of idiopathic macular holes larger than 400 µm is
  increased by the peeling of the MLI. Awaited results: To show that the success rate of the surgery of
  idiopathic macular holes larger than 400 µm is improved by ILM peeling. This category could then have
  a success rate similar to the small holes. If this difference is not proven, it will remain no justification
  to continue this procedure which represents little risk but which is not either without consequence.
  (NCT NCT00190190; status COMPLETED).'
