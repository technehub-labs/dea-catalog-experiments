name: NCT00460408 — Ocular Safety Of Patients Receiving Macugen For Neovascular Age
  Related Macular Degeneration
description: The study will provide additional safety data for specific safety events
  in persons receiving intravitreal injections. The Committee for Medicinal Products
  for Human Use (CHMP) is interested in obtaining additional safety information when
  Macugen is used in real world settings by practitioners in Europe treating patients
  with neovascular (wet) age-related macular degeneration (AMD). The study will provide
  information about physician practice patterns and characteristics of patients treated
  with Macugen. (NCT NCT00460408; status COMPLETED).
