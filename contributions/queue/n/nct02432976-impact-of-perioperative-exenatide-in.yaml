name: NCT02432976 — Impact of Perioperative Exenatide Infusion on Quality of Life in Cardiac Surgery Patients
description: A diminution of quality of life is often reported by patients after coronary artery bypass
  graft (CABG) surgery. A part of this diminution could be explain by postoperative left ventricular (LV)
  dysfunction. Exenatide (Byetta®) is an incretin mimetic, characterized by an anti-hyperglycemic effect
  that depends on the blood glucose level. Recent data have suggested that exenatide could improve LV
  function by an inotropic effect in patients suffering from cardiogenic shock or from congestive heart
  failure. Moreover, patients suffering from congestive heart failure reported a better quality of life
  when they were treated with exenatide compared to placebo. The investigators hypothesize that perioperative
  exenatide infusion could improve postoperative quality of life in CABG surgery patients. (NCT NCT02432976;
  status COMPLETED).
