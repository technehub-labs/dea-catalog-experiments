name: NCT06375603 — Nerve and Plane Block Data Collection Study for the Development
  of Artificial Intelligence-assisted Software
description: The primary objective of this observational study is to acquire ultrasound
  images (raw data) from nerve and plane block regions to develop artificial intelligence-guided
  nerve block software (Nerveblox). The study aims to acquire raw ultrasound video
  from 200 volunteers' planned nerve and plane block regions. These participants will
  undergo ultrasound scans administered by expert clinicians proficient in these techniques
  in their clinical practice. The data collection devices utilized in this study are
  FDA-cleared general-purpose ultrasound devices. (NCT NCT06375603; status COMPLETED).
