name: NCT06872437 — Evaluation of the Efficacy of Therapeutic Infiltrations of the
  Pudendal Nerve, Performed Under Neurostimulation on Pain, 1 Month After an Infiltration
  of Local Anaesthetic, in the Treatm
description: Pudendal neuralgia (PN) is a chronic nerve compression syndrome causing
  neuropathic pain. Treatment includes medication, infiltration and decompressive
  surgery. Medicinal treatment involves the use of drugs that have proved effective
  in other areas, such as shingles or diabetes. There is no consensus on the molecules
  to be used for pudendal nerve infiltration (PNTI), and less than half of patients
  experience short-term relief. The only risk factor for failure is the duration of
  pain. Our study proposes to compare the usual treatment with a placebo, as no type
  of infiltration has been compared with a placebo. (NCT NCT06872437; status RECRUITING).
