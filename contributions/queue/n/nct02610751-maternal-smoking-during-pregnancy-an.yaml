name: NCT02610751 — Maternal Smoking During Pregnancy and Female Fetal Testosterone
  Levels
description: '* The investigators hope their study will answer the question of whether
  or not fetal testosterone levels are increased in female newborns exposed to nicotine
  as a result of maternal smoking during pregnancy. Secondarily they plan to also
  evaluate maternal cotinine and testosterone levels and newborn anogenital distance,
  second digit to fourth digit (2D:4D) finger length ratio, newborn length and birth
  weight. * The investigators hope by performing this study, they will help to uncover
  the effect of tobacco exposure in utero on human female fetal testosterone levels,
  thus improving the counseling for tobacco use in pregnancy. (NCT NCT02610751; status
  COMPLETED).'
