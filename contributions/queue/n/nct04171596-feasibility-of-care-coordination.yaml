description: 'The primary aim of this study is to determine feasibility of incorporating a primary care
  coordinator (PCC) into an integrative concierge primary care practice. Secondary aims include: 1. To
  determine whether the PCC intervention increases patient satisfaction and/or patient activation. 2.
  To determine whether regular telephone contacts from a PCC over a period of 6 months increases the number
  of visits and services by DIPC members. (NCT NCT04171596; status COMPLETED).'
