name: NCT07393360 — Effect of a Food for Special Medical Purposes on Muscle Mass Preservation During GLP-1
  RAs Weight Loss Treatment
description: This study evaluates whether a Food for Special Medical Purposes (FSMP) can help to preserve
  appendicular skeletal muscle mass (ASMM) in adults undergoing weight loss treatment with GLP-1 receptor
  agonists or dual GIP/GLP-1 receptor agonists. Participants will receive the FSMP or a matching placebo
  for 24 weeks while continuing standard GLP-1-based therapy. ASMM will be measured using Bioelectrical
  Impedance Vector Analysis (BIVA). (NCT NCT07393360; status RECRUITING).
