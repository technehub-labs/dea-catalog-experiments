name: NCT06025591 — Shear-Wave Elastography in Deep Vein Thrombosis
description: Compression ultrasonography (CUS), which is the gold-standard for the diagnosis of deep vein
  thrombosis, cannot provide adequate information on the timing of the onset of thrombosis. Shear-Wave
  elastography, a technique used to assess tissue elasticity and widely used in hepatology, could play
  a crucial role in distinguishing between acute and chronic deep vein thrombosis. This study aims at
  evaluating the efficacy and diagnostic and prognostic accuracy of Shear-Wave elastography in distinguishing
  between acute and chronic deep vein thrombosis. (NCT NCT06025591; status UNKNOWN).
