name: NCT04038437 — A Trial of CPX-351 Lower Intensity Therapy (LIT) Plus Venetoclax as First Line Treatment
  for Subjects With AML
description: 'Study CPX351-103 is an open-label, multicenter, phase 1b, safety and PK study to determine
  the MTD of the combination of CPX 351 and venetoclax when administered to subjects with newly diagnosed
  AML who are unfit for intensive chemotherapy (ICT) and to determine the recommended phase 2 dose (RP2D)
  for the Expansion Phase. This study will comprise 2 phases: a Dose Exploration Phase (Part 1) and an
  Expansion Phase (Part 2), in which all subjects will receive a combination of CPX-351 and venetoclax.
  (NCT NCT04038437; status COMPLETED).'
