name: NCT03881969 — Does Paying Subjects to Participate in Research Improve Recruitment
description: Patient recruitment into clinical trials is a major challenge and the
  elderly, socially deprived and those with multiple co-morbidities are often under-represented.
  The idea of paying patients an incentive to participate in research is controversial
  and evidence is needed to evaluate this as a recruitment strategy. This study aims
  to assess the impact on recruitment into five current clinical trials of a £100
  incentive payment and whether this payment will attract more elderly and socially
  deprived patients. (NCT NCT03881969; status COMPLETED).
