name: 'NCT05826041 — Project INSPIRE: INtervention Support Groups: Peers Inspiring Resilience and Empowerment'
description: The investigators will develop a new, integrated, group intervention to enhance safety, support,
  and empowerment for survivors of intimate partner violence in the community. The intervention will consist
  of 9 weekly, 90-minute group sessions that will teach specific skills for identifying various forms
  of trauma and abuse, developing mutually supportive relationships, safety planning and self-care, goal-oriented
  communication, empowerment and self-efficacy, goal setting, coping, and connecting to resources. The
  investigators will pilot test the intervention, including evaluating the process of implementation,
  including feasibility, acceptability/likeability, and safety, as well as evaluating outcomes of safety,
  support, and empowerment. Outcomes from the intervention will be compared to outcomes from a traditional
  domestic violence support group. (NCT NCT05826041; status TERMINATED).
