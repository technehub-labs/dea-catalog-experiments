name: NCT06788951 — The Effect of Oral Carbohydrate Inhalation Given to Patients Before Coronary Artery
  Bypass Graft Operation on Recovery
description: The aim of this study was to investigate the effect of oral carbohydrate solution given to
  patients before coronary artery bypass graft surgery on nausea-vomiting, hunger, thirst, physiologic
  parameters and recovery. The study will be completed with a total of 120 participants, 40 control, 40
  placebo and 40 experimental. As a randomization method, simple randomization method will be used to
  provide an equal number of samples in three groups and patients will be informed verbally about the
  study and written informed consent will be obtained from patients who agree. In this study, the effects
  of oral carbohydrate solution administration on nausea and vomiting, hunger, thirst, physiologic parameters
  and recovery were evaluated before coronary artery bypass graft surgery. (NCT NCT06788951; status COMPLETED).
