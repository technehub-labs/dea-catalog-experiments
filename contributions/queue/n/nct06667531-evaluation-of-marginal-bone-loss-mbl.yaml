name: NCT06667531 — Evaluation of Marginal Bone Loss (MBL) 12 Months Post-loading of Implants Supporting
  Individual Crowns, Based on the Height of the Intermediate Abutment and Its Placement Time. Immediate
description: 'Objectives:To determine which combination of abutment height and timing of placement is
  most effective in reducing marginal bone loss (MBL). Materials and Methods: 54 patients received at
  least one single screw-retained crown on an implant replacing a posterior tooth (60 implants). The implants
  were divided into six treatment groups based on the height (1.5 mm; 2 mm; 3 mm) and timing of placement
  (immediate: surgery 1; delayed: surgery 2) of the intermediate abutment: group 1 (height 3; surgery1),
  group 2 (height 2; surgery1), group 3 (height 1.5; surgery1), group 4 (height 3; surgery2), group 5
  (height 2; surgery2), group 6 (height 1.5; surgery2). Mesial and distal linear radiographic measurements
  (from the implant shoulder to the bone crest) were performed at five follow-up times: implant surgery,
  crown placement (T1), and at 3 (T2), 6 (T3), and 12 months after loading (T4). Partial and total MBL
  were compared among the treatment groups. (NCT NCT06667531; status COMPLETED).'
