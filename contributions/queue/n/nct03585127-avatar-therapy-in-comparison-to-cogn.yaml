name: NCT03585127 — Avatar Therapy in Comparison to Cognitive Behavioral Therapy for
  Treatment-resistant Schizophrenia
description: Schizophrenia is associated with long-lasting health, social and financial
  burden for patients, families, caregivers and society. Unfortunately, 25-30% of
  schizophrenia patients respond poorly to antipsychotic medication. Moreover, psychotherapeutic
  treatment alternatives are very limited for this suffering population. This unmet
  clinical need requires innovation and action. Psychotherapeutic treatment alternatives
  such as Cognitive Behavior Therapy (CBT) provide at best moderate results. Using
  immersive virtual reality, we recently tested a novel psychotherapeutic intervention,
  Avatar Therapy (AT), where the therapist engages in a dialogue with the patient
  through a virtual representation of the patient's distressing voice. This approach,
  being both relational and experiential, provides a unique opportunity to aid patients
  gain control over their voice. The results of our pilot study on AT were clinically
  promising for the severity and distress related to hallucinations, positive symptomatology
  and emotion regulation. To further research in this field, the primary goal of this
  randomized-controlled, single-site parallel study is to show that AT is superior
  to CBT for the treatment of persistent auditory hallucinations in schizophrenia.
  Our secondary goal is to examine the effects of these interventions on emotion regulation,
  mood symptoms (anxiety and depression), self-esteem, level of functioning and quality
  of life. (NCT NCT03585127; status COMPLETED).
