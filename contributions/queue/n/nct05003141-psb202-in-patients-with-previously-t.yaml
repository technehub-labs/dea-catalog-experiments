name: NCT05003141 — PSB202 in Patients With Previously Treated-, Relapsed-, Indolent
  B-Cell Malignancies
description: 'Product: PSB202 is a novel biological entity consisting of two engineered
  monoclonal antibodies, an Fc-enhanced humanized type II anti-CD20 IgG1 (PSB102)
  and a humanized anti-CD37 IgG1 (PSB107), that target B-cells. PSB202 is manufactured
  to work as a single product with the two components of PSB202 enabling a distinct
  dual target-specific antibody directed cell killing of B-cells. Study: Multi-center-,
  International Phase 1a/1b (Escalation/Expansion) study in patients with indolent-,
  relapsed-, B-cell malignancies. The Phase 1a (Dose Escalation) part of study follows
  a 3+3 design. (NCT NCT05003141; status UNKNOWN).'
