name: NCT02397161 — Mental Attention-neuromuscular Training for Children With Developmental Coordination
  Disorder
description: 'Objective: To compare the effectiveness of EEG biofeedback mental attention-neuromuscular
  training (AT-NMT), neuromuscular training (NMT) alone, EEG biofeedback mental attention training (AT)
  alone, and no intervention for improving reactive balance performance among children with developmental
  coordination disorder (DCD). Design: A single-blinded, randomized controlled clinical trial. Sample:
  172 children with DCD. Interventions: AT-NMT, NMT, AT, or no intervention for 12 weeks. Major outcomes:
  Outcomes will be evaluated at baseline, post-intervention, and 3-month follow-up. A motor control test
  (MCT) will give a composite latency score, prefrontal cortex EEG recordings during MCT will measure
  the mental attention level, and surface electromyography recordings during MCT will indicate the lower
  limb muscle onset latency. (NCT NCT02397161; status UNKNOWN).'
