name: NCT00244517 — DIAFAX I+II-Effects of Inhalative Anesthetics on Left Ventricular Diastolic Function
description: Anaesthetics may impair the diastolic function of the heart, but the importance of this finding
  for patients has not been sufficiently examined. Specially the effects on diastolic function in patients
  with diastolic dysfunction has to be determined. The aim of this study is to examine the effect of isoflurane
  (only part I), sevoflurane and desflurane (part I+II) on the diastolic left ventricular function by
  doppler echocardiography. (NCT NCT00244517; status TERMINATED).
