name: NCT06774222 — A Study of Fruquintinib Plus Chemotherapy for Postoperative Treatment of HER2-Negative
  Gastric Cancer With Poor TRG
description: Given that a significant proportion of locally advanced gastric cancer patients still die
  from tumor recurrence after surgery, with long-term therapeutic outcomes stagnating and difficult to
  further improve, especially for patients with poor tumor regression grade (TRG) after surgery, this
  study aims to explore a new model of adjuvant therapy by conducting research on the use of Fruquintinib
  in combination with standard chemotherapy for postoperative treatment of HER2-negative gastric cancer
  patients with poor TRG, in order to bring greater survival benefits to patients. (NCT NCT06774222; status
  RECRUITING).
