name: NCT06836973 — Blinatumomab for Treatment of Refractory Myasthenia Gravis
description: 'The goal of this clinical trial is to evaluate the efficacy and safety of Blinatumomab in
  the treatment of refractory myasthenia gravis, with the expectation of offering a new therapeutic option
  for refractory patients. The main questions it aims to answer are: * Does Blinatumomab improve patients''
  clinical symptoms? * Is Blinatumomab safe for the treatment of myasthenia gravis? Participants will:
  * Receive two cycles of intravenous Blinatumomab infusion, each lasting 5 days, with a 1-week interval
  between cycles. * Visit the clinic once every 4 weeks for checkups and tests. * Keep a diary of their
  symptoms and the types and dosages of medications. (NCT NCT06836973; status NOT_YET_RECRUITING).'
