name: NCT06352320 — Risk Stratification and New Early Prevention and Treatment Strategies for Patients
  With Cardiomyopathy (STRENGTH）
description: This study will include patients with different types of cardiomyopathy from multiple centers
  were prospectively enrolled in a retrospective study to establish a natural population cohort of cardiomyopathy
  patients. By collecting clinical data and biological samples from surgical patients, we will construct
  a prognostic system for cardiomyopathy, optimize risk stratification, explore new strategies for the
  early prevention and treatment of cardiomyopathy, and improve the efficiency of clinical cardiomyopathy
  patients' diagnosis and treatment. (NCT NCT06352320; status RECRUITING).
