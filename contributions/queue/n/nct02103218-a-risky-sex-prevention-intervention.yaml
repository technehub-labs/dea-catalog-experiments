name: NCT02103218 — A Risky Sex Prevention Intervention for Middle School Age Minority Girls
description: African American adolescent females are more likely to have sex at an early age, to have
  older sex partners that have had multiple sexual experiences, and are less likely to use a condom than
  their white counterparts. Lack of sexual assertiveness is a factor in the risky sex behaviors of young
  African American women. African American girls at the greatest risk for contracting HIV are the ones
  that report that their partners could convince them to have sex and report trouble communicating their
  wishes related to sex. Thus far no intervention has addressed the disparate rate of HIV infection in
  young African American girls. This study is unique in promoting increases in racial pride as a component
  of empowerment to help African American girls self-protect against HIV. The study has the potential
  to empower young African American girls to delay sex initiation or reduce risky sex behaviors and thus
  reduce their risk of contracting HIV. (NCT NCT02103218; status COMPLETED).
