name: NCT01211496 — The Effect of Velocity Training in Functionally Limited Elderly
description: We are exploring a unique weight-training program for men and women 65
  years or older that emphasizes high speed training. We believe that the speed at
  which muscles move may be more important to the performance of functional tasks
  than how strong the muscles are. We are comparing velocity training with traditional
  strength training to determine which method has the greatest effects on muscle strength,
  speed of movement, functional performance and physical disability. We believe that
  higher speed training will improve these measures to a greater extent than simply
  training for increased muscle strength. Aging also results in loss of bone mass,
  which increases the risk for falls and fractures. Strength training also has been
  shown to maintain bone mass in the elderly, but no studies have examined high velocity
  resistance training and maintenance of bone mass. We believe it is important to
  examine this aspect of velocity training before recommendations can be made. (NCT
  NCT01211496; status COMPLETED).
