name: NCT04009382 — Modulation Effects of Baduanjin Exercise on Subjective Cognitive Decline
description: The aim of this study is to investigate the modulation effects of Baduanjin (BDJ), a simple
  and innovative mind-body exercise, on cognitive function, resting state functional connectivity, and
  brain morphometry in individuals with subjective cognitive decline (SCD). The results obtained will
  provide novel insights for improving the prevention of age-related cognitive decline and Alzheimer's
  disease. (NCT NCT04009382; status COMPLETED).
