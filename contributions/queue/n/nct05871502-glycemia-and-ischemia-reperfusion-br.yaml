name: NCT05871502 — Glycemia and Ischemia Reperfusion Brain Injury in Patients With Acute Cerebral Infarction
  Treated With Mechanical Thrombectomy
description: Postictus hyperglycemia is associated with an accelerated transformation of the ischemic
  penumbra into an infarct area, with increased infarct size, worse recanalization, reduced cerebral perfusion,
  increased ischemia reperfusion damage, and worse outcome. Furthermore, when perfusion is reinstated,
  hyperglycemia causes secondary tissue damage through an increase in ischemic reperfusion damage. Thus,
  those patients with glycemia values \< 155 mg/dL during mechanical thrombectomy, and especially at the
  time of reperfusion, will have greater ischemia-reperfusion damage, showing a different profile in miRNA
  expression, with better neurological and functional outcomes and higher risk of hemorrhagic transformation
  and cerebral edema. The main objective of the study is to evaluate the association between glycemia
  values at the time of reperfusion and stroke recovery at 3 months in patients with acute cerebral infarction
  treated with mechanical thrombectomy. (NCT NCT05871502; status COMPLETED).
