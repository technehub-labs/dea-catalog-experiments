name: NCT07307235 — Efficacy and Safety of iGlarLixi Versus Standard of Care in a
  Real-world Adult China Population With Uncontrolled Type 2 Diabetes on Oral Agents
description: 'This study is a prospective, open-label, multicenter, parallel-group,
  positive-controlled, and pragmatic randomized clinical trial (pRCT). It will compare
  the efficacy and safety of iGlarLixi versus standard of care in adult T2DM patients
  with poor glycemic control, who are using 1 to 3 OADs in a real-world clinical practice
  setting. A total of 1,316 subjects from approximately 40 research centers in China
  will be randomly assigned in a 1:1 ratio to one of the following treatment groups:
  Group 1: iGlarLixi for blood glucose control; and Group 2: Standard of care for
  diabetes (basal insulin or premixed insulin, excluding any GLP-1RA-containing drugs).
  Considering the substantial difference in intervention methods between the two groups,
  the study is designed as non-blinded with an open-label approach. (NCT NCT07307235;
  status RECRUITING).'
