name: NCT05318053 — International Kink Health Study
description: 'The study design is an observational, longitudinal study with data collected
  online via a computer-assisted survey. Subjects will be recruited through non-probability
  snowball sampling. Objectives: 1. to document the prevalence of injuries and medical
  complications arising from kink activities 2. to document how healthcare is utilized
  by kink-involved people 3. to document the health outcomes particular to a large
  sample of kink-involved people 4. to test whether the centrality of kink identity
  and degree of community belongingness affect injuries, health outcomes, and healthcare
  utilization (NCT NCT05318053; status COMPLETED).'
