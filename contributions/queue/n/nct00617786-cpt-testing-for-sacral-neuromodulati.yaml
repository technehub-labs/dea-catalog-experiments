description: This is a prospective study. Subjects will be recruited from the urology practices of Dr.
  Ken Peters and Dr. Ananias Diokno at William Beaumont Hospital. Subjects will be referred to the study
  by the clinician recommending Sacral NeuroModulation therapy (SNM). This pilot study is to explore the
  effect of SNM on sensory pathways by measuring CPT values pre and post SNM treatment. (NCT NCT00617786;
  status COMPLETED).
