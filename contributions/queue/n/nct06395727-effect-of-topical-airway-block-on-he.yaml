name: NCT06395727 — Effect of Topical Airway Block on Hemodynamic Stability Post Induction
  of Anaesthesia in Cardiac Surgeries
description: Opioids have always been the mainstay in management of patients during
  cardiac surgeries. Mega doses are often used to relieve stress of surgeries in highly
  labile patients with narrow hemodynamic threshold to keep the balance between oxygen
  demand and supply. Unfortunately, this is associated with hemodynamic instability
  and affect the fast-track pathway for extubation. Most of these doses are given
  in induction, so by blocking airway by non-invasive technique, this will help in
  the reduction in opioid doses and preventing risky hemodynamic instability during
  induction of anesthesia in these patients. (NCT NCT06395727; status COMPLETED).
