name: NCT04489589 — Midodrine for the Early Liberation of Vasopressor Support in the ICU
description: Vasopressors are medications that are given intravenously to increase the blood pressure
  of patients with illnesses that cause dangerous blood pressure drops. When a doctor prescribes a vasopressor,
  they ask that the dose be adjusted to achieve a specific blood pressure. This kind of medical support
  with intravenous (IV) vasopressors are usual treatments in intensive care unit (ICU) settings. Oral
  vasopressors, such as midodrine, have been historically used to maintain blood pressure in non-critically
  ill patients. In this study, the investigators will be using midodrine to reduce the need for IV vasopressors
  as blood pressure improves during the stay in the ICU The LIBERATE pilot study will evaluate the role
  of midodrine for patients with low blood pressure in the ICU. The investigators are planning on enrolling
  up to 20 study participants to evaluate this question in the General Systems ICU at the University of
  Alberta Hospital. (NCT NCT04489589; status COMPLETED).
