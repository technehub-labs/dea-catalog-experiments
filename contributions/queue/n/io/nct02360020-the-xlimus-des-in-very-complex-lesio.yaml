name: NCT02360020 — The XLIMUS-DES in Very Complex Lesions
description: Stent delivery failure occurs in 4% of all percutaneous coronary interventions
  (PCI) and \>90% of these failures are due to vessel tortuosity and/or calcification.
  The XLIMUS eluting coronary stent (CARDIONOVUM GmbH, Bonn, Germany) is a new type
  of endovascular prostheses characterised by better mechanical properties than traditional
  DES. This is a prospective, non-randomized, single-center pilot study, aiming to
  evaluate the performance of the XLIMUS DES in severely complex coronary lesions
  in real-world clinical practice. (NCT NCT02360020; status COMPLETED).
