name: NCT07626996 — Laparoscopic Versus Open Radical Hysterectomy in Early-Stage Cervical Cancer
description: 'The study aims to compare laparoscopic-assisted radical hysterectomy with open radical hysterectomy
  in women with early-stage cervical cancer. A total of 60 patients diagnosed with FIGO stage IA1, IA2,
  and IB1 cervical cancer were enrolled and randomly assigned into two equal groups: laparoscopic surgery
  and open surgery. All patients underwent total hysterectomy, bilateral adnexectomy, and pelvic lymph
  node dissection. Perioperative outcomes were evaluated, including operative time, blood loss, complications,
  and hospital stay, as well as long-term oncological outcomes such as recurrence, recurrence-free survival,
  and overall survival. Patients were followed for up to three years postoperatively. The findings of
  this study aim to assess the safety, feasibility, and clinical effectiveness of laparoscopic-assisted
  surgery compared with the conventional open approach in the management of early-stage cervical cancer.
  (NCT NCT07626996; status COMPLETED).'
