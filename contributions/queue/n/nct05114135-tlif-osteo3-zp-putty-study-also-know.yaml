name: NCT05114135 — TLIF Osteo3 ZP Putty Study (Also Known as the TOP Fusion Study)
description: In recent years there has been an increase in interest from surgeons in the use of synthetic
  bone graft substitutes to avoid the need of sourcing allograft or iliac crest autograft for use in spinal
  fusion procedures. This will be an open label, prospective, first in man, single-centre clinical study
  to evaluate the safety and performance of Osteo3 ZP Putty synthetic bone graft in TLIF procedures with
  instrumented PLF. Safety and performance data obtained in this clinical study will be used to estimate
  clinical success rates achieved with the use of Osteo3 ZP Putty synthetic bone graft in TLIF procedures.
  No comparative control group is intended. The study is expected to run for approximately three years
  with each subject being followed up for a two- year post-operative period. The target is to recruit
  approximately 17 subjects to this clinical study, allowing for some subject attrition to get 15 evaluable.
  (NCT NCT05114135; status COMPLETED).
