  and pulmonary effect in children after surgical repair of congenital heart disease with right ventricular
  hypertrophic ventilated with Pressure control ventilation (PCV), Pressure support ventilation (PSV),
  and NAVA by a crossover study. (NCT NCT04825054; status UNKNOWN).
