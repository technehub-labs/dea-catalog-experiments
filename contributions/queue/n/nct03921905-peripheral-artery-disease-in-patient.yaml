name: 'NCT03921905 — Peripheral Artery Disease in Patients With Stable Coronary Artery
  Disease in General Practice: Prevalence, Management and Clinical Outcomes.'
description: Patients with lower extremity peripheral artery disease (PAD) are at
  risk of developing major adverse limb events and have a similar cardiovascular (CV)
  morbidity and mortality to those with coronary artery disease (CAD) with which is
  associated in most cases with a more severe prognosis. Because of higher risk conferred
  by concomitant PAD an early diagnosis is recommended in subjects with CAD. PAD can
  be diagnosed relatively easily and noninvasively with the ankle-brachial index (ABI)
  measure. An ABI ≤0.9 is an indicator of the presence of lower extremity PAD, indicating
  athero-occlusive arterial disease while \>1.3/1.4 indicates an incompressible ankle
  arteries. However, ABI is not routinely applied in the clinical practice. Data on
  prevalence of PAD are scanty and in patients with stable CAD are lacking. The under-diagnosis
  of PAD may be a barrier to the use of treatments to improve prognosis. The primary
  aim of this study is to assess the coexistence of PAD in subjects with stable CAD
  and to evaluate the management and the prognosis of these patients in primary care
  at 12-month after the inclusion in the study. (NCT NCT03921905; status COMPLETED).
