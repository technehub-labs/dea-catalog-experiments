name: NCT01612156 — Lubricant Versus Lidocaine Gel for Pain Control During Urodynamics
description: The purpose of this study is to determine a difference in patient reported
  pain levels before, during, and after multichannel urodynamics in patients treated
  with 2% lidocaine gel or water based lubricant. We hypothesize that lidocaine gel
  will decrease pain levels when compared to lubricant gel. (NCT NCT01612156; status
  COMPLETED).
