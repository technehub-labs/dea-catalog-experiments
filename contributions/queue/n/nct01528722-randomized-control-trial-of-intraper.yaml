name: NCT01528722 — Randomized Control Trial of Intraperitoneal Bupivacaine During Cholecystectomy
description: Laparoscopic cholecystectomy (removal of the gall bladder via 'keyhole surgery') is a common
  procedure. This can be performed as an emergency operation when a patient has a complication of gall
  stones such as acute inflammation or pancreatitis. There are several trials which demonstrate that placing
  local anaesthetic inside the abdomen at the site of gall bladder surgery during a planned elective operation
  decreases post operative pain. This is the first trial to investigate the efficacy of this local anaesthetic
  during emergency cholecystectomy. (NCT NCT01528722; status COMPLETED).
