name: NCT04919954 — Tebipenem (SPR994) Tissue Penetration in Diabetic Patients With
  Wound Infections and Healthy Volunteers Via In Vivo Microdialysis
description: This study will determine the tissue penetration of a broad-spectrum
  orally bioavailable carbapenem, tebipenem pivoxil hydrobromide (SPR994) (Spero Therapeutics,
  Inc.), into the extracellular, interstitial fluid of soft tissue in diabetic patients
  with lower limb wound infections. Penetration will be compared with a group of healthy
  volunteer control participants. (NCT NCT04919954; status COMPLETED).
