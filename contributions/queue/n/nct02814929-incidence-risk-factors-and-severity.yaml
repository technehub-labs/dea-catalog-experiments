name: NCT02814929 — Incidence, Risk Factors and Severity of Retinopathy of Prematurity (ROP) in Turkey
description: The study includes preterm infants who are being screened for ROP between April 1,2016 and
  April 30, 2017 in 69 neonatal intensive care units (NICUs) in Turkey. Infants with birth weight (BW)
  of ≤1500 g or ≤32 weeks' gestation and those with a BW of greater than 1500 g or gestational age (GA)
  \>32 weeks with an unstable clinical course are included. The incidence of any ROP, severe ROP and treatment
  modalities will be determined. The risk factors for ROP development will also be evaluated. (NCT NCT02814929;
  status COMPLETED).
