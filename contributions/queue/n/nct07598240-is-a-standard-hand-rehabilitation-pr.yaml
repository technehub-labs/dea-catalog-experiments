name: NCT07598240 — Is a Standard Hand Rehabilitation Program Sufficient in Rheumatoid
  Arthritis Patients With Central Sensitization
description: The presence of central sensitization leads to overestimation of pain
  sensitivity and disease activity in rheumatoid arthritis (RA) patients. Central
  sensitization should not be overlooked in RA patients to avoid over-treatment for
  inflammation and to determine the need for treatment of nociplastic pain. While
  literature contains no studies comparing alternative programs with the standard
  hand rehabilitation program in the presence of central sensitization in rheumatoid
  arthritis patients, the objective of this study is to investigate whether desensitization
  exercises provide additional benefit in this patient group. (NCT NCT07598240; status
  ACTIVE_NOT_RECRUITING).
