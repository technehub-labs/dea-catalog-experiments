name: NCT07812779 — Thyroid Health Outcomes Registry for Surgery
description: THORS is a single-center ambidirectional observational cohort study conducted
  at Moscow Multidisciplinary Clinical Center "Kommunarka". The study combines retrospective
  analysis of routinely collected clinical data from patients who underwent thyroid
  surgery beginning in January 2023 with ongoing prospective accrual of new eligible
  patients and longitudinal updating of follow-up information. No diagnostic or therapeutic
  intervention is assigned by the research protocol; all treatment decisions are made
  as part of routine clinical care. The program evaluates the structure and outcomes
  of thyroid surgery, postoperative complications, histopathology, repeat and completion
  procedures, long-term oncologic and functional outcomes, health-care resource use,
  and the quality and reproducibility of real-world data. Applicable outcomes from
  the international Core Outcome Set for surgical treatment of differentiated thyroid
  carcinoma (COS-DTC) are incorporated where they can be reliably measured. The first
  frozen historical analytical baseline includes 968 unique patients and 1,017 thyroid
  operations performed from 06 January 2023 through 13 February 2026. The cohort remains
  open to ongoing enrollment and follow-up (NCT NCT07812779; status NOT_YET_RECRUITING).
