name: NCT06578442 — Effectiveness of Electromagnetic Field Therapy in Chronic Constipation
description: 'This study was, randomise controlled study. The aim of this study was to determine the effect
  of transabdominal magnetic field therapy on constipation severity in patients with chronic functional
  constipation. After eligibility assessment and baseline measurements, participants were randomly allocated
  into three groups: the transabdominal magnetic field therapy group, the sham group, and the standard
  care group. All groups received Constipation Management Education. The education program, developed
  based on the literature, covered the definition, causes, risk factors, medication use, and lifestyle-related
  factors associated with constipation. In addition, behavioral recommendations were provided, including
  maintaining regular bowel habits, adopting an appropriate defecation posture, avoiding delayed defecation
  and excessive straining, and optimizing diet, fluid intake, and physical activity. The MFT group received
  active transabdominal magnetic field therapy twice weekly for 8 weeks. The sham group underwent the
  same device placement and session protocol; however, the device was used without delivering an active
  magnetic field. The standard care group received only Constipation Management Education. Participants
  were followed face to face for 8 weeks, and individual counseling was provided when needed to answer
  their questions. The primary outcome measure was the Constipation Severity Instrument (CSI). Secondary
  outcomes were the CSI subscales, the Patient Assessment of Constipation Quality of Life questionnaire
  (PAC-QOL), the Bristol Stool Form Scale, complete spontaneous bowel movements (CSBM), and defecation
  time. (NCT NCT06578442; status COMPLETED).'
