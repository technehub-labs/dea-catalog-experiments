description: The objective of this study is to evaluate the immune profile of blast
  cells and immune effector cells in paired peripheral whole blood and bone marrow
  samples from AML and MDS patients by standardized flow cytometry. A special emphasis
  will be focused on monitoring expression of CD200 as well as PGP-170 (MDR1) on blasts
  cells. (NCT NCT03801005; status COMPLETED).
