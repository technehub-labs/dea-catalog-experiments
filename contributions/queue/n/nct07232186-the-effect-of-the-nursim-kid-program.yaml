name: NCT07232186 — The Effect of the NURSIM-KID Program for Migrant Children Hospitalized in Hospitals
  on the Nursing Image of Children and Parents
description: The nursing profession has a dynamic image in society, shaped by individuals' lives, cultural
  backgrounds, and interactions with healthcare services. The image of nursing formed during childhood,
  in particular, directly influences individuals' attitudes toward healthcare professionals and their
  participation in healthcare services. Migrant children, however, may perceive the nursing profession
  in a more limited and negative context due to reasons such as unfamiliarity with the hospital environment,
  language barriers, and cultural differences. Based on this, the aim of this study is to evaluate the
  effect of the NURSIM-KID program, developed for migrant children aged 8-11 years receiving inpatient
  treatment in the pediatric ward of Kilis Prof. Dr. Alaeddin Yavaşca State Hospital, on the images of
  the nursing profession held by children and their parents. The program aims to contribute to introducing
  the nursing profession in a more positive and functional way, using methods appropriate to the children's
  age and developmental level. The limited number of studies in the literature addressing the perceptions
  of migrant children and their parents regarding the image of nursing highlights the importance of this
  research and the original contribution it will make to the field. The findings of the study are of a
  nature that could guide the development of nursing education, child-friendly hospital practices, and
  culturally supportive initiatives. (NCT NCT07232186; status COMPLETED).
