name: NCT07434986 — Overnight TI in TLE
description: 'The goal of this clinical trial is to gauge whether overnight, non-invasive temporal interference
  (TI) stimulation aimed at the hippocampus can reduce abnormal brain activity linked to seizures and
  improve sleep in adults with drug-resistant temporal lobe epilepsy. The main questions are: Does overnight
  TI stimulation lower seizure-related EEG activity during sleep? Does overnight TI stimulation improve
  sleep quality and sleep patterns measured overnight in the lab? Researchers will compare each participant''s
  nights without stimulation to nights with active stimulation, and will also look at a night after stimulation
  ends to see whether any changes last. Participants will: Stay in-lab for six days for overnight sleep
  and EEG monitoring Have one night of monitoring without stimulation Receive TI stimulation during sleep
  for several nights Have another night of monitoring without stimulation after the stimulation nights
  Complete brief questionnaires and thinking/memory tasks before and after the stimulation nights Be checked
  for side effects and comfort during the study and at follow-up (NCT NCT07434986; status RECRUITING).'
