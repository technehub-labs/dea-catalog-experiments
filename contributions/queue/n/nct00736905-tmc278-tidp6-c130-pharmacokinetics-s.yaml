name: 'NCT00736905 — TMC278-TiDP6-C130: Pharmacokinetics, Safety and Tolerability of TMC278 in Subjects
  With Mildly or Moderately Impaired Hepatic Function.'
description: The purpose of this study is to investigate the pharmacokinetics (how the drug is absorbed
  into the bloodstream, distributed in the body and eliminated from the body) after a single dose and
  after repeated administration of TMC278 administered once daily for 11 days in subjects with mild or
  moderate hepatic impairment (impaired liver function), compared with healthy control subjects. Furthermore
  the short-term safety and tolerability (how well the body tolerates the drug) of TMC278 will be assessed.
  (NCT NCT00736905; status COMPLETED).
