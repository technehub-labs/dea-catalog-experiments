name: NCT03144869 — Physical Activity Monitoring Paediatric Type 1 Diabetes
description: Physical activity (PA) can have positive health outcomes for children with type 1 diabetes
  (T1DM), yet being physically active can have unwanted side effects due to fluctuations in blood glucose
  (BG) level. Children and parents need support to help understand the relationship between PA and BG
  level, and how to use PA as a vehicle to better manage the condition. Using PA monitoring could help
  HCPs raise awareness about PA, discuss PA and facilitate diabetes management. This research will explore
  the feasibility and acceptability of PA monitoring as a clinical tool to help the management of paediatric
  T1DM. (NCT NCT03144869; status COMPLETED).
