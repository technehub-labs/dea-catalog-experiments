name: NCT02351050 — Sonolysis in Risk Reduction of Symptomatic and Silent Brain Infarctions
  During Coronary Stenting
description: The aim of the project is to demonstrate a fibrinolytic effect of sonothrombolysis
  (continual transcranial Doppler monitoring) using 2 MHz diagnostic probe on the
  reduction of risk of brain infarctions due to the activation of endogenous fibrinolytic
  system during angioplasty and stenting of coronary arteries. 120 patients indicated
  for coronary angioplasty and stenting will be enrolled into the study in order to
  demonstrate a twenty-percent risk reduction of number and volume of brain infarctions
  detected using MRI examination 24 hours after cardiac endovascular treatment in
  5% level of significance. Patients will be randomized - subgroup 1 will undergo
  a 40-240 minute non-diagnostic TCD monitoring during endovascular procedure, subgroup
  2 will undergo interventions without TCD monitoring. Confirmation of our hypothesis
  that sonothrombolysis is able to activate endogenous fibrinolytic system during
  coronary angioplasty and stenting with consecutive reduction of the number and volume
  of brain infarcts, can lead to the increase of the safety these patients. We can
  presume that up to 50% of patients indicated for endovasular heart treatment can
  be treated using these methods in the future. (NCT NCT02351050; status COMPLETED).
