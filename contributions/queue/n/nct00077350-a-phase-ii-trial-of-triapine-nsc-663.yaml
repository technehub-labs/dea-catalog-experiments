name: 'NCT00077350 — A Phase II Trial of Triapine (NSC #663249) in Combination With
  Gemcitabine as Second Line Treatment of Non-Small Cell Lung Cancer'
description: Drugs used in chemotherapy, such as 3-AP and gemcitabine, work in different
  ways to stop tumor cells from dividing so they stop growing or die. Giving 3-AP
  together with gemcitabine may kill more tumor cells. This phase II trial is studying
  how well giving 3-AP together with gemcitabine works as second-line therapy in treating
  patients with progressive or recurrent non-small cell lung cancer (NCT NCT00077350;
  status COMPLETED).
