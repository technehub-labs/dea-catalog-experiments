name: NCT04105582 — Breast Cancer Neoantigen Vaccination With Autologous Dendritic Cells
description: In this project, the investigators propose the first clinical study in Colombia of vaccination
  of patients with triple-negative breast cancer (TNBC) using synthetic peptides that contain mutations
  of the tumor itself that will be presented to the immune system by autologous dendritic cells to assess
  immunogenicity and safety of this type of personalized vaccine. Achieving the specific objectives set
  out in this project will mean that the investigators can validate in Colombia the experimental design
  necessary to identify exclusive epitopes in the tumors of the participants in this study, and also that
  have been able to demonstrate the safety and immunogenicity of these vaccines. (NCT NCT04105582; status
  COMPLETED).
