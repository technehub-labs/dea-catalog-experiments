name: NCT04863690 — Assessing the Effects of the Muse Sleep Intervention on Sleep
description: In this study, we will examine whether use of the Sleep Intervention protocol marketed by
  Interaxon (the 'Muse'), leads to improvements in sleep quality (e.g. decreased latency to sleep, improved
  sleep duration), as well as knock-on improvements on measures of mindfulness, improvement in quality
  of life scores, reduction in perceived stress levels, anxiety, improvements in cognitive performance,
  improvement in markers relevant for safety, and increased success in the workplace in healthy participants.
  (NCT NCT04863690; status COMPLETED).
