name: NCT07810725 — Effect of a Myopia Control Lens on the Astigmatism in Children
description: 'The goal of this clinical trial is to investigate over a one-year period the effect of myopia
  control spectacle lenses on astigmatism in children aged 6 to 13 years with myopia and astigmatism.
  The main question it aims to answer is: \- How does the eye respond at each timepoint to the myopia
  control lenses? By evaluating: the change in astigmatism (cylinder) after one year? Participants will:
  Wear the assigned study spectacles daily Visit the Essilor R\&D Centre for scheduled follow-up sessions
  (NCT NCT07810725; status NOT_YET_RECRUITING).'
