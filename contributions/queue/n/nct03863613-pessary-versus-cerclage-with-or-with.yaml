name: NCT03863613 — Pessary Versus Cerclage With or Without Progesterone in Twins
description: This study compares the effectiveness of cervical pessary and cervical cerclage with or without
  vaginal progesterone for prevention of preterm birth in women with a twin pregnancy and a cervix ≤28
  mm. Participants will be randomly assigned in a 1:1:1:1 ratio to receive cerclage, pessary, cerclage
  plus progesterone or pessary plus progesterone. (NCT NCT03863613; status TERMINATED).
hypothesis: This study compares the effectiveness of cervical pessary and cervical cerclage with or without
