name: NCT04449068 — Observational Database on Deep Brain Stimulation in Tourette Syndrome
description: Within an ongoing deep brain stimulation (DBS) program for Tourette syndrome (TS) at the
  Department of Neurology, Pitié-Salpêtrière Hospital, Paris/France, the investigator team plans to evaluate
  patients pre-operatively and then at one year intervals post-operatively until the 5-year mark has been
  achieved. The investigator team will investigate tic severity, psychiatric co-morbidities, quality of
  life, and neuropsychological measures. (NCT NCT04449068; status RECRUITING).
