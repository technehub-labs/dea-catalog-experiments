description: 'This study is part of the ADAPT Forward platform study (NCT07294170). ADAPT Forward is a
  platform study with the aim to look at how safe different drugs are and how well they work for people
  with myasthenia gravis. The goal is to find the best therapeutic approach to reduce patients'' side
  effects and improve their quality of life. The aim of this ISA1 is to evaluate the safety and therapeutic
  relevance of empasiprubart as add-on therapy to efgartigimod in participants with AChR-Ab seropositive
  generalized myasthenia gravis. The ADAPT Forward master protocol is registered on https://clinicaltrials.gov/study/NCT07294170
  More information can be found here: https://clinicaltrials.argenx.com/adaptforward1 (NCT NCT07284420;
  status RECRUITING).'
