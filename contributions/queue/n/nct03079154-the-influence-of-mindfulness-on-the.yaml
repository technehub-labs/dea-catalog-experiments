name: NCT03079154 — The Influence of Mindfulness on the Link Between Consumer Culture Values and Well-being
description: 'The study is a three-arm intervention, where students are randomly assigned to one of three
  conditions: Teacher-led group-based MBCT, Self-guided MBCT using an audio book, or ''wait list'' control.
  Pre-intervention, respondents complete a questionnaire assessing self, values, psychological processes
  related to self, and well-being. Post-intervention, respondents complete the same questionnaire, and
  then take part in a laboratory-based study which assesses behaviours related to the variables measured
  in the questionnaires. We are aiming for a sample size of 180 students at Sussex, 60 in each intervention
  arm. (NCT NCT03079154; status COMPLETED).'
