name: NCT05970354 — EMLA Cream as Analgesic for Outpatient Gynecological Procedures
description: 'The goal of this clinical trial is to compare pain perception in the
  study participant population undergoing the following gynecological procedures:
  Intra Uterine Device (IUD) insertion, hysteroscopy, and endometrial biopsy and given
  either Eutectic Mixture of Local Anesthetics (EMLA) cream or a placebo. The main
  question to answer is: • Does EMLA cream reduce pain when administered during the
  following gynecological procedures: IUD insertion, hysteroscopy, and endometrial
  biopsy? Participants will be asked to do assess their pain on the Visual Analogue
  Scale through 3 times during the procedure. Researchers will compare the study group
  with those receiving placebo group to see if there is a difference in pain scores.
  (NCT NCT05970354; status COMPLETED).'
