name: NCT05784610 — Interest of the Automated Management of Deep Neuromuscular Blockade
  Monitoring (CURATP)
description: Neuromuscular blockade (NMB) recommendations updated in 2018 by the Société
  Française d'Anesthésie et Réanimation (SFAR) recommend the use of NMB agents to
  facilitate surgical procedure during abdominal surgery by laparotomy or laparoscopy.
  This study aims to evaluate deep NMB monitoring with automated management of NMB
  depth measurement (ATP mode) versus non-automated monitoring (PTC/TOF), in order
  to improve the maintenance of deep NMB during abdominal surgery. (NCT NCT05784610;
  status UNKNOWN).
