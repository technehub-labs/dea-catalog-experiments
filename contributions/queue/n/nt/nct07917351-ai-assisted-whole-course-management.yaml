name: 'NCT07917351 — AI-Assisted Whole-Course Management for Medication Safety and
  Healthcare Burden in Advanced Solid Tumors: A Prospective Controlled Study'
description: This is a prospective, single-center, controlled real-world study in
  patients with advanced solid tumors (stage III-IV) receiving chemotherapy, targeted
  therapy, immunotherapy, or endocrine therapy. Participants who choose the digital
  management group use a smartphone-based oncology management application with medication
  reminders, AI-assisted laboratory report interpretation, adverse event self-reporting,
  and clinician alerts for critical values. Participants who choose the conventional
  group receive routine outpatient follow-up and telephone contact without digital
  tools. The study follows participants for 12 months to compare the incidence of
  overall and severe (CTCAE grade ≥3) adverse events, emergency department visits,
  30-day readmission, dose reduction, treatment delay/missed doses, and time to adverse
  event recovery. The aim is to evaluate whether a digital whole-course management
  model improves medication safety, reduces healthcare burden, and supports treatment
  adherence in advanced cancer care. (NCT NCT07917351; status RECRUITING).
