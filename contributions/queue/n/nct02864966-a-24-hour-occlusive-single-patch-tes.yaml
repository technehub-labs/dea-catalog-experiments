description: This is a 24 hour patch test to determine the acute tolerance of 3 variants of condom on
  a panel of healthy adult subjects. The patches will be affixed to the back and remain under occlusion
  for 24 hours. They will then be assessed at 30 minutes and 24 hours post patch removal. (NCT NCT02864966;
  status COMPLETED).
