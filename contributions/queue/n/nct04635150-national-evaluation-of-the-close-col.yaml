name: NCT04635150 — National Evaluation of the Close Collaboration With Parents Training
description: The aim of this study was to evaluate the effects of an educational intervention for neonatal
  staff on parent-infant physical closeness during their infant's stay in the Neonatal Intensive Care
  Unit (NICU) and parents' and staff perception on family centered care in the unit. This pre-post intervention
  study was carried out in nine hospitals in Finland in 2012 through 2018. Data was collected by using
  daily parental diaries, daily text message questions to parents and an audit interview for the staff.
  (NCT NCT04635150; status COMPLETED).
