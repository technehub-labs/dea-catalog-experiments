name: NCT04680494 — Effect of Acute Physical Exercise on Memory
description: An increasing amount of studies show the beneficial effect of regular exercise on cognitive
  and brain functions and especially in the memory domain. Yet little is known of what happens within
  an acute bout of exercise and whether it would also yield cognitive effects. The literature clearly
  shows that molecules such as brain derived neurotrophic factor (BDNF) and endocannabinoids (mainly anandamide,
  AEA) are heavily involved in neural plasticity mechanisms and increase when we exercise hinting at possible
  mechanisms underlying memory improvement after exercise. This protocol assesses the effects of acute
  exercise on associative and motor sequence memory, their underlying neural activations (measured using
  fMRI) and blood biomarkers (BDNF and AEA). A related aim is to assess the effect of exercise intensity,
  therefore three exercising conditions (rest, moderate intensity and high intensity) were included. Finally,
  a 3-month delayed retest visit is also realized to assess effects of acute exercise on long-term memory
  consolidation. (NCT NCT04680494; status COMPLETED).
