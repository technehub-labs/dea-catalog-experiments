name: NCT00525720 — Brachytherapy for Prostatic Carcinoma Patients
description: The goal of this clinical research study is to learn if a prostate implant (brachytherapy)
  can help to control intermediate risk prostate cancer. The safety of this procedure will also be studied.
  Prostate brachytherapy is performed by inserting permanent seeds (which are radioactive pellets) into
  your prostate in order to treat the prostate cancer with radiation therapy. (NCT NCT00525720; status
  ACTIVE_NOT_RECRUITING).
