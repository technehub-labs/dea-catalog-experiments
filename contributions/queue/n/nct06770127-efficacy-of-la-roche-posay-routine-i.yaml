name: NCT06770127 — Efficacy of La Roche Posay Routine in the Management of Facial Post Inflammatory Hyperpigmentation
  (PIHP)
description: The goal of this clinical trial is to test and compare La Roche Posay routine --the studied
  product-- with a comparator product in participants with acne. The main question it aims to answer is
  how well can the product de-pigment the skin. The participants will be asked to use the products given
  twice daily. Researchers will compare the routine La Roche Posay group(experimental) with the routine
  Eucine group(control) to see if the La Roche product shows superiority in case of better efficacy. (NCT
  NCT06770127; status COMPLETED).
