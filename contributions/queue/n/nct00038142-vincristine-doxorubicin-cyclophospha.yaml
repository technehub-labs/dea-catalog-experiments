name: NCT00038142 — Vincristine, Doxorubicin, Cyclophosphamide and Dexrazoxane (VACdxr)
  in High Risk Ewing's Sarcoma Patients
description: 'Objectives: 1. To determine if dose intensive Vincristine, Doxorubicin,
  Cyclophosphamide and Dexrazoxane (VACdxr) with or without ImmTherTM can improve
  the 2-year disease-free survival seen with standard VAC therapy. 2. To evaluate
  the feasibility and describe the toxicity associated with VACdxr. 3. To evaluate
  the feasibility and describe the toxicity of administering ImmTherTM on a weekly
  basis for 50- 52 weeks. 4. To determine which therapy (VACdxr+ or VACdxr-) is worthy
  of further evaluation. (NCT NCT00038142; status TERMINATED).'
