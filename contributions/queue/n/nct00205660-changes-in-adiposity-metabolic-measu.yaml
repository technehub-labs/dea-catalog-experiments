name: NCT00205660 — Changes in Adiposity, Metabolic Measures From Atypicals to Aripiprazole
description: This proposal aims to use well-validated methodologies such as dual energy x-ray absorptiometry
  (DEXA), frequently sampled oral glucose tolerance tests (fsOGTTs), and hyperinsulinemic euglycemic clamps
  to characterize the metabolic effects of 12 weeks of aripiprazole treatment following chronic pretreatment
  with olanzapine, quetiapine, risperidone or ziprasidone. We hypothesize that switching to aripiprazole
  treatment will induce improvements in total body adiposity, inflammation (e.g., high sensitivity C-reactive
  protein \[hsCRP\]), glucose metabolism (e.g., insulin sensitivity) and lipid metabolism (e.g., fasting
  plasma triglyceride), in comparison to chronic pretreatment with olanzapine, risperidone and quetiapine.
  (NCT NCT00205660; status COMPLETED).
