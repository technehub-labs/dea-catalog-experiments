name: NCT01034917 — Switching From Protease Inhibitor (PI) to Etravirine in HIV-1 Infected Subjects With
  Viremia Suppression
description: This is a 48 week randomized, prospective, controlled, open-label, proof-of-concept pilot
  clinical trial. Patients with HIV-1 infection on HAART PI-based regimen will be randomized to switch
  from the PI to etravirine (400 mg dissolved in water every 24 hours) or to continue with the same approach.
  The aim of the study is to compare the virological efficacy of the etravirine-based regimen with standard
  PI-containing regimen. (NCT NCT01034917; status COMPLETED).
