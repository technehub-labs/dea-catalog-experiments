name: NCT07499310 — The Safety and Effectiveness of Q Therapeutic System, Frequency-tuned
  Electromagnetic Field Treatment in Facilitating the Recovery of Patients With Chronic
  Stroke.
description: 'This trial will test a promising new intervention to promote post-stroke
  neural reorganization and functional recovery. The overall aim is to identify a
  systematic, methodological approach to system fitting, training protocols, and optimization
  of collecting outcome measures. Aim 1: Assess the safety of using the Q Therapeutic
  (BQ 3.0) System, including in-clinic and at- extremity rehabilitation training for
  individuals with chronic stroke, as determined by the number of adverse events.
  Device deficiencies will also be recorded to detect operational reliability. Aim
  2: Evaluate the effectiveness of the Q Therapeutic (BQ 3.0) System for individuals
  with chronic stroke in improving upper extremity function as determined by change
  in functional outcome measures after 3-month treatment, including in-clinic and
  at-home sessions. (NCT NCT07499310; status NOT_YET_RECRUITING).'
