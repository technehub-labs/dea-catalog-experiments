name: NCT02198846 — A Study to Compare Insulin Pump With Conventional Treatment in
  Type 2 Diabetes
description: Insulin deficiency resulted from progressive beta cell failure and insulin
  resistance in type 2 diabetes requires exogenous insulin therapy, escaping from
  oral antihyperglycemic agents. Previous data have been suggested that continuous
  subcutaneous insulin infusion (CSII) does not only have efficacy in glucose control
  but also restore beta cell failure. The investigators plan to compare the efficacy/safety
  and beta cell function between insulin pump treatment and the intensification of
  conventional treatment in patients with uncontrolled type 2 diabetes. (NCT NCT02198846;
  status UNKNOWN).
