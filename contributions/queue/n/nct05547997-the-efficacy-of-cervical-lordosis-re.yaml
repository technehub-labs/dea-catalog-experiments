name: NCT05547997 — The Efficacy of Cervical Lordosis Rehabilitation for Nerve Root Function and Pain
  in Cervical Spondylotic Radiculopathy
description: To test the hypothesis that improvement of cervical lordosis (CL) in cervical spondylotic
  radiculopathy (CSR) will improve clinical features in a population suffering from CSR. Thirty chronic
  lower CSR patients with CL \< 25° will be included. Patients will be assigned randomly into two equal
  groups, study and control . Both groups will receive neck stretching and exercises and infrared; additionally
  the study group will receive cervical extension traction. Treatments will be applied 3 time per week
  for 10 weeks after which groups will be followed for 3-months and 2-years. Amplitude of dermatomal somatosensory
  evoked potentials (DSSEPS), Cervical lordosis, and pain scales (NRS) will be measured. (NCT NCT05547997;
  status COMPLETED).
