name: NCT04326790 — The GReek Study in the Effects of Colchicine in Covid-19 cOmplications Prevention
description: Based on data regarding the effect of colchicine on the inflammasome NLP3 and microtubule
  formation and associations thereof with the pathogenetic cycle of SARS-COV-2, the question arises whether
  colchicine, administered in a relatively low dose, could potentially have an effect the patients' clinical
  course by limiting the myocardial necrosis and pneumonia development in the context of COVID-19. If
  present, this effect would be attributed to its potential to inhibit inflammasome and (less probably)
  to the process of SARS-CoV-2 endocytosis in myocardial and endothelial respiratory cells. (NCT NCT04326790;
  status TERMINATED).
