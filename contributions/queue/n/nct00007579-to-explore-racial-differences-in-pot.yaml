name: NCT00007579 — To Explore Racial Differences in Potential Risk Factors for Developing
  Prostate Cancer in the VA Population.
description: 'Primary Objectives: To explore racial differences in potential risk
  factors for developing prostate cancer in the VA population and to compare and contrast
  the results of this study with that of an ongoing NCI-funded study in North Carolina.
  Secondary Objectives: To investigate familial aggregation of prostate cancer in
  blacks and whites. To determine whether screening behavior differs in men diagnosed
  with early stage prostate cancer versus those with later stage disease as well as
  to determine if screening behavior differences exist between blacks and whites.
  Primary Outcomes: The primary outcomes are pesticide, occupational and chemical
  exposure, and dietary history. Other major endpoints include: 1) familial aggregation
  of prostate cancer; 2) weight, weight history, and weight cycling; 3) subject''s
  knowledge, attitudes, and behaviors about prostate cancer; and 4) treatment choices.
  Intervention: N/A Study Abstract: Prostate cancer is the most commonly diagnosed
  cancer in American men. Among African Americans the incidence and mortality from
  prostate cancer is even greater. Although incidence rates in the Southern United
  States tend to be only slightly higher than that of the nation, a clear discrepancy
  exists between national mortality rates and those in the Southeastern United States.
  Notably high rates, particularly among African Americans are observed and in North
  Carolina the prostate cancer mortality rate among African Americans is the highest
  of any state in the nation. In spite of these statistics, very little is known about
  racially based differences in the etiology of this disease. This study hypothesizes
  that racial differences in the incidence and mortality of prostate cancer may be
  a result of multiple factors including those that are socioeconomic, environmental,
  dietary and genetic. This research will provide insight into gene-environmental
