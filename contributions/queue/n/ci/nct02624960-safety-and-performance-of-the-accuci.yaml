description: This is a single-arm, multi-center, open-label controlled study that
  will assess the safety and performance of the Accucinch System to induce left ventricular
  reverse remodeling and reduce the severity of functional mitral regurgitation in
  symptomatic adult patients with mitral regurgitation and left ventricular remodeling
  due to dilated cardiomyopathy (ischemic or non-ischemic etiology), who are of high
  operative risk. (NCT NCT02624960; status WITHDRAWN).
