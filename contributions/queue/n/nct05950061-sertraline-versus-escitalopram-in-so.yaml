name: NCT05950061 — Sertraline Versus Escitalopram in South Asian Participants With Moderate to Severe
  Major Depressive Disorder
description: 'Objective: The aim of this randomized controlled trial was to compare the efficacy and safety
  of sertraline and escitalopram in participants with moderate to severe major depressive disorder (MDD).
  Methods: A total of 744 participants with moderate to severe MDD were randomly assigned to receive either
  sertraline or escitalopram for 8 weeks. Drug dosages and titration schedules were based on the recommendations
  of the prescribing information for each product and according to the judgment of the clinicians involved
  in the study. The primary outcome measures were changes from baseline on the Montgomery-Åsberg Depression
  Rating Scale (MADRS) and the Clinical Global Impression (CGI) scale as well as frequency of adverse
  events in both groups. (NCT NCT05950061; status COMPLETED).'
