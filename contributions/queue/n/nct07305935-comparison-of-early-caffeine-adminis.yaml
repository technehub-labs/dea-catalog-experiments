name: NCT07305935 — Comparison of Early Caffeine Administration Vs Supportive Therapy
  in Preventing Acute Kidney Injury
description: Recent observational data point towards a reduced incidence of acute
  kidney injury (AKI) with early caffeine use, but high-quality randomized controlled
  trials comparing early caffeine initiation to supportive therapy alone are lacking.
  This study aims to fill this critical gap by comparing the efficacy of early caffeine
  administration versus supportive therapy in preventing AKI in preterm neonates.
  (NCT NCT07305935; status COMPLETED).
