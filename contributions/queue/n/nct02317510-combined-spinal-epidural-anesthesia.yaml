name: NCT02317510 — Combined Spinal Epidural Anesthesia and General Anesthesia for Laparoscopic Cholecystectomy
description: The aim of this study was to compare general anesthesia (GA) and combined (epidural and spinal)
  anesthesia (CA) for laparoscopic cholecystectomy. General anesthesia is a gold standard for laparoscopic
  cholecystectomy(LC). The use of combined anesthesia may offer several advantages over general anesthesia.
  Fifty patients will be randomly assigned to either the CA LC (25 patients) or GA LC (25 patients). All
  patients has symptomatic gall stone disease or polyp of gall bladder. Intraoperative events related
  to combined anesthesia , postoperative complications, pain score and duration of operation time will
  record. (NCT NCT02317510; status COMPLETED).
