description: 'The goal of this observational study is to learn if an ai-assistive
  algorithm would be useful in patients who are under suspicion of coronary disease.
  The main question it aims to answer: What proportion of patients would clinicians
  see fit to order an ai-assistive algorithm if available for clinical use? Participants
  will be asked to use clinical judgement as to whether a patient fits a predetermined
  criteria for use and select them for ai-assistive analysis. (NCT NCT07405866; status
  NOT_YET_RECRUITING).'
