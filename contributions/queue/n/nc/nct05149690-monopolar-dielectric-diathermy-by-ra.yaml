name: NCT05149690 — Monopolar Dielectric Diathermy by Radiofrequency and Therapeutic
  Exercise in Patients With Chronic Low Back Pain.
description: A total of 60 people diagnosed with non-specific chronic low back pain
  of more than 3 months of evolution and who are not currently undergoing any type
  of treatment will be recruited, with ages between 30 and 65 years. A random distribution
  will be made into two treatment groups (diathermy combined with supervised therapeutic
  exercise versus supervised therapeutic exercise). Participants will receive treatment
  once a week for a period of four weeks, in the physiotherapy laboratories of the
  University of Almería, with a follow-up evaluation at three weeks and two months
  after the start of treatment. At their first visit, participants will be screened
  for study eligibility according to the study inclusion and exclusion criteria, and
  will be evaluated by a therapist blinded to the intervention. After this face-to-face
  evaluation, patients will be randomly assigned to one of the two groups and will
  receive treatment for low back pain according to their random assignment group by
  two therapists belonging to the research group and trained in the techniques used.
  (NCT NCT05149690; status COMPLETED).
