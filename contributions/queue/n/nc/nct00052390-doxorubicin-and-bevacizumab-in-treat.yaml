name: NCT00052390 — Doxorubicin and Bevacizumab in Treating Patients With Locally
  Recurrent or Metastatic Soft Tissue Sarcoma
description: 'RATIONALE: Drugs used in chemotherapy use different ways to stop tumor
  cells from dividing so they stop growing or die. Bevacizumab may stop the growth
  of tumor cells by stopping blood flow to the tumor. Combining doxorubicin with bevacizumab
  may kill more tumor cells. PURPOSE: Phase II trial to study the effectiveness of
  combining doxorubicin with bevacizumab in treating patients who have locally recurrent
  or metastatic soft tissue sarcoma. (NCT NCT00052390; status COMPLETED).'
