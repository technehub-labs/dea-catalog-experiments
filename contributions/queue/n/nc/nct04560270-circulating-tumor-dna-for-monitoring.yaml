name: NCT04560270 — CIrculating Tumor DNA for Monitoring Response to First Line Chemotherapy
  in Unresectable PANcreatic Cancer
description: With an incidence of more than 11,600 new cases per year in France and
  an annual number of deaths close to the incidence rate, adenocarcinoma of the pancreas
  is a public health problem. The aim of this study is to assess the predictive value
  of response to the 1st line of chemotherapy of mutated KRAS ctDNA (circulating tumor
  DNA) in unresectable metastatic or locally advanced pancreatic adenocarcinomas.
  (NCT NCT04560270; status COMPLETED).
