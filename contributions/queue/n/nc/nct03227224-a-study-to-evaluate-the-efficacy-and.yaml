name: 'NCT03227224 — A Study to Evaluate the Efficacy and Safety of JNJ-42847922 as
  Adjunctive Therapy to Antidepressants in Adult Participants With Major Depressive
  Disorder Who Have Responded Inadequately '
description: The purpose of this study is to assess the dose-response relationship
  of 2 doses of JNJ-42847922 before interim analysis, and potentially 3 doses based
  on interim analysis results, compared to placebo as adjunctive therapy to an antidepressant
  drug in improving depressive symptoms in participants with Major Depressive Disorder
  (MDD) who have had an inadequate response to current antidepressant therapy with
  a selective serotonin reuptake inhibitor (SSRI) or serotonin-norepinephrine reuptake
  inhibitor (SNRI); and to assess the safety and tolerability of JNJ-42847922 compared
  to placebo as adjunctive therapy to an antidepressant in participants with MDD.
  (NCT NCT03227224; status COMPLETED).
