name: NCT04874766 — The Effects of Wearing a Face Mask During Exercise in Youth Hockey
  Players During COVID-19
description: There is concern that wearing a face mask during COVID will affect oxygen
  uptake, especially during intense exercise. COVID transmission is especially prevalent
  in sports such as hockey, where there is close contact between players and arena
  ventilation is poor. This study will assess the effect of wearing a surgical face
  mask on simulated hockey performance and blood and muscle oxygenation during cycling
  exercise. (NCT NCT04874766; status COMPLETED).
