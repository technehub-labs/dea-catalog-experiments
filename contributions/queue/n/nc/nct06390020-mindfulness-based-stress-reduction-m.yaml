name: 'NCT06390020 — Mindfulness-Based Stress Reduction (MBSR) for People High on
  the Personality Trait Sensory Processing Sensitivity: A Mixed Methods Study'
description: This study investigates the efficacy of MBSR training in alleviating
  stress-related symptoms among individuals with high sensory processing sensitivity.
  Participants will be randomly allocated to either the MBSR group or the control
  group. The primary hypothesis is that participants in the MBSR group, relative to
  control group, will have lower depression-anxiety-stress scores post-intervention,
  after controlling for baseline scores. The secondary hypothesis is that in the MBSR
  group, relative to control group, other mental health, physical health and well-being
  outcomes, as well as potential mindfulness mechanisms will also improve, after controlling
  for baseline scores. (NCT NCT06390020; status UNKNOWN).
