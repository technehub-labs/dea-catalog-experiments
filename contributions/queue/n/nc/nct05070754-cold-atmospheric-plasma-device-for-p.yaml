name: NCT05070754 — Cold Atmospheric Plasma Device for Pediatric Molluscum and Verruca
description: This study is going to test a cold atmospheric plasma device (CAP), in
  particular a floating electrode-dielectric barrier device (FE-DBD), to treat warts
  and molluscum. The treatment device in this study generates cold atmospheric plasma
  (gaseous ionized molecules) to rid the virus from the body. Based on the successes
  of previous dermatologic studies, FE-DBD is being tested for this study to treat
  warts and molluscum. Patients will be enrolled to test the efficacy and safety of
  this device. The duration of the study is 4-12 weeks depending on treatment clearance.
  The number of lesions will be chosen by the dermatologist. Patients will receive
  standard of care therapy and/or NTAP depending on the number of lesions. (NCT NCT05070754;
  status COMPLETED).
