name: NCT00176488 — Epirubicin and Vinorelbine in Treating Patients With Stage II,
  Stage III, or Stage IV Breast Cancer
description: 'RATIONALE: Drugs used in chemotherapy, such as epirubicin and vinorelbine,
  work in different ways to stop the growth of tumor cells, either by killing the
  cells or by stopping them from dividing. Giving epirubicin together with vinorelbine
  may kill more tumor cells. PURPOSE: This phase II trial is studying how well giving
  epirubicin together with vinorelbine works in treating patients with stage II, stage
  III, or stage IV breast cancer. (NCT NCT00176488; status TERMINATED).'
