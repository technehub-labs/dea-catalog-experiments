name: NCT05601427 — Intra-Operative Adductor Canal Blocks
description: Adductor canal blocks (ACB) have been recommended in total knee arthroplasty
  (TKA) to provide better control of post-operative pain, facilitate early ambulation,
  and reduce length of stay in the hospital. ACB is typically done before surgery
  by an anesthesiologist, which may increase time per case, cost, and requires the
  specialized skills of an anesthesiologist trained in regional anesthesia. Recent
  studies have suggested that surgeons can safely and reliably administer the adductor
  canal blocks (sACB) during surgery. However, there is currently very limited data
  on the clinical efficacy of such sACBs, and no studies assessing this technique
  in the context TKA that are discharged the same day. As such, this randomized control
  trial (RCT) is being done to compare sACBs to conventional anesthesiologist-performed
  adductor canal blocks (aACB). (NCT NCT05601427; status COMPLETED).
