name: NCT07293650 — PREcision MEDicine In Achalasia (PREMEDIA)
description: 'The goal of this clinical trial is to learn if shorter Per-Oral Endoscopic
  Myotomy (POEM) works as well as a longer POEM in patients with trouble swallowing
  due to certain conditions. The main question\[s\] it aims to answer \[is/are\]:
  * Does making a smaller cut in the muscle at the bottom of the esophagus work just
  as well as making the standard bigger cut in relieving symptoms? * Does making the
  smaller cut reduce the side effects of the procedure compared to the standard bigger
  cut? Researchers will compare the symptoms and side effects of making a shorter
  cut to the symptoms and side effects of a longer cut. Participants will allow researchers
  to access their standard of care information in their medical record, complete questionnaires
  at up to 6 times over a 2-year period. (NCT NCT07293650; status RECRUITING).'
