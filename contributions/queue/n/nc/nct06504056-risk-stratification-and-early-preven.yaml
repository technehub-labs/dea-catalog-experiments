name: NCT06504056 — Risk Stratification and Early Prevention Strategies for Non-compaction
  of Ventricular Myocardium (CAPTAIN)
description: This study intends to retrospectively-prospectively enroll NVM patients
  from multiple centers to establish a natural population cohort of NVM patients.
  By collecting clinical data and biological samples from surgical patients, the investigators
  will construct a prognosis prediction system for NVM, optimize risk stratification,
  explore new strategies for the early prevention and treatment of NVM, and improve
  the efficiency of clinical treatment of NVM patients. (NCT NCT06504056; status NOT_YET_RECRUITING).
