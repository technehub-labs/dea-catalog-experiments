name: NCT04699474 — Protocol for Rapid Onset of Mobilization in Patients With Traumatic
  Spinal Cord Injury
description: PROMPT-SCI (Protocol for Rapid Onset of Mobilization in Patients with
  Traumatic SCI) is a single-site single-arm proof-of-concept trial. Forty-five patients
  aged 18 years or older who have sustained a severe traumatic SCI (American Spinal
  Injury Association Impairment Scale grade A, B or C) from C0 to L1 and undergoing
  spinal surgery within 48 hours of the injury will be included. Participants will
  receive daily 30-minute sessions of in-bed leg cycling for 14 consecutive days,
  initiated within 48 hours after spinal surgery. The feasibility outcomes consist
  of the 1) absence of serious adverse events associated with cycling sessions, 2)
  completion of at least 1 full session within 48 hours after spinal surgery for at
  least 90% of participants, and 3) completion of at least 11 sessions for at least
  80% of participants. Patient outcomes 6 weeks and 6 months after injury will be
  measured from neurofunctional assessments, quality of life questionnaires and inpatient
  length of stay. Feasibility and patient outcomes will be analysed with descriptive
  statistics. Patient outcomes will also be compared to a matched historical cohort
  not receiving in-bed cycling. (NCT NCT04699474; status COMPLETED).
