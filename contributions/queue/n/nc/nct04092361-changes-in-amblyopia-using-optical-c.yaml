name: NCT04092361 — Changes in Amblyopia Using Optical Coherence Tomography
description: There have been multiple trials to investigate the morphological changes
  in the macula and retinal nerve fiber layer of amblyopic eyes, due to the different
  published results and the lack of evident association between these changes and
  the patients' parameters. So, we perform this study to compare the variations in
  macular parameters (central thickness, average thickness, macular volume) and peripapillary
  thickness in different cases of amblyopic eyes versus the normal fellow eyes using
  spectral-domain optical coherence tomography. In addition, to estimate the relationship
  of optical coherence tomography variations with different defined patients' parameters
  (age, sex, best corrected visual acuity, spherical equivalent refractive error,
  and axial length). (NCT NCT04092361; status UNKNOWN).
