description: The investigators propose the use of a 20 week physician-derived exercise
  programme will lead to an improvement in physical fitness which will in turn lead
  to an increase in muscle mass, a reduction in visceral obesity resulting in an improvement
  in biologic response, disease biomarkers (including a reduction in circulating pro-inflammatory
  cytokines), fatigue scores and quality of life. (NCT NCT05174754; status UNKNOWN).
