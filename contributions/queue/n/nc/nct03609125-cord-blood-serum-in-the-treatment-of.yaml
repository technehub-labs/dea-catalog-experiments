name: NCT03609125 — Cord Blood Serum in the Treatment of Neuro-Degenerative Ophthalmic
  Diseases. 1-Glaucoma
description: A non-randomized, monocentric clinical study with a four month follow-up
  period , using a cord blood serum (CBS) eye drops in glaucoma patients. The purpose
  of the study analyzes whether the addition of CBS to hypotonic therapy is able to
  slow down the progression of anatomical and functional damage induced by glaucoma.
  The study evaluates the differences after two months of treatment as compared to
  baseline and after two-month from the end of the treatment. (NCT NCT03609125; status
  COMPLETED).
