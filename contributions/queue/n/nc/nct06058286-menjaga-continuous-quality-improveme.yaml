name: 'NCT06058286 — MENJAGA: Continuous Quality Improvement for Antenatal HIV, Syphilis
  and Hepatitis B Testing in Indonesia'
description: Elimination of mother-to-child-transmission (EMTCT) of HIV, syphilis
  and hepatitis B are key priorities in Indonesia, the fourth most populous country
  in the world. Despite national guidelines and strong antenatal care attendance,
  coverage of antenatal screening for these diseases among pregnant women remains
  extremely limited in Indonesia. The Indonesian government is committed to improving
  the integration of HIV/syphilis/hepatitis B testing and treatment into the antenatal
  platform but currently lacks comprehensive evidence on interventions to support
  this. We will evaluate a low-cost and locally driven intervention based on the principles
  of continuous quality improvement to strengthen antenatal care and promote screening
  for HIV, syphilis and hepatitis B. Continuous Quality Improvement (CQI), which involves
  local antenatal care (ANC) teams systematically collecting and reflecting on local
  data to inform the design and implementation of service delivery, has been effectively
  used to strengthen ANC in a number of Sub-Saharan African countries but yet to be
  comprehensively evaluated in ANC services in Indonesia. This approach holds considerable
  promise for Indonesia, a highly populous and diverse country where a 'one size fits
  all' approach to the delivery of quality ANC rarely applies. (NCT NCT06058286; status
  UNKNOWN).
