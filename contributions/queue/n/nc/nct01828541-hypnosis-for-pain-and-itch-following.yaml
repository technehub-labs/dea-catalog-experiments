name: NCT01828541 — Hypnosis for Pain and Itch Following Burn Injuries
description: 'The purpose of this study is to determine whether hypnosis will decrease
  the intensity of either pain or itch in patients who have sustained a burn injury.
  Primary hypothesis: Hypnosis will provide more effective relief from post-burn itch
  and pain than a control intervention at 1-month, 3-months, 6-months and 1-year post-burn
  injury. Secondary hypothesis 1: Subjects treated with hypnosis will report better
  sleep quality and fewer symptoms of Post Traumatic Stress Disorder (PTSD). Secondary
  Hypothesis 2: Subjects treated with hypnosis will require less escalation of the
  gabapentin doses and have lower average pain scores than those in the control group.
  Exploratory Hypothesis: Subjects who will randomize to the hypnosis treatment group
  early after injury will report lower rates of neuropathic pain and itch than subjects
  who will be enrolled in the study and receive hypnosis later in the healing process.
  (NCT NCT01828541; status UNKNOWN).'
