name: NCT06634953 — The Impact of Volleyball on Menstrual Symptoms
description: 'The goal of this observational study is to examine menstrual characteristics
  and symptoms in adolescent volleyball athletes compared to non-athlete adolescents.
  The main question it aims to answer is: How do menstrual symptoms and characteristics
  differ between adolescent volleyball athletes and non-athletes? The study included
  154 adolescents aged 10-19, divided into 77 volleyball athletes (average age 15.09)
  and 77 non-athletes (average age 14.79). Assessments covered menstruation age, regularity,
  dysmenorrhea characteristics, and menstrual symptoms using the Menstrual Symptom
  Questionnaire (MSQ). (NCT NCT06634953; status COMPLETED).'
