description: The primary purpose of the study is to evaluate whether the type of fluid
  (0.9% saline or 6% Hydroxyethyl starch 130/0.4) in the context of an individualized
  goal-directed fluid therapy is associated with a difference in morbidity and mortality
  within the first 14 days in patients at moderate-to-high risk of postoperative complications
  after abdominal surgery. (NCT NCT02502773; status COMPLETED).
