name: NCT04937725 — Reading Problems Associated With Central Nervous System (CNS)
  Pathologies.
description: This project aims to analyse eye movements, their alterations and influence
  in reading performance in patients with acquired CNS diseases and compare them with
  people of the same age, without neurological or ocular pathology and with normal
  reading speed and pattern. The exploration is focused on the oculomotor system in
  patients with CNS diseases, even without involvement of the primary visual pathway,
  and reveals more involvement than the one obtained by a simple ophthalmological
  examination. (NCT NCT04937725; status COMPLETED).
