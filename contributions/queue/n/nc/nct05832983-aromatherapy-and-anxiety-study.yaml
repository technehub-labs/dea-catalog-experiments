name: NCT05832983 — Aromatherapy and Anxiety Study
description: While intra-articular injections can alleviate pain in orthopedic patients,
  this can be an anxiety-provoking experience. Adult patients scheduled to receive
  an injection at the study location will be randomly assigned to one of three groups.
  The control group (C) will receive the current standard of nursing care. The first
  experimental group (A) will receive a guided meditation prior to receiving the injection.
  The second experimental group (B) will receive an Elequil Aromatab and the same
  guided meditation prior to receiving the injection. (NCT NCT05832983; status COMPLETED).
