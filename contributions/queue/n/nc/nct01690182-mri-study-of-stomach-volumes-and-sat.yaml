name: NCT01690182 — MRI Study of Stomach Volumes and Satiety
description: The GI MRI Research group at the University of Nottingham has been developing
  new, non-invasive magnetic resonance imaging (MRI) techniques to image the gastrointestinal
  tract. In collaboration with food manufacturer Unilever, the investigators want
  to image the abdomen of healthy volunteers after consumption of test meals of varying
  volume and energy density to determine levels of gastric distension and investigate
  possible correlations of this with the subjects' sense of satiety. (NCT NCT01690182;
  status COMPLETED).
