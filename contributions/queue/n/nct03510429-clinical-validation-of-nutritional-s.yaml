name: NCT03510429 — Clinical Validation of Nutritional Supplements("Ketogenic Plus") Developed for Pancreaticobiliary
  Cancer Patients
description: Decreased bowel function and loss of appetite in patients who underwent pancreaticobiliary
  surgery contribute impaired nutritional status in postoperative period. It can also affect perioperative
  and oncologic outcomes negatively. Therefore it is important to improve nutritional status in postoperative
  period by supply tailor-made optimal diets. The investigators have developed customized postoperative
  diets and products for pancreaticobiliary cancer patients. This time, newly developed ketogenic drink
  contain beefsteak mint. The investigators expect that nutritional supplement for pancreaticobiliary
  patients will increase the food intake rate and contribute a improvement of perioperative outcomes and
  even oncologic outcomes. (NCT NCT03510429; status UNKNOWN).
