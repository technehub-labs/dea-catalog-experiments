name: NCT07207746 — Effect of Music on Pain, Embarrassment, and Urodynamic Outcomes
description: Urodynamic testing (UDT) is a diagnostic procedure frequently used to
  evaluate lower urinary tract dysfunction, including urinary incontinence and voiding
  difficulties. Despite its diagnostic value, UDT is invasive and often causes discomfort,
  pain, and embarrassment due to catheter placement and repeated measurements. These
  negative experiences may reduce patient compliance, affect diagnostic accuracy,
  and increase reluctance to repeat the procedure. Music has been shown to promote
  relaxation and reduce pain and anxiety in various clinical settings, but its effect
  during urodynamic testing has not been adequately studied. This randomized controlled
  trial was designed to determine whether listening to music during invasive UDT can
  reduce pain and embarrassment while influencing urodynamic parameters. (NCT NCT07207746;
  status COMPLETED).
