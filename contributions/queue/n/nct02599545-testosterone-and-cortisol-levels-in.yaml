name: NCT02599545 — Testosterone and Cortisol Levels in Infants
description: Very low birth weight (VLBW) infants have more health and developmental problems than normal
  birth weight full-term infants. These problems are more common in males than female VLBW preterm infants.
  Male VLBW infants also experience less positive mother-infant interactions than females, especially
  when mothers are emotionally distressed. This is a significant problem because positive mother-infant
  interactions function as an important protective factor against the negative health and developmental
  outcomes associated with prematurity. The source of the vulnerability of male VLBW infants to health
  problems, suboptimal mother-infant interactions, and poor development goes beyond gender socialization
  differences and includes biological factors. Identification of infant and maternal biological markers/predictors
  of infant health and developmental outcomes could ultimately lead to interventions for VLBW preterm
  infants. The purpose of this study is to confirm that testosterone rather than cortisol is a more reliable
  marker/predictor of complications affecting infants' health outcomes, mother-infant interactions, and
  infant cognitive/motor/language developmental outcomes; and that male infants exhibit a higher sensitivity
  to testosterone levels than female infants. This longitudinal study will examine the associations of
  the steroid hormones, testosterone and cortisol, levels with infant health, mother-infant interactions,
  and infant cognitive/motor/language development ('infant development') in very low birthweight (VLBW,
  BW \< 1,500 g) preterm (gestational age \< 32 weeks gestation) infants after adjusting for maternal
  physical and mental health state, infant socioemotional and behavioral development, and characteristics
  of infants and mothers. Concurrent and repeated measurement of testosterone and cortisol levels both
  in infants and mothers will be conducted through infancy and early childhood (at birth, 40 weeks postmenstrual
  age, 12 and 24 months corrected age). (NC
