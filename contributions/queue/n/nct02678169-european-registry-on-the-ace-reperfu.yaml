description: Prospective, single-arm, multicenter, observational registry of the ACE Reperfusion Catheters
  and the Penumbra System in Europe. Consecutive patients presenting within 6 hours from symptom onset
  with an acute ischemic stroke (within the internal carotid artery and internal carotid terminus, middle
  cerebral - M1/M2 segments) due to anterior circulation large vessel occlusion (LVO) will be treated
  using the ADAPT technique with thrombo-aspiration as first intention and site routine practice. (NCT
  NCT02678169; status COMPLETED).
