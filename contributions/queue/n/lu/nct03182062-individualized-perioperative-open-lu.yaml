name: NCT03182062 — Individualized Perioperative Open-Lung Ventilatory Strategy During
  One-Lung Ventilation
description: The purpose of this study is to determine whether individualized ventilatory
  management during one-lung ventilation in patients scheduled for thoracic surgery,
  combining the use of low tidal volumes, alveolar recruitment maneuvers, individually
  titrated positive end-expiratory pressure and individually indicated ventilatory
  support will decrease postoperative pulmonary complications, ICU and hospital length
  of stay compared to a standardized Lung Protective Ventilation (LPV). (NCT NCT03182062;
  status UNKNOWN).
