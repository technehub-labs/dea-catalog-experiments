description: The purpose of this research protocol is to measure Patient Reported
  Outcome Measures (PROMs) in breast cancer patients. PROM results will be provided
  to patients and providers and the investigators will evaluate the relationship between
  patient engagement with PROM results and patient and clinicopathologic variables,
  utilization of supportive and hospital services, and patient satisfaction with patient-provider
  communication. (NCT NCT03995082; status ACTIVE_NOT_RECRUITING).
