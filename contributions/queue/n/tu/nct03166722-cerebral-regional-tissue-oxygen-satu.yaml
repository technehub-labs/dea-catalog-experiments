name: NCT03166722 — Cerebral Regional Tissue Oxygen Saturation to Guide Oxygen Delivery
  in Preterm Neonates During Immediate Transition
description: The aim of the COSGOD Phase III trial is to examine, if it is possible
  to increase survival without cerebral injury in preterm neonates \<32 weeks of gestation
  by monitoring the cerebral tissue oxygen saturation in addition to routine monitoring
  of arterial oxygen saturation and heart rate and specified clinical treatment guidelines
  during immediate transition period after birth (the first 15 minutes). (NCT NCT03166722;
  status COMPLETED).
