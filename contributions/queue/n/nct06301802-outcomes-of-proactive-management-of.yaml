name: NCT06301802 — Outcomes of Proactive Management of Children With Myelomeningocele
description: Spina bifida birth prevalence in Africa is 0.13%. Myelomeningocele (MMC) represents the most
  frequent and most severe cause of NB in children. Treatment of neuropathic bladder secondary to spina
  bifida is an ongoing challenge. Damage of the renal parenchyma in children with NB is preventable given
  adequate evaluation, follow-up and proactive management. Proactive management was defined as use of
  clean intermittent catheterization (CIC), and/or anticholinergics at presentation, or based on initial
  high-risk urodynamic findings by 1 year of age. The proactive approach to treat SB (CIC and pharmacotherapy)
  has contributed to decreasing chronic kidney disease (CKD). Myelomeningocele is considered a complex
  congenital disease. Hence, a multidisciplinary team is the best choice for management of spina bifida,
  involving neurosurgeons, orthopedic surgeons, urologists, physical medicine and rehabilitation specialists
  and pediatricians. Currently, children with spina bifida in Egypt must visit multiple different locations
  to access the complex care they need. Here, we review our experience with patients with spina bifida
  who will be followed with this team with an emphasis on patients' upper urinary tract protection and
  decreasing urinary incontinence. (NCT NCT06301802; status UNKNOWN).
