name: NCT01832545 — Aquatic Exercise Program for Knee Osteoarthritis
description: 'The aim of PICO study is to design an aquatic exercise program specific for obese individuals
  with knee osteoarthritis which the main goals are OA symptoms management and the improvement of physical
  fitness. The author''s opinion is that the musculoskeletal pain is the main constraint for any kind
  of mobility and its control should be considered as an important goal in the weight management''s programs.
  Therefore the PICO project proposes an aquatic exercise program to controlling pain and other symptoms
  management, showing that it is possible to live with the disease, and motivating the change in lifestyle,
  thus preventing the installation or worsening of KOA. In this way, five hypotheses were formulated:
  H1. 3 months of aquatic exercise is enough to improve KOA symptoms and functionality in obese individuals;
  H2. The gait parameters of obese individuals with KOA can be improved by aquatic exercise; H3. Beyond
  the exercises skills, aquatic exercise group classes can work with an educational component, promoting
  lifestyles changes. H4: Pain reduction and a better psychological status can lead an increase of functionally,
  increasing amount of physical activity. H5: Even if the main goal is not weight management, the aquatic
  exercise program can lead a weight reduction or body composition change. (NCT NCT01832545; status COMPLETED).'
