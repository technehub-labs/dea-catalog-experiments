name: 'NCT07136129 — Functional Exercise Performance in Children With Cerebral Palsy: Is the One-Minute
  Sit-to-Stand Test an Alternative to the Six-Minute Walk Test'
description: This study investigates the validity of the 1-minute sit-to-stand test (1MSTS) as a practical
  and time-efficient alternative to the 6-minute walk test (6MWT) for assessing functional exercise capacity
  in children with spastic cerebral palsy (CP). Children aged 5 to 18 years with spastic hemiplegic CP,
  classified as Level I or II according to the Gross Motor Function Classification System (GMFCS), will
  perform both tests on the same day. Cardiopulmonary responses and fatigue will be monitored before and
  after each test. The study aims to determine whether the 1MSTS can be reliably used in clinical settings
  as a simpler assessment tool for this population. (NCT NCT07136129; status COMPLETED).
