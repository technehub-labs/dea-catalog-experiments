name: NCT00284479 — The Effect of Walking on Cardiovascular Risk
description: The purpose of this study was to investigate the effects of an 8 week program of walking
  for 45 minutes, twice a week, on fitness, body composition , blood pressure and blood markers of cardiovascular
  risk. We hypothesised that this 90 minutes of walking per week would result in measurable increases
  in fitness and reductions in body fat, resting blood pressure and improved blood lipid profiles. (NCT
  NCT00284479; status COMPLETED).
