name: NCT07013097 — A Phase I Clinical Trial to Evaluate the Single Dose Ascending
  and Food Effects of PG-033 in Healthy Adults
description: The goal of this study is to evaluate the safety, tolerability and pharmacokinetics
  (PK) profiles of single ascending oral doses(SAD) of PG-033 by directly comparing
  it with placebo. Meanwhile, the impact of a high-fat meal on the pharmacokinetics
  of PG-033 will also be evaluated. The research will also explore the potential metabolites
  and metabolic pathways of PG-033 within the human body，as well as investigate the
  effect of PG-033 on the QTc interval. (NCT NCT07013097; status RECRUITING).
