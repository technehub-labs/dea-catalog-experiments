name: NCT01581723 — Clinical Trial Using Bipolar Technology for Transurethral Resection of Bladder Tumor
description: Bladder cancer is a common urological malignant disease. Patients with bladder cancer will
  first be managed with transurethral resection (TUR) of bladder tumor. For many years, monopolar transurethral
  resection of bladder tumor (TURP) has been the gold standard for treatment. However, complications including
  bleeding, bladder perforation and inadequate sampling of deep tumor biopsy remain the major concerns.
  Recently published papers suggested that the newer bipolar TUR technology has similar surgical outcomes
  but less complications comparing with monopolar TUR. In this study, investigators will investigate the
  benefit of new technology as compared with conventional monopolar resection on tumor clearance, complication
  and recurrence rates. (NCT NCT01581723; status UNKNOWN).
