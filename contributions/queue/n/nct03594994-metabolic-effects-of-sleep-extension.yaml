name: NCT03594994 — Metabolic Effects of Sleep Extension in People With Obesity
description: This study is designed to determine the impact of extending sleep duration
  on glucose metabolism in people with obesity. Half of the participants will be instructed
  to increase their time-in-bed in order to achieve \>7h sleep/night (sleep extension;
  n=15) while the other half will be be instructed to maintain their current sleep
  habits (n=15). (NCT NCT03594994; status COMPLETED).
