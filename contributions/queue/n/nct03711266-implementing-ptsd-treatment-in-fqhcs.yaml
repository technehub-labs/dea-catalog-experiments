name: NCT03711266 — Implementing PTSD Treatment in FQHCs for Michigan Medicaid Enrollees
description: The purpose of this project is to expand access to trauma-focused treatment among Medicaid
  Enrollees with PTSD, thereby improving the quality of mental health services delivered to this population.
  Specifically, the project goals are to evaluate the delivery and sustainability of a brief trauma-focused
  treatment, Prolonged Exposure for Primary Care (PE-PC), an evidence-based intervention for PTSD, when
  delivered via telehealth to patients enrolled at CHCs in Michigan. (NCT NCT03711266; status COMPLETED).
