name: NCT05297240 — Retrospective Study of the Use of Belantamab Mafodotin (Blenrep®)
  in Patients With Relapsed and/or Refractory Multiple Myeloma (RRMM) in Spain.
description: The proposal of this study is to retrospectively analyze the experience
  with belantamab mafodotin monotherapy in patients with RRMM included in the compassionate
  use or in the expanded access program in Spain between November 2019 and June 2021.
  The focus of the study will be on the estimation of the magnitude of the treatment
  effect as assessed by the overall response rate (ORR), duration of response (DOR),
  progression free survival (PFS), overall survival (OS), and the safety of single
  agent belantamab mafodotin in patients with RRMM. Subjects may receive treatment
  until progression. Myeloma disease status will be evaluated locally for response
  and progression per International Myeloma Working Group (IMWG) criteria from cycle
  1 day 1 until confirmed progressive disease, death, unacceptable toxicity, or lost
  to follow-up (whichever occurs first). (NCT NCT05297240; status UNKNOWN).
