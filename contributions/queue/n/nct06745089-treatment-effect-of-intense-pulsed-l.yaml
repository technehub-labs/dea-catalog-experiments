name: 'NCT06745089 — Treatment Effect of Intense Pulsed Light and Thermal Pulsation
  Therapy on Meibomian Gland Dysfunction-associated Dry Eye Disease: a Randomized
  Trial'
description: 'The goal of this clinical trial is to understand novel treatment methods
  for meibomian gland dysfunction (MGD)-associated dry eye disease (DED) by comparing
  two treatment modalities- intense pulsed light (IPL) and thermal pulsation therapy
  (TPT), to find out the difference of their therapeutic mechanisms and treatment
  effects, so that eye doctors can give more precise advice to the patients when making
  treatment decisions. The main questions it aims to answer are: * What subtype of
  meibomian gland dysfunction (MGD) better responds to which treatment modality? *
  How long do the treatment effects last? Researchers will compare each group (IPL
  and TPT) to a control group treated with eyedrops. \* Do combined treatment of IPL
  or TPT with eyedrops show better outcomes than only eyedrops? Participants will:
  * Receive different treatment for 2 months according to the group they were randomly
  allocated to. * Visit the clinic for checkups after 1 and 3 months after completing
  the treatment sessions. (NCT NCT06745089; status COMPLETED).'
