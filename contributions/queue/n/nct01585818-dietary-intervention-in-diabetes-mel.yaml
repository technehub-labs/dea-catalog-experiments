name: NCT01585818 — Dietary Intervention in Diabetes Mellitus (DIDM)- Intermediate
  and Acute Effects
description: Lifestyle modification, in particular adopting an appropriate dietary
  pattern, is generally accepted as the cornerstone for the treatment of people with
  type 2 diabetes mellitus (T2DM). Consumption of low glycaemic index (GI) meals have
  been shown to improve glycaemic control, lipid profile and reduced systemic inflammation.
  However, these studies and international evidence-based nutritional recommendations
  are principally based on people of European ethnicity consuming fairly typical "western"
  diets. There are few published controlled dietary intervention studies which have
  attempted to determine appropriate dietary patterns for the treatment of diabetes
  amongst populations consuming rice-based diets. HYPOTHESIS 1. The glycaemic response
  over 6 days as measured by CGMS will have a lower mean glucose level and postprandial
  increase in individuals consuming the LGI compared with the SDI meal plan. 2. A
  LGI meal plan is acceptable and participants will adhere and comply to the diet
  to the same level as those receiving the SDI meal plan. 3. Glycaemic and metabolic
  parameters as measured by integrated area under the curve (IAUC) of glucose and
  insulin are lower after a single meal comprising of LGI than compared with an SDI
  meal. 4. The effect of a single meal of LGI reduces appetite and increases satiety
  compared with a meal of SDI. (NCT NCT01585818; status UNKNOWN).
