name: NCT06629025 — The Clinical Manifestation and Prognosis of Pediatric Esophageal Motility Disorders
description: 'Background: Abnormal esophageal peristalsis mostly occurs in adults, but some patients have
  onset in childhood. Most of the symptoms of esophageal motility disorders in children are not as clear
  as those described by adult patients, and they are only manifested in repeated vomiting. Esophageal
  peristalsis abnormalities in children took longer from symptoms to diagnosis than in adults. Common
  esophageal motility disorders in children include Achalasia, ineffective esophageal motility disorder
  (IEM), absent contractility, nutcracker esophagus, jackhammer esophagus, diffuse Esophageal spasm (diffuse
  esophageal spasm), lower esophageal sphincter hypertension (hypertensive lower esophageal sphincter),
  etc. Treatment for abnormal esophageal motility includes medication, endoscopic therapy, and surgery.
  This includes peroral endoscopic myotomy (POEM). The above treatment effects are rarely reported in
  children. This project uses the method of retrospective analysis of medical records to study the clinical
  manifestations and treatment prognosis of abnormal esophageal motility in children Research purpose:
  The purpose of this study is to evaluate various clinical manifestations and treatment prognosis of
  abnormal esophageal motility in children, including analysis of diagnosis age, symptom time, related
  imaging examinations, endoscopy and high-resolution esophageal pressure examination, treatment methods,
  etc. Research design: We plan to collect pediatric patients (0-20 years old) diagnosed with abnormal
  esophageal peristalsis at National Taiwan University Hospital during 2010/1/1-2022/12/31. Retrospective
  analysis of medical records and relevant laboratory data of patients in hospitals, including gender,
  height and weight, age of onset, symptoms, clinical manifestations, endoscopy, gastrointestinal photography,
  24-hour multi-lumen esophageal impedance and acid-base examination, high-resolution esophageal pressure
  examination, ultrasound examination, pathological slide repor'
