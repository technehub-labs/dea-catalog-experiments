name: NCT01772927 — Clinical Tolerance of Numeta 13%
description: Numeta G13% is a triple chamber bag including amino acids plus electrolytes, glucose and
  lipids, dedicated for parenteral nutrition in preterm newborn infants when oral/enteral nutrition is
  not possible, insufficient or contra indicated. The product has been registered in 18 countries in Europe
  via a decentralized procedure that ended 15th December 2010. The present study want to evaluate the
  use of Numeta 13% as standard medical prescription in the NICU of the university of Liege. It is a prospective,
  monocentric, non-interventional, non comparative, open-labeled data collection of record keeping, nutritional
  intakes from the bags, additional intakes as well as blood and urine biochemical markers currently evaluated
  in the NICU. The data will be collected only in VLBWI \< 1500 g receiving Numeta G13% from day of birth
  (day 1) until parenteral nutrition (PN) decreases below 20% of the targeted intakes 2 days in a row
  as a quality control of the new solution in clinical practice. Indication for PN and daily prescription
  will follow the protocol in use in the NICU on behalf of the investigators (NCT NCT01772927; status
  UNKNOWN).
