description: 'RATIONALE: Radiation therapy uses high-energy x-rays to damage tumor
  tissue. Drugs used in chemotherapy use different ways to stop tumor cells from dividing
  so they stop growing or die. It is not yet known if radiation therapy is more effective
  with or without combination chemotherapy for endometrial cancer. PURPOSE: Randomized
  phase III trial to compare the effectiveness of radiation therapy with or without
  combination chemotherapy following surgery in treating patients who have stage I
  or stage II endometrial cancer. (NCT NCT00006027; status COMPLETED).'
