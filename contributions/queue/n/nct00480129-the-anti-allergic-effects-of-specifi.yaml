name: NCT00480129 — The Anti-allergic Effects of Specific Probiotics
description: We hypothesize that specifically selected probiotics can alleviate symptoms
  of allergy in lactose tolerant individuals. Two strains of probiotics, Lactobacillus
  rhamnosus GR-1, and Bifidobacterium adolescentis 7007-05 will be used to create
  a yogurt product. Additionally a non-probiotic yogurt product will also be made
  as a placebo. Allergy sufferers will be asked to consume one of the two types of
  yogurts (blinded) for two months. During the two months there will be 3 sampling
  days, for blood samples and nasal lavage samples. Additionally Mini Rhinoconjunctivitis
  Quality of Life Questionnaires will be filled out weekly over the two months. After
  the two months of perceived responses as well sample analysis we should have a better
  idea of how these specific probiotic effect the immune system and allergies. (NCT
  NCT00480129; status COMPLETED).
