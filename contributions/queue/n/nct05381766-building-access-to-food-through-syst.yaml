name: NCT05381766 — Building Access to Food Through Systems and Solidarity
description: 'BASIS aims to implement a whole-of-community intervention in Brooklyn for improving diet
  and the social and /built environments for English-, Chinese-, Spanish-, and Bangla-speaking communities.
  This is achieved through five main pillars: by 1) improving food access (subsidized, culturally tailored
  fresh produce box program), 2) providing nutrition education, 3) conducting experiential learning (gardening
  workshops, cooking demonstrations, farm tours, physical activity sessions, arts-based sessions), 4)
  assisting with economic security (SNAP/WIC enrollment, workforce development, small business owner engagement),
  and 5) contributing to policy. (NCT NCT05381766; status RECRUITING).'
