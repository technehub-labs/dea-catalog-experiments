name: NCT06433440 — Safety and Immunogenicity of Purified Verocell Rabies Vaccine
  PVRV Administered Intramuscularly and Intradermally
description: Rabies is fatal disease but preventable with rabies vaccines and immunoglobulins,
  conventionally involves intramuscular (IM) administration of the vaccine. However,
  switching the intradermal (ID) route offers potential advantages in dosing, time
  and cost without compromising efficacy and safety. Therefore, this study aims to
  compare the safety and immunogenicity of a short-term three-doses intradermal regimen
  (3D-ID) with a conventional five-doses intramuscular regimen (5D-IM) of the purified
  Vero cell rabies vaccine (PVRV), administered via both intramuscular (IM) and intradermal
  (ID) routes as post-exposure prophylaxis (PEP). (NCT NCT06433440; status COMPLETED).
