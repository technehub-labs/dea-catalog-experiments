name: NCT03638817 — Perioperative Eltrombopag in Patients With Inherited Thrombocytopenia
description: The objective of the study is to estimate the response to eltrombopag
  based on platelet count increase above a safety level of 80 G/L and lack of requirement
  for pre-, per- and post-operative administration of platelet concentrates (PC) for
  performing elective invasive acts at mild or high bleeding risk,in selected patients
  with inherited thrombocytopenia (IT). (NCT NCT03638817; status COMPLETED).
