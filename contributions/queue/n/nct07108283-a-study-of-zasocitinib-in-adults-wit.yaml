name: NCT07108283 — A Study of Zasocitinib in Adults With Nonsegmental Vitiligo
description: Vitiligo is a long-term autoimmune condition that causes the skin to
  lose its color. The body's germ-fighting system (immune system) mistakenly attacks
  the skin cells (melanocytes) which produce the pigment that gives the skin color
  (melanin). This leads to the formation of patches of skin with less or no pigment
  (depigmentation). These patches can occur anywhere on the body. In the nonsegmental
  form of vitiligo, similar patches occur on both sides of the body (symmetrical patches).
  The main aim of this study is to learn how safe zasocitinib is, how well it works
  and how well it is tolerated by adults with nonsegmental vitiligo. The participants
  will receive the study treatment (either zasocitinib or placebo) for up to 1 year
  (52 weeks). The placebo looks like the zasocitinib capsule but does not have any
  medicine in it. Participants who receive placebo at the beginning will change to
  zasocitinib after about 6 months. During the study, participants will visit their
  study clinic 11 times. (NCT NCT07108283; status ACTIVE_NOT_RECRUITING).
