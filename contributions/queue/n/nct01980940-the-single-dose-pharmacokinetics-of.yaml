name: NCT01980940 — The Single Dose Pharmacokinetics of Two and Proof of Efficacy of One New Etoricoxib
  Gel Formulation in Participants With Osteoarthritis (MK-0663-168)
description: Study Part 1 is designed to assess the plasma pharmacokinetics of etoricoxib (ETOR) 4% dimethyl
  sulfoxide (DMSO) and propylene glycol (PG) formulations, each at 2 different doses, upon single-dose
  topical administration on the knee of osteoarthritis participants. Study Part 2 is designed to evaluate
  the efficacy of topical etoricoxib vs. placebo in the treatment of osteoarthritis of the knee. The primary
  hypothesis is that topical etoricoxib will be more effective than placebo in the treatment of osteoarthritis
  of the knee over 2 weeks of treatment as assessed by time-weighted average change from baseline on the
  Western Ontario and McMaster Universities Arthritis Index (WOMAC) Visual Analogue (VA) 3.0 pain subscale.
  (NCT NCT01980940; status COMPLETED).
