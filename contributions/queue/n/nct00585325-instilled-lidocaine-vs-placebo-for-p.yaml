name: NCT00585325 — Instilled Lidocaine vs Placebo for Pain Management During Vacuum
  Assisted Closure (VAC) Dressing Changes
description: 'Patients will be randomized prospectively to one of two groups. One
  group will receive 5 mg/kg of 1% lidocaine, and the other will receive .9 normal
  saline, instilled into their VAC sponge ½ hour prior to VAC dressing change. All
  patients will complete a pain assessment tool prior to receiving the instilled lidocaine/placebo,
  immediately after the procedure and 1 hour after the procedure. Pain scores will
  then be compared between the lidocaine and placebo groups. Risks: Lidocaine toxicity
  is a potential risk, but 5 mg/kg of 1 % Lidocaine is below toxicity thresholds in
  an adult. (NCT NCT00585325; status COMPLETED).'
