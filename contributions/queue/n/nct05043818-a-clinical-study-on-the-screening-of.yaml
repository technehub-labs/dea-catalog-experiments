  of patients. During treatment, it is found that patients are often accompanied by
  a certain degree of psychological problems, such as depression, sensitivity, introversion,
  depression, and pessimistic disappointment. Among them, anxiety and depression are
  the most common. Through prospective observational research, statistics of the incidence
  of depression in inflammatory bowel disease in our hospital, comparison of the proportions
  of each subtype, screening of intestinal biomarkers in IBD patients with depression,
  and observation of inflammatory bowel disease with different The type and quantity
  of different intestinal flora in patients with severe depression, and the correlation
  between intestinal flora and depression. (NCT NCT05043818; status UNKNOWN).
