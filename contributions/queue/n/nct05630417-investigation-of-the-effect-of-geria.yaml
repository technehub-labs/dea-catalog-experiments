name: NCT05630417 — Investigation of the Effect of Geriatric Massage
description: There is no study has been found to examine the effect of geriatric massage
  applied to the elderly with type 2 diabetes on diabetes symptoms and blood parameters.
  This study was planned as a pretest-posttest randomized controlled single-center
  study to examine the effect of geriatric massage on diabetes symptoms and blood
  parameters in the elderly with type 2 diabetes. 60 elderly people who type 2 diabetes
  who applied to the Internal Medicine Polyclinic of Bayburt State Hospital in the
  city center of Bayburt will the diagnosis of Type 2 diabetes will form the sample
  of the study. The sample will consist of two groups, the geriatric massage group
  and the control group. Data will be collected with the "Elderly Information Form",
  "Standardized Mini-Mental Test", "Diabetes Symptoms Checklist Scale", "Blood Parameters
  Monitoring Form". "Geriatric Massage" will be applied as an intervention. The geriatric
  massage group will receive 20 minutes (10 minutes on each foot) foot massage and
  10 minutes back massage, two days a week for eight weeks. The control group will
  receive the institution's standard of care. Frequency, number, mean, Student's t
  test and/or Mann-Whitney U test, ANOVA and/or Kruskal-Wallis test, Chi-square test
  and/or Correlation and Regression Analysis will be used in the analysis of the data.
  As a result of this study, it is anticipated that the effects of geriatric massage
  on diabetes symptoms and blood parameters in the elderly with Type 2 diabetes will
  be determined and these effects will be included in evidence-based guidelines. (NCT
  NCT05630417; status COMPLETED).
