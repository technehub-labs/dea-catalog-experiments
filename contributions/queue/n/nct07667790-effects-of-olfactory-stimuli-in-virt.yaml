name: NCT07667790 — Effects of Olfactory Stimuli in Virtual Reality Cue Exposure on Craving and Attentional
  Bias in Alcohol Use Disorder
description: 'Alcohol use disorder (AUD) is a prevalent and burdensome clinical condition with high relapse
  rates. A central risk factor for relapse is craving for alcohol-often accompanied by an attentional
  bias toward alcohol-related stimuli-which can be evoked by both real-world and virtual stimuli in immersive
  virtual reality (VR). In addition to visual and auditory stimuli, olfactory stimuli are increasingly
  recognized as important for creating realistic, multisensory VR environments. However, no systematic
  investigation has yet examined how olfactory stimuli embedded in VR-based cue exposure (VR-CE) influence
  craving and attentional bias in patients with AUD. The goal of this prospective experimental single-arm
  clinical study, with a 2 (visual stimuli: neutral vs. alcohol-related VR scenarios) × 2 (olfactory stimuli:
  no odor vs. alcohol-related odor) within-subjects factorial design, is to determine how visual and olfactory
  stimuli contribute to the outcomes during a multimodal VR-CE in patients with AUD. The main question
  is whether VR-CE with concurrent visual and olfactory alcohol-related stimuli induces a greater increase
  in craving and attentional bias from baseline than exposure to a single modality (visual or olfactory),
  as assessed by subjective and psychophysiological measures in patients with AUD. (NCT NCT07667790; status
  NOT_YET_RECRUITING).'
