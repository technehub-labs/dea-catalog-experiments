name: NCT03611062 — VR-based EF Rehabilitation for Pediatric TBI
description: Childhood traumatic brain injury (TBI) poses significant impairment in
  children's executive functions (EFs) for moderate to severe injuries, yet interventions
  specifically designed for children's EF rehabilitation post-TBI and rigorous clinical
  trials to establish the safety and efficacy of such interventions remain unavailable.
  In this study, the investigators will conduct a small-scale pilot randomized clinical
  trial to evaluate the safety and preliminary efficacy of a novel virtual reality
  (VR)-based training program for EF rehabilitation for mild complicated to severe
  childhood TBI. Knowledge from this research will provide empirical evidence for
  a larger-scale RCT after the conclusion of this pilot study, with the aim to improve
  the long-term health and quality of life in children with TBI, as well as promote
  efficiency and effectiveness of future psychological rehabilitation for children
  with TBI. (NCT NCT03611062; status COMPLETED).
