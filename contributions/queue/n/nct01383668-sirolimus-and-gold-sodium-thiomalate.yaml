description: This phase I trial studies the side effects and best dose of sirolimus
  and gold sodium thiomalate when given together in treating patients with advanced
  squamous non-small cell lung cancer (NSCLC). Sirolimus and gold sodium thiomalate
  may stop the growth of tumor cells by blocking some of the enzymes needed for cell
  growth (NCT NCT01383668; status WITHDRAWN).
