name: NCT07176702 — A Phase II Clinical Study of HLX22 in Combination With Trastuzumab and Chemotherapy
description: Pancreatic cancer is an extremely high-mortality malignancy. The chemotherapy regimen of
  gemcitabine combined with nab-paclitaxel (GEM-NABP) serves as one of the first-line standard therapies
  for metastatic pancreatic cancer. Given that traditional dual HER2 blockade (pertuzumab + trastuzumab)
  has demonstrated preliminary efficacy in HER2-expressing solid tumors, the novel clinical strategy of
  dual HER2 blockade (HLX22 + trastuzumab) combined with GEM-NAP offers the potential to improve outcomes
  for patients with HER2-positive pancreatic cancer. (NCT NCT07176702; status ACTIVE_NOT_RECRUITING).
