name: NCT05527808 — A Single-arm Exploratory Study of Neoadjuvant Therapy
description: Neoadjuvant EGFR TKI therapy targeting EGFR mutation has some problems failure to fulfill
  clinical requirements such as low MPR rate, tissue fibrosis and other major surgical impacts and unmet
  clinical needs.This study hypothesized that Tisleizumab combined with chemotherapy in the neoadjuvant
  treatment of stage II-IIIA non-squamous NSCLC with EGFR-mutant PD-L1 expression ≥1% could significantly
  improve the pathological response rate after neoadjuvant therapy, improve the surgical complete resection
  rate, reduce perioperative complications and do not increase the surgical difficulty.In this study,
  biomarker analysis is going to explore the possible direction of neoadjuvant therapy population screening,
  and to explore a possible method for the efficacy and safety of neoadjuvant immunotherapy in clinical
  stage II-IIIA non-squamous non-small cell lung cancer with EGFR mutation and expression of PD-L1. (NCT
  NCT05527808; status UNKNOWN).
