name: NCT02801773 — Clinical Effect of Lactobacillus Reuteri in Treatment of Gingivitis
description: 'The aim of this randomized placebo- controlled clinical trials is to evaluate the effects
  of Lactobacillus reuteri containing probiotic lozenges as an adjunct to scaling and root planning (SRP).
  Material and methods: Thirty six gingivitis patients will be recruited and monitored clinically at baseline,
  3 and 6 month after therapy. All patients will receive scaling and periodontal treatment and randomly
  will be assigned over an experimental (SRP + probiotic, N=18) or control (SRP+ placebo, n=18) group.
  The lozenges will be used once per day during 3 month. (NCT NCT02801773; status UNKNOWN).'
