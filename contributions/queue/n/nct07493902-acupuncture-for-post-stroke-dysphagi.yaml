name: 'NCT07493902 — Acupuncture for Post-Stroke Dysphagia: A Clinical Study'
description: Employing a nested design, a partially randomized preference study (Study II) is embedded
  within a prospective, multicenter cohort study (Study I). The cohort study, with acupuncture as the
  exposure factor, explores the clinical efficacy and health economic value of different integrated Chinese
  and Western medicine treatment protocols. The nested partially randomized preference study of different
  acupuncture protocols generates high-level evidence through randomized cohorts while supplementing real-world
  decision-making with preference cohort data. (NCT NCT07493902; status RECRUITING).
