name: NCT03834935 — Efficacy of Topical Pimecrolimus in the Treatment of Pityriasis Alba
description: Pityriasis alba (PA) is a common benign skin disorder, that usually affects children and
  adolescents of darker phototypes. A history of atopic dermatitis is a well-known risk factor, and PA
  may be a minor manifestation of atopic dermatitis, although it can occur in nonatopic individuals as
  well. The objective is to evaluate the effect of topical pimecrolimus in the treatment of treatment
  of PA (NCT NCT03834935; status UNKNOWN).
