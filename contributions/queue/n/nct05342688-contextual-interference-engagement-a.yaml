name: NCT05342688 — Contextual Interference, Engagement , and Change in Motor Performance in Stroke
description: 'The aim of the study is to examine associations between contextual interference (CI), engagement
  during practice and changes in upper limb motor performance among patients post-stroke. Fifty patients
  over the age of 18, after a stroke, in the sub-acute and early chronic stages who have weakness of the
  upper extremity and are treated in a rehabilitation center will be recruited. The study will include
  participation in five sessions: session 1 for baseline assessment, session 2-4 for practice of upper
  extremity functions, and session 5 for post intervention assessment. The intervention will include training
  of three items from the Wolf motor function test in random order (high CI group) or block order (low
  CI group). Outcomes of engagement will include the brain engagement index, heart rate variability and
  galvanic skin response. Outcomes of learning will include the pre-post change in performance of the
  wolf motor function selected items. (NCT NCT05342688; status UNKNOWN).'
