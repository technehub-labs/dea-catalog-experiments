name: NCT02684669 — Effect of High-dose Target-controlled Naloxone Infusion on Pain and Hyperalgesia During
  a Burn Injury
description: In several rodent studies, it has been demonstrated that very high doses of opioid antagonists
  (i.e., naloxone 3-10 mg/kg) administered after weeks after recovery from an inflammatory injury may
  lead to a reinstatement of hyperalgesia and pain behavior. This latent sensitization has recently been
  demonstrated also to take place in humans. The present study examines if it is possible to foresee individuals
  who will demonstrate a larger degree of latent sensitization upon challenge with an injury, than others.
  Using an enriched design high sensitizers (e.g., the upper quartile of individuals developing large
  areas of secondary hyperalgesia following a mild burn injury) are compared with low sensitizers (lower
  quartile), regarding the propensity for developing latent sensitization (NCT NCT02684669; status COMPLETED).
