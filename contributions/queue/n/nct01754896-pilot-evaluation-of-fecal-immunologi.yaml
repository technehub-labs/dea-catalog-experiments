name: NCT01754896 — Pilot Evaluation of Fecal Immunologic Test (FIT) in Ontario
description: Prior to implementation of new colorectal cancer (CRC) screening technology
  (fecal immunochemical test - FIT) in Ontario, there is a need for a laboratory and
  field assessment to validate and optimize its use in the Ontario climate and conditions
  (e.g., large geographic area) and to determine whether adjustments to the current
  structure of the ColonCancerCheck (CCC) Program would be required. This study consists
  of 2 phases. Phase 1 consists of laboratory testing of FIT kits to evaluate analytical
  performance relevant to the requirements of the CCC Program. Phase 2 is a field
  assessment to evaluate the effect of different distribution and return methods and
  pre-labeling of kits on uptake and completion of the tests. The entire study will
  take 12-18 months to complete, with patients being recruited through family physicians
  in patient enrollment model (PEM) family practices across the province of Ontario.
  This Clinical Trials registration relates to Phase 2 of the study. (NCT NCT01754896;
  status COMPLETED).
