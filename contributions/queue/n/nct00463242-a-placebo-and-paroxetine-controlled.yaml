description: This study will evaluate the efficacy, safety and tolerability of agomelatine
  25 mg or 50 mg per day and will compare agomelatine and paroxetine tolerability.
  Eligible patients will receive double-blind study medication for 8 weeks. One week
  after completion of the double-blind treatment phase there will be a single follow-up
  visit. (NCT NCT00463242; status COMPLETED).
