name: NCT03787225 — A Research Study of How NNC0174-0833 Behaves in Japanese and Caucasian
  Volunteers Who Are Normal Weight, Overweight or With Obesity
description: The aim of this study is to look at how the study medicine behaves in
  the participant's body and how it is removed from the participant's body. The study
  compares Japanese and Caucasian people who are normal weight, overweight or with
  obesity. The participants will either get NNC0174-0833 (a potential new medicine)
  or placebo (a "dummy" medicine similar to the study medicine but without active
  ingredients) - which treatment any participant gets is decided by chance. Participants
  will get 1 injection by a study nurse at the clinic. The injection will be with
  a needle in a skin fold in the participant's stomach area. The study will last for
  about 4 months, but duration of participation for any participant will last up to
  about 2 months. The participants will have 8 clinic visits with the study staff.
  (NCT NCT03787225; status COMPLETED).
