name: NCT01722240 — Liraglutide in Type 1 Diabetes
description: 'The glucose lowering effects of GLP-1 agonists are well established in subjects with type
  2 diabetes, however, these have not been studied prospectively in subjects with type 1 diabetes. The
  investigators have, therefore, designed this study to investigate the central hypothesis that in patients
  with type 1 diabetes, Liraglutide has a glucose lowering effect. A major secondary objective of this
  study is to elucidate the mechanisms responsible for its glucose lowering effects and those involved
  in reducing the insulin dose. The specific aims of this proposal are: Hypothesis 1: Treatment with Liraglutide
  in patients with type 1 diabetes decreases HbA1c, fasting, postprandial and the overall mean glucose
  concentrations while decreasing the dose of insulin required. Hypothesis 2: Treatment with Liraglutide
  in patients with type 1 diabetes decreases basal and postprandial glucagon concentrations and increases
  basal and postprandial C-peptide concentrations. Hypothesis 3: Treatment with Liraglutide in patients
  with type 1 diabetes delays gastric emptying. (NCT NCT01722240; status COMPLETED).'
