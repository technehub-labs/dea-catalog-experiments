description: Retrospective, multicenter study including pts with metastatic pancreatic cancer who started
  first-line treatment with napaclitaxel plus Gemcitabine between December 2013 and June 2015 according
  to the routine practice. Overall survival (OS) and progression-free survival (PFS) were assessed for
  the total sample and the exploratory subgroups based on treatment and clinical characteristics of the
  study pts. (NCT NCT03620461; status COMPLETED).
