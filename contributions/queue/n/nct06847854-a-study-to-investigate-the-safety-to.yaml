name: NCT06847854 — A Study to Investigate the Safety, Tolerability, Pharmacokinetics
  (PK) and Pharmacodynamics (PD) of RO7497372 in Participants With Diabetic Macular
  Edema (DME)
description: This study will assess the safety and tolerability of RO7497372 in participants
  with DME. The study consists of 2 parts. Part 1 will test multiple-ascending doses
  of RO7497372 after unilateral intravitreal (IVT) administration in participants
  with DME. The main purpose of Part 1 is to provide data for RO7497372 safety and
  tolerability, as well as to characterize the ocular and systemic pharmacokinetics
  (PK), systemic anti-drug antibodies (ADA), and duration of target engagement, i.e.,
  the pharmacodynamics (PD) in aqueous humor (AH) and blood. Part 2 will evaluate
  the safety, tolerability, PK, and PD of two dose strengths of RO7497372 (low dose
  and high dose), identified as safe and tolerated in Part 1. (NCT NCT06847854; status
  ACTIVE_NOT_RECRUITING).
