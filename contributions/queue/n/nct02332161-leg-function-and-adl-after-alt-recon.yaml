name: NCT02332161 — Leg Function and ADL After ALT Reconstruction for Head and Neck
  Cancer
description: Anterolateral thigh (ALT) free flap tissue transfer is a commonly used
  method of head and neck reconstruction after head and neck cancer removal. The procedure
  involves removing some muscle, skin, and tissue from the thigh, and this may affect
  leg function. The purpose of this study is to determine the impact of ALT on ambulation
  and activities of daily living (ADLs) (NCT NCT02332161; status COMPLETED).
