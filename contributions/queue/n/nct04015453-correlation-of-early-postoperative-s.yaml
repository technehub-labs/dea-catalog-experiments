name: NCT04015453 — Correlation of Early Postoperative Scar Appearance With Long-term Scar Outcomes
description: A retrospective cohort study of early and late period postoperative scars using previously
  validated survey measures and clinical photographs. The target population consists of participants treated
  with Mohs micrographic surgery (MMS) for a facial skin cancer by the division of dermatologic surgery.
  This study aims to determine if patient assessment of scar appearance correlates with physician ratings
  and/or third-person observer ratings. Secondary goals are to assess for correlations between early post-operative
  scar appearance and long-term scar appearance as well as identification of predictive factors for scar
  healing. (NCT NCT04015453; status COMPLETED).
