name: NCT05374590 — Evaluating Long-term Safety of Efgartigimod Administered Intravenously
  and Efgartigimod PH20 Administered Subcutaneously in Children With Generalized Myasthenia
  Gravis
description: The purpose of this trial is to evaluate the long-term safety of efgartigimod
  IV and efgartigimod PH20 SC administered to participants with gMG in the antecedent
  studies, ARGX-113-2006 and ARGX-113-2207, respectively. Participants will receive
  efgartigimod IV or efgartigimod PH20 SC, using the dose administered in the antecedent
  studies. Participants who have not reached the age of 18 can remain in the study
  until efgartigimod becomes commercially available in the respective country or available
  through another continued access program for gMG. Participants who have reached
  the age of 18 can remain in the study for a maximum of 2 years, until efgartigimod
  becomes commercially available in the respective country or available through another
  continued access program for gMG, whichever comes first. (NCT NCT05374590; status
  ENROLLING_BY_INVITATION).
