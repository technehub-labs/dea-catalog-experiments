name: NCT04755790 — To Assess the Utility of the Point Digit in a Clinical Take-home
  Study
description: This study will allow us to assess whether the Point Digit confers functional
  and psychological benefit to persons with partial hand amputations in an unconstrained
  environment. The use of the Point Digit outside of the laboratory will allow for
  a wider variety of uses and for a more realistic simulation of the product being
  used in the field. This well-controlled trial (without randomization of subjects)
  will produce the first Level II-1 medical evidence in our field of partial hand
  prosthetic design as described by the 1989 U.S. Preventive Services Task Force.
  Furthermore, this study will provide important data to support providers who are
  requesting reimbursement from payers. (NCT NCT04755790; status COMPLETED).
